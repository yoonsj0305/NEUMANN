[project]
name = "neumann1"
version = "0.0.81"
description = "Research-engineering core for Structural Compression and verified hybrid problem solving"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4"]

[project.optional-dependencies]
relational = ["duckdb==1.5.6"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["neumann1*"]
exclude = ["interop*"]
