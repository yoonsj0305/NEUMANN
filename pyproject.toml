[project]
name = "neumann1"
version = "0.0.106"
description = "Frontier-level problem solving with minimum necessary computation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4"]

[project.optional-dependencies]
relational = ["duckdb==1.5.6"]
native_lp = ["highspy==1.15.1"]
recursive = ["cvc5==1.4.1", "z3-solver==4.15.4.0"]
tensor = ["opt_einsum==3.4.0", "cotengra==0.8.2", "autoray==0.11.0", "threadpoolctl==3.7.0", "sympy==1.14.0"]
structural = ["egglog==14.0.0", "networkx==3.6.1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["neumann1*"]
exclude = ["interop*"]
