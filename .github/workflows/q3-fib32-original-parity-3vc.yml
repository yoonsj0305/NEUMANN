name: Q3 fib32 exact original parity source full 3VC independent Z3 cvc5
on:
  pull_request:
    paths:
      - '.github/workflows/q3-fib32-original-parity-3vc.yml'
      - 'research/evidence/q3_fib32_parity_20261021/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  true_original_fib32_parity_invariant_certification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: original
          sparse-checkout: |
            lib/Inv_Track/from_2018
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen true source and previously opened manual parity invariant hypothesis
        run: |
          test "$(git -C original rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          python -m py_compile research/evidence/q3_fib32_parity_20261021/source_fib32_native_k_b_i_j_n_mod2_inductive_certificate.py
          python - <<'PY'
          import json
          c=json.load(open('research/evidence/q3_fib32_parity_20261021/FROZEN_MANUAL_POSTHOC_PARITY_HYPOTHESIS_BEFORE_3VC.json'))
          assert c['source_original_PREVIOUSLY_OPENED']
          assert c['original_git_blob']=='4fb129488bee3e1e0cdae899b318d6503ae23c12'
          assert c['no_model_weights_trained']
          assert c['global_Q3']==c['global_Q4']==c['global_Q5']=='OPEN'
          print('SOURCE_ORIGINAL_FIB32_PARITY_NOT_TRAINED_Q3_UNIQUE')
          PY
      - name: Real independent original full SAT and UNSAT theorem proving backends
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check numpy==2.3.5 z3-solver==4.13.3.0
      - name: Actual unchanged original fib32 3VC proof for parity and phase with ablations
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_fib32_parity_20261021/source_fib32_native_k_b_i_j_n_mod2_inductive_certificate.py --root original --freeze research/evidence/q3_code2inv_presource24_20261021/BEFORE_ANY_ORIGINAL_SOURCE_BODY_OPEN_24_GIT_BLOBS.json --protocol research/evidence/q3_fib32_parity_20261021/FROZEN_MANUAL_POSTHOC_PARITY_HYPOTHESIS_BEFORE_3VC.json --out /tmp/q3_true_original_fib32_parity_3vc.json | tee /tmp/q3_true_original_fib32_parity_3vc.log
          sha256sum /tmp/q3_true_original_fib32_parity_3vc.json
      - name: Archive all full true original obligation results including failed parity components
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-original-fib32-parity-phase-dual-inductive-3vc
          path: |
            /tmp/q3_true_original_fib32_parity_3vc.json
            /tmp/q3_true_original_fib32_parity_3vc.log
          if-no-files-found: warn
      - name: Require original SHA and source-pretrained manual invariant proof, never fake learned
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/q3_true_original_fib32_parity_3vc.json'))
          assert r['manual_parity_candidate_registered_before_original_3VC_commit']=='bfbfa969b38041118b2ca6dea4188ab1b2b94f5c'
          assert r['source_full_original_previously_opened_not_new_first_blind']
          assert r['learned_model_forward_and_training_update']==0
          assert r['global_Q3']==r['global_Q4']==r['global_Q5']=='OPEN'
          assert r['original']['true_original_SHA_authenticated']
          assert r['original']['original_verification_true_unmodified_Pre_Trans_Post']
          assert r['source_original_fib32_safe_certified']
          for key,v in r['original']['original_all_three_independent_proof_obligations'].items():
              assert v['dual_pass'],key
          print('TRUE_SOURCE_FIB32_ORIGINAL_SAFE_PARITY_NATIVE_Z3_CVC5_3VC_ALL_THREE_PASS')
          PY
