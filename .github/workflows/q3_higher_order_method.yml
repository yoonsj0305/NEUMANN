name: Q3 Higher-Order Method Self-Invention and Four-Domain Transfer

on:
  pull_request:
    paths:
      - "neumann1/higher_order_method_inventor.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "tests/test_higher_order_method_inventor.py"
      - ".github/workflows/q3_higher_order_method.yml"
  workflow_dispatch:

jobs:
  synthesize-and-revise-method:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production NEUMANN and test runner
        run: python -m pip install -e . pytest
      - name: Verify source-induced method AST revisions and four-domain transfer
        run: |
          python -m pytest -q -s tests/test_higher_order_method_inventor.py
