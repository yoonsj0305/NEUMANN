name: Q3 true original circle1 real existential SAT 39 exact rational clauses Z3 cvc5
on:
  pull_request:
    paths:
      - '.github/workflows/q3-original-circle1-exact-39-SAT.yml'
      - 'research/evidence/q3_circles_sat_witness_20261021/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual_circle_original_full_39_native_SAT_certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SMT-LIB/benchmark-submission-2022
          ref: 81a39628827f61fbd74c6f3e67feb5c1b740d2f0
          path: original
          sparse-checkout: |
            non-incremental/NRA/20220222-cut-three-circles
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate frozen genuine original and source exact witness contract
        run: |
          test "$(git -C original rev-parse HEAD)" = 81a39628827f61fbd74c6f3e67feb5c1b740d2f0
          python -m py_compile research/evidence/q3_circles_sat_witness_20261021/original_circle1_39conjuncts_exact_rational_z3_cvc5.py
          python - <<'PY'
          import json
          x=json.load(open('research/evidence/q3_circles_sat_witness_20261021/BEFORE_DUAL_SAT_CHECK_REAL_ORIGINAL_CIRCLE1_WITNESS.json'))
          assert x['schema']=='neumann.q3.posthoc_cutout1_concrete_12real_sat_candidate_v1'
          assert x['source_already_opened'] and len(x['candidate_real_rational_decimal_strings'])==12
          assert '39' in x['complete_source_native_semantics']
          print('PROSPECTIVE_AFTER_NUMERICAL_DESIGN_BEFORE_NATIVE_PROOF_12_REAL_VECTOR')
          PY
      - name: Install pinned two independent actual original SMT native proof solvers
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
          lscpu | grep 'Model name' | head -1
      - name: Original SHA exact Fraction 39 conjuncts and independent Z3 and cvc5 true source SAT proof
        run: |
          set -o pipefail
          PYTHONPATH=. python research/evidence/q3_circles_sat_witness_20261021/original_circle1_39conjuncts_exact_rational_z3_cvc5.py --root original --freeze research/evidence/q3_fresh_real_nra_20261021/BEFORE_ANY_NEW_SOURCE_BODY_18_ORIGINALS.json --contract research/evidence/q3_circles_sat_witness_20261021/BEFORE_DUAL_SAT_CHECK_REAL_ORIGINAL_CIRCLE1_WITNESS.json --out /tmp/q3_real_circle1_all_39_full_true_source_sat.json | tee /tmp/q3_real_circle1_all_39_full_true_source_sat.log
          sha256sum /tmp/q3_real_circle1_all_39_full_true_source_sat.json
      - name: Archive all actual original source clauses and positive/negative control full SMT2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-circle1-original-authentic-all-39-rational-real-sat-source-proofs
          path: |
            /tmp/q3_real_circle1_all_39_full_true_source_sat.json
            /tmp/q3_real_circle1_all_39_full_true_source_sat.log
          if-no-files-found: warn
      - name: Fail closed on even one original false inequality or independent theorem mismatch
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3_real_circle1_all_39_full_true_source_sat.json'))
          assert x['original_SHA_metadata_before_first_content_freeze_commit']=='5412a4fb16c96694ab2bf629c34f6e41737f7a7f'
          assert x['current_SAT_witness_constructed_only_AFTER_historical_source_18_first_expert_screen']
          assert x['original_exact_Fraction_true_all_39_native_inequalities']
          assert x['original_full_true_SMT2_dual_Z3_cvc5_SAT']
          assert x['no_novel_neural_or_learned_model_discovery']
          assert x['global_Q3']==x['global_Q4']==x['global_Q5']=='OPEN'
          r=x['evidence']
          assert r['true_original_source_Git_blob_authenticated']
          assert r['true_original_all_39_conjuncts_checked_exact_Fraction']==39
          assert len(r['original_39_exact_native_boolean_results'])==39
          assert all(r['original_39_exact_native_boolean_results'])
          assert r['original_all_native_grounded_independent_Z3_cvc5_SAT']['both_authentic_independent_SAT']
          assert r['negative_control_actually_violates_original_geometry']
          assert r['negative_control_actual_original_SMT2']['both_authentic_independent_UNSAT']
          print('GENUINE_ORIGINAL_CIRCLE1_FULL_39_REAL_SAT_Z3_CVC5_PASS')
          print('ORIGINAL_FALSE_WITNESS_DUAL_UNSAT_NEGATIVE_CONTROL_PASS')
          PY
