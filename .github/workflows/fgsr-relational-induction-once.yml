name: FGSR cross-thread relational source-actual induction (one gate)

on:
  pull_request:
    paths:
      - '.github/workflows/fgsr-relational-induction-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-relational-induction:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      FGSR_RESULT: research/evidence/fgsr-q3-single-independent-family/relational_induction_first_receipt.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin independent proof backend
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
          python -m py_compile research/evidence/fgsr-q3-single-independent-family/relational_houdini_single_gate.py
      - name: Single real source and goal cross-thread induction gate
        run: |
          python research/evidence/fgsr-q3-single-independent-family/relational_houdini_single_gate.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("research/evidence/fgsr-q3-single-independent-family/relational_induction_first_receipt.json").read_text())
          print("REAL_ORIGINAL_GATE",x["status"])
          print("VERIFIED",x.get("original_unsat_count"))
          print("CLASSES",x.get("frozen_language_size"))
          print("NEURAL_CALLS",x["model_calls"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgsr-real-48-relational-induction-first
          path: research/evidence/fgsr-q3-single-independent-family/relational_induction_first_receipt.json
          if-no-files-found: warn
          retention-days: 45
