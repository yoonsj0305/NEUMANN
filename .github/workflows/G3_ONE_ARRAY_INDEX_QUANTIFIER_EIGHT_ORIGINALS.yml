name: NEUMANN G3 one quantified array index reuse ALL eight 2025 CHC originals
on:
  push:
    branches:
      - research/q3-g3-2025-chc-native-first-20261106
    paths:
      - .github/workflows/G3_ONE_ARRAY_INDEX_QUANTIFIER_EIGHT_ORIGINALS.yml
permissions:
  contents: read
  actions: read
jobs:
  fixed-one-mechanism-all8:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: NEUMANN-G3-2025-CHC-ARRAY_CHC-NATIVE-ORIGINAL-FIRST
          run-id: 42174775254
          github-token: ${{ github.token }}
          path: original-2025-array8
      - uses: actions/download-artifact@v4
        with:
          name: NEUMANN-G3-2025-ARRAY_CHC-ELDARICA23-GOLEM09-POSTFIRST
          run-id: 42176459753
          github-token: ${{ github.token }}
          path: original-default-eldarica-array8
      - name: Pin exact original first + exact stronger default negative and source-free hypothesis contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/g3/postfirst_single_array_quantified_invariant.py
          echo '47d2776afe699cccab8dc6d6e4b4f06707522f61e8d3d079c478c5614ed5f8c8  original-2025-array8/G3-ARRAY_CHC-NATIVE-ORIGINAL-FIRST.json' | sha256sum -c -
          echo '28b1131382f42fef480223d648ef48d4823a979d63ad3e016996628c9a8d58e0  original-default-eldarica-array8/G3-ARRAY_CHC-POSTFIRST-STRONG-NATIVE.json' | sha256sum -c -
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('docs/experiments/G3_ONE_SHARED_ARRAY_INDEX_QUANTIFIED_INVARIANT_8_POSTFIRST_2026_11_06.json').read_text())
          assert x['method']['solver_options']==['-arrayQuans:1','-verifySolutions']
          assert x['method']['per_source_solver_wall_budget_seconds']==30
          assert x['stop_conditions']['all_8_denominator_nonnegotiable'] is True
          assert x['stop_conditions']['model_training_calls']==0
          print('ONE_SHARED_QUANTIFIED_INDEX_GENERALIZATION_ONLY_NO_FLAG_SEARCH')
          PY
      - name: Download byte-pinned Eldarica 2.3 static expert
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 90 https://github.com/uuverifiers/eldarica/releases/download/v2.3/eldarica-x86-linux-static.gz -o "$RUNNER_TEMP/eldarica-v2.3.gz"
          echo "6815742c34e92d26b379006029eeeb1877757947206b5af9c2f7ff61a5e9440d  $RUNNER_TEMP/eldarica-v2.3.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/eldarica-v2.3.gz" > "$RUNNER_TEMP/eld-v2.3"
          chmod 755 "$RUNNER_TEMP/eld-v2.3"
          echo "ELDARICA_PATH=$RUNNER_TEMP/eld-v2.3" >> "$GITHUB_ENV"
      - name: Source-free ARRAY Horn known safe and known unsafe with same one quantifier and native verification
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/sourcefree-array-safe.smt2" <<'EOF'
          (set-logic HORN)
          (declare-fun Inv ((Array Int Int) Int) Bool)
          (assert (forall ((a (Array Int Int)) (i Int))
            (=> (= (select a i) 0) (Inv a i))))
          (assert (forall ((a (Array Int Int)) (i Int) (b (Array Int Int)))
            (=> (and (Inv a i) (= b (store a i 0))) (Inv b i))))
          (assert (forall ((a (Array Int Int)) (i Int))
            (=> (and (Inv a i) (not (= (select a i) 0))) false)))
          (check-sat)
          EOF
          sed 's/(not (= (select a i) 0))/(= (select a i) 0)/' "$RUNNER_TEMP/sourcefree-array-safe.smt2" > "$RUNNER_TEMP/sourcefree-array-unsafe.smt2"
          set +e
          timeout 10 "$ELDARICA_PATH" -arrayQuans:1 -verifySolutions "$RUNNER_TEMP/sourcefree-array-safe.smt2" > G3-ARRAY-Q1-SOURCEFREE-SAFE.log 2>&1
          rc1=$?
          timeout 10 "$ELDARICA_PATH" -arrayQuans:1 -verifySolutions "$RUNNER_TEMP/sourcefree-array-unsafe.smt2" > G3-ARRAY-Q1-SOURCEFREE-UNSAFE.log 2>&1
          rc2=$?
          set -e
          echo "SOURCEFREE_ARRAY_SAFE_EXIT=$rc1"; cat G3-ARRAY-Q1-SOURCEFREE-SAFE.log
          echo "SOURCEFREE_ARRAY_UNSAFE_EXIT=$rc2"; cat G3-ARRAY-Q1-SOURCEFREE-UNSAFE.log
          test "$rc1" = 0
          test "$rc2" = 0
          python3 - <<'PY'
          from pathlib import Path
          a=Path('G3-ARRAY-Q1-SOURCEFREE-SAFE.log').read_text().strip().splitlines()
          b=Path('G3-ARRAY-Q1-SOURCEFREE-UNSAFE.log').read_text().strip().splitlines()
          assert a and a[-1].strip()=='sat',a
          assert b and b[-1].strip()=='unsat',b
          print('ONE_INDEX_ORDINARY_ARRAY_SAFE_AND_UNSAFE_EXTERNAL_SOURCEFREE_PASS')
          PY
      - name: Exact 8 original after FIRST one quantified index invariant source-native expert
        shell: bash
        run: |
          set +e
          python3 -m research.g3.postfirst_single_array_quantified_invariant \
            --eld "$ELDARICA_PATH" \
            --first original-2025-array8/G3-ARRAY_CHC-NATIVE-ORIGINAL-FIRST.json \
            --default original-default-eldarica-array8/G3-ARRAY_CHC-POSTFIRST-STRONG-NATIVE.json \
            > G3-ARRAY8-ONE-SHARED-INDEX-QUANTIFIER.json \
            2> G3-ARRAY8-ONE-SHARED-INDEX-QUANTIFIER.stderr
          rc=$?
          set -e
          if test -s G3-ARRAY8-ONE-SHARED-INDEX-QUANTIFIER.json; then
            python3 - <<'PY'
          import json
          x=json.load(open('G3-ARRAY8-ONE-SHARED-INDEX-QUANTIFIER.json'))
          print(json.dumps({'science_status':x.get('science_status'),'stats':x.get('stats'),
            'cases':[(z['file'],z['status'],z.get('wall_ms')) for z in x.get('rows',[])]},sort_keys=True))
          assert x['stats']['original_count']==8
          assert x['stats']['learned_model_training_or_inference_calls']==0
          assert x['stats']['ARC_public_eval_new_IDs']==0
          assert x['stats']['genuine_independent_original_certificates']==0
          PY
            v=$?
            if test "$v" -ne 0;then rc=1;fi
          else
            rc=1
          fi
          cat G3-ARRAY8-ONE-SHARED-INDEX-QUANTIFIER.stderr
          echo "ONE_SHARED_ARRAY_INDEX_EIGHT_ORIGINAL_EXIT=$rc"
          exit "$rc"
      - name: SHA immutable one-quantifier complete original result even negative
        if: always()
        shell: bash
        run: |
          if test -s G3-ARRAY8-ONE-SHARED-INDEX-QUANTIFIER.json; then
            sha256sum G3-ARRAY8-ONE-SHARED-INDEX-QUANTIFIER.json > G3-ARRAY8-ONE-SHARED-INDEX-QUANTIFIER.sha256
            cat G3-ARRAY8-ONE-SHARED-INDEX-QUANTIFIER.sha256
          fi
      - name: Preserve all eight original outcomes and sourcefree semantic controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEUMANN-G3-ARRAY8-ONE-GENERIC-QUANTIFIED-INDEX-ORIGINAL
          path: |
            G3-ARRAY8-ONE-SHARED-INDEX-QUANTIFIER.json
            G3-ARRAY8-ONE-SHARED-INDEX-QUANTIFIER.sha256
            G3-ARRAY8-ONE-SHARED-INDEX-QUANTIFIER.stderr
            G3-ARRAY-Q1-SOURCEFREE-SAFE.log
            G3-ARRAY-Q1-SOURCEFREE-UNSAFE.log
          if-no-files-found: warn
          retention-days: 90
