name: NEUMANN G3 post-FIRST Eldarica2.3 and Golem0.9 stronger native 8 array + 7 LIA
on:
  push:
    branches:
      - research/q3-g3-2025-chc-native-first-20261106
    paths:
      - .github/workflows/G3_POSTFIRST_ELDARICA_GOLEM_15_ORIGINALS.yml
permissions:
  contents: read
  actions: read
jobs:
  stronger-native-post-first:
    strategy:
      fail-fast: false
      matrix:
        cohort:
          - ARRAY_CHC
          - LIA_MULTIPHASE
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: NEUMANN-G3-2025-CHC-LIA_MULTIPHASE-NATIVE-ORIGINAL-FIRST
          run-id: 42174775254
          github-token: ${{ github.token }}
          path: immutable-lia-first
      - uses: actions/download-artifact@v4
        with:
          name: NEUMANN-G3-2025-CHC-ARRAY_CHC-NATIVE-ORIGINAL-FIRST
          run-id: 42174775254
          github-token: ${{ github.token }}
          path: immutable-array-first
      - name: Byte-pin immutable original FIRST before all postfirst specialist source access
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/g3/chccomp2025_postfirst_specialists.py
          echo 'c4529472973dc7e102e3b755ff866ccac5f285a9d7206488d65dd054f5b41535  immutable-lia-first/G3-LIA_MULTIPHASE-NATIVE-ORIGINAL-FIRST.json' | sha256sum -c -
          echo '47d2776afe699cccab8dc6d6e4b4f06707522f61e8d3d079c478c5614ed5f8c8  immutable-array-first/G3-ARRAY_CHC-NATIVE-ORIGINAL-FIRST.json' | sha256sum -c -
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('docs/experiments/G3_POSTFIRST_STRONG_2025_CHC_2_NEW_NATIVE_SPECIALISTS_CONTRACT_2026_11_06.json').read_text())
          assert p['postfirst_scope']['unit_budget_seconds_per_source_solver']==20
          assert p['postfirst_scope']['groups'][0]['id']=='ARRAY_CHC'
          assert p['postfirst_scope']['groups'][1]['id']=='LIA_MULTIPHASE'
          assert p['postfirst_scope']['groups'][0]['n']==8
          assert p['postfirst_scope']['groups'][1]['n']==7
          print('POSTFIRST_NEW_STRONG_SOLVERS_8_ARRAY_7_LIA_METADATA_FROZEN')
          PY
      - name: Download official Eldarica and Golem binaries by exact published SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g3-specialists"
          curl -fLsS --retry 2 --max-time 90 https://github.com/uuverifiers/eldarica/releases/download/v2.3/eldarica-x86-linux-static.gz -o "$RUNNER_TEMP/g3-specialists/eldarica.gz"
          echo "6815742c34e92d26b379006029eeeb1877757947206b5af9c2f7ff61a5e9440d  $RUNNER_TEMP/g3-specialists/eldarica.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/g3-specialists/eldarica.gz" > "$RUNNER_TEMP/g3-specialists/eld"
          chmod 755 "$RUNNER_TEMP/g3-specialists/eld"
          curl -fLsS --retry 2 --max-time 90 https://github.com/usi-verification-and-security/golem/releases/download/v0.9.0/golem-x64-linux.tar.bz2 -o "$RUNNER_TEMP/g3-specialists/golem.tar.bz2"
          echo "8209e804c6d4870e52d8d53b605a19145309445bffbd7e89f3ab4db31afdc490  $RUNNER_TEMP/g3-specialists/golem.tar.bz2" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/g3-specialists/golem-dir"
          tar -xjf "$RUNNER_TEMP/g3-specialists/golem.tar.bz2" -C "$RUNNER_TEMP/g3-specialists/golem-dir"
          GOLEM_PATH="$(find "$RUNNER_TEMP/g3-specialists/golem-dir" -type f -name golem | head -1)"
          test -n "$GOLEM_PATH"
          chmod 755 "$GOLEM_PATH"
          echo "ELDARICA_PATH=$RUNNER_TEMP/g3-specialists/eld" >> "$GITHUB_ENV"
          echo "GOLEM_PATH=$GOLEM_PATH" >> "$GITHUB_ENV"
      - name: Verify real published binary semantics on source-free Horn safety/unsafety BEFORE originals
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/g3-safe.smt2" <<'EOF'
          (set-logic HORN)
          (declare-fun Inv (Int) Bool)
          (assert (forall ((x Int)) (=> (= x 0) (Inv x))))
          (assert (forall ((x Int) (y Int)) (=> (and (Inv x) (= y (+ x 1))) (Inv y))))
          (assert (forall ((x Int)) (=> (and (Inv x) (< x 0)) false)))
          (check-sat)
          EOF
          sed 's/(< x 0)/(> x 0)/' "$RUNNER_TEMP/g3-safe.smt2" > "$RUNNER_TEMP/g3-unsafe.smt2"
          test "$(timeout 9 "$ELDARICA_PATH" "$RUNNER_TEMP/g3-safe.smt2" | tr -d '\r')" = 'sat'
          test "$(timeout 9 "$ELDARICA_PATH" "$RUNNER_TEMP/g3-unsafe.smt2" | tr -d '\r')" = 'unsat'
          test "$(timeout 9 "$GOLEM_PATH" -l QF_LIA "$RUNNER_TEMP/g3-safe.smt2" | tr -d '\r')" = 'sat'
          test "$(timeout 9 "$GOLEM_PATH" -l QF_LIA "$RUNNER_TEMP/g3-unsafe.smt2" | tr -d '\r')" = 'unsat'
          echo 'POSTFIRST_BOTH_REAL_STRONG_SPECIALISTS_SAFE_AND_UNSAFE_CONTROLS_PASS'
      - name: New postfirst stronger native expert original source exact 8 ARRAY + 7 LIA, no learning
        shell: bash
        env:
          COHORT: ${{ matrix.cohort }}
        run: |
          set +e
          python3 -m research.g3.chccomp2025_postfirst_specialists \
            --cohort "$COHORT" \
            --eld "$ELDARICA_PATH" \
            --golem "$GOLEM_PATH" \
            --first-array immutable-array-first/G3-ARRAY_CHC-NATIVE-ORIGINAL-FIRST.json \
            --first-lia immutable-lia-first/G3-LIA_MULTIPHASE-NATIVE-ORIGINAL-FIRST.json \
            > "G3-$COHORT-POSTFIRST-STRONG-NATIVE.json" \
            2> "G3-$COHORT-POSTFIRST-STRONG-NATIVE.stderr"
          rc=$?
          set -e
          if test -s "G3-$COHORT-POSTFIRST-STRONG-NATIVE.json"; then
            python3 - "$COHORT" <<'PY'
          import json,sys
          c=sys.argv[1]
          x=json.load(open('G3-'+c+'-POSTFIRST-STRONG-NATIVE.json'))
          print(json.dumps({
             'scope':x.get('postfirst_original_scope'),
             'science':x.get('science_status'),
             'stats':x.get('stats'),
             'rows':[{'file':r['original_file'],'status':r['postfirst_status'],
               'engines':[(z['engine'],z['status'],z.get('wall_ms')) for z in r['natives']]}
                for r in x.get('rows',[])]
          },sort_keys=True))
          assert x['postfirst_original_denominator']==(8 if c=='ARRAY_CHC' else 7)
          assert x['extra_training_and_neural_model_calls']==0
          assert x['stats']['ARC_public_eval_new_IDs']==0
          PY
            valid=$?
            if test "$valid" -ne 0; then rc=1; fi
          else
            rc=1
          fi
          cat "G3-$COHORT-POSTFIRST-STRONG-NATIVE.stderr"
          echo "G3_POSTFIRST_STRONG_NATIVE_EXIT=$rc"
          exit "$rc"
      - name: Byte pin exact new native result whether success, negative or infrastructure error
        if: always()
        shell: bash
        env:
          COHORT: ${{ matrix.cohort }}
        run: |
          if test -s "G3-$COHORT-POSTFIRST-STRONG-NATIVE.json"; then
            sha256sum "G3-$COHORT-POSTFIRST-STRONG-NATIVE.json" > "G3-$COHORT-POSTFIRST-STRONG-NATIVE.sha256"
            cat "G3-$COHORT-POSTFIRST-STRONG-NATIVE.sha256"
          fi
      - name: Preserve postfirst actual strong native results and all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEUMANN-G3-2025-${{ matrix.cohort }}-ELDARICA23-GOLEM09-POSTFIRST
          path: |
            G3-${{ matrix.cohort }}-POSTFIRST-STRONG-NATIVE.json
            G3-${{ matrix.cohort }}-POSTFIRST-STRONG-NATIVE.sha256
            G3-${{ matrix.cohort }}-POSTFIRST-STRONG-NATIVE.stderr
          if-no-files-found: warn
          retention-days: 90
