name: v102 Frozen Authority Preflight

on:
  push:
    branches:
      - research/v102-expand4-fresh-holdout
    paths:
      - .github/workflows/v102_authority_preflight.yml

jobs:
  authority-preflight:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "HASWELL"
      MKL_NUM_THREADS: "1"
      MKL_CBWR: "COMPATIBLE"
      BLIS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact frozen v102 authority runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.9.1 threadpoolctl==3.7.0 highspy==1.15.1
          pip install -e . --no-deps
          pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Validate source and authority chain without evaluation
        run: |
          python - <<'PY'
          from experiments.lp_expand4_holdout_register_v102 import load_registered
          from experiments.lp_expand4_holdout_v102 import (
              AUTHORITY_MANIFEST, SOURCE_MANIFEST, authority_and_models,
              canonical_training_identity,
          )

          source_manifest, source_report = load_registered(SOURCE_MANIFEST)
          assert len(source_report["sources"]) == 48
          assert source_manifest["model_access"] is False
          assert source_manifest["route_evaluation"] is False
          assert source_manifest["timing"] is False

          authority, models, training = authority_and_models()
          assert authority["summary"]["decision"] == "ADMIT_NEW_FRESH_Q34_HOLDOUT_FOR_FROZEN_SUPPORT_SYSTEM"
          assert authority["summary"]["fresh_holdout_candidate"] == ["EXPAND4"]
          assert set(models) == {100001, 100002}
          assert set(training) == {100001, 100002}
          assert canonical_training_identity(training) == canonical_training_identity(authority["training_identity"])

          print("V102_AUTHORITY_PREFLIGHT=PASS")
          print("V102_SOURCE_HEAD=" + source_manifest["frozen_head"])
          for seed in (100001, 100002):
              print(f"V102_WEIGHT_{seed}=" + training[seed]["weights_sha256"])
          PY
