name: FGSR specialist Eldarica 2.3 original-only

on:
  pull_request:
    paths:
      - '.github/workflows/fgsr-eldarica-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-specialist-cold:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FGSR_RESULT: research/evidence/fgsr-q3-single-independent-family/eldarica_first_receipt.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Freeze & verify test script
        run: python -m py_compile research/evidence/fgsr-q3-single-independent-family/eldarica_once.py
      - name: Download pinned public release and run one unmodified original
        run: |
          python research/evidence/fgsr-q3-single-independent-family/eldarica_once.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/evidence/fgsr-q3-single-independent-family/eldarica_first_receipt.json').read_text())
          print('SPECIALIST_OUTCOME',r['status'])
          print('ORIGINAL_ONLY',not r['external_source_modified'])
          print('MODEL_CALLS',r['neural_calls'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgsr-specialist-eldarica-first-actual-receipt
          path: research/evidence/fgsr-q3-single-independent-family/eldarica_first_receipt.json
          if-no-files-found: warn
          retention-days: 45
