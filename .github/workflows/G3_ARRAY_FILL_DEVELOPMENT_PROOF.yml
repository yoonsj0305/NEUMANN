name: NEUMANN G3 one-rule array fill parametric invariant DEVELOPMENT ONLY
on:
  push:
    branches:
      - research/g3-array-init-parametric-proof-transfer-20261106
    paths:
      - .github/workflows/G3_ARRAY_FILL_DEVELOPMENT_PROOF.yml
permissions:
  contents: read
jobs:
  already-opened-array-only:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile one-rule semantic generator without touching unseen sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/g3/array_fill_parametric_invariant.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('docs/experiments/G3_ARRAY_FILL_ONE_RULE_UNSEEN_N5_N8_N9_FIRST_PREREG_2026_11_06.json').read_text())
          assert x['unopened_heldout_transfer']['n']==3
          assert [r['file'] for r in x['unopened_heldout_transfer']['selected_file_metadata_before_body']]==[
            'standard_init5_true-unreach-call_ground_000.smt2',
            'standard_init8_true-unreach-call_ground_000.smt2',
            'standard_init9_true-unreach-call_ground_000.smt2'
          ]
          assert x['unopened_heldout_transfer']['source_body_unopened_before_this_manifest'] is True
          print('G3_UNSEEN_N5_N8_N9_SOURCE_HASH_ONLY_STILL_UNOPENED')
          PY
      - name: Install actual independent original clause verifier
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq z3
          z3 --version
      - name: Source-free typed prefix/suffix inference compatibility controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m research.g3.array_fill_parametric_invariant --mode SOURCE_FREE_SYNTHETIC > G3-ARRAY-INIT-SOURCE-FREE-CONTROLS.json
          cat G3-ARRAY-INIT-SOURCE-FREE-CONTROLS.json
          python3 - <<'PY'
          import json
          x=json.load(open('G3-ARRAY-INIT-SOURCE-FREE-CONTROLS.json'))
          assert x['sourcefree_parser_and_typed_rule_pass']
          assert x['detected_stages']==2
          PY
      - name: FIRST rule development solely on ALREADY OPENED init4 init6 init7 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m research.g3.array_fill_parametric_invariant --mode DEVELOPMENT --per-clause-cap 7 > G3-ARRAY-FILL-OPENED-DEVELOPMENT-RESULTS.json
          python3 - <<'PY'
          import json
          x=json.load(open('G3-ARRAY-FILL-OPENED-DEVELOPMENT-RESULTS.json'))
          print(json.dumps({
            'registered_dev_denominator':x['stats']['original_denominator'],
            'independent_full_proofs':x['stats']['independent_full_original_clause_proofs'],
            'opened_development_cases':[{
              'source':v['source'],
              'original_certified':v['certified_original'],
              'n_stages':v.get('num_store_stages'),
              'error':v.get('error'),
              'proof':{k:v.get('independent_original_all_chc_proof',{}).get(k)
                         for k in ['original_clauses_examined','original_clauses_independently_proven','first_nonproof']}
            } for v in x['cases']]
          },sort_keys=True))
          assert x['stats']['original_denominator']==3
          assert x['stats']['new_ARC_public_eval_IDs_consumed']==0
          assert x['stats']['neural_model_trained'] is False
          PY
      - name: Pin all positive/negative development outcomes, no heldout task read
        if: always()
        shell: bash
        run: |
          for p in G3-ARRAY-FILL-OPENED-DEVELOPMENT-RESULTS.json G3-ARRAY-INIT-SOURCE-FREE-CONTROLS.json; do
            if test -s "$p"; then sha256sum "$p"; fi
          done
      - name: Archive structural template developer experiment including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEUMANN-G3-ARRAY-FILL-ONE-RULE-OPENED-DEVELOPMENT
          path: |
            G3-ARRAY-FILL-OPENED-DEVELOPMENT-RESULTS.json
            G3-ARRAY-INIT-SOURCE-FREE-CONTROLS.json
          if-no-files-found: warn
          retention-days: 90
