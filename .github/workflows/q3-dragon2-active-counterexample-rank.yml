name: Q3 DRAGON2 active authentic source counterexamples to close affine GF2 rank
on:
  pull_request:
    paths:
      - '.github/workflows/q3-dragon2-active-counterexample-rank.yml'
      - 'research/evidence/q3_exact_GF2_all_arity_20261021/dragon2_active_counterexample_rank.py'
      - 'docs/research/Q3_DRAGON2_ACTIVE_COUNTEREXAMPLE_RANK_PROTOCOL_20261021.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  active_exact_source_rank_convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: upstream_real_originals
          sparse-checkout: |
            lib/Inv_Track/andrew_lustre
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate pinned source and compile counterexample experiment
        run: |
          test "$(git -C upstream_real_originals rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          python -m py_compile research/evidence/q3_exact_GF2_all_arity_20261021/dragon2_active_counterexample_rank.py
      - name: Pin independent original cvc5 and Python solver
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check numpy==2.3.5 z3-solver==4.13.3.0
      - name: Recover SHA256-pinned earlier strong original 2VC proof
        uses: actions/download-artifact@v4
        with:
          run-id: 39516722327
          name: q3-two-authentic-originals-true-inductive-gf2-basis
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/previous_original
      - name: Exact rank refinement against original Pre and Pre+Trans
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_exact_GF2_all_arity_20261021/dragon2_active_counterexample_rank.py --root upstream_real_originals --prior /tmp/previous_original/q3_strong_GF2_actual_inductive_original.json --out /tmp/q3_dragon2_active_exact_rank_result.json | tee /tmp/q3_dragon2_active_exact_rank.log
          sha256sum /tmp/q3_dragon2_active_exact_rank_result.json
      - name: Immutable result and ABSTAIN retained
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-dragon2-active-counterexample-rank-source-only
          path: |
            /tmp/q3_dragon2_active_exact_rank_result.json
            /tmp/q3_dragon2_active_exact_rank.log
          if-no-files-found: warn
      - name: Scientific status cannot silently promote learned Q3
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3_dragon2_active_exact_rank_result.json'))
          assert x['global_Q3']=='OPEN'
          assert x['previous_first_learned_original_2VC']=='0/2_PRESERVED'
          assert x['fresh_verified_inductive_basis_rank']==3
          assert x['source_specific_posthoc'] and x['GPU_calls']==x['paid_API_calls']==0
          assert x['all_arity_affine_original_closed']==x['status'].startswith('PASS_')
          print('SCIENCE_STATUS:',x['status'])
          PY
