name: Q3 two earlier original published safety exact PDR dual 3VC
on:
  pull_request:
    paths:
      - '.github/workflows/q3-old-two-pdr-dual-original-post.yml'
      - 'research/evidence/q3_affine_unopened_transfer_20261021/old_two_origins_pdr_extracted_3vc.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full_source_original_two_post_pdr_cert:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: frozen_originals
          sparse-checkout: |
            lib/Inv_Track/andrew_lustre
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned original upstream revision, test syntax
        run: |
          test "$(git -C frozen_originals rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          python -m py_compile research/evidence/q3_affine_unopened_transfer_20261021/old_two_origins_pdr_extracted_3vc.py
      - name: Independent Z3 plus SHA pinned cvc5
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          python -m pip install --disable-pip-version-check numpy==2.3.5 z3-solver==4.13.3.0
      - name: All native published Pre Trans Post proof, two original targets
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_affine_unopened_transfer_20261021/old_two_origins_pdr_extracted_3vc.py --root frozen_originals --out /tmp/q3_old_two_published_3vc.json | tee /tmp/q3_old_two_published_3vc.log
          sha256sum /tmp/q3_old_two_published_3vc.json
      - name: Archive every proof and gap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-two-previous-originals-full-native-published-3vc
          path: |
            /tmp/q3_old_two_published_3vc.json
            /tmp/q3_old_two_published_3vc.log
          if-no-files-found: warn
      - name: Native actual original source and no learned first-overwrite
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3_old_two_published_3vc.json'))
          assert len(x['rows'])==2
          assert x['previous_first_unopened_learned_XOR4_zero_of_two_immutable']
          assert x['global_Q3']==x['global_Q4']=='OPEN'
          for r in x['rows']:
              if r['actual_source_original_dual_3VC']:
                  assert all(p['dual_pass'] for row in r['checked_candidates'] if row['verified_source_original_full_3VC'] for p in row['native_independent_3VC'].values())
          print('OLDER_TWO_REAL_ORIGINAL_PUBLISHED_DUAL_3VC',x['original_full_safety_dual_3VC'],'/2')
          PY
