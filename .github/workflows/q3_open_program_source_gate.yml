name: Q3 Open-Program Generative Invention Source Gate
on:
  pull_request:
    paths:
      - "neumann1/open_program_inventor.py"
      - "neumann1/q3_trainable_code_policy.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "tests/test_q3_open_program_discovery.py"
      - ".github/workflows/q3_open_program_source_gate.yml"
  workflow_dispatch:

jobs:
  safe-generative-source-invention:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare isolated no-network Python worker
        run: docker pull python:3.11-alpine
      - name: Install project tests
        run: python -m pip install -e . pytest
      - name: Prove source correction, sandbox, and training-data isolation
        run: python -m pytest -q -x tests/test_q3_open_program_discovery.py
