name: v100 Retained Replay Check

on:
  push:
    branches:
      - research/v100-quotient-point-refit
    paths:
      - .github/workflows/v100_replay_check.yml

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest highspy==1.15.1
          pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Replay retained v100 result without execution
        run: pytest -q tests/test_lp_quotient_refit_replay_v100.py
