name: NEUMANN Q3 actual trained auxiliary proposer versus exact same grammar classical and native original
on:
  pull_request:
    paths:
      - '.github/workflows/q3_actual_learned_aux_original_dev.yml'
      - 'research/g0/learned_auxiliary_proposer.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: research/g0
jobs:
  source_original_setup_and_truth_isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SMT-LIB/benchmark-submission-2023
          ref: 7f993a017850ba547c6ea19a1bf3b54adf54a449
          path: upstream
          sparse-checkout: |
            non-incremental/QF_NIA/20230328-sqrtmodinv-hoenicke
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Freeze old classical original lemma prover and original revision, prepare no-truth source update
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = 7f993a017850ba547c6ea19a1bf3b54adf54a449
          test "$(git rev-parse HEAD:research/g0/source_newton_2adic_proof.py)" = dc51a73154bc90227906de8c5f40c000bf64a4c3
          python -m py_compile research/g0/learned_auxiliary_proposer.py
          python research/g0/learned_auxiliary_proposer.py --mode prepare \
            --source-root upstream \
            --source-dir /tmp/learned-source-only \
            --secret-dir /tmp/original-hidden-private-grader
      - uses: actions/upload-artifact@v4
        with:
          name: new-trained-aux-4-source-without-original-status-or-answer
          path: /tmp/learned-source-only/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: new-trained-aux-4-private-original-identity-only-for-grader
          path: /tmp/original-hidden-private-grader/
          if-no-files-found: error
  genuine_CPU_self_supervised_training_then_frozen_predictions:
    needs: source_original_setup_and_truth_isolation
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          name: new-trained-aux-4-source-without-original-status-or-answer
          path: /tmp/learned-source-only
      - name: Train three tiny differentiable source-to-aux proposer seeds without target labels; seal
        run: |
          set -euo pipefail
          mkdir -p /tmp/trained-a-only
          OPENBLAS_NUM_THREADS=1 python research/g0/learned_auxiliary_proposer.py --mode infer \
            --source /tmp/learned-source-only/SOURCE_ONLY_NO_ORIGINAL_LABELS.json \
            --pred /tmp/trained-a-only/NEURAL_SOURCE_PREDICTIONS_BEFORE_ORIGINAL_GRADE.json \
            | tee /tmp/trained-a-only/SOURCE_TRAIN_CONSOLE.log
          sha256sum /tmp/trained-a-only/NEURAL_SOURCE_PREDICTIONS_BEFORE_ORIGINAL_GRADE.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-trained-aux-4-predictions-sealed-before-original-grader
          path: /tmp/trained-a-only/
          if-no-files-found: error
  fully_separate_original_author_math_proof_and_same_grammar_classical:
    needs: genuine_CPU_self_supervised_training_then_frozen_predictions
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SMT-LIB/benchmark-submission-2023
          ref: 7f993a017850ba547c6ea19a1bf3b54adf54a449
          path: upstream
          sparse-checkout: |
            non-incremental/QF_NIA/20230328-sqrtmodinv-hoenicke
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 z3-solver==4.13.3.0
      - uses: actions/download-artifact@v4
        with:
          name: new-trained-aux-4-private-original-identity-only-for-grader
          path: /tmp/original-hidden-private-grader
      - uses: actions/download-artifact@v4
        with:
          name: new-trained-aux-4-predictions-sealed-before-original-grader
          path: /tmp/trained-a-only
      - name: Exact original lemma proof only when neural source candidate is nonvacuous and algebraically valid; classical with same syntax
        run: |
          set -euo pipefail
          mkdir -p /tmp/trained-grade
          OPENBLAS_NUM_THREADS=1 python research/g0/learned_auxiliary_proposer.py --mode grade \
            --source-root upstream \
            --secret /tmp/original-hidden-private-grader/PRIVATE_ORIGINAL_FILE_IDENTITIES.json \
            --pred /tmp/trained-a-only/NEURAL_SOURCE_PREDICTIONS_BEFORE_ORIGINAL_GRADE.json \
            --out /tmp/trained-grade/FROZEN_AUX_LEARNED_VS_EXACT_CLASSICAL_ORIGINAL_GRADE.json \
            | tee /tmp/trained-grade/INDEPENDENT_GRADE_CONSOLE.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-trained-aux-4-native-original-math-grade-and-equal-grammar-cost
          path: /tmp/trained-grade/
          if-no-files-found: error
