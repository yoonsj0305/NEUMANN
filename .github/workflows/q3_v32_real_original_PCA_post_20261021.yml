name: Q3 v32 actual learned PCA law plus original Post full 3VC
on:
  pull_request:
    paths:
      - '.github/workflows/q3_v32_real_original_PCA_post_20261021.yml'
      - 'research/evidence/q3_v32_posthoc_full_original_20261021/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  honest_original_posthoc_learned_conservation_for_full_source_safety:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: original
          sparse-checkout: |
            lib/Inv_Track/from_2018
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original source real provenance and posthoc model schema lint
        run: |
          test "$(git -C original rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          python -m py_compile research/evidence/q3_v32_posthoc_full_original_20261021/real_trained_PCA_plus_source_Post_3VC.py
          echo 'POSTHOC_FULL_TASK_METHOD_ADDED_AFTER_FIRST_SOURCE_OPEN_NOT_FIRST_SOURCE_BLIND'
      - name: Independently pinned actual source Z3 cvc5 and fitted PCA/sympy comparators
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 sympy==1.14.0 z3-solver==4.13.3.0
      - name: Full original 12 source native exact Post proof attempt with actual trained law vs two controls
        run: |
          set -o pipefail
          PYTHONPATH=. OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python research/evidence/q3_v32_posthoc_full_original_20261021/real_trained_PCA_plus_source_Post_3VC.py \
            --root original \
            --freeze research/evidence/q3_v31_fresh12_original_conservation_20261021/BEFORE_NEW12_ACTUAL_ORIGINAL_SOURCE_GITSHA.json \
            --out /tmp/q3_v32_learned_original_post_3VC.json | tee /tmp/q3_v32_learned_original_post_3VC.log
          sha256sum /tmp/q3_v32_learned_original_post_3VC.json
      - name: Retain all native original verification proof statuses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-posthoc-actual-PCA-learned-conservation-original-full-Post-3VC
          path: |
            /tmp/q3_v32_learned_original_post_3VC.json
            /tmp/q3_v32_learned_original_post_3VC.log
          if-no-files-found: warn
      - name: Independently assert actual source full three original VCs only
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3_v32_learned_original_post_3VC.json'))
          assert x['schema']=='neumann.q3.v32_true_original_posthoc_actual_learned_conservation_to_full_safety.v1'
          assert x['original_source_count']==12 and len(x['real_originals'])==12
          assert x['all_program_source_bodies_ALREADY_OPENED_by_PR401']
          assert x['no_claim_of_firstblind_complete_post_experiment']
          assert x['no_machine_learning_unique_versus_strongest_classical_claim']
          assert x['global_Q3']==x['global_Q4']==x['global_Q6']=='OPEN'
          for row in x['real_originals']:
              for key in ('POST_only_already_exact_original_dual','simple_NOLEARN_plus_original_POST','TRAINED_PCA_plus_original_POST','EXACT_CLASSICAL_plus_original_POST'):
                  p=row.get(key)
                  if p and p['fully_verified_complete_original_3VC']:
                      assert all(q['dual_pass'] for q in p['independent_original_pre_trans_post_dual_proofs'].values())
          print('POSTHOC_GENUINE_COMPLETE_SOURCE_NATIVE_3VC_ACTUAL_RESULTS_PRESERVED')
          PY
