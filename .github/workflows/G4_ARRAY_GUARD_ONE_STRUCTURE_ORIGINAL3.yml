name: NEUMANN G4 one frozen array CHC guard canonicalizer original3 whole-source transfer
on:
  push:
    branches:
      - research/q3-g4-array-frame-single-structure-20261106
    paths:
      - .github/workflows/G4_ARRAY_GUARD_ONE_STRUCTURE_ORIGINAL3.yml
permissions:
  contents: read
jobs:
  one-frozen-operator-three-external-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin source-free first and actual 2026 Z3 solver
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/g4/array_guard_normalizer.py
          python -m pip install --quiet --no-cache-dir z3-solver==5.0.0.0
          python - <<'PY'
          from pathlib import Path
          import json,z3
          p=json.loads(Path('docs/experiments/G4_ONE_ARRAY_FRAME_OPERATOR_POSTFIRST_SOURCE_SELECTION_2026_11_06.json').read_text())
          q=json.loads(Path('docs/experiments/G4_ONE_ARRAY_GUARD_CANONICALIZER_SOURCE_FREE_FIRST_2026_11_06.json').read_text())
          assert z3.get_version_string().startswith('5.0.')
          assert q['unchanged_target3']==['array_swap_000.smt2','array_swap_twice_000.smt2','standard_copy2_true-unreach-call_ground_000.smt2']
          assert p['source_first_context']['prior_2025_first_run']==42174775254
          assert all(len(x['git_blob'])==40 for x in [p['pre_source_inspection_selection']['main'],*p['pre_source_inspection_selection']['transfer_without_rewrite']])
          print('G4_FROZEN_SOURCE_FREE_SAFE_UNSAFE_RUN_42177587302_ARCHIVED_PASS')
          PY
      - name: Sourcefree safe and unsafe control repeated before original
        shell: bash
        run: |
          set -euo pipefail
          python -m research.g4.array_guard_normalizer --synthetic > G4-REPEATED-SOURCEFREE-SAFETY-CONTROLS.json
          python - <<'PY'
          import json
          x=json.load(open('G4-REPEATED-SOURCEFREE-SAFETY-CONTROLS.json'))
          assert x['pass'] is True
          assert x['original_benchmark_bytes_read']==0
          print('ONE_OPERATOR_SAFE_AND_UNSAFE_SOURCEFREE_CONTROLS_PASS')
          PY
      - name: Complete original swap primary plus two transfer SAME frozen operator without task-specific tuning
        shell: bash
        run: |
          set -uo pipefail
          python -m research.g4.array_guard_normalizer --original3 > G4-ONE-ARRAY-STRUCTURE-ORIGINAL3.json 2> G4-ONE-ARRAY-STRUCTURE-ORIGINAL3.stderr
          code=$?
          if test -s G4-ONE-ARRAY-STRUCTURE-ORIGINAL3.json;then
            python - <<'PY'
          import json
          x=json.load(open('G4-ONE-ARRAY-STRUCTURE-ORIGINAL3.json'))
          print(json.dumps({'science':x.get('scientific_status'),'stats':x.get('stats'),
            'original_first_transfer':[{
              'file':r['name'],'status':r['status'],
              'source_predicate_arity_preserved':r.get('canonicalization',{}).get('no_new_predicate_signatures'),
              'original_bytes':r.get('canonicalization',{}).get('original_bytes'),
              'normalized_bytes':r.get('canonicalization',{}).get('normalized_bytes'),
              'normalization_ms':r.get('canonicalization',{}).get('normalization_wall_ms'),
              'native_outcome':r.get('native',{}).get('outcome'),
              'native_ms':r.get('native',{}).get('solver_wall_ms'),
              'original_independent_proof':r.get('native',{}).get('independent_original_witness_available')}
              for r in x.get('rows',[])]},sort_keys=True))
          assert x['stats']['original_exact']==3
          assert x['stats']['student_trained_weights'] is False
          assert x['stats']['ARC_eval_used']==0
          assert x['stats']['independently_verified_originals_solved']==0
          PY
            parsed=$?
            if test "$parsed" -ne 0;then code=1;fi
          else
            code=1
          fi
          cat G4-ONE-ARRAY-STRUCTURE-ORIGINAL3.stderr
          echo "G4_ORIGINAL_ONE_OPERATOR_FIRST_EXIT=$code"
          exit "$code"
      - name: SHA preserve scientific negative or positive, no fabricated Q3
        if: always()
        shell: bash
        run: |
          if test -s G4-ONE-ARRAY-STRUCTURE-ORIGINAL3.json; then
            sha256sum G4-ONE-ARRAY-STRUCTURE-ORIGINAL3.json > G4-ONE-ARRAY-STRUCTURE-ORIGINAL3.sha256
            cat G4-ONE-ARRAY-STRUCTURE-ORIGINAL3.sha256
          fi
      - name: Archive frozen primary and two secondary source results including all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEUMANN-G4-ONE-ARRAY-GUARD-NORMALIZER-ORIGINAL3
          path: |
            G4-ONE-ARRAY-STRUCTURE-ORIGINAL3.json
            G4-ONE-ARRAY-STRUCTURE-ORIGINAL3.sha256
            G4-ONE-ARRAY-STRUCTURE-ORIGINAL3.stderr
            G4-REPEATED-SOURCEFREE-SAFETY-CONTROLS.json
          if-no-files-found: warn
          retention-days: 90
