name: Q3 Induced Grammar Source-Only Transfer

on:
  pull_request:
    paths:
      - "neumann1/induced_grammar.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "research/q3/q3_induced_grammar_development.py"
      - "tests/test_induced_grammar_cross_domain.py"
      - ".github/workflows/q3_grammar_invention.yml"
  workflow_dispatch:

jobs:
  independent_replay:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run source-only grammar induction and falsification contracts
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_induced_grammar_cross_domain.py
      - name: Recompute matched classical versus invented grammar baseline
        run: |
          PYTHONPATH=. python research/q3/q3_induced_grammar_development.py
          python - <<'PY'
          import json
          d=json.load(open('research/q3/q3_induced_grammar_development_results.json'))
          s=d['summary']
          assert s['induced_rules']==3
          assert s['target_tasks']==9
          assert s['target_using_new_rules']==8
          assert s['target_solved_invented']==s['target_solved_cold']==9
          assert s['correct_invented']==s['correct_cold']==1080
          assert s['target_candidate_checks_invented']==596
          assert s['target_candidate_checks_cold']==1108
          assert s['source_candidate_checks']==251
          print('SOURCE+TARGET CHECKS: invented',251+596,'vs cold',1108)
          PY
