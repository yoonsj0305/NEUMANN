name: G0 ONE-SHOT Cryptol What4 BV official 2026 classical gap
on:
  push:
    branches:
      - 'research/g0-cryptol-bitvector-once-20261018'
    paths:
      - '.github/workflows/g0-cryptol-bv-one-shot.yml'
      - 'research/evidence/g0-cryptol-bv-2026/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Official streaming JSON only
        run: python -m pip install --disable-pip-version-check ijson==3.4.0
      - name: Frozen source-family single-query record analysis
        run: |
          python research/evidence/g0-cryptol-bv-2026/one_shot_official_results.py
          python - <<'PY'
          import json
          p='/tmp/g0_cryptol_bv_official_first_receipt.json'
          r=json.load(open(p))
          assert r['status']=='FIRST_OFFICIAL_CRYPTO_BV_PER_TASK_SCREEN_COMPLETE'
          assert r['no_original_source_body_downloaded']
          assert r['no_new_solver_running'] and r['no_model_training']
          assert r['G1']=='HOLD_LEARNING' and r['Q1_to_Q7_global']=='OPEN'
          print('G0_CLASSICAL_FIRST_RECEIPT',r['G0_classical_gap_status'])
          PY
      - name: Archive immutable first status, success or failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g0-one-shot-cryptol-bv-2026-official
          path: /tmp/g0_cryptol_bv_official_first_receipt.json
          retention-days: 90
