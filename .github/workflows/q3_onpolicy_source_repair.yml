name: Q3 ACTUAL Model Failures to Learned Discovery Policy
on:
  push:
    branches:
      - research/q3-onpolicy-source-repair-20261109
    paths:
      - ".github/workflows/q3_onpolicy_source_repair.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual_frozen_model_source_repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: One frozen 0.5B model, optional LoRA, actual independent Docker SOURCE verifier
        run: |
          set -euo pipefail
          python -m pip install -q -e .
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install -q 'transformers==4.48.3' 'peft==0.14.0' 'accelerate==1.3.0' pytest sentencepiece
          docker pull python:3.11-alpine
          python -m pytest -q -x \
            tests/test_q3_onpolicy_repair.py \
            tests/test_q3_open_program_discovery.py \
            tests/test_q3_source_refutation_learning.py
      - name: Reuse same 7 original SOURCE-certified model-authored teachers and frozen control policies
        run: |
          set -euo pipefail
          mkdir -p inputs/first inputs/context inputs/synthetic outputs
          gh run download 42593621076 \
            --name Q3-REAL-WEIGHT-LEARNING-ORIGINAL-SOURCE-BLIND \
            --dir inputs/first
          gh run download 42602782399 \
            --name Q3-TWO-ORIGIN-FROZEN-SOURCE-ADAPTER \
            --dir inputs/context
          gh run download 42607278598 \
            --name Q3-SOURCE-COUNTEREXAMPLE-MODEL-REPAIR-PILOT \
            --dir inputs/synthetic
          cmp inputs/first/SOURCE_TEACHERS.jsonl inputs/context/SOURCE_TEACHERS.jsonl
          cmp inputs/first/MODEL_REVISION.txt inputs/context/MODEL_REVISION.txt
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          first=Path("inputs/first/SOURCE_TEACHERS.jsonl").read_bytes()
          sha=hashlib.sha256(first).hexdigest()
          a=json.loads(Path("inputs/context/adapter/neumann_source_training_manifest.json").read_text())
          b=json.loads(Path("inputs/synthetic/adapter/neumann_source_training_manifest.json").read_text())
          assert a["steps"]==b["steps"]==10
          assert a["source_sha256"]==b["source_sha256"]==sha
          assert a["base_model"]==b["base_model"]
          assert a["model_revision"]==b["model_revision"]
          assert b["source_counterexample_repair_training"]
          assert b["source_falsified_repair_episodes"]==12
          assert a["contextual_method_training"]
          assert a["source_programs"]==b["source_programs"]==7
          print("Q3_ONPOLICY_REUSED_FROZEN_CONTROLS",sha,flush=True)
          PY
      - name: ACTUAL PRETRAINED model writes programs; independently SOURCE-refute them
        run: |
          set -euo pipefail
          REV="$(cat inputs/first/MODEL_REVISION.txt)"
          python -m neumann1.q3_onpolicy_repair \
            --sources inputs/first/SOURCE_TEACHERS.jsonl \
            --model-revision "$REV" --max-per-teacher 1 \
            --out outputs/FROZEN_REAL_MODEL_SOURCE_FAILURES.jsonl
          test -s outputs/FROZEN_REAL_MODEL_SOURCE_FAILURES.jsonl
          sha256sum outputs/FROZEN_REAL_MODEL_SOURCE_FAILURES.jsonl \
            > outputs/FROZEN_REAL_MODEL_SOURCE_FAILURES.sha256
      - name: Learn ACTUAL failed algorithm causal repair with same 10 gradient steps
        run: |
          set -euo pipefail
          REV="$(cat inputs/first/MODEL_REVISION.txt)"
          python -m neumann1.q3_trainable_code_policy \
            --sources inputs/first/SOURCE_TEACHERS.jsonl \
            --adapter-output outputs/onpolicy_adapter \
            --model Qwen/Qwen2.5-Coder-0.5B-Instruct \
            --model-revision "$REV" \
            --steps 10 --contextual-method-training \
            --onpolicy-source-repairs outputs/FROZEN_REAL_MODEL_SOURCE_FAILURES.jsonl
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          current=json.loads(Path("outputs/onpolicy_adapter/neumann_source_training_manifest.json").read_text())
          old=json.loads(Path("inputs/synthetic/adapter/neumann_source_training_manifest.json").read_text())
          control=json.loads(Path("inputs/context/adapter/neumann_source_training_manifest.json").read_text())
          assert current["repair_negative_origin"]=="REAL_FROZEN_MODEL_GENERATION"
          assert current["model_generated_falsified_repairs"]>=2
          assert current["steps"]==old["steps"]==control["steps"]==10
          assert current["source_sha256"]==old["source_sha256"]==control["source_sha256"]
          assert current["model_revision"]==old["model_revision"]==control["model_revision"]
          assert current["rank"]==old["rank"]==control["rank"]
          assert current["learning_rate"]==old["learning_rate"]==control["learning_rate"]
          assert current["onpolicy_source_file_sha256"]==hashlib.sha256(
            Path("outputs/FROZEN_REAL_MODEL_SOURCE_FAILURES.jsonl").read_bytes()).hexdigest()
          print("Q3_ACTUAL_ONPOLICY_WEIGHT_UPDATE",
                current["model_generated_falsified_repairs"],
                "equal_steps",current["steps"],flush=True)
          PY
      - name: SAME original SOURCE tasks: base A, imitation B, AST repair C, actual model-failure repair D
        run: |
          set -euo pipefail
          REV="$(cat inputs/first/MODEL_REVISION.txt)"
          python research/q3/q3_source_refutation_pilot.py \
            --blind inputs/first/BLIND.json \
            --teachers inputs/first/SOURCE_TEACHERS.jsonl \
            --adapter inputs/synthetic/adapter \
            --context-adapter inputs/context/adapter \
            --onpolicy-adapter outputs/onpolicy_adapter \
            --revision "$REV" \
            --out outputs/FOUR_ARMS_SOURCE_PREDICTIONS.json
          sha256sum outputs/FOUR_ARMS_SOURCE_PREDICTIONS.json \
            > outputs/FOUR_ARMS_SOURCE_PREDICTIONS.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("outputs/FOUR_ARMS_SOURCE_PREDICTIONS.json").read_text())
          assert p["original_target_gold_seen"] is False
          assert p["model_scientific_scope"]=="PREEXPOSED_CODEARC_DEV_ONLY"
          assert set(p["records"][0]["arms"])=={"A","B","C","D"}
          d=p["model_generated_repair_residual_over_all_controls"]
          reg=p["model_generated_repair_regressions_vs_control_B"]
          print("Q3_REAL_MODEL_FAILURE_LEARNING_SOURCE_GATE",
                json.dumps({"D_only_vs_A_B_C":d,
                            "D_regressions_vs_B":reg,
                            "Q3_global":"OPEN",
                            "already_exposed_development_only":True}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Q3-ACTUAL-MODEL-SOURCE-REPAIR-WEIGHTS-AND-FOUR-ARM-RECEIPTS
          path: outputs/
          if-no-files-found: warn
          retention-days: 90
