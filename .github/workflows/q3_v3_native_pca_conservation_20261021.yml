name: Q3 actual PCA-learned conserved relations vs exact classical nullspace
on:
  pull_request:
    paths:
      - '.github/workflows/q3_v3_native_pca_conservation_20261021.yml'
      - 'research/evidence/q3_v3_PCA_conservation_20261021/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_original_actual_fitted_conservation_versus_exact_nolearn:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: original
          sparse-checkout: |
            lib/Inv_Track/from_2018
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact authenticated original source code and model syntax
        run: |
          test "$(git -C original rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          python -m py_compile research/evidence/q3_v3_PCA_conservation_20261021/actual_native_source_PCA_conservation.py
          echo 'V3_POSTHOC_ON_PREVIOUSLY_OPENED_REAL_SOURCES_NOT_FIRST_BLIND'
      - name: Install Z3 independent cvc5 and actual fitted PCA/scikit-learn
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 sympy==1.14.0 z3-solver==4.13.3.0
      - name: CPU model PCA FIT from original Pre/Trans, exact classical nullspace and independent full native proof
        run: |
          set -o pipefail
          PYTHONPATH=. OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python research/evidence/q3_v3_PCA_conservation_20261021/actual_native_source_PCA_conservation.py \
            --root original \
            --freshfreeze research/evidence/q3_firstblind_eight_trained_20261021/BEFORE_EIGHT_NEW_ORIGINAL_SOURCE_BODIES_SHA_LOCK.json \
            --oldfreeze research/evidence/q4q6_fresh12_cpu_router_20261021/FIRST_FRESH_12_SOURCE_SHA_FREEZE_BEFORE_BODY.json \
            --out /tmp/q3_actual_PCA_native_source10_conservation.json | tee /tmp/q3_actual_PCA_native_source10_conservation.log
          sha256sum /tmp/q3_actual_PCA_native_source10_conservation.json
      - name: Preserve all actual trained and no-fit proof attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-actual-fitted-PCA-original-conservation-vs-exact-classical
          path: |
            /tmp/q3_actual_PCA_native_source10_conservation.json
            /tmp/q3_actual_PCA_native_source10_conservation.log
          if-no-files-found: warn
      - name: Accept only native original independent Z3 cvc5 complete proofs
        if: success()
        run: |
          python - <<'PY'
          import json
          q=json.load(open('/tmp/q3_actual_PCA_native_source10_conservation.json'))
          assert q['schema']=='neumann.q3.v3_posthoc_trained_PCA_affine_conserved_inductive_original_v1'
          assert q['original_source_count']==10 and len(q['programs'])==10
          assert len({x['real_source_blob'] for x in q['programs']})==10
          assert q['all_original_source_bodies_previously_OPENED']
          assert q['model_is_actually_trained_on_native_trajectories_not_hand_invariant']
          assert q['global_Q3']==q['global_Q4']==q['global_Q6']=='OPEN'
          for r in q['programs']:
              for k in ('PCA_actually_learned_full_original_dual','equal_data_exact_classical_no_learning_full_original_dual','zero_fit_small_template_original_dual'):
                  p=r.get(k)
                  if p and p['fully_verified_complete_original_3VC']:
                      assert all(a['dual_pass'] for a in p['independent_original_pre_trans_post_dual_proofs'].values())
          print('REAL_TRAINED_PCA_AND_EQUAL_AUTHORITY_CLASSICAL_EXACT_BOTH_CHECKED')
          PY
