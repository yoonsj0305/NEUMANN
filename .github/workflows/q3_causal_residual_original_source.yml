name: Q3 Real SOURCE Causal Residual Program Discovery
on:
  push:
    branches:
      - research/q3-causal-residual-program-synthesis-20261110
    paths:
      - "neumann1/q3_causal_residual_programs.py"
      - "tests/test_q3_causal_residual_programs.py"
      - ".github/workflows/q3_causal_residual_original_source.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
jobs:
  original_author_source:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Causal method-synthesis unit contract with real no-network sandbox
        run: |
          set -euo pipefail
          python -m pip install -q -e . pytest
          docker pull python:3.11-alpine
          python -m pytest -q -x tests/test_q3_causal_residual_programs.py
      - name: Retrieve previously frozen original-author SOURCE, never TARGET
        run: |
          set -euo pipefail
          mkdir -p source methods evidence
          gh run download 42757846590 --name q3-prospective-source-100-originals-frozen --dir source
          gh run download 42757846590 --name q3-coordinate-frozen-source-methods --dir methods
          test "$(cut -d ' ' -f1 source/ORIGINAL_SOURCE_ONLY.sha256)" = "$(sha256sum source/ORIGINAL_SOURCE_ONLY.json | cut -d ' ' -f1)"
          test "$(cut -d ' ' -f1 methods/FROZEN_SOURCE_METHODS.sha256)" = "$(sha256sum methods/FROZEN_SOURCE_METHODS.json | cut -d ' ' -f1)"
      - name: Independently SOURCE-certify new methods synthesized from residuals
        run: |
          set -euo pipefail
          python -u - <<'PY'
          import hashlib,json
          from pathlib import Path
          from neumann1.open_program_inventor import IsolatedPython,source_same_value
          from neumann1.q3_causal_residual_programs import induce_causal_residual_programs
          original=json.loads(Path("source/ORIGINAL_SOURCE_ONLY.json").read_text())
          old=json.loads(Path("methods/FROZEN_SOURCE_METHODS.json").read_text())
          assert original["original_source_count"]==100
          assert original["no_target_gold_in_payload"] is True
          assert old["source_verified_count"]==3
          assert old["target_gold_accessed"] is False
          old_ids={r["id"] for r in old["receipts"] if r.get("certified")}
          runner=IsolatedPython(max_seconds=8)
          rows=[]
          proposals=0
          for i,task in enumerate(original["records"]):
              source=task["source_pairs"]
              row={"id":task["source_id"],"source_examples":len(source),
                   "candidate_count":0,"new_source_certified":False}
              if 3<=len(source)<=32:
                  train=source[:-1]
                  checks=source[-1:]
                  programs=induce_causal_residual_programs(
                      train,runner,max_first=4,max_second=8,max_candidates=4)
                  row["candidate_count"]=len(programs)
                  proposals+=len(programs)
                  for p in programs:
                      tested=runner.evaluate(p.program,[x for x,y in checks])
                      if tested.status=="EXECUTED" and len(tested.outputs)==len(checks) and all(
                          source_same_value(got,y) for got,(_,y) in zip(tested.outputs,checks)):
                          row["new_source_certified"]=True
                          row["program_sha256"]=hashlib.sha256(p.program.encode()).hexdigest()
                          break
              rows.append(row)
              if row["new_source_certified"]:
                  print("Q3_NEW_CAUSAL_SOURCE",row["id"],
                        row["id"] not in old_ids,row["program_sha256"],flush=True)
              if (i+1)%20==0:print("Q3_CAUSAL_SOURCE_PROGRESS",i+1,flush=True)
          found={r["id"] for r in rows if r["new_source_certified"]}
          report={
            "scope":"PREVIOUSLY_EXPOSED_100_REAL_AUTHOR_SOURCE_ONLY",
            "original_author_source_denominator":100,
            "source_eligible":sum(r["source_examples"]>=3 for r in rows),
            "new_macro_candidates_train_fit":proposals,
            "new_macro_source_certified":len(found),
            "new_id_exclusive_vs_previous_coordinate":len(found-old_ids),
            "source_verified_previous_coordinate":len(old_ids),
            "original_target_gold_read":False,
            "q3_global":"OPEN","rows":rows}
          Path("evidence/Q3_REAL_CAUSAL_RESIDUAL_SOURCE.json").write_text(
              json.dumps(report,sort_keys=True,separators=(",",":")))
          print("Q3_REAL_CAUSAL_RESIDUAL_SOURCE_RESULT",
                {k:v for k,v in report.items() if k!="rows"},flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-real-source-causal-residual-program-synthesis
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
