name: P1.6 semantic surface normalizer contracts

on:
  pull_request:
    paths:
      - 'neumann1/control_plane_p16.py'
      - 'experiments/control_plane_p16*.py'
      - 'tests/test_control_plane_p16*.py'
      - 'docs/experiments/control_plane_p16*.json'
      - 'docs/research/control_plane_p16*.md'
      - 'scripts/control_plane_p16*.py'
      - '.github/workflows/control_plane_p16.yml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing CPU package dependencies only
        run: python -m pip install numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1 threadpoolctl==3.7.0
      - name: P1.6 source compile preflight
        run: python -m py_compile neumann1/control_plane_p16.py experiments/control_plane_p16_catalog.py experiments/control_plane_p16_registration.py experiments/control_plane_p16_dev.py experiments/control_plane_p16_replay.py scripts/control_plane_p16_kaggle.py
      - name: P1.6 synthetic normalization and candidate contracts
        run: python -m unittest discover -s tests -p 'test_control_plane_p16*.py' -v
      - name: P1.6 frozen registration and original checker controls
        run: python -m experiments.control_plane_p16_registration
