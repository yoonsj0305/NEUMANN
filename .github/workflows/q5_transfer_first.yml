name: Q5 new-family first admission (unarmed without marker)

on:
  push:
    branches: [research/q5-transfer-admission]
    paths: [docs/experiments/q5_transfer_admission.trigger.json]

permissions:
  contents: write
concurrency:
  group: q5-transfer-first-admission
  cancel-in-progress: false

jobs:
  first-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "HASWELL"
      MKL_NUM_THREADS: "1"
      MKL_CBWR: "COMPATIBLE"
      BLIS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: First attempt and published independent contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test ! -e docs/experiments/results/v104_transfer_admission_first
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          marker=json.loads(Path('docs/experiments/q5_transfer_admission.trigger.json').read_text())
          assert marker['schema']=='neumann.q5-transfer-first-trigger.v104.v1'
          assert marker['rerun'] is False
          assert marker['fresh_seed_range']==[104000,104031]
          subprocess.run(['git','merge-base','--is-ancestor',marker['published_executor_head'],'HEAD'],check=True)
          current=subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/branches/main','--jq','.commit.sha'],text=True).strip()
          assert current==marker['latest_main_sha'],'main advanced: stop before new evidence'
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen runtime
        run: |
          pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.9.1 threadpoolctl==3.7.0 highspy==1.15.1
          pip install -e . --no-deps
          pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: First registration then isolated serial admission only
        run: |
          python -m experiments.q5_transfer_admission --directory docs/experiments/results/v104_transfer_admission_first --frozen-head "$GITHUB_SHA"
      - name: Retain first bytes including failed labels/partial receipts
        if: always()
        run: |
          if test -d docs/experiments/results/v104_transfer_admission_first; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- docs/experiments/results/v104_transfer_admission_first
            if ! git diff --cached --quiet; then
              git commit -m "Q5 retain first independent-family admission; no replacement"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
      - name: Upload first receipts including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q5-transfer-first-admission
          path: docs/experiments/results/v104_transfer_admission_first
