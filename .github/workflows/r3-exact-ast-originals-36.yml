name: R3 exact AST necessary-pattern cheap proof routing 36 originals
on:
  push:
    branches:
      - research/r3-exact-ast-proof-gate-36-20261018
    paths:
      - research/evidence/r3-exact-ast-gate-36/**
      - .github/workflows/r3-exact-ast-originals-36.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-way-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse exact original Z3 4.15.4 and SymPy 1.14
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.15.4.0 sympy==1.14.0
          python -m py_compile research/evidence/r3-exact-ast-gate-36/one_shot_old_vs_token_vs_exact_ast.py
      - name: Frozen 36 originals, old vs old R2 vs R3 exact AST necessary gate
        run: |
          python research/evidence/r3-exact-ast-gate-36/one_shot_old_vs_token_vs_exact_ast.py
          python - <<'PY'
          import json
          p='/tmp/r3_frozen36_semantic_gate_receipt.json'
          d=json.load(open(p))
          assert d['status']=='R3_FIRST_36_EXACT_AST_ROUTER_COMPLETE'
          assert len(d['cases'])==36
          assert d['summary']['r3_preservation']=='PASS_4_OF_4'
          assert d['neural_forwards']==0 and d['global_Q1_Q7']=='OPEN'
          print('R3_NARROW_STAGE_GATE',d['summary']['r3_criterion'])
          PY
      - name: Preserve FIRST test all per-source statuses, including technical failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-exact-ast-sound-noop-36-originals-first
          path: /tmp/r3_frozen36_semantic_gate_receipt.json
          retention-days: 90
