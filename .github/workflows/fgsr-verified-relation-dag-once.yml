name: NEUMANN factored exact relation original 48-rule independent proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-48-dag-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
      - run: python research/evidence/fgsr-q3-verified-relation-factor-20261017/independent_full48_dag_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-48-original-dag-compression-independent-audit
          path: research/evidence/fgsr-q3-verified-relation-factor-20261017/INDEPENDENT_GITHUB_48_DAG_RECEIPT.json
          retention-days: 45
