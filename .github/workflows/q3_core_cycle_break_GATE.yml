name: NEUMANN Q3 core anti-loop admission FIRST software gate
on:
  push:
    branches:
      - research/q3-root-cause-cycle-break-20261106
      - research/q3-g1-native-saturation-stop-20261106
      - research/q3-g2-native-full-coverage-stop-20261106
    paths:
      - .github/workflows/q3_core_cycle_break_GATE.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reject-repeated-fixed-H:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run precise fail-closed admission controls, no ARC task bodies or model inference
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_q3_cycle_break_gate.py -v
      - name: P45 known-failure strategy is hard rejected, not Q3 promoted
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          example={
            "schema":"neumann.q3.unseen-semantic-proposer-admission.v1",
            "strategy":"ONE_SEED_MASK_MERGE"
          }
          Path('/tmp/closed_p45.json').write_text(json.dumps(example))
          PY
          set +e
          python3 scripts/q3_cycle_break_gate.py /tmp/closed_p45.json --repo . > Q3-CYCLE-BREAK-P45-NEGATIVE-RECEIPT.json
          code=$?
          set -e
          test "$code" = 2
          cat Q3-CYCLE-BREAK-P45-NEGATIVE-RECEIPT.json
          python3 - <<'PY'
          import json
          x=json.load(open('Q3-CYCLE-BREAK-P45-NEGATIVE-RECEIPT.json'))
          assert x['decision']=='HARD_STOP_REPEAT_CLASS'
          assert x['spend_authorized'] is False
          assert x['Q3_learned_discovery']=='NOT_PROVEN'
          assert x['can_consume_untouched_arc_eval'] is False
          print('P45_REPEATED_HYPOTHESIS_FAMILY_HARD_STOP_PASS')
          PY
      - name: Verify actual native-saturated learned AST cannot reenter Q3 experimentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/known_g1.json').write_text(json.dumps({
           "schema":"neumann.q3.unseen-semantic-proposer-admission.v1",
           "strategy":"OWN_WEIGHT_FIXED_TWO_TOKEN_STRING_AST",
           "generator":{"own_weights_trained":True,
             "typed_executable_AST":True}
          }))
          PY
          set +e
          python3 scripts/q3_cycle_break_gate.py /tmp/known_g1.json --repo . > Q3-CYCLE-BREAK-G1-NATIVE-SATURATION.json
          rc=$?
          set -e
          test "$rc" = 2
          python3 - <<'PY'
          import json
          v=json.load(open('Q3-CYCLE-BREAK-G1-NATIVE-SATURATION.json'))
          assert v['decision']=='HARD_STOP_REPEAT_CLASS'
          assert v['spend_authorized'] is False
          assert v['Q3_learned_discovery']=='NOT_PROVEN'
          assert v['can_consume_untouched_arc_eval'] is False
          print('G1_TRAINED_TWO_TOKEN_AST_NATIVE_8_OF_8_SATURATION_HARD_STOP_PASS')
          PY
      - name: Ensure entire G2 24/24 source-native cohort cannot be wasted as neural discovery
        shell: bash
        run: |
          set -euo pipefail
          echo '{"schema":"neumann.q3.unseen-semantic-proposer-admission.v1","strategy":"NATIVE_SATURATED_SYGUS_BV64_AND_INTEGER_INV","generator":{"own_weights_trained":true}}' > /tmp/g2-native-closed.json
          set +e
          python3 scripts/q3_cycle_break_gate.py /tmp/g2-native-closed.json --repo . > Q3-CYCLE-BREAK-G2-NATIVE-FULL-COVERAGE.json
          rc=$?
          set -e
          test "$rc" = 2
          python3 - <<'PY'
          import json
          v=json.load(open('Q3-CYCLE-BREAK-G2-NATIVE-FULL-COVERAGE.json'))
          assert v['decision']=='HARD_STOP_REPEAT_CLASS'
          assert v['spend_authorized'] is False
          assert v['Q3_learned_discovery']=='NOT_PROVEN'
          assert v['can_consume_untouched_arc_eval'] is False
          assert '24/24' in v['reason']
          print('G2_NATIVE_24_OF_24_SATURATED_NO_Q3_LEARNED_HARD_STOP_PASS')
          PY
      - name: Preserve original software gate evidence without a capability claim
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEUMANN-Q3-CYCLE-BREAK-P45-NEGATIVE-GATE
          path: |
            Q3-CYCLE-BREAK-P45-NEGATIVE-RECEIPT.json
            Q3-CYCLE-BREAK-G1-NATIVE-SATURATION.json
            Q3-CYCLE-BREAK-G2-NATIVE-FULL-COVERAGE.json
          if-no-files-found: warn
          retention-days: 90
