name: Q3 trainable composed AST macro original solver proof
on:
  pull_request:
    paths:
      - '.github/workflows/q3-trained-ast-macro.yml'
      - 'research/evidence/q3_learned_typed_ast_macro_20261019/**'
      - 'docs/research/Q3_TRAINED_COMPOSITIONAL_AST_MACRO_FIRST_CI_FREEZE_20261019.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first_trainable_composite_ast_original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SaswatPadhi/LoopInvGen
          ref: 6ac90265b11431c9477dfbd33e3e3380234c0499
          path: official_loopinv
          sparse-checkout: |
            benchmarks/NIA/2016.ATVA_PILAT
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze real original identity and compile source
        run: |
          test "$(git -C official_loopinv rev-parse HEAD)" = 6ac90265b11431c9477dfbd33e3e3380234c0499
          python -m py_compile research/evidence/q3_learned_typed_ast_macro_20261019/train_self_discovered_composition.py
      - name: Install pinned independent Z3 and cvc5 under SHA
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          test "$(find /tmp/cvc5bin -type f -name cvc5 | wc -l)" -eq 1
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F '1.4.2'
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0 sympy==1.14.0 numpy==2.3.5 scipy==1.17.0
      - name: FIRST full source-feedback learned AST macro and original three VC verification
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_learned_typed_ast_macro_20261019/train_self_discovered_composition.py --original-root official_loopinv --out /tmp/q3_trained_ast_macro_first.json | tee /tmp/q3_trained_ast_macro_first.log
          sha256sum /tmp/q3_trained_ast_macro_first.json
      - name: Preserve actual FIRST outcome, including failures/unknowns
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-self-discovered-composite-ast-first
          path: |
            /tmp/q3_trained_ast_macro_first.json
            /tmp/q3_trained_ast_macro_first.log
          if-no-files-found: warn
      - name: Enforce no fabricated global claims or solver bypass
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3_trained_ast_macro_first.json'))
          assert x['initial_grammar_primitives']['has_mod_operator'] is False
          assert x['initial_grammar_primitives']['programs_complete_closure']==25920
          assert x['synthetic_train_rows']==240
          assert x['policy_metrics']['gradient_updates']==100
          assert x['no_gold_AST_supplied_as_training_label'] is True
          assert x['neural_training_uses_self_discovered_symbolic_pseudolabel'] is True
          assert x['learned_neural_discovered_initial_macro_without_symbolic_search'] is False
          assert x['new_mathematical_primitive_outside_complete_grammar'] is False
          assert x['strong_matched_classical_also_solves'] is True
          assert x['real_external_original_fresh_blind'] is False
          assert x['global_Q3']==x['global_Q1_Q7']=='OPEN'
          assert x['synthetic_scope_pass'],x['synthetic_holdout']
          assert len(x['synthetic_holdout'])==4
          assert not x['greedy_untrained_correct']
          print('Q3_AST_SELF_DISTILLED_TYPED_MACRO_SYNTHETIC_SCOPED_PASS')
          print('GLOBAL_Q3',x['global_Q3'])
          PY
