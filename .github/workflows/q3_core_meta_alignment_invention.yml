name: NEUMANN Core Meta-Alignment Operator Self-Expansion
on:
  push:
    branches:
      - feature/core-meta-alignment-invention-20261108
    paths:
      - neumann1/structural_meta_invention.py
      - tests/test_structural_meta_invention.py
      - neumann1/engine.py
      - neumann1/registry_engine.py
      - .github/workflows/q3_core_meta_alignment_invention.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core_meta_alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the real NEUMANN core
        run: |
          python -m pip install -q --disable-pip-version-check numpy scipy scikit-learn pytest
          python -m compileall -q neumann1
      - name: Drive the production engines through self-invented alignments
        run: python -m pytest -q tests/test_structural_meta_invention.py tests/test_engine.py
