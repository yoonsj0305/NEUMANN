name: NEUMANN research Q3 bounded-consensus focused tests
on:
  push:
    branches: [research/rc51-intelligence-spend-gate-20261026]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-uncertainty-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: focused six tests on real first-benchmark false-consensus diagnosis
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_q3_portfolio_consensus_evidence_gate_20261027.py tests/test_q3_source_input_identifiability_guard_20261027.py

  official-danger39-exact-source-cyclic-ranking-impossibility:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - name: Check source and pre-experiment retrospective mathematical theorem disclosure
        run: |
          set -euo pipefail
          test -s docs/research/G0_OFFICIAL_DANGER39_CYCLIC_RANK_IMPOSSIBILITY_POSTFIRST_PREREG_20261027.md
          python3 -m py_compile research/q3/discovery_policy/sygus_danger39_cyclic_rank_unsat_20261027.py
          sha256sum research/q3/discovery_policy/sygus_danger39_cyclic_rank_unsat_20261027.py
      - name: Pin original independent source and install proof engine
        run: |
          set -euo pipefail
          git init -q official_repo
          git -C official_repo remote add origin https://github.com/SyGuS-Org/benchmarks.git
          git -C official_repo fetch --depth 1 origin 13c8deb68a873635879c9a69bc78caebd340f646
          git -C official_repo checkout --detach -q FETCH_HEAD
          echo 'c9f45a3e85860f3161fb948a85489777498d64656673364b328162af1d9f2b2d  official_repo/lib/General_Track/cegist-cav18/inv/danger-loop39.sl' | sha256sum --check
          python3 -m pip -q install 'z3-solver==4.13.3.0'
      - name: Seven exact universal source implications + mathematical modular rank cycle
        run: |
          set -euo pipefail
          python3 research/q3/discovery_policy/sygus_danger39_cyclic_rank_unsat_20261027.py
          test -s official_danger39_cyclic_rank_proof/DANGER39_SOURCE_CHECKED_CYCLIC_RANK_UNREALIZABLE.json
          sha256sum official_danger39_cyclic_rank_proof/DANGER39_SOURCE_CHECKED_CYCLIC_RANK_UNREALIZABLE.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-g0-official-danger39-rank-cycle-original-unsat
          path: |
            official_danger39_cyclic_rank_proof/*.json
            official_danger39_cyclic_rank_proof/*.smt2
          if-no-files-found: warn
