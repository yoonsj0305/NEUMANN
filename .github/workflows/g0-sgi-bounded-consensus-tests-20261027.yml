name: NEUMANN research Q3 bounded-consensus focused tests
on:
  push:
    branches: [research/rc51-intelligence-spend-gate-20261026]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-uncertainty-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: focused six tests on real first-benchmark false-consensus diagnosis
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_q3_portfolio_consensus_evidence_gate_20261027.py tests/test_q3_source_input_identifiability_guard_20261027.py

  official-four-family-12-original-Z3-postfirst-grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - name: Original new12 native FIRST strictly sealed BEFORE independent grade
        run: |
          set -euo pipefail
          grep -Fq 'bde9d71dc8e9120a4178e29cb1e758014c2f7effcade3ccec1e75fdc1c1505ba' docs/research/G1_FOUR_FAMILY_NEW12_MODERN_C_FIRST_FROZEN_PREGRADE_20261028.md
          python3 -m py_compile research/q3/discovery_policy/sygus_official_diverse12_independent_z3_postfirst_20261028.py
          sha256sum research/q3/discovery_policy/sygus_official_diverse12_independent_z3_postfirst_20261028.py
      - uses: actions/download-artifact@v4
        with:
          name: neumann-g1-readiness-official-diverse-four-family-12-native-cvc5-FIRST
          run-id: 40607539670
          repository: yoonsj0305/NEUMANN
          github-token: ${{ github.token }}
          path: official_diverse12_sealed_first
      - name: Exact original first SHA before any new original full semantics accessed
        run: |
          set -euo pipefail
          echo 'bde9d71dc8e9120a4178e29cb1e758014c2f7effcade3ccec1e75fdc1c1505ba  official_diverse12_sealed_first/FOUR_FAMILY_NEW12_OFFICIAL_CVC5_142_FIRST.json' | sha256sum --check
          git init -q official_repo
          git -C official_repo remote add origin https://github.com/SyGuS-Org/benchmarks.git
          git -C official_repo fetch --depth 1 origin 13c8deb68a873635879c9a69bc78caebd340f646
          git -C official_repo checkout --detach -q FETCH_HEAD
          python3 -m pip -q install 'z3-solver==4.13.3.0'
      - name: Prove all original ordinary and exact invariant initialization, consecution and post VCs
        run: |
          set -euo pipefail
          python3 research/q3/discovery_policy/sygus_official_diverse12_independent_z3_postfirst_20261028.py
          sha256sum official_diverse12_independent_z3_grade/FOUR_FAMILY_ORIGINAL12_CLASSICAL_POSTFIRST_Z3_FULL_PROOF.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-g1-readiness-diverse-12-original-Z3-inductive-VC-postfirst
          path: official_diverse12_independent_z3_grade/FOUR_FAMILY_ORIGINAL12_CLASSICAL_POSTFIRST_Z3_FULL_PROOF.json
          if-no-files-found: warn
