name: NEUMANN research Q3 bounded-consensus focused tests
on:
  push:
    branches: [research/rc51-intelligence-spend-gate-20261026]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-uncertainty-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: focused six tests on real first-benchmark false-consensus diagnosis
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_q3_portfolio_consensus_evidence_gate_20261027.py tests/test_q3_source_input_identifiability_guard_20261027.py tests/test_ownweight_direct_program_evidence_gate_20261028.py tests/test_typed_ast_semantics_guard_v2_20261028.py tests/test_original_source_information_rights_gate_20261028.py


      - name: Independent standard-library original 8-bit finite semantic optimality certificate
        run: |
          set -euo pipefail
          python3 research/q3/discovery_policy/finite_semantic_query_certificate_20261028.py
          python3 - <<'PY'
          import json
          x=json.load(open("FINITE_8BIT_QUERY_OPTIMALITY_CERTIFICATE.json"))
          assert x["original_full_semantic_functions"] == 3639
          assert x["original_unidentifiable_without_more_observations"] == 257
          assert x["DP_minimum_total_extra_queries_uniform_semantics"] == 333
          assert x["greedy_total_extra_queries_uniform_semantics"] == 333
          assert x["G1"] == "HOLD"
          print("FINITESPACE_SOURCE_QUERY_THEOREM_REPLAY_PASS")
          PY
          sha256sum FINITE_8BIT_QUERY_OPTIMALITY_CERTIFICATE.json

      - name: Additional original-grammar 14 fixed source-input design, standard-library proof
        run: |
          set -euo pipefail
          python3 research/q3/discovery_policy/static_source_observation_design_certificate_20261028.py
          python3 - <<'PY'
          import json
          x=json.load(open('STATIC_SOURCE_QUERY_DESIGN_14_INPUTS_CERTIFICATE.json'))
          assert x['original_anchor_count']==16
          assert x['original_source_ambiguous_functions']==257
          assert x['designed_static_anchor_count']==14
          assert x['designed_source_signature_classes']==3639
          assert x['designed_source_ambiguous_functions']==0
          assert x['stronger_claim_global_minimum_14']=='NOT_PROVED'
          assert x['G1']=='HOLD'
          print('STATIC_SOURCE_14_OBSERVATIONS_EXACT_SEMANTIC_CERT_PASS')
          PY


  new16-original-native-z3-proof-and-pbe-oracle-rights:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - name: Freeze first before original proof grade; post-content PBE prereg
        run: |
          set -euo pipefail
          test -s docs/research/G1_EXTERNAL_NEW16_FIRST_SEALED_PRE_INDEPENDENT_GRADE_20261028.md
          test -s docs/research/G1_EXTERNAL_STRING_PBE_GROUND_EXAMPLES_NONIDENTIFIABILITY_TWO_PROGRAMS_POSTCONTENT_PREREG_20261028.md
          python3 -m py_compile research/q3/discovery_policy/sygus_external_new16_native_original_z3_postfirst_20261028.py research/q3/discovery_policy/sygus_external_string_pbe_nonidentifiability_z3_20261028.py
      - uses: actions/download-artifact@v4
        with:
          name: neumann-g1-new-external-fourtrack16-native-original-cvc5-first
          run-id: 40643083431
          repository: yoonsj0305/NEUMANN
          github-token: ${{ github.token }}
          path: external_new16_frozen_FIRST
      - name: Pin original first and source; install independent proof backend
        run: |
          set -euo pipefail
          echo '7acee7938ea2b8d18db2dd38058de36f7abdcf5116fbd703f6fce048b3a4418c  external_new16_frozen_FIRST/NEUMANN_G1_EXTERNAL_NEW16_FOUR_TRACKS_CVC5_FIRST.json' | sha256sum -c
          git init -q official_repo
          git -C official_repo remote add origin https://github.com/SyGuS-Org/benchmarks.git
          git -C official_repo fetch --depth 1 origin 13c8deb68a873635879c9a69bc78caebd340f646
          git -C official_repo checkout -q --detach FETCH_HEAD
          python3 -m pip -q install 'z3-solver==4.13.3.0'
      - name: Independent Z3 prove all native 10, retain original all16 denominator
        run: |
          set -euo pipefail
          python3 research/q3/discovery_policy/sygus_external_new16_native_original_z3_postfirst_20261028.py
          sha256sum external_new16_z3_postfirst/*.json
      - name: Prove original SLIA finite source example underdetermination with two distinct executable programs
        run: |
          set -euo pipefail
          python3 research/q3/discovery_policy/sygus_external_string_pbe_nonidentifiability_z3_20261028.py
          sha256sum external_pbe_source_nonidentifiability/*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-g1-new16-native-full-original-z3-and-string-multiple-solutions
          path: |
            external_new16_z3_postfirst/*.json
            external_pbe_source_nonidentifiability/*.json
            external_pbe_source_nonidentifiability/*.smt2
          if-no-files-found: warn


  three-external-native-invariants-nine-full-original-vcs-two-provers:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - name: Original source and candidate prereg integrity
        run: |
          set -euo pipefail
          test -s docs/research/G1_EXTERNAL16_THREE_INVARIANTS_NINE_FULL_ORIGINAL_VCS_TWO_BACKENDS_PREREG_20261028.md
          python3 -m py_compile research/q3/discovery_policy/sygus_external_3invariants_nine_vcs_two_engines_20261028.py
          sha256sum research/q3/discovery_policy/sygus_external_3invariants_nine_vcs_two_engines_20261028.py
      - uses: actions/download-artifact@v4
        with:
          name: neumann-g1-new-external-fourtrack16-native-original-cvc5-first
          run-id: 40643083431
          repository: yoonsj0305/NEUMANN
          github-token: ${{ github.token }}
          path: external_new16_frozen_FIRST
      - name: Source first immutable SHA and independent published solver
        run: |
          set -euo pipefail
          echo '7acee7938ea2b8d18db2dd38058de36f7abdcf5116fbd703f6fce048b3a4418c  external_new16_frozen_FIRST/NEUMANN_G1_EXTERNAL_NEW16_FOUR_TRACKS_CVC5_FIRST.json' | sha256sum -c
          git init -q official_repo
          git -C official_repo remote add origin https://github.com/SyGuS-Org/benchmarks.git
          git -C official_repo fetch --depth 1 origin 13c8deb68a873635879c9a69bc78caebd340f646
          git -C official_repo checkout -q --detach FETCH_HEAD
          python3 -m pip -q install 'z3-solver==4.13.3.0'
          curl -fSL --retry 3 --max-time 150 \
            'https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-libcxx-static.zip' \
            -o official-cvc5-142.zip
          echo '0af677313c8277dc558d3049b192389db4d975d31c968fbd6f31cf0849ee411d  official-cvc5-142.zip' | sha256sum -c
          unzip -q official-cvc5-142.zip -d official-bin
          f="$(find official-bin -type f -name cvc5 | head -1)"
          test -n "$f"
          mkdir -p native_solver_bin
          cp "$f" native_solver_bin/cvc5
          chmod +x native_solver_bin/cvc5
          echo "$(pwd)/native_solver_bin" >> "$GITHUB_PATH"
      - name: Actually create 9 full original SMT VCs and prove by independent Z3 and CVC5
        run: |
          set -euo pipefail
          python3 research/q3/discovery_policy/sygus_external_3invariants_nine_vcs_two_engines_20261028.py
          sha256sum external_invariant3_two_provers/*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-g1-external3-original-invariants-nine-vcs-cvc5-z3
          path: |
            external_invariant3_two_provers/*.json
            external_invariant3_two_provers/*.smt2
          if-no-files-found: warn
