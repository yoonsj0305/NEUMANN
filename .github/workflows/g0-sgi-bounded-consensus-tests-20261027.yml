name: NEUMANN research Q3 bounded-consensus focused tests
on:
  push:
    branches: [research/rc51-intelligence-spend-gate-20261026]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-uncertainty-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: focused six tests on real first-benchmark false-consensus diagnosis
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_q3_portfolio_consensus_evidence_gate_20261027.py tests/test_q3_source_input_identifiability_guard_20261027.py

  official-sygus-9-native-candidates-z3-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - name: Preregistered separate exact original semantics Z3 obligations
        run: |
          test -s docs/research/G0_OFFICIAL_SYGUS_C16_Z3_ORDINARY_CONSTRAINTS_POSTFIRST_PREREG_20261027.md
          python3 -m py_compile research/q3/discovery_policy/sygus_official_independent_ordinary_z3_postfirst_20261027.py
          sha256sum research/q3/discovery_policy/sygus_official_independent_ordinary_z3_postfirst_20261027.py
      - uses: actions/download-artifact@v4
        with:
          name: neumann-g0-official-SyGuS-four-families-C16-FIRST-source
          run-id: 40490276713
          repository: yoonsj0305/NEUMANN
          github-token: ${{ github.token }}
          path: official_original_first
      - name: Restore pinned independent original and verify unmodified classical first
        run: |
          set -euo pipefail
          echo 'a648346b162b3c76d4c60283f339c1a3c54016ad374128c1b4135453c27a5ba5  official_original_first/OFFICIAL_C16_FIRST_UNGRADED_CLASSICAL_HEADROOM.json' | sha256sum -c
          git init -q official_repo
          git -C official_repo remote add origin https://github.com/SyGuS-Org/benchmarks.git
          git -C official_repo fetch --depth 1 origin 13c8deb68a873635879c9a69bc78caebd340f646
          git -C official_repo checkout --detach -q FETCH_HEAD
          python3 -m pip install -q 'z3-solver==4.13.3.0'
      - name: Check native first candidate full original semantic obligations with Z3
        run: |
          set -euo pipefail
          python3 research/q3/discovery_policy/sygus_official_independent_ordinary_z3_postfirst_20261027.py
          sha256sum official_z3_semantic_grade/OFFICIAL_9_CANDIDATES_ORDINARY_Z3_GRADE_POSTFIRST.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-g0-official-C16-first-Z3-independent-ordinary-candidate-verdicts
          path: official_z3_semantic_grade/OFFICIAL_9_CANDIDATES_ORDINARY_Z3_GRADE_POSTFIRST.json
          if-no-files-found: warn
