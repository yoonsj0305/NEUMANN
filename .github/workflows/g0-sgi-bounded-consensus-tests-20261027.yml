name: NEUMANN research Q3 bounded-consensus focused tests
on:
  push:
    branches: [research/rc51-intelligence-spend-gate-20261026]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-uncertainty-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: focused six tests on real first-benchmark false-consensus diagnosis
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_q3_portfolio_consensus_evidence_gate_20261027.py tests/test_q3_source_input_identifiability_guard_20261027.py

  official-sygus-four-family-strong-c-first:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - name: Strict preregistration and runner syntax verification
        run: |
          set -euo pipefail
          test -s docs/research/G0_OFFICIAL_SYGUS_C_MULTI_FAMILY_16_FIRST_PREREG_20261027.md
          python3 -m py_compile research/q3/discovery_policy/sygus_official_multifamily_classical_first_20261027.py
          sha256sum research/q3/discovery_policy/sygus_official_multifamily_classical_first_20261027.py
      - name: Fetch EXACT pinned external official SyGuS originals and native CVC5
        run: |
          set -euo pipefail
          git init -q official_repo
          git -C official_repo remote add origin https://github.com/SyGuS-Org/benchmarks.git
          git -C official_repo fetch --depth 1 origin 13c8deb68a873635879c9a69bc78caebd340f646
          git -C official_repo checkout --detach -q FETCH_HEAD
          test "$(git -C official_repo rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y -qq install cvc5
          cvc5 --version
      - name: Run all original official tasks under one 15-second cap each
        run: |
          set -euo pipefail
          python3 research/q3/discovery_policy/sygus_official_multifamily_classical_first_20261027.py
          test -s official_c16_first/OFFICIAL_C16_FIRST_UNGRADED_CLASSICAL_HEADROOM.json
          sha256sum official_c16_first/OFFICIAL_C16_FIRST_UNGRADED_CLASSICAL_HEADROOM.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-g0-official-SyGuS-four-families-C16-FIRST-source
          path: |
            official_c16_first/OFFICIAL_C16_FIRST_UNGRADED_CLASSICAL_HEADROOM.json
            official_c16_first/*.stdout
            official_c16_first/*.stderr
          if-no-files-found: warn
