name: NEUMANN research Q3 bounded-consensus focused tests
on:
  push:
    branches: [research/rc51-intelligence-spend-gate-20261026]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-uncertainty-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: focused six tests on real first-benchmark false-consensus diagnosis
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_q3_portfolio_consensus_evidence_gate_20261027.py tests/test_q3_source_input_identifiability_guard_20261027.py

  # One-time never-opened SGI12 source-only A/B prior FIRST.
  new-ownweight-program-prior-first:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      SEALED_TRAIN_SHA256: aa43cf5f770b351ac3848fb0f9ece9e1e4255715d5029bd9164c61c5dd113edd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - name: Verify training checkpoint was independently sealed first
        run: |
          set -euo pipefail
          grep -q 'aa43cf5f770b351ac3848fb0f9ece9e1e4255715d5029bd9164c61c5dd113edd' docs/research/G0_OWNWEIGHT_PROGRAM_PRIOR_A_B_TRAINED_WEIGHTS_PRETEST_SEAL_20261027.md
          python3 -m py_compile research/q3/discovery_policy/sgi_ownweight_prior_new12_first.py
          sha256sum research/q3/discovery_policy/sgi_ownweight_prior_new12_first.py
      - uses: actions/download-artifact@v4
        with:
          name: neumann-g0-SGI-ownweight-trained-A-B-weights-20261027
          run-id: 40482577961
          repository: yoonsj0305/NEUMANN
          github-token: ${{ github.token }}
          path: training_weights
      - name: Install native CVC5 and independent source Z3
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y -qq install cvc5
          python3 -m pip -q install 'z3-solver==4.13.3.0'
          cvc5 --version
      - name: Prepare EXACT fixed new original filenames, source-only body and unlabeled inputs
        run: |
          set -euo pipefail
          echo 'aa43cf5f770b351ac3848fb0f9ece9e1e4255715d5029bd9164c61c5dd113edd  training_weights/FROZEN_TRAINED_A_B_WEIGHTS.json' | sha256sum -c
          git init -q upstream
          git -C upstream remote add origin https://github.com/Barnard-PL-Labs/sygus-sgi-1.git
          git -C upstream fetch --depth 1 origin e7ae840e5546e9243ff94afb1a29064fc050011c
          git -C upstream checkout -q --detach FETCH_HEAD
          python3 research/q3/discovery_policy/sgi_ownweight_prior_new12_first.py prepare
          test -s newprior_source_pack.json
          rm -rf upstream
      - name: Freeze all test arm programs and A/B/MDL/C0 selections without heldout outputs
        run: |
          set -euo pipefail
          test ! -e upstream
          python3 research/q3/discovery_policy/sgi_ownweight_prior_new12_first.py propose
          test -s newprior_first/UNSEEN12_FIRST_PROGRAM_SELECTIONS_BEFORE_GOLD.json
          sha256sum newprior_first/UNSEEN12_FIRST_PROGRAM_SELECTIONS_BEFORE_GOLD.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-g0-SGI-ownweight-new12-FROZEN-FIRST-ungRADED
          path: |
            newprior_first/UNSEEN12_FIRST_PROGRAM_SELECTIONS_BEFORE_GOLD.json
            newprior_first/*.stdout
            newprior_first/*.stderr
          if-no-files-found: warn
