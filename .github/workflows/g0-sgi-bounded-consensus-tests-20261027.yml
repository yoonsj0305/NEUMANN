name: NEUMANN research Q3 bounded-consensus focused tests
on:
  push:
    branches: [research/rc51-intelligence-spend-gate-20261026]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-uncertainty-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: focused six tests on real first-benchmark false-consensus diagnosis
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_q3_portfolio_consensus_evidence_gate_20261027.py tests/test_q3_source_input_identifiability_guard_20261027.py

  official-sorting-naive-SymPy-true-grammar-CFG-Z3:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - name: Pre-frozen post-FIRST grammar-aware classical compression contract
        run: |
          set -euo pipefail
          test -s docs/research/G1_SORTING_NAIVE_POSTFIRST_SYMPY_GRAMMAR_SPECIALIST_PREREG_20261028.md
          python3 -m py_compile research/q3/discovery_policy/sygus_sortingnaive_boolean_cnf_cfg_z3_postfirst_20261028.py
          sha256sum research/q3/discovery_policy/sygus_sortingnaive_boolean_cnf_cfg_z3_postfirst_20261028.py
      - name: Official externally authored exact pinned original Boolean circuit and two independent checker libraries
        run: |
          set -euo pipefail
          git init -q official_repo
          git -C official_repo remote add origin https://github.com/SyGuS-Org/benchmarks.git
          git -C official_repo fetch --depth 1 origin 13c8deb68a873635879c9a69bc78caebd340f646
          git -C official_repo checkout --detach -q FETCH_HEAD
          echo '07ec6bd54cdf81008dcb273cb7528c3c5ad30843b0642262ef8b8731cb5137e6  official_repo/lib/General_Track/woosuk/sorting_naive.eqn_sygus_iter_256_0.sl' | sha256sum -c
          python3 -m pip -q install 'z3-solver==4.13.3.0' 'sympy==1.14.0'
      - name: Actually compute 64 truth table, SymPy canonical CNF, original grammar derivation and native independent Z3 proof
        run: |
          set -euo pipefail
          python3 research/q3/discovery_policy/sygus_sortingnaive_boolean_cnf_cfg_z3_postfirst_20261028.py
          test -s official_sortingnaive_bool_specialist/SORTING_NAIVE_ORIGINAL_BOOL_COMPRESSED_AST_CFG_Z3_PROOF.json
          sha256sum official_sortingnaive_bool_specialist/SORTING_NAIVE_ORIGINAL_BOOL_COMPRESSED_AST_CFG_Z3_PROOF.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-g1-no-neural-spend-sortingnaive-sympy-original-cfg-z3
          path: |
            official_sortingnaive_bool_specialist/*.json
            official_sortingnaive_bool_specialist/*.smt2
          if-no-files-found: warn
