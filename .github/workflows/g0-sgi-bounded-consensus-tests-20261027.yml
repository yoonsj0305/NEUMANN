        run: |
          set -euo pipefail
          test -s docs/research/G1_ORIGINAL_INVARIANT_106C_POSTFIRST_FINITE_UNSAFE_PATH_PREREG_20261028.md
          python3 -m py_compile research/q3/discovery_policy/sygus_original_106_postfirst_reachability_unsat_20261028.py
      - uses: actions/download-artifact@v4
        with:
          name: neumann-g1-new-external-fourtrack16-native-original-cvc5-first
          run-id: 40643083431
          repository: yoonsj0305/NEUMANN
          github-token: ${{ github.token }}
          path: external_4track16_FROZEN_FIRST
      - name: Pinned first original SHA, third-party source commit and both independent SMT solvers
        run: |
