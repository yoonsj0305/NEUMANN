name: NEUMANN research Q3 bounded-consensus focused tests
on:
  push:
    branches: [research/rc51-intelligence-spend-gate-20261026]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-uncertainty-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: focused six tests on real first-benchmark false-consensus diagnosis
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_q3_portfolio_consensus_evidence_gate_20261027.py tests/test_q3_source_input_identifiability_guard_20261027.py

  # Temporary isolated training stage; original data only; never reads new eval gold.
  trained-ownweight-prior-training:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - name: Preserve exact prereg code before reading train originals
        run: |
          test -s docs/research/G0_OWNWEIGHT_PROGRAM_PRIOR_NEW12_PREREG_20261027.md
          python3 -m py_compile research/q3/discovery_policy/sgi_ownweight_prior_train.py
          ! grep -q 'import numpy' research/q3/discovery_policy/sgi_ownweight_prior_train.py
          sha256sum research/q3/discovery_policy/sgi_ownweight_prior_train.py
      - uses: actions/download-artifact@v4
        with:
          name: neumann-g0-sgi12-active-oracle-FIRST-UNgraded-20261027
          run-id: 40456478489
          repository: yoonsj0305/NEUMANN
          github-token: ${{ github.token }}
          path: training_first
      - name: Install genuine PyTorch CPU training and independent Z3
        run: |
          python3 -m pip -q install 'z3-solver==4.13.3.0'
          python3 -m pip -q install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python3 -c 'import torch,z3; print(torch.__version__,z3.get_version_string())'
      - name: Pinned previous original task source
        run: |
          echo 'a2713cee7e4a54506501927c07ff65f78d4ad110e4c9568892d937f3a0aa8185  training_first/FIRST_PROPOSALS_AND_QUERY_DECISIONS_UNGRADED.json' | sha256sum -c
          git init -q upstream
          git -C upstream remote add origin https://github.com/Barnard-PL-Labs/sygus-sgi-1.git
          git -C upstream fetch --depth 1 origin e7ae840e5546e9243ff94afb1a29064fc050011c
          git -C upstream checkout --detach -q FETCH_HEAD
      - name: Train three true-label and three shuffled-label ownweight policies
        run: |
          python3 research/q3/discovery_policy/sgi_ownweight_prior_train.py
          test -s training_weights/FROZEN_TRAINED_A_B_WEIGHTS.json
          sha256sum training_weights/FROZEN_TRAINED_A_B_WEIGHTS.json
          rm -rf upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-g0-SGI-ownweight-trained-A-B-weights-20261027
          path: training_weights/FROZEN_TRAINED_A_B_WEIGHTS.json
          if-no-files-found: warn
