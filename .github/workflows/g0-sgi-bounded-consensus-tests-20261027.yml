          echo "$(pwd)/native_solver_bin" >> "$GITHUB_PATH"
          python3 -m pip -q install 'z3-solver==4.13.3.0'
      - name: Test original pre/transition/NOT safety at depth1-3 with Z3 and cvc5
        run: |
          set -euo pipefail
          python3 research/q3/discovery_policy/sygus_original_106_postfirst_reachability_unsat_20261028.py
          sha256sum official_106_reachable_unsafety/*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-g1-original-106-reachable-unsafety-z3-cvc5
