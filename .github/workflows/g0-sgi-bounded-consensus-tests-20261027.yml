name: NEUMANN research Q3 bounded-consensus focused tests
on:
  push:
    branches: [research/rc51-intelligence-spend-gate-20261026]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-uncertainty-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: focused six tests on real first-benchmark false-consensus diagnosis
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_q3_portfolio_consensus_evidence_gate_20261027.py tests/test_q3_source_input_identifiability_guard_20261027.py

  official-dangerloop-eight-postfirst-native-Z3:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - name: Seal that historical original first research receipt was committed BEFORE grading
        run: |
          set -euo pipefail
          grep -Fq '57df20f0c54f2c22965e3a6b104def1a529ccf58bbc645fedd4695aa041b4c3d' docs/research/G0_OFFICIAL_DANGER8_PROSPECTIVE_FIRST_SEALED_PRE_NATIVE_POSTGRADE_20261027.md
          python3 -m py_compile research/q3/discovery_policy/sygus_dangerloop_unseen8_native_postfirst_z3_grade_20261027.py
          sha256sum research/q3/discovery_policy/sygus_dangerloop_unseen8_native_postfirst_z3_grade_20261027.py
      - uses: actions/download-artifact@v4
        with:
          name: neumann-g0-official-danger8-prospective-structure-vs-modern-c-first
          run-id: 40500729030
          repository: yoonsj0305/NEUMANN
          github-token: ${{ github.token }}
          path: official_danger8_frozen_first
      - name: Original FIRST sha exact verified, pin original Git SHA independently
        run: |
          set -euo pipefail
          echo '57df20f0c54f2c22965e3a6b104def1a529ccf58bbc645fedd4695aa041b4c3d  official_danger8_frozen_first/DANGERLOOP_SAME_AUTHOR_PROSPECTIVE_EIGHT_TEMPLATE_VS_CVC5_142.json' | sha256sum --check
          git init -q official_repo
          git -C official_repo remote add origin https://github.com/SyGuS-Org/benchmarks.git
          git -C official_repo fetch --depth 1 origin 13c8deb68a873635879c9a69bc78caebd340f646
          git -C official_repo checkout --detach -q FETCH_HEAD
          python3 -m pip -q install 'z3-solver==4.13.3.0'
      - name: Independent Z3 for all 5 frozen native wrapped program outputs, 3 timeout unchanged
        run: |
          set -euo pipefail
          python3 research/q3/discovery_policy/sygus_dangerloop_unseen8_native_postfirst_z3_grade_20261027.py
          sha256sum official_danger8_independent_z3_grade/POSTFIRST_DANGER8_ORIGINAL_CVC5_142_Z3_VERIFIED.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-g0-official-danger8-postfirst-native-cvc5-z3-proof
          path: official_danger8_independent_z3_grade/POSTFIRST_DANGER8_ORIGINAL_CVC5_142_Z3_VERIFIED.json
          if-no-files-found: warn
