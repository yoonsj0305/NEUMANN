name: NEUMANN research Q3 bounded-consensus focused tests
on:
  push:
    branches: [research/rc51-intelligence-spend-gate-20261026]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-uncertainty-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: focused six tests on real first-benchmark false-consensus diagnosis
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_q3_portfolio_consensus_evidence_gate_20261027.py
  # ONE-SHOT bounded development analysis; remove after sealing exact receipt.
  opened-dev-constructive-bitguard:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - name: Preserve original code and prereg SHA
        run: |
          test -s docs/research/G0_SGI_CONSTRUCTIVE_BITGUARD_OPENED_DEV_PREREG_20261027.md
          python3 -m py_compile research/q3/discovery_policy/sgi_constructive_bitguard_opened_dev.py
          sha256sum research/q3/discovery_policy/sgi_constructive_bitguard_opened_dev.py
      - uses: actions/download-artifact@v4
        with:
          name: neumann-g0-sgi12-active-oracle-FIRST-UNgraded-20261027
          run-id: 40456478489
          repository: yoonsj0305/NEUMANN
          github-token: ${{ github.token }}
          path: previous_first
      - name: Install distinct original source and pinned Z3
        run: |
          set -euo pipefail
          python3 -m pip -q install 'z3-solver==4.13.3.0'
          git init -q upstream
          git -C upstream remote add origin https://github.com/Barnard-PL-Labs/sygus-sgi-1.git
          git -C upstream fetch --depth 1 origin e7ae840e5546e9243ff94afb1a29064fc050011c
          git -C upstream checkout -q --detach FETCH_HEAD
          echo 'a2713cee7e4a54506501927c07ff65f78d4ad110e4c9568892d937f3a0aa8185  previous_first/FIRST_PROPOSALS_AND_QUERY_DECISIONS_UNGRADED.json' | sha256sum --check
      - name: Sanitize source and unlabeled inputs, remove withheld outputs
        run: |
          set -euo pipefail
          python3 research/q3/discovery_policy/sgi_constructive_bitguard_opened_dev.py prepare
          rm -rf upstream
      - name: Construct original-grammar counterprogram and prove independent Z3 obligations
        run: |
          set -euo pipefail
          test ! -e upstream
          python3 research/q3/discovery_policy/sgi_constructive_bitguard_opened_dev.py prove
          sha256sum bitguard_receipt/POSTFIRST_CONSTRUCTIVE_64BIT_BITGUARD_WITNESS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-g0-sgi-constructive-bitguard-opened-dev
          path: bitguard_receipt/POSTFIRST_CONSTRUCTIVE_64BIT_BITGUARD_WITNESS.json
          if-no-files-found: warn
