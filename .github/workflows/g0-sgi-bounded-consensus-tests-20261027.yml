name: NEUMANN research Q3 bounded-consensus focused tests
on:
  push:
    branches: [research/rc51-intelligence-spend-gate-20261026]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-uncertainty-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: focused six tests on real first-benchmark false-consensus diagnosis
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_q3_portfolio_consensus_evidence_gate_20261027.py tests/test_q3_source_input_identifiability_guard_20261027.py

  official-firefly-independent-second-CVC5-fifteen-verification-conditions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - name: Prove prior five-candidate result immutable before second backend
        run: |
          set -euo pipefail
          test -s docs/research/G1_FIREFLY_INDEPENDENT_CVC5_SECOND_BACKEND_PARITY_PREREG_20261028.md
          python3 -m py_compile research/q3/discovery_policy/sygus_firefly_five_candidate_cvc5_independent_replay_20261028.py
          grep -Fq 'assert len(source_vars)==20' research/q3/discovery_policy/sygus_firefly_five_candidate_cvc5_independent_replay_20261028.py
          sha256sum research/q3/discovery_policy/sygus_firefly_five_candidate_cvc5_independent_replay_20261028.py
      - uses: actions/download-artifact@v4
        with:
          name: neumann-g1-official-FIREFLY-5-classical-inductive-candidates
          run-id: 40629900597
          repository: yoonsj0305/NEUMANN
          github-token: ${{ github.token }}
          path: official_frozen_firefly_five
      - name: Verify frozen five-program original Z3 SHA and official independent CVC5 binary
        run: |
          set -euo pipefail
          echo 'fb98bc250e57131cb671c613616796373a5f5ff2a93acd4ebb0472cd28f810c4  official_frozen_firefly_five/FIREFLY_ORIGINAL_5_CLASSIC_INVARIANTS_3VC_POSTFIRST.json' | sha256sum -c
          curl -fSL --retry 3 --max-time 150 \
            'https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-libcxx-static.zip' \
            -o official-cvc5-142.zip
          echo '0af677313c8277dc558d3049b192389db4d975d31c968fbd6f31cf0849ee411d  official-cvc5-142.zip' | sha256sum --check
          unzip -q official-cvc5-142.zip -d official-bin
          f="$(find official-bin -type f -name cvc5 | head -n 1)"
          test -n "$f"
          mkdir -p native_solver_bin
          cp "$f" native_solver_bin/cvc5
          chmod +x native_solver_bin/cvc5
          echo "$(pwd)/native_solver_bin" >> "$GITHUB_PATH"
          native_solver_bin/cvc5 --version | head -n 1
      - name: Fetch exact source original in fresh checkout and run 15 independent SMT checks
        run: |
          set -euo pipefail
          git init -q official_repo
          git -C official_repo remote add origin https://github.com/SyGuS-Org/benchmarks.git
          git -C official_repo fetch --depth 1 origin 13c8deb68a873635879c9a69bc78caebd340f646
          git -C official_repo checkout --detach -q FETCH_HEAD
          python3 research/q3/discovery_policy/sygus_firefly_five_candidate_cvc5_independent_replay_20261028.py
          sha256sum official_firefly_2solver_recheck/FIREFLY_5_ORIGINAL_INVARIANTS_TWO_PROVERS_15_VCS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-g1-FIREFLY-independent-CVC5-15-original-smt-verification-conditions
          path: |
            official_firefly_2solver_recheck/*.json
            official_firefly_2solver_recheck/*.smt2
          if-no-files-found: warn
