name: NEUMANN research Q3 bounded-consensus focused tests
on:
  push:
    branches: [research/rc51-intelligence-spend-gate-20261026]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-uncertainty-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: focused six tests on real first-benchmark false-consensus diagnosis
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_q3_portfolio_consensus_evidence_gate_20261027.py tests/test_q3_source_input_identifiability_guard_20261027.py

  official-firefly-five-preregistered-classical-invariant-VCS:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - name: Assert exact five precommitted original FIREFLY hypotheses
        run: |
          set -euo pipefail
          test -s docs/research/G1_FIREFLY_POSTFIRST_FIVE_FIXED_CLASSICAL_INVARIANT_VC_PREREG_20261028.md
          python3 -m py_compile research/q3/discovery_policy/sygus_firefly_five_classic_invariants_postfirst_20261028.py
          sha256sum research/q3/discovery_policy/sygus_firefly_five_classic_invariants_postfirst_20261028.py
      - name: Fetch exact 3rd party FIREFLY original source
        run: |
          set -euo pipefail
          git init -q official_repo
          git -C official_repo remote add origin https://github.com/SyGuS-Org/benchmarks.git
          git -C official_repo fetch --depth 1 origin 13c8deb68a873635879c9a69bc78caebd340f646
          git -C official_repo checkout --detach -q FETCH_HEAD
          test "$(git -C official_repo rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          python3 -m pip -q install 'z3-solver==4.13.3.0'
      - name: Independently check fixed 5 typed invariant candidates original three full inductive VCs
        run: |
          set -euo pipefail
          python3 research/q3/discovery_policy/sygus_firefly_five_classic_invariants_postfirst_20261028.py
          test -s official_firefly_classic_five/FIREFLY_ORIGINAL_5_CLASSIC_INVARIANTS_3VC_POSTFIRST.json
          sha256sum official_firefly_classic_five/FIREFLY_ORIGINAL_5_CLASSIC_INVARIANTS_3VC_POSTFIRST.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-g1-official-FIREFLY-5-classical-inductive-candidates
          path: |
            official_firefly_classic_five/*.json
            official_firefly_classic_five/*.smt2
          if-no-files-found: warn
