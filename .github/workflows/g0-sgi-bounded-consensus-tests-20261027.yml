name: NEUMANN research Q3 bounded-consensus focused tests
on:
  push:
    branches: [research/rc51-intelligence-spend-gate-20261026]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/g0-sgi-bounded-consensus-tests-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-uncertainty-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: focused six tests on real first-benchmark false-consensus diagnosis
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_q3_portfolio_consensus_evidence_gate_20261027.py tests/test_q3_source_input_identifiability_guard_20261027.py

  official-sygus-strings-v1-v2-postfirst:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - name: Verify separate prereg and only four fixed failed task IDs
        run: |
          set -euo pipefail
          test -s docs/research/G0_OFFICIAL_SYGUS_STRING_V1V2_POSTFIRST_PREREG_20261027.md
          test -s docs/research/G0_OFFICIAL_SYGUS_C16_FIRST_ACTUAL_2TIMEOUT_4PARSER_FROZEN_20261027.md
          python3 -m py_compile research/q3/discovery_policy/sygus_official_string_converter_postfirst_20261027.py
          sha256sum research/q3/discovery_policy/sygus_official_string_converter_postfirst_20261027.py
      - name: Pin official original external source and official converter version
        run: |
          set -euo pipefail
          git init -q official_repo
          git -C official_repo remote add origin https://github.com/SyGuS-Org/benchmarks.git
          git -C official_repo fetch --depth 1 origin 13c8deb68a873635879c9a69bc78caebd340f646
          git -C official_repo checkout --detach -q FETCH_HEAD
          git init -q official_tools
          git -C official_tools remote add origin https://github.com/SyGuS-Org/tools.git
          git -C official_tools fetch --depth 1 origin master
          git -C official_tools checkout --detach -q FETCH_HEAD
          git -C official_tools rev-parse HEAD
          python3 -m pip install -q ply pyparsing
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y cvc5
      - name: Process exactly four previous SYGUS2 parse errors after original first
        run: |
          set -euo pipefail
          python3 research/q3/discovery_policy/sygus_official_string_converter_postfirst_20261027.py
          test -s official_string_converter/OFFICIAL_PBE_SLIA_V1_TO_V2_POSTFIRST_NATIVE_C_GRADE.json
          sha256sum official_string_converter/OFFICIAL_PBE_SLIA_V1_TO_V2_POSTFIRST_NATIVE_C_GRADE.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-g0-official-EUPHONY-v1-v2-converter-postfirst
          path: official_string_converter
          if-no-files-found: warn
