name: Q3 Reflectively Repair the Inventing Method - New Originals FIRST

on:
  push:
    branches:
      - research/q3-graph-conditional-source-invention-20261107
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  meta_method_repair_first:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read immutable prior source-A original certificate only
        uses: actions/download-artifact@v4
        with:
          name: q3-conditional-bv-graph-24-untouched-original-first
          run-id: 42370828681
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prior_a
      - name: Read immutable prior source-B original counterexample only
        uses: actions/download-artifact@v4
        with:
          name: q3-autogenerated-graph-constructor-fresh-24-original-first
          run-id: 42371171010
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prior_b
      - name: Before target access, test self-repair and freeze complete method
        run: |
          python -m py_compile research/q3/reflective_guard_method_repair_unseen_first.py
          git hash-object research/q3/reflective_guard_method_repair_unseen_first.py
          python - <<'PY'
          import sys,json
          sys.path.insert(0,"research/q3")
          import reflective_guard_method_repair_unseen_first as q
          a=json.load(open(q.PREV_A));b=json.load(open(q.PREV_B))
          old,new=q.extract_source_experience(a,b)
          assert len(q.TARGET_IDS)==24
          assert q.TARGET_IDS==[f"PRE_{i}_100" for i in range(1,25)]
          assert old["pattern"]==["ite",["bit",0],{"hole":0},{"hole":1}]
          assert new["template"]==["ite",["bit",{"hole":0}],{"hole":1},{"hole":2}]
          assert 3 in new["remembered_guard_values"]
          cases=[(x, (x+2) if x&8 else (x>>16)) for x in range(120)]
          assert q.solve_for_guards(old,cases,[0])["ast"] is None
          r=q.solve_for_guards(new,cases,new["remembered_guard_values"])
          assert r["ast"] is not None
          assert all(q.base.run(r["ast"],x)==((x+2) if x&8 else (x>>16))
                     for x in range(120,2000))
          print("PREFLIGHT_REFLECTIVE_METHOD_HASH",new["fingerprint"])
          print("SOURCE_ONLY_PASS")
          PY
      - name: Strict 24 untouched original first after source frozen
        run: python research/q3/reflective_guard_method_repair_unseen_first.py
      - name: Preserve complete discovery-method and target original results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-reflective-method-repair-24-untouched-original-first
          path: |
            Q3_REFLECTIVE_REPAIR_FROZEN_BEFORE_TARGET.json
            Q3_REFLECTIVE_REPAIR_NEW_ORIGINAL_FIRST.json
          if-no-files-found: warn
