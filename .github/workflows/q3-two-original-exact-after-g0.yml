name: Q3 two opened real originals source-only exact polynomial 3VC
on:
  pull_request:
    paths:
      - '.github/workflows/q3-two-original-exact-after-g0.yml'
      - 'research/evidence/q3_two_postg0_source_only_20261020/**'
      - 'docs/research/Q3_MUL_SORIN_EXACT_SOURCE_ONLY_POST_G0_FIRST_CI_FREEZE_20261020.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two_authentic_originals_exact_source_only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SaswatPadhi/LoopInvGen
          ref: 6ac90265b11431c9477dfbd33e3e3380234c0499
          path: original_loopinvgen
          sparse-checkout: |
            benchmarks/NIA/other
            benchmarks/NIA/2018.CHI_InvGame
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm source SHA origin and script syntax
        run: |
          test "$(git -C original_loopinvgen rev-parse HEAD)" = 6ac90265b11431c9477dfbd33e3e3380234c0499
          python -m py_compile research/evidence/q3_two_postg0_source_only_20261020/classical_exact_trace_polynomial.py
      - name: Pinned official cvc5 1.4.2 and original Z3 for exact source 3VC
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          test "$(find /tmp/cvc5bin -type f -name cvc5 | wc -l)" -eq 1
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 sympy==1.14.0 z3-solver==4.13.3.0
      - name: FIRST actual original source-only exact trajectories and independent 3VC
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_two_postg0_source_only_20261020/classical_exact_trace_polynomial.py --root original_loopinvgen --out /tmp/q3_two_real_originals_first.json | tee /tmp/q3_two_real_originals_first.log
          sha256sum /tmp/q3_two_real_originals_first.json
      - name: Preserve FIRST source-only science outcomes pass or fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-mul-sorin-source-only-first-original
          path: |
            /tmp/q3_two_real_originals_first.json
            /tmp/q3_two_real_originals_first.log
          if-no-files-found: warn
      - name: Fail-closed source identity and honest posthoc status
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3_two_real_originals_first.json'))
          assert x['all_rows_retained'] and len(x['cases'])==2
          assert {z['source'] for z in x['cases']}=={
            'benchmarks/NIA/other/mul.sl',
            'benchmarks/NIA/2018.CHI_InvGame/sorin04.desugared.sl'}
          assert x['source_was_opened_after_first_G0'] is True
          assert x['all_training_neural_calls']==0
          assert x['global_Q3']==x['global_Q1_Q7']=='OPEN'
          print('FIRST_TWO_ORIGINAL_CLASSICAL_CERTIFIED',x['total_double_certified'],'/2')
          PY
