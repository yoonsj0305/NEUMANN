name: Q3 Autonomous Hidden Graph Ontology Recovery

on:
  pull_request:
    paths:
      - "neumann1/latent_graph_ontology.py"
      - "neumann1/causal_representation_inventor.py"
      - "neumann1/symmetry_orbit_inventor.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "tests/test_latent_graph_ontology.py"
      - ".github/workflows/q3_latent_ontology.yml"
  workflow_dispatch:

jobs:
  hidden-coordinate-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recover unnamed graph vertices and edges from 5 permuted raw input bases
        run: |
          python -m pip install -e . pytest
          python -m pytest -q -s tests/test_latent_graph_ontology.py
