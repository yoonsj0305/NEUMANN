name: Q3Q6 Second Untouched Original Predictive-State Causal Gate
on:
  push:
    branches:
      - research/q3q6-frozen-crosssemantic-original-20261110
    paths:
      - ".github/workflows/q3q6_predictive_state_original.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  TOKENIZERS_PARALLELISM: "false"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  freeze_second_unexposed_original_groups:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: q3q6-frozen-original-author-visible-source
          path: prior_register
          run-id: 42834364029
          github-token: ${{ github.token }}
      - name: Run policy and SOURCE-isolation contracts before touching originals
        run: |
          set -euo pipefail
          python -m pip install -q -e . pytest
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pytest -q -x \
            tests/test_q3_predictive_state_contract.py \
            tests/test_q3q6_original_transfer_gate.py
      - name: Fetch only the SAME SHA-pinned original author files
        run: |
          set -euo pipefail
          mkdir -p public_originals visible oracle target_gold
          FOLIO=5d7bb84c7edab3fb358e057d2807f19cf5cf5e2d
          BBH=9ee07bd481feebf959a6b59d61ea57bdcf30964d
          curl -fsSL --retry 2 \
            "https://raw.githubusercontent.com/Yale-LILY/FOLIO/$FOLIO/data/v0.0/folio-train.jsonl" \
            -o public_originals/folio-train.jsonl
          curl -fsSL --retry 2 \
            "https://raw.githubusercontent.com/Yale-LILY/FOLIO/$FOLIO/data/v0.0/folio-validation.jsonl" \
            -o public_originals/folio-validation.jsonl
          curl -fsSL --retry 2 \
            "https://raw.githubusercontent.com/suzgunmirac/BIG-Bench-Hard/$BBH/bbh/causal_judgement.json" \
            -o public_originals/causal_judgement.json
      - name: Pre-freeze all 8 SECOND heldout originals excluding every FIRST study train/source/target story
        run: |
          set -euo pipefail
          python -m research.q3.q3q6_two_author_freeze freeze \
            --folio-train public_originals/folio-train.jsonl \
            --folio-validation public_originals/folio-validation.jsonl \
            --bbh public_originals/causal_judgement.json \
            --study-salt "NEUMANN.Q3Q6.2026-11-10.V2.PREDICTIVE-STATE" \
            --exclude-register prior_register/frozen_original_manifest.json \
            --out-visible visible/model_visible.json \
            --out-source-oracle oracle/source_oracle.json \
            --out-target-gold target_gold/original_gold.json \
            --out-manifest visible/frozen_original_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path("prior_register/frozen_original_manifest.json").read_text())
          new=json.loads(Path("visible/frozen_original_manifest.json").read_text())
          assert new["frozen_salt"]=="NEUMANN.Q3Q6.2026-11-10.V2.PREDICTIVE-STATE"
          for d in ("folio_logical_entailment","bbh_causal_attribution"):
              prior=old["selected_original_ids"][d]
              current=new["selected_original_ids"][d]
              assert not(set(prior["train_original_ids"]+
                             prior["eval_SOURCE_ids"]+
                             prior["heldout_original_TARGET_ids"]) &
                         set(current["train_original_ids"]+
                             current["eval_SOURCE_ids"]+
                             current["heldout_original_TARGET_ids"]))
              assert not(set(prior["train_story_ids"]+
                             prior["source_story_ids"]+
                             prior["target_story_ids"]) &
                         set(current["train_story_ids"]+
                             current["source_story_ids"]+
                             current["target_story_ids"]))
          visible=json.loads(Path("visible/model_visible.json").read_text())
          assert len(visible["training_episodes"])==4
          assert len(visible["evaluation_tasks"])==8
          assert all("label" not in e["target"]
                     for e in visible["evaluation_tasks"])
          print("Q3Q6_SECOND_ORIGINAL_AUTHOR_EXPOSURE_DISJOINT_FROZEN",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q3q6-second-original-visible-predictive
          path: visible/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: q3q6-second-source-oracle-predictive
          path: oracle/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: q3q6-second-gold-scorer-only-predictive
          path: target_gold/
          retention-days: 90

  train_c_predict_all_originals_without_gold:
    needs: freeze_second_unexposed_original_groups
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: q3q6-second-original-visible-predictive
          path: visible
      - uses: actions/download-artifact@v4
        with:
          name: q3q6-second-source-oracle-predictive
          path: oracle
      - name: Verify TARGET gold absent; initialize exact same pinned base for A B C
        run: |
          set -euo pipefail
          test ! -e target_gold/original_gold.json
          python -m pip install -q -e .
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install -q 'transformers==4.46.3' 'peft==0.14.0' \
            'accelerate==1.2.1' 'huggingface_hub==0.27.1' 'jinja2>=3.1.4,<4'
          python - <<'PY'
          from huggingface_hub import model_info
          assert model_info("Qwen/Qwen2.5-Coder-0.5B-Instruct").sha=="ea3f2471cf1b1f0db85067f1ef93848e38e88c25"
          print("Q3Q6_SECOND_SAME_BASE_WEIGHTS_SOURCE_ONLY",flush=True)
          PY
      - name: Real 4 SOURCE-gradient updates then same-core untouched 8 original target predictions
        run: |
          set -euo pipefail
          mkdir -p frozen_predictions
          python -u -m research.q3.q3q6_predictive_state_original \
            --visible visible/model_visible.json \
            --source-oracle oracle/source_oracle.json \
            --revision ea3f2471cf1b1f0db85067f1ef93848e38e88c25 \
            --out frozen_predictions/learned_latent_original_predictions.json
          sha256sum frozen_predictions/learned_latent_original_predictions.json \
            > frozen_predictions/predictions.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("frozen_predictions/learned_latent_original_predictions.json").read_text())
          assert p["original_TARGET_gold_read"] is False
          assert len(p["A_B_C"]["C"])==8
          print("Q3Q6_SECOND_CAUSAL_PREDICTIONS_FROZEN",{
              "updates":p["C_actual_weight_updates"],
              "parameter_L1_delta":p["C_weight_delta_l1"]},flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3q6-second-predictive-state-frozen-untouched-originals
          path: frozen_predictions/
          if-no-files-found: warn
          retention-days: 90

  score_without_model:
    needs: [freeze_second_unexposed_original_groups, train_c_predict_all_originals_without_gold]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: q3q6-second-original-visible-predictive
          path: visible
      - uses: actions/download-artifact@v4
        with:
          name: q3q6-second-gold-scorer-only-predictive
          path: target_gold
      - uses: actions/download-artifact@v4
        with:
          name: q3q6-second-predictive-state-frozen-untouched-originals
          path: frozen_predictions
      - name: Strict SHA check and independent score, with NO neural runtime installed
        run: |
          set -euo pipefail
          python -m pip install -q -e .
          sha256sum -c frozen_predictions/predictions.sha256
          mkdir -p scored_originals
          python -m research.q3.q3q6_original_transfer_run score \
            --predictions frozen_predictions/learned_latent_original_predictions.json \
            --gold target_gold/original_gold.json \
            --manifest visible/frozen_original_manifest.json \
            --out scored_originals/q3q6_second_original_verdict.json
          sha256sum scored_originals/q3q6_second_original_verdict.json \
            > scored_originals/scorer_sha256.txt
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("scored_originals/q3q6_second_original_verdict.json").read_text())
          assert d["Q3_global"]==d["Q6_global"]=="OPEN"
          print("Q3Q6_SECOND_INDEPENDENT_AUTHOR_TWO_DOMAIN_VERDICT",{
              "domains":d["domains"],
              "C_updates":d["C_actual_weight_updates"],
              "two_domain_initial_criterion":d["causal_two_domain_initial_condition"],
          },flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3q6-second-predictive-state-independent-original-results
          path: scored_originals/
          if-no-files-found: warn
          retention-days: 90
