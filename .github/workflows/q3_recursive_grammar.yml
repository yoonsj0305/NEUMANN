name: Q3 Recursive Control Invention and New Primitive

on:
  pull_request:
    paths:
      - "neumann1/induced_fixpoint_grammar.py"
      - "neumann1/induced_grammar.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "tests/test_induced_fixpoint_grammar.py"
      - "research/q3/q3_recursive_grammar_first.py"
      - ".github/workflows/q3_recursive_grammar.yml"
  workflow_dispatch:

jobs:
  scoped-conditional-proof-and-execution:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run focused controls and complete n3 graph enumeration
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_induced_fixpoint_grammar.py tests/test_induced_grammar_cross_domain.py
      - name: Reproduce conditional compiler equivalence and strong BFS comparator
        run: |
          PYTHONPATH=. python research/q3/q3_recursive_grammar_first.py > /tmp/q3_recursive_benchmark.log
          cat /tmp/q3_recursive_benchmark.log
