      - name: Cheap-feature first fit and screen replay (no fitting or timing rerun)
        run: pytest -q tests/test_lp_cheap_features_v091.py tests/test_lp_cheap_screen_v091.py
      - name: Late-pruning first fit and retained screen replay (no fitting or timing rerun)
