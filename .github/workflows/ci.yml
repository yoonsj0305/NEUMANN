# Q3 first-authored original-only audit refresh: same frozen first SHA, exhaustive 10 static pairs, not new first-blind.

  q3_postgrade_first_source_all5_individual_action_no_dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 sympy==1.13.3 scikit-learn==1.5.2
      - uses: actions/download-artifact@v4
        with:
          run-id: 40067150397
          name: q3-first-new-keijzer7-neat5-source-only-real-original-x-y
          github-token: ${{ github.token }}
          path: /tmp/q3-pair-counter/source
      - uses: actions/download-artifact@v4
        with:
          run-id: 40067150397
          name: q3-first-new-keijzer7-neat5-sealed-real-learned-graph-edit-predictions
          github-token: ${{ github.token }}
          path: /tmp/q3-pair-counter/first
      - name: Assert first source/pred SHA, replay every original action by same unchanged graph executor and retain DUPLICATED actions rather than hiding routes
        run: |
          set -euo pipefail
