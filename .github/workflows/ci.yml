        run: pytest -q tests/test_lp_quotient_refit_replay_v100.py
      - name: Frozen quotient support-expansion contracts (no fitting/development generation)
        run: pytest -q tests/test_lp_frozen_support_expansion_v101.py
      - name: Frozen support-expansion first-result replay (no model, solver, fitting, or timing)
        run: pytest -q tests/test_lp_frozen_support_expansion_replay_v101.py
      - name: Fresh EXPAND4 holdout contracts only (no source generation/model/timing)
        run: pytest -q tests/test_lp_expand4_holdout_register_v102.py tests/test_lp_expand4_holdout_v102.py
