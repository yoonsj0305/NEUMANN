          pip install -e . pytest
          pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Sequence experiment contract tests
        run: pytest -q tests/test_sequence_v031.py
      - name: LP model-side state compression architecture fixtures (no fitting)
        run: pytest -q tests/test_lp_state_models_v087.py
      - name: First learned-model study contracts (no fitting or final generation)
        run: pytest -q tests/test_lp_model_study_v088.py
      - name: Frozen-checkpoint shortlist contracts and retained replay (no final rerun)
        run: pytest -q tests/test_lp_shortlist_study_v089.py
      - name: One-pass opened-training screen fixtures and retained replay (no timing rerun)
