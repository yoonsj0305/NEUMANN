  q3-posthoc-pre-tight-source-original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: official_sygus
          persist-credentials: false
          sparse-checkout: |
            comp/2017/Inv_Track
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source original pinned and unchanged historical verifier
        run: |
          test "$(git -C official_sygus rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          test "$(git hash-object experiments/q3_source_prove.py)" = a74b62cc97958e06f70116f3c8cec2f6db3d3b75
          test "$(git hash-object experiments/am2_sygus_native_three_vc_checker.py)" = aca2b543057c968acd8a175e7b1ef8e391ba79b2
          python -m py_compile research/evidence/q3_cegar_pre_tight_facets_20261019/first_original_tight_facet.py
      - name: Exact SMT original Z3 and independent cvc5
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cvc5
          python -m pip install --disable-pip-version-check . sympy==1.13.3 z3-solver==4.13.3.0
      - name: Development first cegar Pre-tight proof, no source cherry picking
        run: |
          set -o pipefail
          PYTHONPATH=. python research/evidence/q3_cegar_pre_tight_facets_20261019/first_original_tight_facet.py --original-root official_sygus --out /tmp/q3_cegar_tight_facet_first.json | tee /tmp/q3_cegar_tight_facet_first_stdout.log
          sha256sum /tmp/q3_cegar_tight_facet_first.json
      - name: Preserve first results including failure before verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-cegar-pre-tight-first-actual-proof-evidence
          path: |
            /tmp/q3_cegar_tight_facet_first.json
            /tmp/q3_cegar_tight_facet_first_stdout.log
          if-no-files-found: warn
      - name: Strict honest posthoc one-source verdict
        if: success()
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open("/tmp/q3_cegar_tight_facet_first.json"))
          assert d["preregistered_issue"]==281
          assert d["prior_issue279_first_verdict_preserved"]=="FAIL"
          assert d["is_posthoc_development_after_issue279_first_failure"]
          assert d["global_Q1_Q7"]=="OPEN"
          assert d["gpu_calls"]==d["model_calls"]==d["paid_api_calls"]==0
          print("FIRST_POSTHOC_REAL_CEGAR_ORIGINAL_DEV",d["scoped_development_pass"])
          print("FIXED_CRITERIA",d["fixed_first_development_checks"])
          if not d["scoped_development_pass"]:sys.exit(2)
          print("ONE_ORIGINAL_TIGHT_FACET_CERTIFIED_NOT_NEW_FAMILY")
          PY


  q3-preregistered-pre-tight-three-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: untouched_official_sources
          persist-credentials: false
          sparse-checkout: |
            comp/2017/Inv_Track
            comp/2018/Inv_Track
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Immutable original and proposer integrity checks before first source open
        run: |
          test "$(git -C untouched_official_sources rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          test "$(git hash-object experiments/q3_source_prove.py)" = a74b62cc97958e06f70116f3c8cec2f6db3d3b75
          test "$(git hash-object experiments/am2_sygus_native_three_vc_checker.py)" = aca2b543057c968acd8a175e7b1ef8e391ba79b2
          python -m py_compile research/evidence/q3_pretight_three_original_first_20261019/first_source_bound_transfer.py
          echo 'First prospective original source selector and success threshold frozen before source bodies in Issue #283'
      - name: Install exact source native Z3 and independent cvc5
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cvc5
          python -m pip install --disable-pip-version-check . sympy==1.13.3 z3-solver==4.13.3.0
          cvc5 --version
      - name: One first actual three-original transfer, unchanged strong baseline and unchanged exact Pre-tight method
        run: |
          set -o pipefail
          PYTHONPATH=. python research/evidence/q3_pretight_three_original_first_20261019/first_source_bound_transfer.py --source-root untouched_official_sources --out /tmp/q3_pretight_three_originals_first.json | tee /tmp/q3_pretight_three_originals_first_stdout.log
          sha256sum /tmp/q3_pretight_three_originals_first.json
      - name: Always preserve immutable raw first source results BEFORE criterion, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-pre-tight-prospective-three-official-originals-first
          path: |
            /tmp/q3_pretight_three_originals_first.json
            /tmp/q3_pretight_three_originals_first_stdout.log
          if-no-files-found: warn
      - name: Enforce original preregistered scientific gate and no global promotion
        if: success()
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open('/tmp/q3_pretight_three_originals_first.json'))
          assert d["preregistered_issue"]==283
          assert d["metadata_preregistered_before_original_body_examination"]
          assert len(d["first_original_receipts"])==3
          assert not d["distinct_original_authors_confirmed"]
          assert not d["neural_learned_unique_capability"]
          assert d["historical_issue279_first"]==d["historical_AM1_first"]=="FAIL_UNCHANGED"
          assert d["global_Q1_Q7"]=="OPEN"
          assert d["actual_model_forwards"]==d["accelerator_calls"]==d["paid_api_calls"]==0
          print("ONE_FIRST_PRETIGHT_NEW_ORIGINAL_GATE",d["first_predeclared_scope_pass"])
          print("ALL_REGISTERED_GATES",d["predeclared_conditions"])
          if not d["first_predeclared_scope_pass"]:sys.exit(2)
          print("PROSPECTIVE_REAL_ORIGINAL_CLASSICAL_GAIN_SCOPED_NOT_NEURAL_GLOBAL_Q3")
          PY


