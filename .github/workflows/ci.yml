name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "HASWELL"
      MKL_NUM_THREADS: "1"
      MKL_CBWR: "COMPATIBLE"
      BLIS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1 threadpoolctl==3.7.0
          pip install -e '.[relational,native_lp]' pytest build
