name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "HASWELL"
      MKL_NUM_THREADS: "1"
      MKL_CBWR: "COMPATIBLE"
      BLIS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1 threadpoolctl==3.7.0
          pip install -e '.[relational,native_lp]' pytest build
          # Real independent proof-DAG tests require Z3 at pytest collection.
          pip install z3-solver==4.13.3.0
      - name: Test
        run: pytest -q
      - name: Discovery benchmark smoke
        run: python benchmark_v014.py
      - name: Authorization benchmark smoke
        run: python benchmark_v016.py
      - name: Persistent authorization benchmark smoke
        run: python benchmark_v017.py
      - name: Threat-model benchmark smoke
        run: python benchmark_v018.py
      - name: Out-of-process plugin benchmark smoke
        run: python benchmark_v019.py
      - name: Runtime-cost and threat-v2 benchmark smoke
        run: python benchmark_v020.py
      - name: Persistent worker lifecycle benchmark smoke
        run: python benchmark_v021.py
      - name: Worker state-hygiene benchmark smoke
        run: python benchmark_v022.py
      - name: Lifecycle-class policy benchmark smoke
        run: python benchmark_v023.py
      - name: Lifecycle attestation benchmark smoke
        run: python benchmark_v024.py
      - name: Durable attestation ledger benchmark smoke
        run: python benchmark_v025.py
      - name: Structural efficiency contract benchmark smoke
        run: python benchmark_v026.py
      - name: Model-side structural proposal cost benchmark smoke
        run: python benchmark_v027.py
      - name: Tiny neural structural proposal benchmark smoke
        run: python benchmark_v028.py
      - name: Matched token direct-vs-structure benchmark smoke
        run: python benchmark_v029.py
      - name: Direct capacity-data frontier benchmark smoke
        run: python benchmark_v030.py
      - name: Oracle Structural Compression benchmark smoke
        run: python benchmark_v032.py
      - name: Learned Structural Compression benchmark smoke
        run: python benchmark_v033.py
      - name: Structural baseline gauntlet and stopping benchmark smoke
        run: python benchmark_v034.py
      - name: Compression Utility contract smoke
        run: python benchmark_v035_smoke.py
      - name: Residual headroom contract smoke
        run: python benchmark_v036_smoke.py
      - name: Learned residual contract smoke
        run: python benchmark_v037_smoke.py
      - name: Coupled-block harder-family contract smoke
        run: python benchmark_v038_smoke.py
      - name: Mixed local-plus-coupled contract smoke
        run: python benchmark_v0381_smoke.py
      - name: Block discovery routing contract smoke
        run: python benchmark_v040_smoke.py
      - name: Anti-shortcut causal-family contract smoke
        run: python benchmark_v041_smoke.py
      - name: Residual-peeling contract smoke
        run: python benchmark_v042_smoke.py
      - name: Incremental indexed-peeling contract smoke
        run: python benchmark_v043_smoke.py
      - name: Adversarial structural-boundary contract smoke
        run: python benchmark_v044_smoke.py
      - name: Exact Schur cost contract smoke
        run: python benchmark_v045_smoke.py
      - name: Cached candidate and dense abstention contract smoke
        run: python benchmark_v046_smoke.py
      - name: Row-overlap boundary contract smoke
        run: python benchmark_v047_smoke.py
      - name: Cost-gate opportunity contract smoke
        run: python benchmark_v048_smoke.py
      - name: Matched topology counterfactual contract smoke
        run: python benchmark_v049_smoke.py
      - name: Sparse ordering opportunity contract smoke
        run: python benchmark_v050_smoke.py
      - name: PACE ordering opportunity contract smoke
        run: python benchmark_v051_smoke.py
      - name: Real numerical matrix original-equation contract smoke
        run: python benchmark_v052_smoke.py
      - name: Exact real-matrix component reuse contract smoke
        run: python benchmark_v053_smoke.py
      - name: Factorization reuse mechanism contract smoke
        run: python benchmark_v054_smoke.py
      - name: Natural-matrix reuse abstention contract smoke
        run: python benchmark_v055_smoke.py
      - name: Corrective natural-matrix numerical contract smoke
        run: python benchmark_v056_smoke.py
      - name: DP lifetime hygiene focused contract
        run: pytest -q tests/test_dp_lifetime_v075.py
      - name: Program parity and Q4 admission integration contract
        run: pytest -q tests/test_program_parity_v076.py tests/test_q4_admissibility_v077.py
      - name: Natural arithmetic opportunity contracts (no final audit rerun)
        run: pytest -q tests/test_natural_arithmetic_v078.py
      - name: Matched full-path cost fault-injection contracts
        run: pytest -q tests/test_matched_cost_v079.py
      - name: Relational semantics and first-archive contracts (no audit rerun)
        run: pytest -q tests/test_relational_v080.py
      - name: LP primal-dual certificate authority contracts
        run: pytest -q tests/test_lp_certificate_v081.py
      - name: LP certificate integration smoke (no timing claim)
        run: python benchmark_v081_smoke.py
      - name: Oracle-basis headroom protocol contracts (no final audit)
        run: pytest -q tests/test_lp_basis_headroom_v082.py
      - name: Oracle-basis comparator integration smoke (no timing claim)
        run: python benchmark_v082_smoke.py
      - name: Observable basis discovery contracts and retained archive (no timing audit)
        run: pytest -q tests/test_lp_discovery_v083.py
      - name: Scale-invariant portfolio and portable witness replay contracts (fixtures only)
        run: pytest -q tests/test_lp_portfolio_v084.py
      - name: Build core and external plugin wheels
        run: |
          python -m build --wheel --outdir dist/core .
          python -m build --wheel --outdir dist/plugin interop/example_scalar_sum_plugin
      - name: Cross-package out-of-process execution in fresh venv
        run: |
          python -m venv /tmp/neumann-interop
          /tmp/neumann-interop/bin/python -m pip install --upgrade pip
          /tmp/neumann-interop/bin/python -m pip install dist/core/*.whl dist/plugin/*.whl
          cd /tmp
          /tmp/neumann-interop/bin/python "$GITHUB_WORKSPACE/interop/run_cross_package_interop.py"
      - name: Cross-package persistent worker execution in fresh venv
        run: |
          cd /tmp
          /tmp/neumann-interop/bin/python "$GITHUB_WORKSPACE/interop/run_persistent_worker_interop.py"
      - name: Cross-package state-hygiene execution in fresh venv
        run: |
          cd /tmp
          /tmp/neumann-interop/bin/python "$GITHUB_WORKSPACE/interop/run_state_hygiene_interop.py"
      - name: Cross-package lifecycle-class enforcement in fresh venv
        run: |
          cd /tmp
          /tmp/neumann-interop/bin/python "$GITHUB_WORKSPACE/interop/run_lifecycle_class_interop.py"
      - name: Cross-package lifecycle attestation in fresh venv
        run: |
          cd /tmp
          /tmp/neumann-interop/bin/python "$GITHUB_WORKSPACE/interop/run_lifecycle_attestation_interop.py"
      - name: Cross-package durable attestation revocation in fresh venv
        run: |
          cd /tmp
          /tmp/neumann-interop/bin/python "$GITHUB_WORKSPACE/interop/run_durable_attestation_interop.py"

  sequence-experiment:
