name: Q3 authentic original circle1 exact real SAT from classical numeric candidates
on:
  pull_request:
    paths:
      - '.github/workflows/q3-circles1-original-exact-sat.yml'
      - 'research/evidence/q3_cut1_exact_sat_20261021/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_complete_circles1_exact_rational_certifier:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SMT-LIB/benchmark-submission-2022
          ref: 81a39628827f61fbd74c6f3e67feb5c1b740d2f0
          path: original
          sparse-checkout: |
            non-incremental/NRA/20220222-cut-three-circles
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze no-neural original posthoc SAT search and source SHA
        run: |
          test "$(git -C original rev-parse HEAD)" = 81a39628827f61fbd74c6f3e67feb5c1b740d2f0
          python -m py_compile research/evidence/q3_cut1_exact_sat_20261021/authentic_original_circle1_scipy_nonlinear_exact_source_witness.py
          python - <<'PY'
          import json
          q=json.load(open('research/evidence/q3_cut1_exact_sat_20261021/POSTHOC_FROZEN_NUMERIC_THEN_EXACT_FULL_SOURCE_GATE.json'))
          assert q['posthoc_original_source_already_opened'] and q['global_Q3']=='OPEN'
          assert q['original_git_blob_sha']=='0c0cd2fa878deac4791b790a8a13cb2747df5b14'
          print('TRUE_ORIGINAL_CIRCLE1_NOT_LEARNED_UNIQUE_AND_ALREADY_OPEN')
          PY
      - name: Install exact raw original Z3+cvc5 and ordinary classical SciPy
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.16.3 z3-solver==4.13.3.0
      - name: First frozen numeric search for exact ORIGINAL 39 SMT2 constraints, dual independently grounded SAT
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_cut1_exact_sat_20261021/authentic_original_circle1_scipy_nonlinear_exact_source_witness.py --root original --contract research/evidence/q3_cut1_exact_sat_20261021/POSTHOC_FROZEN_NUMERIC_THEN_EXACT_FULL_SOURCE_GATE.json --out /tmp/q3_circle1_original_full_exact.json | tee /tmp/q3_circle1_original_full_exact.log
          sha256sum /tmp/q3_circle1_original_full_exact.json
      - name: Archive ALL evidence, exact witness or mathematical UNKNOWN
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-authentic-circle1-posthoc-classical-optimizer-exact-source
          path: |
            /tmp/q3_circle1_original_full_exact.json
            /tmp/q3_circle1_original_full_exact.log
          if-no-files-found: warn
      - name: Fail closed on false SAT certificate and preserve UNKNOWN rather than inventing proof
        if: success()
        run: |
          python - <<'PY'
          import json
          q=json.load(open('/tmp/q3_circle1_original_full_exact.json'))
          assert q['posthoc_same_original_source_already_opened']
          assert not q['learned_model_training']
          assert q['direct_matched_with_same_scipy_has_exact_algorithm_access']
          assert q['global_Q3']==q['global_Q4']==q['global_Q5']=='OPEN'
          v=q.get('real_original_numeric_and_exact_evidence',{})
          if v.get('actual_original_SAT_dual_verified'):
              assert v['true_original_full_source_exact_rational_witness']['independent_original_full_SMT2_SAT_Z3_cvc5']['independent_real_original_full_Z3_cvc5_SAT']
              assert v['true_original_full_source_exact_rational_witness']['all_original_source_native_constraints_satisfied_with_Fraction']
              assert v['all_39_original_true_source_assertions_preserved']
              print('FIRST_GENUINE_SOURCE_CIRCLE1_CLASSICAL_NUMERIC_AND_EXACT_DUAL_SAT_PASS')
          else:
              print('FIRST_GENUINE_SOURCE_CIRCLE1_UNKNOWN_OR_ABSTAIN_PRESERVED')
          PY
