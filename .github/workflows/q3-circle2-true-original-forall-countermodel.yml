name: Q3 original all-real circles2 quantified formula genuine exact rational counterexample
on:
  pull_request:
    paths:
      - '.github/workflows/q3-circle2-true-original-forall-countermodel.yml'
      - 'research/evidence/q3_circles_forall_20261021/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_rational_geometry_quantifier_counterexample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SMT-LIB/benchmark-submission-2022
          ref: 81a39628827f61fbd74c6f3e67feb5c1b740d2f0
          path: original
          sparse-checkout: |
            non-incremental/NRA/20220222-cut-three-circles
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authentic source theorem contract and syntax
        run: |
          test "$(git -C original rev-parse HEAD)" = 81a39628827f61fbd74c6f3e67feb5c1b740d2f0
          python -m py_compile research/evidence/q3_circles_forall_20261021/genuine_circle2_source_forall_counterexample_dual.py
          python - <<'PY'
          import json
          x=json.load(open('research/evidence/q3_circles_forall_20261021/POSTHOC_ORIGINAL_CIRCLE2_EXACT_COUNTERMODEL_CONTRACT.json'))
          assert x['schema']=='neumann.q3.posthoc_actual_cut_three_circles_source_exact_forall_counterexample.v1'
          assert x['source_body_OPENED_posthoc']
          print('ORIGINAL_SOURCE_CIRCLE2_NOT_FABRICATED_LLM_NEW_STRUCTURE')
          PY
      - name: Exact independent native original SMT2 proof solvers
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
      - name: Actual twelve original source variables exact rational witness all clauses native two-solvers
        run: |
          set -o pipefail
          PYTHONPATH=. python research/evidence/q3_circles_forall_20261021/genuine_circle2_source_forall_counterexample_dual.py --root original --freeze research/evidence/q3_fresh_real_nra_20261021/BEFORE_ANY_NEW_SOURCE_BODY_18_ORIGINALS.json --contract research/evidence/q3_circles_forall_20261021/POSTHOC_ORIGINAL_CIRCLE2_EXACT_COUNTERMODEL_CONTRACT.json --out /tmp/q3_circle2_original_real_counterexample.json | tee /tmp/q3_circle2_original_real_counterexample.log
          sha256sum /tmp/q3_circle2_original_real_counterexample.json
      - name: Preserve exact real original mathematical proof including UNKNOWN if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-circle2-quantifier-rational-full-original-counterexample
          path: |
            /tmp/q3_circle2_original_real_counterexample.json
            /tmp/q3_circle2_original_real_counterexample.log
          if-no-files-found: warn
      - name: Admit only exact source original native dual proof, not a source-only guess
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3_circle2_original_real_counterexample.json'))
          assert x['source_git_sha_before_first_original_content_commit']=='5412a4fb16c96694ab2bf629c34f6e41737f7a7f'
          assert x['source_body_opened_in_parent_historical_FIRST_CI']
          assert x['not_neural_or_learned_new_structure']
          assert x['global_Q3']==x['global_Q4']==x['global_Q5']=='OPEN'
          q=x['actual_original_source_evidence']
          assert q['original_source_Git_SHA_authenticated']
          assert q['original_forall_actually_refuted']
          assert q['ALL_actual_original_antecedent_conjuncts_TRUE']
          assert q['actual_original_consequent_FALSE']
          assert q['original_full_native_SMT2_dual_Z3_cvc5']['both_Z3_and_cvc5_full_source_ground_counterexample_SAT']
          print('REAL_SOURCE_CIRCLE2_FULL_QUANTIFIED_ORIGINAL_UNSAT_TWO_SOLVERS_CERTIFIED')
          PY
