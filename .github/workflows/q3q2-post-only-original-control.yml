name: Q3Q2 original Post-as-invariant adversarial control on frozen exact Q3Q 40 originals
on:
  pull_request:
    paths:
      - 'research/evidence/q3q2-post-only-20261018/**'
      - 'docs/research/Q3Q2_POST_ONLY_EXPLANATION_PREREG_20261018.md'
      - '.github/workflows/q3q2-post-only-original-control.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-post-only-control:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SaswatPadhi/LoopInvGen
          ref: 6ac90265b11431c9477dfbd33e3e3380234c0499
          path: external_loopinvgen
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Load immutable first original learned AST evidence, no retraining
        uses: actions/download-artifact@v4
        with:
          repository: yoonsj0305/NEUMANN
          run-id: 39094837562
          name: q3q-first-learned-source-ast-constructor-original-3vc-full-baselines
          github-token: ${{ github.token }}
          path: /tmp/q3q2-first-neural
      - name: Install pinned original Z3 and existing PyTorch source parser
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Check original Post only, independently against same 40 source hashes and 3 VCs
        run: |
          python research/evidence/q3q2-post-only-20261018/source_post_invariant_control.py --root external_loopinvgen --first-q3q /tmp/q3q2-first-neural/q3q-first-real-neural-construction-original-proof.json --out /tmp/q3q2-original-post-only.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3q2-original-post-only.json'))
          assert x['status']=='Q3Q2_ORIGINAL_POST_CONDITION_ONLY_CONTROL_COMPLETE'
          assert x['source_programs']==40
          assert x['posthoc_explanation_only'] is True
          assert x['no_model_retraining_or_inference'] is True
          assert x['no_test_cover_or_published_answer_loaded'] is True
          assert x['no_q3f_challenge_originals_opened'] is True
          assert x['global_q1_q7']=='OPEN'
          assert len(x['per_exact_original'])==40
          assert len(set(c['source_sha'] for c in x['per_exact_original']))==40
          for split,n in [('HELDOUT',24),('DIAGNOSTIC',16)]:
              y=x['by_split'][split]
              assert y['exact_originals']==n
              assert 0<=y['learned_proofs_not_provable_by_source_post_alone']<=y['first_learned_source_constructed_proofs']
              assert y['learned_proofs_not_solved_by_full_grammar_classical']==0
          print('Q3Q2_FIRST_ORIGINAL_POST_ONLY_FROZEN_AND_MATCHED_CONTROL_COMPLETE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3q2-first-original-source-post-only-vs-neural-conjunction-control
          path: /tmp/q3q2-original-post-only.json
          retention-days: 90
