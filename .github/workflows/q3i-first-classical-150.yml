name: Q3I first all 150 licensed genuine C sources, classical without labels
on:
  pull_request:
    paths:
      - 'research/evidence/q3i-150-classical-20261018/**'
      - 'docs/research/Q3I_SOURCE_ONLY_CLASSICAL_150_PREREG_20261018.md'
      - '.github/workflows/q3i-first-classical-150.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze-and-execute:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/loop-invariant-gen-experiments
          ref: 91fe89245a0894ec8ad3741d85ae91ce3b552b2e
          path: third_party_loopy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact pinned C source parser and SMT backend
        run: |
          python -m pip install --disable-pip-version-check pycparser==2.22 z3-solver==4.13.3.0
          python -m py_compile research/evidence/q3i-150-classical-20261018/first_source_only_150.py
      - name: First full source-only baseline on exactly 150 pinned licensed real sources
        run: |
          python research/evidence/q3i-150-classical-20261018/first_source_only_150.py --workbook third_party_loopy/GeneratedInvariants.xlsx --dataset third_party_loopy/dataset.zip --output /tmp/q3i-source-only-first-150.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3i-source-only-first-150.json'))
          assert x['status']=='SOURCE_ONLY_LICENSED_DEVELOPMENT_CORPUS_CLASSICAL_AUDIT_COMPLETE'
          assert x['source_programs_seen']==150
          assert x['exact_original_source_hashes_distinct']==150
          assert len(x['first_originals'])==150
          assert x['invariant_strings_passed_to_solver'] is False
          assert x['published_invariant_strings_used_for_generation'] is False
          assert x['model_training_or_inference_calls']==0
          assert x['q3f_original_bodies_read'] is False
          assert x['source_originals_modified'] is False
          assert x['all_q1_q7']=='OPEN'
          for rec in x['first_originals']:
              if rec['proof']['status']=='SOURCE_ONLY_AUTO_INVARIANT_CERTIFIED':
                  p=rec['proof']['full_original_check']
                  assert all(p[key]=='unsat' for key in ('initial','inductive','postcondition','signed_overflow'))
                  assert p['deliberately_false_goal']==p['empty_invariant_goal']=='sat'
          print('FIRST_FROZEN_Q3I_REAL_SOURCE_ONLY_BOUNDARY_AUDIT_PASSED')
          PY
      - name: Load immutable frozen Q3G actual real-source neural checkpoint + first receipt
        uses: actions/download-artifact@v4
        with:
          repository: yoonsj0305/NEUMANN
          run-id: 39082129492
          name: q3g-real-cpu-trained-invariant-model-first-raw-receipts
          github-token: ${{ github.token }}
          path: /tmp/q3i-neural-frozen
      - name: Load immutable Q3I first 150-source classical evidence (not recomputed)
        uses: actions/download-artifact@v4
        with:
          repository: yoonsj0305/NEUMANN
          run-id: 39084573345
          name: q3i-first-150-real-source-no-label-classical-houdini-receipt
          github-token: ${{ github.token }}
          path: /tmp/q3i-classical-frozen
      - name: Install same PyTorch/NumPy inference interface for previously trained model
        run: |
          python -m pip install --disable-pip-version-check numpy==1.26.4
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Exact original-C proof of 32 frozen neural outputs vs source-only classical 6
        run: |
          python research/evidence/q3i-150-classical-20261018/frozen_neural_same32_original_proof.py --checkpoint /tmp/q3i-neural-frozen/first-frozen-real-source.pt --trained-receipt /tmp/q3i-neural-frozen/first_train_receipt.json --classical-receipt /tmp/q3i-classical-frozen/q3i-source-only-first-150.json --dataset third_party_loopy/dataset.zip --out /tmp/q3i-neural-paired-originals.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/q3i-neural-paired-originals.json'))
          assert r['actual_original_c_sources_evaluated']==32
          assert r['unmodified_original_source_count']==32
          assert r['classical_whole_original_safety_proofs']==6
          assert r['train_test_source_sha_overlap']==0
          assert r['model_was_retrained'] is False
          assert r['reference_input_originals_only'] is True
          assert r['q3f_competition_escrow_bodies_accessed'] is False
          assert r['global_q1_q7']=='OPEN'
          assert len(r['per_original'])==32
          print('FROZEN_SAME_SOURCE_32_ORIGINAL_PROOF_PAIR_REPLAY_COMPLETE',r['neural_whole_original_safety_proofs'],r['classical_whole_original_safety_proofs'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3i2-frozen-original-32-neural-vs-classical-true-proof
          path: /tmp/q3i-neural-paired-originals.json
          retention-days: 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3i-first-150-real-source-no-label-classical-houdini-receipt
          path: /tmp/q3i-source-only-first-150.json
          retention-days: 60
