name: Q3 post-G0 mannadiv learned cross-term original Z3-cvc5
on:
  pull_request:
    paths:
      - '.github/workflows/q3-mannadiv-learned-cross-term.yml'
      - 'research/evidence/q3_mannadiv_learned_cross_term_20261019/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  post-g0-development-mannadiv-original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SaswatPadhi/LoopInvGen
          ref: 6ac90265b11431c9477dfbd33e3e3380234c0499
          path: official_loopinv
          sparse-checkout: |
            benchmarks/NIA/2016.ATVA_PILAT
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned upstream source and scientific first protocol
        run: |
          test "$(git -C official_loopinv rev-parse HEAD)" = 6ac90265b11431c9477dfbd33e3e3380234c0499
          python -m py_compile research/evidence/q3_mannadiv_learned_cross_term_20261019/mannadiv_original_train_verify.py
      - name: Install CPU gradient training and original independent Z3 cvc5 provers
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cvc5
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0 sympy==1.14.0 numpy==2.3.5 scipy==1.17.0
          cvc5 --version
      - name: FIRST actual source-only gradient learner plus same-basis exact classical
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_mannadiv_learned_cross_term_20261019/mannadiv_original_train_verify.py --root official_loopinv --out /tmp/q3_mannadiv_first.json | tee /tmp/q3_mannadiv_first.log
          sha256sum /tmp/q3_mannadiv_first.json
      - name: Archive scientific FIRST outcome even if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-mannadiv-first-opened-original-learned-mod-relation
          path: |
            /tmp/q3_mannadiv_first.json
            /tmp/q3_mannadiv_first.log
          if-no-files-found: warn
      - name: Assert only bounded original proof and negative classical comparison
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3_mannadiv_first.json'))
          assert x['scoped_original_pass'],x['gates']
          assert all(x['gates'].values())
          assert x['train_episodes']==78 and x['test_episodes']==15
          assert x['headroom_against_strong_specialist']=='NOT_ESTABLISHED'
          assert x['new_mathematical_primitive_outside_monomial_degree2_vocabulary'] is False
          assert x['exclusive_neural_capability_over_exact_classical'] is False
          assert x['neural_g1_admitted'] is False
          assert x['global_Q3']==x['global_Q1_Q7']=='OPEN'
          print('MANNADIV_POSTG0_DEVELOPMENT_ORIGINAL_Z3_CVC5_SCOPED_PASS_ONLY')
          PY
