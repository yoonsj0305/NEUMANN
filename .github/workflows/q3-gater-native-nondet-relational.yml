name: Q3 Gate R first source-bound mixed nondet and relational branch
on:
  pull_request:
    paths:
      - '.github/workflows/q3-gater-native-nondet-relational.yml'
      - 'research/evidence/q3_gater_relational_mixed_20261020/**'
      - 'docs/research/Q3_GATER_TYPED_GLOBAL_NONDET_AND_BRANCH_SEMANTICS_FROZEN_20261020.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove_source_semantic_frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: external_originals
          sparse-checkout: |
            lib/Inv_Track/xujie_code2inv
            lib/Inv_Track/andrew_lustre
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact original Git SHA and syntax
        run: |
          test "$(git -C external_originals rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          python -m py_compile research/evidence/q3_gater_relational_mixed_20261020/first_actual_nondet_and_branch_originals.py
      - name: SHA pinned independent cvc5 and Z3
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          test "$(find /tmp/cvc5bin -type f -name cvc5 | wc -l)" -eq 1
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0 sympy==1.14.0
      - name: FIRST source-preserving original independent semantics check
        run: |
          set -o pipefail
          PYTHONPATH=. python research/evidence/q3_gater_relational_mixed_20261020/first_actual_nondet_and_branch_originals.py --root external_originals --out /tmp/q3_gateR_semantics_first.json | tee /tmp/q3_gateR_semantics_first.log
          sha256sum /tmp/q3_gateR_semantics_first.json
      - name: Retain first outcome including UNKNOWN
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-gater-native-mixed-relational-first
          path: |
            /tmp/q3_gateR_semantics_first.json
            /tmp/q3_gateR_semantics_first.log
          if-no-files-found: warn
      - name: Honest scope
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/q3_gateR_semantics_first.json'))
          assert r['all_two_source_git_blobs_verified']
          assert len(r['sources'])==2
          assert r['two_existing_opened_sources_POSTHOC']
          assert r['global_Q3']==r['gate_R_complete']==r['gate_V']=='OPEN'
          assert r['new_learned_nonpolynomial_operator']=='NOT_DEMONSTRATED'
          print('Gate R original source semantics',r['exact_three_predicate_dual_source_count'],'of 2 independently confirmed')
          PY
