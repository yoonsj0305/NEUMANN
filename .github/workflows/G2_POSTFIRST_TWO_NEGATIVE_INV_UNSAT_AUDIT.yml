name: NEUMANN G2 original two legacy negative numerals independently prove native invariant
on:
  push:
    branches:
      - research/q3-g2-native-residual-two-formalisms-20261106
    paths:
      - .github/workflows/G2_POSTFIRST_TWO_NEGATIVE_INV_UNSAT_AUDIT.yml
permissions:
  contents: read
  actions: read
jobs:
  exact-two-native-reproof:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: NEUMANN-G2-NATIVE-INV_INDUCTION-ORIGINAL-FIRST
          run-id: 42167219443
          github-token: ${{ github.token }}
          path: immutable-original-inv
      - name: Install SMT checker only, NEVER rerun SyGuS synthesis
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cvc5
          echo 'df7486f738cc47aa59b3fc91569ca73ccebb53da0b06ad4892c8f74e16d96229  immutable-original-inv/G2-INV_INDUCTION-ORIGINAL-FIRST.json' | sha256sum -c -
      - name: Source independent negative Integer numeral normalized SMT proof, all 3 obligations each
        shell: bash
        run: |
          set -euo pipefail
          python3 -m research.g2.independent_negative_integer_original_reproof immutable-original-inv/G2-INV_INDUCTION-ORIGINAL-FIRST.json > G2-TWO-LEGACY-NUMERAL-NATIVE-PROOFS.json
          python3 - <<'PY'
          import json
          x=json.load(open('G2-TWO-LEGACY-NUMERAL-NATIVE-PROOFS.json'))
          print(json.dumps({
            'audit':x['audit_pass'],
            'original_first_sha':x['first_INV_SHA256'],
            'actual_native_verified_12':x['total_exact_original_INV_verified_including_reproof'],
            'remaining_12s_timeouts':x['remaining_original_12s_timeout'],
            'remaining_native_no_program':x['remaining_native_no_program'],
            'source_cases':[{'file':a['name'],'normalized_legacy_number_count':a['legacy_integer_tokens_corrected'],
             '3_independent_proofs':a['all_three_universal_INVARIANT_obligations_valid'],
             'mutant_rejected':a['deliberately_false_invariant_mutant_refuted']}
               for a in x['cases']]},sort_keys=True))
          assert x['audit_pass'] is True
          assert x['total_exact_original_INV_verified_including_reproof']==9
          assert all(a['deliberately_false_invariant_mutant_refuted'] for a in x['cases'])
          assert x['original_native_synthesis_rerun'] is False
          PY
      - name: False favorable modification of original first is rejected by source hash before any reproof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from research.g2.independent_negative_integer_original_reproof import audit
          v=json.loads(Path('immutable-original-inv/G2-INV_INDUCTION-ORIGINAL-FIRST.json').read_text())
          v['stats']['native_independently_proved']=12
          p=Path('/tmp/G2-NATIVE-FORGED-FIRST.json')
          p.write_text(json.dumps(v))
          try:
              audit(p)
          except ValueError as e:
              assert 'ORIGINAL_FIRST_IMMUTABLE_SHA_CHANGED' in str(e)
              print('G2_FAVORABLE_NATIVE_FIRST_FORGERY_REJECTED')
          else:
              raise AssertionError('FALSE_FIRST_NOT_REJECTED')
          PY
      - name: Archive alternate exact original proof results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEUMANN-G2-TWO-LEGACY-INTEGER-INDEPENDENT-SMT-PROOFS
          path: G2-TWO-LEGACY-NUMERAL-NATIVE-PROOFS.json
          if-no-files-found: warn
          retention-days: 90
