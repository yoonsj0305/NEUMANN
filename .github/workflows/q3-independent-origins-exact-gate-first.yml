name: Q3 five independent source families and exact 42-weight novelty no-go
on:
  pull_request:
    paths:
      - '.github/workflows/q3-independent-origins-exact-gate-first.yml'
      - 'research/evidence/q3_independent_origins_20261020/**'
      - 'docs/research/Q3_INDEPENDENT_ORIGIN_FIVE_PRE_SOURCE_FREEZE_20261020.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine_external_source_first_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: external_original
          sparse-checkout: |
            lib/Inv_Track/xujie_code2inv
            lib/Inv_Track/andrew_lustre
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify different upstream repository and exact frozen git revision
        run: |
          test "$(git -C external_original rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          python -m py_compile research/evidence/q3_independent_origins_20261020/first_five_sources_and_exact_no_go.py
      - name: Pinned independent cvc5 1.4.2 plus exact rational SymPy
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          test "$(find /tmp/cvc5bin -type f -name cvc5 | wc -l)" -eq 1
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F '1.4.2'
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0 sympy==1.14.0 numpy==2.3.5 scipy==1.17.0
      - name: FIRST run pre-source trained freeze, exact polynomial uniqueness theorem, five untouched external originals
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_independent_origins_20261020/first_five_sources_and_exact_no_go.py --root external_original --out /tmp/q3_first_cross_origin_five.json | tee /tmp/q3_first_cross_origin_five.log
          sha256sum /tmp/q3_first_cross_origin_five.json
      - name: Preserve FIRST official source-family and theorem result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-independent-families-exact-theorem-first
          path: |
            /tmp/q3_first_cross_origin_five.json
            /tmp/q3_first_cross_origin_five.log
          if-no-files-found: warn
      - name: Fail-closed proof and boundary checks, no synthetic global Q3 claim
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3_first_cross_origin_five.json'))
          assert x['model_training_replayed_before_any_original_content_read']
          assert x['all_five_source_rows_retained'] and len(x['five_actual_original_sources'])==5
          assert x['all_five_source_hashes_verified']
          assert x['frozen_model_weight_sha256']=='563c6be70fade6db755425a5756b6fdd89503ada5727bf31f49ad195ec041a78'
          t=x['exact_algebraic_uniqueness_proof']
          assert t['D_rank']==6
          assert t['matrix_identity_D_times_frozen_WT_over_5040_equals_I6']
          assert t['trained_F_zero_at_t0_for_all_delta']
          assert t['canonical_exact_classical_integrator_equals_learned_operator']
          assert t['perturbed_weight_negative_control_fails']
          assert x['fixed_operator_learned_exclusive_new_primitive']=='BOUNDED_MATHEMATICAL_NO_GO_PROVED'
          assert x['global_Q3']==x['global_Q1_Q7']=='OPEN'
          print('EXACT_LEARNED_OPERATOR_EQ_CLASSICAL_BOUNDED_PROOF_PASS')
          print('NEW_AUTHOR_SOURCE_FROZEN_FIRST',[z['source_science_status'] for z in x['five_actual_original_sources']])
          print('ORIGINAL_FIRST_MODEL',x['learned_first_original_3VC_pass_count'],'CLASSICAL',x['matched_strong_classical_3VC_pass_count'])
          PY
