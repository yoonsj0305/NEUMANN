name: Q3 after-first-FAIL exact public Pre facet cegar1 original-proof development
on:
  pull_request:
    paths:
      - '.github/workflows/q3-cegar-source-tight-facet-first.yml'
      - 'research/evidence/q3_cegar_pre_tight_facets_20261019/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-cegar-public-pre-tight-development:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: official_sygus
          persist-credentials: false
          sparse-checkout: |
            comp/2017/Inv_Track
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen SyGuS original and exact previous-first-failure method unchanged
        run: |
          test "$(git -C official_sygus rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          test "$(git hash-object experiments/q3_source_prove.py)" = a74b62cc97958e06f70116f3c8cec2f6db3d3b75
          test "$(git hash-object experiments/am2_sygus_native_three_vc_checker.py)" = aca2b543057c968acd8a175e7b1ef8e391ba79b2
          python -m py_compile research/evidence/q3_cegar_pre_tight_facets_20261019/first_original_tight_facet.py
      - name: Install exact first original Z3 and separate cvc5 verifier
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cvc5
          python -m pip install --disable-pip-version-check . sympy==1.13.3 z3-solver==4.13.3.0
      - name: FIRST new mechanism development: exact public Pre facets, no source case swap
        run: |
          set -o pipefail
          PYTHONPATH=. python research/evidence/q3_cegar_pre_tight_facets_20261019/first_original_tight_facet.py --original-root official_sygus --out /tmp/q3_cegar_tight_facet_first.json | tee /tmp/q3_cegar_tight_facet_first_stdout.log
          sha256sum /tmp/q3_cegar_tight_facet_first.json
      - name: Preserve first exact source case including all FAIL results before verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-cegar-source-pre-tight-facet-development-first
          path: |
            /tmp/q3_cegar_tight_facet_first.json
            /tmp/q3_cegar_tight_facet_first_stdout.log
          if-no-files-found: warn
      - name: Predeclared authentic single-original development gate only
        if: success()
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open("/tmp/q3_cegar_tight_facet_first.json"))
          assert d["preregistered_issue"]==281
          assert d["is_posthoc_development_after_issue279_first_failure"]
          assert d["prior_issue279_first_verdict_preserved"]=="FAIL"
          assert d["scientific_scope"]=="ONE_PREVIOUSLY_OPENED_OFFICIAL_SOURCE_DEV_ONLY"
          assert d["global_Q1_Q7"]=="OPEN"
          assert d["gpu_calls"]==d["model_calls"]==d["paid_api_calls"]==0
          print("POSTHOC_SINGLE_SOURCE_DEV_PASS",d["scoped_development_pass"])
          print("FROZEN_DEV_CRITERIA",d["fixed_first_development_checks"])
          if not d["scoped_development_pass"]:sys.exit(2)
          print("ONE_SOURCE_ORIGINAL_PRE_TIGHT_FACET_3VC_PASS_NOT_Q3_GLOBAL")
          PY
