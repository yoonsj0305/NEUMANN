name: Q3 Composed Semantic Operator Invention

on:
  pull_request:
    paths:
      - "neumann1/composed_grid_inventor.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "tests/test_composed_grid_inventor.py"
      - ".github/workflows/q3_composed_grid.yml"
  workflow_dispatch:

jobs:
  new-semantic-program:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check old grammar gap and learned composition transfer
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_composed_grid_inventor.py
