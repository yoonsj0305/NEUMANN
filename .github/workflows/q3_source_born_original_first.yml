name: Q3 Source-Born Representation FIRST External Originals
on:
  pull_request:
    paths:
      - "neumann1/source_born_representation_inventor.py"
      - "neumann1/object_gap_router.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "research/q3/q3_arc2_source_born_original_first.py"
      - "tests/test_q3_source_born_representation.py"
      - ".github/workflows/q3_source_born_original_first.yml"
  workflow_dispatch:

jobs:
  new-representation-first-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve pinned independent ARC-AGI-2 source original data
        run: |
          mkdir -p /tmp/q3-arc2-author
          git -C /tmp/q3-arc2-author init -q
          git -C /tmp/q3-arc2-author remote add origin https://github.com/arcprize/ARC-AGI-2.git
          git -C /tmp/q3-arc2-author fetch -q --depth 1 origin f3283f727488ad98fe575ea6a5ac981e4a188e49
          git -C /tmp/q3-arc2-author checkout -q FETCH_HEAD
          test "$(git -C /tmp/q3-arc2-author rev-parse HEAD)" = f3283f727488ad98fe575ea6a5ac981e4a188e49
      - name: Install the actual production NEUMANN code
        run: python -m pip install -e . pytest
      - name: Minimal source-to-AST and fail-closed behavioral tests
        run: python -m pytest -q -x tests/test_q3_source_born_representation.py
      - name: Strictly exclude previously scored originals and blind FIRST inputs
        run: |
          python research/q3/q3_arc2_source_born_original_first.py prepare \
            --upstream /tmp/q3-arc2-author --blind /tmp/q3-source-born-blind --n 32
      - name: Freeze original FIRST predictions BEFORE external target gold
        run: |
          python research/q3/q3_arc2_source_born_original_first.py propose \
            --blind /tmp/q3-source-born-blind \
            --output q3_source_born_frozen.json
          sha256sum q3_source_born_frozen.json > q3_source_born_frozen.sha256
      - name: Score author's ORIGINAL test gold only after frozen SHA exists
        run: |
          original_sha="$(cut -d' ' -f1 q3_source_born_frozen.sha256)"
          python research/q3/q3_arc2_source_born_original_first.py score \
            --upstream /tmp/q3-arc2-author \
            --predictions q3_source_born_frozen.json \
            --sha "$original_sha" --output q3_source_born_first_score.json
      - uses: actions/upload-artifact@v4
        with:
          name: q3-source-born-original-first-frozen
          path: |
            q3_source_born_frozen.json
            q3_source_born_frozen.sha256
            q3_source_born_first_score.json
          if-no-files-found: error
