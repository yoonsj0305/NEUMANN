name: Q3 original DRAGON4 SPACER extracted independent dual 3VC
on:
  pull_request:
    paths:
      - '.github/workflows/q3-dragon4-spacer-dual-3vc.yml'
      - 'research/evidence/q3_affine_unopened_transfer_20261021/dragon4_spacer_extracted_dual_3vc.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent_verified_extracted_safety:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: original
          sparse-checkout: |
            lib/Inv_Track/andrew_lustre
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native original upstream source and candidate checker syntax
        run: |
          test "$(git -C original rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          python -m py_compile research/evidence/q3_affine_unopened_transfer_20261021/dragon4_spacer_extracted_dual_3vc.py
      - name: Pinned independent cvc5 plus source-native Z3
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          python -m pip install --disable-pip-version-check numpy==2.3.5 z3-solver==4.13.3.0
      - name: Independently certify SPACER candidate under original 3VC
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_affine_unopened_transfer_20261021/dragon4_spacer_extracted_dual_3vc.py --root original --out /tmp/q3_dragon4_extracted_dual.json | tee /tmp/q3_dragon4_extracted_dual.log
          sha256sum /tmp/q3_dragon4_extracted_dual.json
      - name: Save full source invariant certificate and negative statuses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-dragon4-real-source-extracted-spacer-dual-original
          path: |
            /tmp/q3_dragon4_extracted_dual.json
            /tmp/q3_dragon4_extracted_dual.log
          if-no-files-found: warn
      - name: Refuse learned or unverifiable certificate promotion
        if: success()
        run: |
          python - <<'PY'
          import json
          a=json.load(open('/tmp/q3_dragon4_extracted_dual.json'))
          assert a['Q3_global']==a['Q4_full']=='OPEN'
          if a['original']['original_full_native_dual_3VC']:
              assert a['original']['PDR_result']=='unsat'
              assert any(t['source_full_dual_3VC'] for t in a['original']['candidate_trials'])
              assert all(q['dual_pass'] for t in a['original']['candidate_trials'] if t['source_full_dual_3VC'] for q in t['original_proof'].values())
          print('ORIGINAL_INDEPENDENT_DUAL_3VC',a['original']['original_full_native_dual_3VC'])
          PY
