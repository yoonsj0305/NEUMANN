name: NEUMANN P2.9 FIRST preregistered 48 original eval transfer
on:
  push:
    branches:
      - research/q3-p29-inferred-coordinate-programs-20261105
    paths:
      - .github/workflows/q3_p29_FIRST_FRESH48.yml
permissions:
  contents: read
jobs:
  first:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - name: Checkout fully locked research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pretrained-model-free unit tests BEFORE opening benchmark
        run: node --test tests/test_q3_p29_induced_coordinate_programs.mjs
      - name: Fetch exact frozen original public ARC upstream
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/arc-agi"
          git -C "$RUNNER_TEMP/arc-agi" remote add origin https://github.com/fchollet/ARC-AGI.git
          git -C "$RUNNER_TEMP/arc-agi" fetch --depth=1 origin 399030444e0ab0cc8b4e199870fb20b863846f34
          git -C "$RUNNER_TEMP/arc-agi" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/arc-agi" rev-parse HEAD)" = 399030444e0ab0cc8b4e199870fb20b863846f34
      - name: Preflight only file NAMES and source identities without reading selected task bodies
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'import {sourcePreflight} from "./experiments/q3_p29_first_fresh48.mjs";const x=sourcePreflight(process.argv[1]);console.log(JSON.stringify({prior_excluded:x.cohort.evaluated_prior_unique,fresh_first:x.cohort.ids.length,still_unopened:x.cohort.unopened_after_this_selection}));' "$RUNNER_TEMP/arc-agi"
      - name: FIRST original 48 model-free generalization experiment, no favorable second run
        shell: bash
        run: |
          set -euo pipefail
          node experiments/q3_p29_first_fresh48.mjs "$RUNNER_TEMP/arc-agi" > P29-FIRST-FRESH48.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('P29-FIRST-FRESH48.json','utf8'));
          if(r.stats.N!==48||r.cohort_prior_excluded!==280||r.remaining_original_unopened!==72||!r.all_proposals_before_gold_read||r.P29_neural_calls!==0)process.exit(1);
          console.log(JSON.stringify({science:r.science_decision,stats:r.stats,Q3:r.autonomous_Q3,Q6:r.novel_semantic_family_Q6}));
          NODE
      - name: Retain immutable ORIGINAL first score artifact and SHA256
        if: always()
        shell: bash
        run: |
          if test -f P29-FIRST-FRESH48.json; then
            sha256sum P29-FIRST-FRESH48.json > P29-FIRST-FRESH48.sha256
            cat P29-FIRST-FRESH48.sha256
          fi
      - name: Preserve immutable first even if negative scientific outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neumann-p29-FIRST-fresh-public-original48
          path: |
            P29-FIRST-FRESH48.json
            P29-FIRST-FRESH48.sha256
          if-no-files-found: warn
          retention-days: 90
