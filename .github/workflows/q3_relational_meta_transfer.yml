name: Q3 Q6 Cross-Semantic Relational Grammar Invention

on:
  pull_request:
    paths:
      - "neumann1/relational_meta_compiler.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "tests/test_relational_meta_compiler.py"
      - ".github/workflows/q3_relational_meta_transfer.yml"
  workflow_dispatch:

jobs:
  typed-relational-transfer:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay identical generator over arithmetic graph and spatial types
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_relational_meta_compiler.py
