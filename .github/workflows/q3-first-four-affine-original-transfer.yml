name: Q3 four frozen untouched original affine transfer classical 2VC
on:
  pull_request:
    paths:
      - '.github/workflows/q3-first-four-affine-original-transfer.yml'
      - 'research/evidence/q3_affine_unopened_transfer_20261021/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_four_blind_source_classical:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: pinned_original
          sparse-checkout: |
            lib/Inv_Track/andrew_lustre
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact source and syntax
        run: |
          test "$(git -C pinned_original rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          python -m py_compile research/evidence/q3_affine_unopened_transfer_20261021/four_original_source_affine_transfer.py
      - name: Install dual solver independently pinned
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check numpy==2.3.5 z3-solver==4.13.3.0
      - name: Independently exhaustive three bit model oracle
        run: |
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_exact_GF2_all_arity_20261021/finite_exhaustive_inductive_oracle_test.py
      - name: FIRST frozen original four all rows preserved, exact source dual Z3+cvc5
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_affine_unopened_transfer_20261021/four_original_source_affine_transfer.py --root pinned_original --freeze research/evidence/q3_affine_unopened_transfer_20261021/ORIGINAL_FOUR_PRESOURCE_FREEZE.json --out /tmp/q3_four_original_transfer.json --max-wall-ms 90000 | tee /tmp/q3_four_original_transfer.log
          sha256sum /tmp/q3_four_original_transfer.json
      - name: Archive every first failure and success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-frozen-unopened-four-source-first-classical-affine
          path: |
            /tmp/q3_four_original_transfer.json
            /tmp/q3_four_original_transfer.log
          if-no-files-found: warn
      - name: Explicit no fabricated success, every case retained
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/q3_four_original_transfer.json'))
          assert r['first_freeze_presource_commit']=='8e6efc5b5a6f637ac6b92fbb459616e30ce97072'
          assert r['all_four_source_rows_preserved'] and len(r['source_results'])==4
          assert r['global_Q3']==r['global_Q4']=='OPEN'
          assert r['controls']['four_way_parity_positive'].startswith('PASS')
          assert r['controls']['unconstrained_transition_negative'].startswith('PASS')
          print('AUTHENTICATED',r['num_authenticated_sources'],'/4')
          print('ORIGINAL_2VC_AFFINE',r['num_exact_full_affine_original_dual_pass'],'/4')
          print('FULL_LOWARITY',r['num_full_affine_lowarity_complete_original_dual_pass'],'/4')
          if r['num_authenticated_sources'] != 4:
              raise SystemExit('Not all pinned first originals authenticated')
          PY
