name: FGSR automatic five-relation invariant scaffold (single opened-development test)
on:
  pull_request:
    paths:
      - '.github/workflows/fgsr-auto-five-scaffold-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-source-automatic-synthesis:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      FGSR_RESULT: research/evidence/fgsr-q3-automatic-scaffold-20261017/first_actual_auto_scaffold_receipt.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin independent SMT verifier and static compile
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
          python -m py_compile research/evidence/fgsr-q3-automatic-scaffold-20261017/autonomous_scaffold_once.py
      - name: Source-alone five-Horn-predicate invariant CEGAR (no human scaffold import)
        run: |
          python research/evidence/fgsr-q3-automatic-scaffold-20261017/autonomous_scaffold_once.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research/evidence/fgsr-q3-automatic-scaffold-20261017/first_actual_auto_scaffold_receipt.json").read_text())
          print("EXACT_AUTOMATIC_9_SOURCE_GATE",r["status"])
          print("INDEPENDENT_ORIGINAL",r.get("LEARNED",{}).get("original_unsat_count"),"/9")
          print("LOOPS",r.get("source_extracted_loops",{}))
          print("Q",r["global_q1_q7"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgsr-first-source-only-automatic-five-relations
          path: research/evidence/fgsr-q3-automatic-scaffold-20261017/first_actual_auto_scaffold_receipt.json
          if-no-files-found: warn
          retention-days: 45
