name: Q3 Self-Invented Symmetry Orbits and Q6 Variable-Size Transfer

on:
  pull_request:
    paths:
      - "neumann1/symmetry_orbit_inventor.py"
      - "neumann1/causal_representation_inventor.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "tests/test_symmetry_orbit_inventor.py"
      - ".github/workflows/q3_orbit_invention.yml"
  workflow_dispatch:

jobs:
  structure-from-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Invent unlabeled graph motifs and symbolic stencils; test new sizes
        run: |
          python -m pip install -e . pytest
          python -m pytest -q -s tests/test_symmetry_orbit_inventor.py
