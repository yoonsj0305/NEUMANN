name: NEUMANN Q6 Nguyen and Q3 Keijzer independent real original source studies
on:
  pull_request:
    paths:
      - '.github/workflows/q3_nguyen_frozen_derived_power_cross_author.yml'
      - 'research/q3/nguyen_external_first8_prepare.py'
      - 'research/q3/nguyen_frozen_real_model_cross_author.py'
      - 'research/q3/keijzer6_induced_fold_source_model.py'
      - '.github/workflows/q3_keijzer6_source_induced_all_integer_proof.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  external_published_Nguyen_author_source_withheld_from_model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 sympy==1.13.3
      - name: Freeze published independent Nguyen1-8 original author targets in a separate source-generation job
        run: |
          set -euo pipefail
          mkdir -p /tmp/q6ng/source /tmp/q6ng/true
          OPENBLAS_NUM_THREADS=1 PYTHONPATH=research/g0 python research/q3/nguyen_external_first8_prepare.py \
            --source /tmp/q6ng/source/NON_ERBENCH_NGUYEN8_NUMERIC_ONLY_48PTS.json \
            --truth /tmp/q6ng/true/PUBLISHED_NGUYEN8_TRUE_AUTHOR_EQUATIONS_PRIVATE.json
          python - <<'PY'
          import json
          src=json.load(open('/tmp/q6ng/source/NON_ERBENCH_NGUYEN8_NUMERIC_ONLY_48PTS.json'))
          assert len(src['source_numeric_without_equations'])==8
          assert all('original_expression' not in x for x in src['source_numeric_without_equations'])
          assert all(len(x['x'])==len(x['y'])==48 for x in src['source_numeric_without_equations'])
          print('Q6_NGUYEN_EXTERNAL_AUTHOR_TRUTH_PHYSICALLY_WITHHELD')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: neumann-q6-first-real-nguyen8-author-numeric-source-only
          path: /tmp/q6ng/source
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: neumann-q6-first-real-nguyen8-original-gold-private-to-grader
          path: /tmp/q6ng/true
          if-no-files-found: error
  frozen_already_trained_model_exact_weights_vs_first_eleventh_original:
    needs: external_published_Nguyen_author_source_withheld_from_model
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 sympy==1.13.3 scikit-learn==1.5.2
      - uses: actions/download-artifact@v4
        with:
          run-id: 39913799990
          name: q3-sx-online-no-label-training-original128-only-numeric
          github-token: ${{ github.token }}
          path: /tmp/q6ng/train_prior_only
      - uses: actions/download-artifact@v4
        with:
          run-id: 39936479218
          name: neumann-q3-eleventh-original-sealed-learned-exp-log-derived-macros
          github-token: ${{ github.token }}
          path: /tmp/q6ng/old_model_proof
      - uses: actions/download-artifact@v4
        with:
          name: neumann-q6-first-real-nguyen8-author-numeric-source-only
          path: /tmp/q6ng/source
      - name: Refuse learned weight/training reward/memory SHA changes, use EXACT previous ERBench neural policy on non-ERBench publisher's original functions
        run: |
          set -euo pipefail
          mkdir -p /tmp/q6ng/proposals
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 PYTHONPATH=research/g0:research/q3 \
            python research/q3/nguyen_frozen_real_model_cross_author.py --mode infer \
            --train /tmp/q6ng/train_prior_only/OTHER_ORIGINAL128_NUMERIC_XY_NO_FORMULA.json \
            --old /tmp/q6ng/old_model_proof/FIRST_ELEVENTH32_DERIVED_EXPLOG_POWER_AND_CLASSICAL_MACROS.json \
            --source /tmp/q6ng/source/NON_ERBENCH_NGUYEN8_NUMERIC_ONLY_48PTS.json \
            --pred /tmp/q6ng/proposals/FIRST_FROZEN_NEURAL_VS_CLASSICAL_NEW_NGUYEN8_SOURCE_PREDICTIONS.json \
            | tee /tmp/q6ng/proposals/ERBENCH_MODEL_NGUYEN_FROZEN_WEIGHTS_ATTESTATION.log
          sha256sum /tmp/q6ng/proposals/FIRST_FROZEN_NEURAL_VS_CLASSICAL_NEW_NGUYEN8_SOURCE_PREDICTIONS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-q6-first-real-nguyen8-frozen-neural-source-proposals-before-author-grader
          path: /tmp/q6ng/proposals
          if-no-files-found: error
  independent_Nguyen_author_entire_analytic_expression_grader:
    needs: frozen_already_trained_model_exact_weights_vs_first_eleventh_original
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 sympy==1.13.3 scikit-learn==1.5.2
      - uses: actions/download-artifact@v4
        with:
          name: neumann-q6-first-real-nguyen8-original-gold-private-to-grader
          path: /tmp/q6ng/original
      - uses: actions/download-artifact@v4
        with:
          name: neumann-q6-first-real-nguyen8-frozen-neural-source-proposals-before-author-grader
          path: /tmp/q6ng/pred
      - name: Score every published original Nguyen1..8 as whole exact symbolic function or UNKNOWN and count learner-only over original strong classical rights
        run: |
          set -euo pipefail
          mkdir -p /tmp/q6ng/graded
          OPENBLAS_NUM_THREADS=1 PYTHONPATH=research/g0:research/q3 \
            python research/q3/nguyen_frozen_real_model_cross_author.py --mode grade \
            --truth /tmp/q6ng/original/PUBLISHED_NGUYEN8_TRUE_AUTHOR_EQUATIONS_PRIVATE.json \
            --pred /tmp/q6ng/pred/FIRST_FROZEN_NEURAL_VS_CLASSICAL_NEW_NGUYEN8_SOURCE_PREDICTIONS.json \
            --out /tmp/q6ng/graded/INDEPENDENT_NGUYEN8_FULL_AUTHOR_TRUTH_SCORE_FROZEN_NEURAL_AND_CLASSICAL.json \
            | tee /tmp/q6ng/graded/NATIVE_CROSS_AUTHOR_VERIFIER_FULL_ANALYTIC_FUNCTION.log
          python - <<'PY'
          import json
          d=json.load(open('/tmp/q6ng/graded/INDEPENDENT_NGUYEN8_FULL_AUTHOR_TRUTH_SCORE_FROZEN_NEURAL_AND_CLASSICAL.json'))
          assert len(d['grades'])==5 and all(k['total']==8 for k in d['grades'].values())
          assert d['G1']=='HOLD' and d['Q3_GLOBAL']=='OPEN'
          print('Q6_PUBLISHED_INDEPENDENT_AUTHOR_ALL_EIGHT_ACCOUNTED')
          PY
          sha256sum /tmp/q6ng/graded/INDEPENDENT_NGUYEN8_FULL_AUTHOR_TRUTH_SCORE_FROZEN_NEURAL_AND_CLASSICAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-q6-first-real-nguyen8-full-analytic-author-exact-independent-grade
          path: /tmp/q6ng/graded
          if-no-files-found: error

  keijzer6_original_source_and_physically_private_author:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.14.1 sympy==1.13.3 scikit-learn==1.5.2
      - name: Separate original published Keijzer6 n1..50 SOURCE and true author n51..120 heldout exact rationals
        run: |
          set -euo pipefail
          mkdir -p /tmp/keijzer-auth/source /tmp/keijzer-auth/private
          OPENBLAS_NUM_THREADS=1 python research/q3/keijzer6_induced_fold_source_model.py --mode prepare \
            --source /tmp/keijzer-auth/source/KEIJZER6_SOURCE_NUMERIC_ONLY.json \
            --truth /tmp/keijzer-auth/private/KEIJZER6_TRUE_ORIGINAL_AND_EXTRAPOLATION.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/keijzer-auth/source/KEIJZER6_SOURCE_NUMERIC_ONLY.json'))
          assert len(p['source_numeric_without_equations'][0]['x'])==50
          assert 'harmonic' not in str(p)
          print('Q3_KEIJZER6_ONLY_SOURCE_NUMERIC_AVAILABLE_TO_NEXT_JOB')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: keijzer6-public-original-numeric-only-no-formula-source
          path: /tmp/keijzer-auth/source/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: keijzer6-physically-private-real-original-author-and-70-rationals
          path: /tmp/keijzer-auth/private/
          if-no-files-found: error
  keijzer6_neural_frozen_source_numeric_pregrade:
    needs: keijzer6_original_source_and_physically_private_author
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.14.1 sympy==1.13.3 scikit-learn==1.5.2
      - uses: actions/download-artifact@v4
        with:
          name: keijzer6-public-original-numeric-only-no-formula-source
          path: /tmp/keijzer-auth/source
      - name: Positive shifted reciprocal and direct polynomial controls, corrupted source negative control
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=1 python - <<'PY'
          import importlib.util,numpy as np
          spec=importlib.util.spec_from_file_location('q3_fold','research/q3/keijzer6_induced_fold_source_model.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          n=np.arange(1,51)
          x={'x':n.tolist(),'y':np.cumsum(3/(n+7)**2).tolist()}
          assert mod.fold(x)[0] is not None and mod.direct(x)[0] is None
          y={'x':n.tolist(),'y':(2*n**3-3*n+7).tolist()}
          assert mod.direct(y)[0] is not None and mod.fold(y)[0] is None
          z={'x':n.tolist(),'y':x['y'].copy()}
          z['y'][35]+=0.05
          assert mod.fold(z)[0] is None
          print('KEIJZER6_POSITIVE_NEGATIVE_SOURCE_VALIDATION_CONTROLS_PASS')
          PY
      - name: Train real neural policy on 112 OTHER synthetic numeric sequences and freeze first original symbolic macro without gold
        run: |
          set -euo pipefail
          mkdir -p /tmp/keijzer-auth/pred
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python research/q3/keijzer6_induced_fold_source_model.py --mode infer \
            --source /tmp/keijzer-auth/source/KEIJZER6_SOURCE_NUMERIC_ONLY.json \
            --pred /tmp/keijzer-auth/pred/FIRST_KEIJZER6_NEURAL_RECURSIVE_MACRO_BEFORE_ORIGINAL_GOLD.json \
            | tee /tmp/keijzer-auth/pred/ORIGINAL_SOURCE_ONLY_NEURAL_POLICY_AND_MACRO.log
          sha256sum /tmp/keijzer-auth/pred/FIRST_KEIJZER6_NEURAL_RECURSIVE_MACRO_BEFORE_ORIGINAL_GOLD.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keijzer6-first-trained-neural-generated-named-recursive-programs-pregrade
          path: /tmp/keijzer-auth/pred/
          if-no-files-found: error
  keijzer6_independent_real_author_mathematical_whole_domain_proof:
    needs: keijzer6_neural_frozen_source_numeric_pregrade
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.14.1 sympy==1.13.3 scikit-learn==1.5.2
      - uses: actions/download-artifact@v4
        with:
          name: keijzer6-physically-private-real-original-author-and-70-rationals
          path: /tmp/keijzer-auth/true
      - uses: actions/download-artifact@v4
        with:
          name: keijzer6-first-trained-neural-generated-named-recursive-programs-pregrade
          path: /tmp/keijzer-auth/pred
      - name: Independent published author whole n-positive-integer proof via base and recurrence + exact 70 unseen heldout rationals, compare all classical
        run: |
          set -euo pipefail
          mkdir -p /tmp/keijzer-auth/grade
          OPENBLAS_NUM_THREADS=1 python research/q3/keijzer6_induced_fold_source_model.py --mode grade \
            --truth /tmp/keijzer-auth/true/KEIJZER6_TRUE_ORIGINAL_AND_EXTRAPOLATION.json \
            --pred /tmp/keijzer-auth/pred/FIRST_KEIJZER6_NEURAL_RECURSIVE_MACRO_BEFORE_ORIGINAL_GOLD.json \
            --out /tmp/keijzer-auth/grade/FIRST_KEIJZER6_TRUE_AUTHOR_ALL_N_INDUCTION_AND_70_EXACT.json \
            | tee /tmp/keijzer-auth/grade/INDEPENDENT_RECURSIVE_ORIGINAL_WHOLE_DOMAIN_PROOF.log
          sha256sum /tmp/keijzer-auth/grade/FIRST_KEIJZER6_TRUE_AUTHOR_ALL_N_INDUCTION_AND_70_EXACT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keijzer6-first-full-source-mathematical-induction-and-exact-70-holdouts
          path: /tmp/keijzer-auth/grade/
          if-no-files-found: error
