name: v098 Fresh Q34 Evaluation

on:
  push:
    branches:
      - research/v098-q34-fresh-holdout
    paths:
      - .github/workflows/v098_q34_evaluate.yml

permissions:
  contents: write

jobs:
  evaluate-holdout:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "HASWELL"
      MKL_NUM_THREADS: "1"
      MKL_CBWR: "COMPATIBLE"
      BLIS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact frozen Q34 runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.9.1 threadpoolctl==3.7.0 highspy==1.15.1
          pip install -e . --no-deps
          pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Evaluate frozen B_POINT on committed fresh sources once
        run: |
          test -e docs/experiments/results/v098_fresh_holdout_sources.json.gz
          test -e docs/experiments/results/v098_fresh_holdout_sources.manifest.json
          test ! -e docs/experiments/results/v098_fresh_holdout_eval.json.gz
          test ! -e docs/experiments/results/v098_fresh_holdout_eval.manifest.json
          python -m experiments.lp_q34_holdout_v098 \
            --output-gzip docs/experiments/results/v098_fresh_holdout_eval.json.gz \
            --manifest docs/experiments/results/v098_fresh_holdout_eval.manifest.json \
            --frozen-head "$GITHUB_SHA"
      - name: Retain immutable first fresh evaluation on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/experiments/results/v098_fresh_holdout_eval.json.gz \
                  docs/experiments/results/v098_fresh_holdout_eval.manifest.json
          git commit -m "v098 retain first fresh Q34 holdout evaluation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload first fresh evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: v098-first-fresh-q34-evaluation
          path: |
            docs/experiments/results/v098_fresh_holdout_eval.json.gz
            docs/experiments/results/v098_fresh_holdout_eval.manifest.json
