name: Q3 Parallel Multi-Object Program Invention

on:
  pull_request:
    paths:
      - "neumann1/parallel_object_edit_inventor.py"
      - "tests/test_parallel_object_edit_inventor.py"
      - ".github/workflows/q3_parallel_bulk.yml"
  workflow_dispatch:

jobs:
  inverse-bulk-object-rules:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: New object set-level inference and source-verification tests
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_parallel_object_edit_inventor.py
