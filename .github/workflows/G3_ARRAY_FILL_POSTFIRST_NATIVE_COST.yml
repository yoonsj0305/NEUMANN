name: NEUMANN G3 array-fill unseen three original POSTFIRST native cost comparator
on:
  push:
    branches:
      - research/g3-array-init-parametric-proof-transfer-20261106
    paths:
      - .github/workflows/G3_ARRAY_FILL_POSTFIRST_NATIVE_COST.yml
permissions:
  contents: read
  actions: read
jobs:
  strong-native-same-original-three:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: NEUMANN-G3-ARRAY-FILL-ONE-RULE-UNSEEN-FIRST3
          run-id: 42178462607
          github-token: ${{ github.token }}
          path: frozen-array-first
      - name: Strict original first SHA and preserved generator code before baseline
        shell: bash
        run: |
          set -euo pipefail
          echo '86cc31057e2fe96c412d39b5ff395ecde03aef9990df0df30ec63be6091c883a  frozen-array-first/G3-ARRAY-FILL-UNSEEN-N5-N8-N9-FIRST.json' | sha256sum -c -
          test "$(git hash-object research/g3/array_fill_parametric_invariant.py)" = 8043d84210822f9a47d78568c25ea97cb0c175dd
          python3 -m py_compile research/g3/array_fill_postfirst_native_cost.py
      - name: Install Z3 + SHA-locked actual Eldarica 2.3 strong native benchmark
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq z3
          z3 --version
          curl -fLsS --retry 2 --max-time 75 https://github.com/uuverifiers/eldarica/releases/download/v2.3/eldarica-x86-linux-static.gz -o "$RUNNER_TEMP/eldarica-v2.3.gz"
          echo "6815742c34e92d26b379006029eeeb1877757947206b5af9c2f7ff61a5e9440d  $RUNNER_TEMP/eldarica-v2.3.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/eldarica-v2.3.gz" > "$RUNNER_TEMP/eld"
          chmod 755 "$RUNNER_TEMP/eld"
          echo "ELDARICA=$RUNNER_TEMP/eld" >> "$GITHUB_ENV"
      - name: Only source-free controls before strong native original comparison
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/safe.smt2" <<'EOF'
          (set-logic HORN)
          (declare-fun Inv (Int) Bool)
          (assert (forall ((x Int)) (=> (= x 0) (Inv x))))
          (assert (forall ((x Int) (y Int)) (=> (and (Inv x) (= y (+ x 1))) (Inv y))))
          (assert (forall ((x Int)) (=> (and (Inv x) (< x 0)) false)))
          (check-sat)
          EOF
          sed 's/(< x 0)/(> x 0)/' "$RUNNER_TEMP/safe.smt2" > "$RUNNER_TEMP/unsafe.smt2"
          python3 - <<'PY'
          import os,subprocess,pathlib
          for solver in (['z3','-smt2'],[os.environ['ELDARICA']]):
            for case,expected in [('safe','sat'),('unsafe','unsat')]:
                f=pathlib.Path(os.environ['RUNNER_TEMP'])/(case+'.smt2')
                p=subprocess.run(solver+[str(f)],capture_output=True,text=True,timeout=8)
                assert p.returncode==0 and p.stdout.strip()==expected,(solver,case,p.stdout,p.stderr)
          print('G3_NATIVE_STRONG_Z3_AND_ELDARICA_SAT_UNSAT_SOURCEFREE_PASS')
          PY
      - name: "FROZEN N5,N8,N9 original three: compare native wall clocks vs verified structural first"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m research.g3.array_fill_postfirst_native_cost \
            --first frozen-array-first/G3-ARRAY-FILL-UNSEEN-N5-N8-N9-FIRST.json \
            --z3 /usr/bin/z3 --eld "$ELDARICA" > G3-ARRAY-THREE-POSTFIRST-STRONG-NATIVE-COST.json
          python3 - <<'PY'
          import json
          x=json.load(open('G3-ARRAY-THREE-POSTFIRST-STRONG-NATIVE-COST.json'))
          print(json.dumps({'original_denominator':x['cohort_original'],
             'native_z3_solved_original':x['native_z3_solved_original'],
             'native_eldarica_solved_original':x['native_eldarica_solved_original'],
             'certified_structural_originals':x['per_instance_frozen_generator_proof_verified'],
             'first_original_SHA':x['first_unseen_original_SHA256'],
             'per_source':[{'file':r['original_file'],
                'generated_plus_proof_ms':r['original_first_generated_rule_and_full_proof_wall_ms'],
                'Z3':(r['native'][0]['status'],r['native'][0]['wall_ms']),
                'Eldarica':(r['native'][1]['status'],r['native'][1]['wall_ms']),
                'lower_bound_process_wall_ratio':r['observed_timeout_vs_rule_lower_bound_wall_ratio']}
                for r in x['rows']]},sort_keys=True))
          assert x['cohort_original']==3
          assert x['per_instance_frozen_generator_proof_verified']==3
          assert x['no_generator_changes_or_neural_training'] is True
          assert x['Q3']=='OPEN' and x['Q4']=='OPEN'
          PY
      - name: Lock exact real time baseline and all outcomes
        if: always()
        shell: bash
        run: |
          if test -s G3-ARRAY-THREE-POSTFIRST-STRONG-NATIVE-COST.json; then
            sha256sum G3-ARRAY-THREE-POSTFIRST-STRONG-NATIVE-COST.json > G3-ARRAY-THREE-POSTFIRST-STRONG-NATIVE-COST.sha256
            cat G3-ARRAY-THREE-POSTFIRST-STRONG-NATIVE-COST.sha256
          fi
      - name: Preserve full original three quantitative postfirst expert comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEUMANN-G3-ARRAY-THREE-POSTFIRST-STRONG-NATIVE-COST
          path: |
            G3-ARRAY-THREE-POSTFIRST-STRONG-NATIVE-COST.json
            G3-ARRAY-THREE-POSTFIRST-STRONG-NATIVE-COST.sha256
          if-no-files-found: warn
          retention-days: 90
