name: NEUMANN G0 first original sqrtmodinv QFNIA source-family prospective classical screen
on:
  pull_request:
    paths:
      - '.github/workflows/g0_fresh_qfnia_classical_screen.yml'
      - 'research/g0/new_source_qfnia_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_source_unseen_hash_first_classical_portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SMT-LIB/benchmark-submission-2023
          ref: 7f993a017850ba547c6ea19a1bf3b54adf54a449
          path: source-upstream
          sparse-checkout: |
            non-incremental/QF_NIA/20230328-sqrtmodinv-hoenicke
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate source revision and immutably established reusable classical comparator engines
        run: |
          set -euo pipefail
          test "$(git -C source-upstream rev-parse HEAD)" = 7f993a017850ba547c6ea19a1bf3b54adf54a449
          mkdir -p /tmp/g0-frozen-prior /tmp/g0-first-trial
          git fetch --no-tags origin research/g0-ultimate-2023-nia-real-20261018
          test "$(git rev-parse FETCH_HEAD:research/evidence/g0-ultimate2023-20261018/exact_original_modular_unsat.py)" = ae50844955aec9e636a0a3f2986f6cc52b4ec1fd
          git show FETCH_HEAD:research/evidence/g0-ultimate2023-20261018/exact_original_modular_unsat.py > /tmp/g0-frozen-prior/exact_original_modular_unsat.py
          git fetch --no-tags origin research/g0-first-four-official-qfnia-classical-headroom-20261021
          test "$(git rev-parse FETCH_HEAD:research/evidence/g0_official_original_four_20261021/original_four_2026_union_smt_direct_recheck.py)" = 6ee2cd4dcb618c42b3ca4f7c4b5285a648b80e61
          git show FETCH_HEAD:research/evidence/g0_official_original_four_20261021/original_four_2026_union_smt_direct_recheck.py > /tmp/g0-frozen-prior/original_four_2026_union_smt_direct_recheck.py
          python -m py_compile research/g0/new_source_qfnia_probe.py
          python -m py_compile /tmp/g0-frozen-prior/*.py
          echo "PRIOR CLASSICAL METHOD AND MATCHED ORIGINAL DIRECT SOLVERS FROZEN"
      - name: Pin original existing Z3 and cvc5 without payment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          lscpu | grep 'Model name' | head -1
      - name: Hash-frozen metadata-first source family; exact source Z3/cvc5 and classical semantic theorem
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/g0-frozen-prior python research/g0/new_source_qfnia_probe.py \
            --source-root source-upstream \
            --out /tmp/g0-first-trial/first_original_cohort.json \
            | tee /tmp/g0-first-trial/all_case_logs.txt
          python - <<'PY'
          import json
          data=json.load(open('/tmp/g0-first-trial/first_original_cohort.json'))
          assert data['counts']['all_originals']==data['selected_count']
          assert len(data['cases'])==data['selected_count']
          assert data['global_Q1_Q7']=='OPEN'
          print('FIRST_SOURCE_ALL_CASES_RETAINED',data['selected_count'])
          print('ORIGINAL_STRUCTURAL_CLASSICAL',data['counts'].get('original_UNSAT_structurally_proved',0))
          print('GLOBAL_NEURAL_Q3',data['actual_new_learned_semantic_operator'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g0-first-new-qfnia-originals-sha-matched-classical-receipts
          path: /tmp/g0-first-trial/
          if-no-files-found: error
