name: NEUMANN Core Q3 Q4 Discovery Investment Utility Gate

on:
  push:
    branches:
      - feature/core-amortized-discovery-utility-gate-20261108
    paths:
      - neumann1/meta_utility_policy.py
      - neumann1/structural_meta_invention.py
      - neumann1/engine.py
      - neumann1/registry_engine.py
      - tests/test_meta_utility_policy.py
      - .github/workflows/q3_core_utility_gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profitability_and_core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Core dependencies
        run: |
          python -m pip install -q --disable-pip-version-check numpy scipy scikit-learn pytest
          python -m compileall -q neumann1
      - name: Cost-aware meta-invention and all production core paths
        run: |
          python -m pytest -q tests/test_meta_utility_policy.py tests/test_autonomous_synthesis_core.py tests/test_structural_meta_invention.py tests/test_engine.py
