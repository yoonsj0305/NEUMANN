name: NEUMANN P2.7 immutable first receipt audit
on:
  push:
    branches:
      - research/q3-p27-compositional-schema-learning-20261105
    paths:
      - .github/workflows/q3_p27_immutable_receipt_audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-first:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve unchanged ORIGINAL first receipt artifact
        uses: actions/download-artifact@v4
        with:
          name: neumann-p27-first-original-32
          run-id: 42003978711
          github-token: ${{ github.token }}
          path: original-first
      - name: Check immutable first byte-level receipt and report first verdict
        run: |
          set -euo pipefail
          node -e 'const f=require("fs"),c=require("crypto"),p="original-first/p27-FIRST-ORIGINAL-32.json",b=f.readFileSync(p),s=c.createHash("sha256").update(b).digest("hex"),d=JSON.parse(b);if(s!=="c472a96a4b1dc1cbe5e8292323a69455a1ac4deec2c38e27ac3c887a74346671"||d.stats.task_count!==32||d.stats.meta_training_tasks!==400)process.exit(1);console.log(JSON.stringify({sha256:s,local_gate:d.local_gate,stats:d.stats,first_result_untouched:true}))'
      - name: Fetch pinned official ARC source to regenerate predictions
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/arc-agi"
          git -C "$RUNNER_TEMP/arc-agi" remote add origin https://github.com/fchollet/ARC-AGI.git
          git -C "$RUNNER_TEMP/arc-agi" fetch --depth=1 origin 399030444e0ab0cc8b4e199870fb20b863846f34
          git -C "$RUNNER_TEMP/arc-agi" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/arc-agi" rev-parse HEAD)" = "399030444e0ab0cc8b4e199870fb20b863846f34"
      - name: Rerun independent typed AST and original oracle replay against FIRST receipt
        run: |
          set -euo pipefail
          node experiments/q3_p27_independent_audit.mjs "$RUNNER_TEMP/arc-agi" original-first/p27-FIRST-ORIGINAL-32.json > p27-FIRST-IMMUTABLE-AUDIT.json
          node -e 'const x=require("./p27-FIRST-IMMUTABLE-AUDIT.json");if(!x.good||x.errors.length)process.exit(1);console.log(JSON.stringify({independent_audit_pass:x.good,counts:x.counts,error_count:x.errors.length}))'
      - name: Preserve independent original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neumann-p27-first-independent-audit
          path: p27-FIRST-IMMUTABLE-AUDIT.json
          if-no-files-found: warn
          retention-days: 90
