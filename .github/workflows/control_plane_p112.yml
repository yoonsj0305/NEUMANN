name: P1.12 cross-encoder semantic judge contracts

on:
  pull_request:
    paths:
      - 'neumann1/control_plane_p112*.py'
      - 'experiments/control_plane_p112*.py'
      - 'scripts/control_plane_p112*.py'
      - 'tests/test_control_plane_p112*.py'
      - 'docs/experiments/control_plane_p112*.json'
      - 'docs/research/control_plane_p112*.md'
      - '.github/workflows/control_plane_p112.yml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies only
        run: python -m pip install pytest numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1 threadpoolctl==3.7.0
      - name: Compile P1.12 without loading model
        run: python -m py_compile neumann1/control_plane_p112.py neumann1/control_plane_p112_semantic.py experiments/control_plane_p112_catalog.py experiments/control_plane_p112_registration.py experiments/control_plane_p112_runtime.py experiments/control_plane_p112_dev.py experiments/control_plane_p112_replay.py scripts/control_plane_p112_kaggle.py tests/test_control_plane_p112.py tests/test_control_plane_p112_first.py tests/test_control_plane_p112_runtime.py tests/test_control_plane_p112_replay.py tests/test_control_plane_p112_kaggle.py
      - name: P1.12 synthetic contracts
        run: python -m pytest -q tests/test_control_plane_p112.py tests/test_control_plane_p112_first.py tests/test_control_plane_p112_runtime.py tests/test_control_plane_p112_replay.py tests/test_control_plane_p112_kaggle.py
      - name: Frozen fresh P1.12 registration and construction controls
        run: python -m experiments.control_plane_p112_registration
      - name: P1.11 and P1.10 regression boundary
        run: python -m pytest -q tests/test_control_plane_p111.py tests/test_control_plane_p110.py
      - name: Machine contract matches implementation
        run: python -c 'import json; from pathlib import Path; from neumann1.control_plane_p112 import contract; assert json.loads(Path("docs/experiments/control_plane_p112_p0.contract.json").read_text()) == contract()'
