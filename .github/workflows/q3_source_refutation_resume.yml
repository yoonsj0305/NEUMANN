name: Q3 Resume Existing Learned Repair Weights, Frozen SOURCE + Original Scorer
on:
  push:
    branches:
      - research/q3-stateful-counterexample-policy-20261109
    paths:
      - ".github/workflows/q3_source_refutation_resume.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  resume_frozen_models:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SAME frozen model stack, real Docker, source-only contract
        run: |
          set -euo pipefail
          python -m pip install -q -e .
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install -q 'transformers==4.48.3' 'peft==0.14.0' 'accelerate==1.3.0' pytest sentencepiece
          docker pull python:3.11-alpine
          python -m pytest -q -x tests/test_q3_open_program_discovery.py tests/test_q3_source_refutation_learning.py
      - name: Download pretrained SOURCE-only inputs, equal-step control, PREVIOUS successfully learned repair weights
        run: |
          set -euo pipefail
          mkdir -p /tmp/q3-first /tmp/q3-context /tmp/q3-repair
          gh run download 42593621076 \
            --name Q3-REAL-WEIGHT-LEARNING-ORIGINAL-SOURCE-BLIND \
            --dir /tmp/q3-first
          gh run download 42602782399 \
            --name Q3-TWO-ORIGIN-FROZEN-SOURCE-ADAPTER \
            --dir /tmp/q3-context
          gh run download 42607278598 \
            --name Q3-SOURCE-COUNTEREXAMPLE-MODEL-REPAIR-PILOT \
            --dir /tmp/q3-repair
          cmp /tmp/q3-first/SOURCE_TEACHERS.jsonl /tmp/q3-context/SOURCE_TEACHERS.jsonl
          cmp /tmp/q3-first/MODEL_REVISION.txt /tmp/q3-context/MODEL_REVISION.txt
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          teacher=Path("/tmp/q3-first/SOURCE_TEACHERS.jsonl").read_bytes()
          a=json.loads(Path("/tmp/q3-repair/adapter/neumann_source_training_manifest.json").read_text())
          b=json.loads(Path("/tmp/q3-context/adapter/neumann_source_training_manifest.json").read_text())
          assert a["steps"]==b["steps"]==10
          assert a["source_sha256"]==b["source_sha256"]==hashlib.sha256(teacher).hexdigest()
          assert a["model_revision"]==b["model_revision"]==Path("/tmp/q3-first/MODEL_REVISION.txt").read_text().strip()
          assert a["contextual_method_training"] and b["contextual_method_training"]
          assert a["source_counterexample_repair_training"] is True
          assert b.get("source_counterexample_repair_training",False) is False
          assert a["source_falsified_repair_episodes"]>=2
          assert Path("/tmp/q3-repair/adapter/adapter_model.safetensors").is_file()
          assert Path("/tmp/q3-context/adapter/adapter_model.safetensors").is_file()
          print("Q3_RESUME_MODEL_WEIGHTS_REUSED_NO_RETRAINING",
                "repaired_source_episodes",a["source_falsified_repair_episodes"],
                "equal_gradient_steps",a["steps"],flush=True)
          PY
      - name: Generate A/B/C real original SOURCE programs, execute original test INPUTS only
        run: |
          set -euo pipefail
          mkdir -p /tmp/q3-result
          REV="$(cat /tmp/q3-first/MODEL_REVISION.txt)"
          python research/q3/q3_source_refutation_pilot.py \
            --blind /tmp/q3-first/BLIND.json \
            --teachers /tmp/q3-first/SOURCE_TEACHERS.jsonl \
            --adapter /tmp/q3-repair/adapter \
            --context-adapter /tmp/q3-context/adapter \
            --revision "$REV" \
            --out /tmp/q3-result/PREDICTIONS.json
          sha256sum /tmp/q3-result/PREDICTIONS.json \
            > /tmp/q3-result/PREDICTIONS.sha256
      - name: Only AFTER frozen predictions fetch independent original author's withheld outputs and score
        run: |
          set -euo pipefail
          mkdir -p /tmp/q3-original
          curl -fL --retry 3 --silent --show-error \
            https://huggingface.co/datasets/anjiangwei/CodeARC-Invocations/resolve/119512573bf96148cbb95e99cf7cdd21c06153e4/invocations.jsonl \
            -o /tmp/q3-original/invocations.jsonl
          EXPECTED="$(cut -d ' ' -f1 /tmp/q3-first/DATASET_SHA256.txt)"
          ACTUAL="$(sha256sum /tmp/q3-original/invocations.jsonl | cut -d ' ' -f1)"
          test "$ACTUAL" = "$EXPECTED"
          FROZEN="$(cut -d ' ' -f1 /tmp/q3-result/PREDICTIONS.sha256)"
          python research/q3/q3_postfirst_repair_original_score.py \
            --original /tmp/q3-original/invocations.jsonl \
            --predictions /tmp/q3-result/PREDICTIONS.json \
            --expected-sha "$FROZEN" \
            --output /tmp/q3-result/ORIGINAL_POSTFIRST_SCORE.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Q3-STATEFUL-SOURCE-REPAIR-ORIGINAL-CAUSAL-RECEIPTS
          path: /tmp/q3-result/
          if-no-files-found: warn
          retention-days: 90
