name: CORE34 mathematical replay

on:
  pull_request:
    paths:
      - 'research/evidence/core34-20261016/**'
      - '.github/workflows/core34-mathematical-replay.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact proof dependencies
        run: python -m pip install sympy==1.14.0 pytest
      - name: Run tests and actual proof
        working-directory: research/evidence/core34-20261016
        run: |
          python -m pytest -q
          python experiment.py --output receipt.json
      - name: Upload generated receipt
        uses: actions/upload-artifact@v4
        with:
          name: core34-mathematical-receipt
          path: research/evidence/core34-20261016/receipt.json
