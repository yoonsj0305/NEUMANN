name: v097 Q34 First Tournament

on:
  push:
    branches:
      - research/v097-q34-support-tournament
    paths:
      - .github/workflows/v097_q34_first.yml

permissions:
  contents: write

jobs:
  first-tournament:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "HASWELL"
      MKL_NUM_THREADS: "1"
      MKL_CBWR: "COMPATIBLE"
      BLIS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact retained LP runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.9.1 threadpoolctl==3.7.0 highspy==1.15.1
          pip install -e . --no-deps
          pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: First Q34 support tournament only
        run: |
          mkdir -p docs/experiments/results
          test ! -e docs/experiments/results/v097_first_tournament.json.gz
          test ! -e docs/experiments/results/v097_first_tournament.manifest.json
          python experiments/lp_q34_tournament_v097.py \
            --output-gzip docs/experiments/results/v097_first_tournament.json.gz \
            --manifest docs/experiments/results/v097_first_tournament.manifest.json \
            --frozen-head "$GITHUB_SHA"
      - name: Retain immutable first result on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/experiments/results/v097_first_tournament.json.gz \
                  docs/experiments/results/v097_first_tournament.manifest.json
          git commit -m "v097 retain first Q34 support tournament"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload first-result evidence
        uses: actions/upload-artifact@v4
        with:
          name: v097-first-q34-tournament
          path: |
            docs/experiments/results/v097_first_tournament.json.gz
            docs/experiments/results/v097_first_tournament.manifest.json
