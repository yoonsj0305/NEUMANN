name: v101 Adaptive Support Contracts

on:
  push:
    branches:
      - research/v101-size-adaptive-support
    paths:
      - .github/workflows/v101_adaptive_contracts.yml
      - docs/experiments/v0.0.101-preregistration.md
      - experiments/lp_size_adaptive_v101.py
      - tests/test_lp_size_adaptive_v101.py

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contract dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Validate frozen v101 pre-screen contract only
        run: pytest -q tests/test_lp_size_adaptive_v101.py
