name: Q3 external SyGuS classical solution source-original dual certificate
on:
  push:
    branches:
      - research/q3-g1-independent-author-original-audit-20261020
    paths:
      - '.github/workflows/q3-g1-postfirst-classical-native-original.yml'
      - 'research/evidence/q3_g1_independent_author_origins_20261020/post_first_cvc5_synth_full_original_verifier.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postfirst_classical_original_proof:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: official_sygus_original
          sparse-checkout: |
            lib/Inv_Track/xujie_code2inv
            lib/Inv_Track/andrew_lustre
            lib/Inv_Track/from_2018
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check untouched upstream and syntax
        run: |
          test "$(git -C official_sygus_original rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          python -m py_compile research/evidence/q3_g1_independent_author_origins_20261020/post_first_cvc5_synth_full_original_verifier.py
      - name: Independent official cvc5 1.4.2 and original Z3 with version SHA
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          test "$(find /tmp/cvc5bin -type f -name cvc5 | wc -l)" -eq 1
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0 numpy==2.3.5 scipy==1.17.0 sympy==1.14.0
      - name: Independent reconstruct and certify solver-found invariants against unchanged originals
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_g1_independent_author_origins_20261020/post_first_cvc5_synth_full_original_verifier.py --root official_sygus_original --out /tmp/q3_external_solver_original_proof.json | tee /tmp/q3_external_solver_original_proof.log
          sha256sum /tmp/q3_external_solver_original_proof.json
      - name: Archive all source-bound proofs and unsupported outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-g1-external-classical-source-native-proof
          path: |
            /tmp/q3_external_solver_original_proof.json
            /tmp/q3_external_solver_original_proof.log
          if-no-files-found: warn
      - name: No retroactive learned G1 success
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3_external_solver_original_proof.json'))
          assert x['first_valid_blind_source_count']==2
          assert x['third_SHA_corrected_POSTHOC_not_blind']
          assert x['all_three_original_sources_sha_authenticated']
          assert x['learned_frozen42_first_external_dual_certified']==0
          assert x['global_Q3']=='OPEN' and x['global_Q1_Q7']=='OPEN'
          print('EXTERNAL_AUTHOR_CLASSICAL_NATIVE_3VC',x['original_dual_certified_cvc5_synthesized_count'],'/3')
          print('G1_UNIQUE_LEARNED',x['G1_unique_learned_new_operator'])
          PY
