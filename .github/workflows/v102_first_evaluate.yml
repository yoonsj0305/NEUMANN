name: v102 First Fresh EXPAND4 Q34 Evaluation

on:
  push:
    branches:
      - research/v102-expand4-fresh-holdout
    paths:
      - .github/workflows/v102_first_evaluate.yml

permissions:
  contents: write

jobs:
  first-evaluation:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "HASWELL"
      MKL_NUM_THREADS: "1"
      MKL_CBWR: "COMPATIBLE"
      BLIS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact frozen v102 evaluation runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.9.1 threadpoolctl==3.7.0 highspy==1.15.1
          pip install -e . --no-deps
          pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Verify registered source archive exists
        run: |
          test -e docs/experiments/results/v102_fresh_sources.json.gz
          test -e docs/experiments/results/v102_fresh_sources.manifest.json
          test -e docs/experiments/results/v101_first_expansion.json.gz
          test -e docs/experiments/results/v101_first_expansion.manifest.json
      - name: First fresh EXPAND4 Q34 evaluation only
        run: |
          test ! -e docs/experiments/results/v102_first_evaluation.json.gz
          test ! -e docs/experiments/results/v102_first_evaluation.manifest.json
          python -m experiments.lp_expand4_holdout_v102 \
            --output-gzip docs/experiments/results/v102_first_evaluation.json.gz \
            --manifest docs/experiments/results/v102_first_evaluation.manifest.json \
            --frozen-head "$GITHUB_SHA"
      - name: Retain immutable first evaluation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/experiments/results/v102_first_evaluation.json.gz \
                  docs/experiments/results/v102_first_evaluation.manifest.json
          git commit -m "v102 retain first fresh EXPAND4 Q34 evaluation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload first evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: v102-first-fresh-expand4-q34
          path: |
            docs/experiments/results/v102_first_evaluation.json.gz
            docs/experiments/results/v102_first_evaluation.manifest.json
