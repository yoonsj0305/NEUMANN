name: FGSR hard-original symmetry parser repair (single paired run)

on:
  pull_request:
    paths:
      - '.github/workflows/fgsr-symmetry-parser-repair-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FGSR_RESULT: research/evidence/fgsr-q3-single-independent-family/symmetry_parser_repaired_receipt.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Z3
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
          python -m py_compile research/evidence/fgsr-q3-single-independent-family/permutation_quotient_once.py
      - name: Execute one exact unchanged-original and verified quotient CPU pair
        run: |
          python research/evidence/fgsr-q3-single-independent-family/permutation_quotient_once.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research/evidence/fgsr-q3-single-independent-family/symmetry_parser_repaired_receipt.json").read_text())
          print("SCIENTIFIC_RESULT",r["verdict"])
          print("DETECTED_SYMMETRIES",r.get("detected_swap_generators"))
          print("ORIGINAL",r.get("paired_original"))
          print("QUOTIENT",r.get("paired_quotient"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgsr-hard-original-symmetry-parser-repair-receipt
          path: research/evidence/fgsr-q3-single-independent-family/symmetry_parser_repaired_receipt.json
          if-no-files-found: warn
          retention-days: 45
