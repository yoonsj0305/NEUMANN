name: NEUMANN Q6 original Nguyen8 SHA-locked cross-author frozen model exact audit
on:
  pull_request:
    paths:
      - '.github/workflows/q6_nguyen_original_eight_aftergrade_audit.yml'
      - 'research/q3/nguyen8_original_frozen_model_aftergrade_audit.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify_all_frozen_Nguyen_author_original_and_no_gain_over_classical:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 sympy==1.13.3
      - uses: actions/download-artifact@v4
        with:
          run-id: 39939206590
          name: neumann-q6-first-real-nguyen8-author-numeric-source-only
          github-token: ${{ github.token }}
          path: /tmp/q6audit/src
      - uses: actions/download-artifact@v4
        with:
          run-id: 39939206590
          name: neumann-q6-first-real-nguyen8-original-gold-private-to-grader
          github-token: ${{ github.token }}
          path: /tmp/q6audit/gold
      - uses: actions/download-artifact@v4
        with:
          run-id: 39939206590
          name: neumann-q6-first-real-nguyen8-frozen-neural-source-proposals-before-author-grader
          github-token: ${{ github.token }}
          path: /tmp/q6audit/pred
      - uses: actions/download-artifact@v4
        with:
          run-id: 39939206590
          name: neumann-q6-first-real-nguyen8-full-analytic-author-exact-independent-grade
          github-token: ${{ github.token }}
          path: /tmp/q6audit/grade
      - name: Assert ORIGINAL four receipts SHA from first Nguyen full original grade before reading which published formulas solved
        run: |
          set -euo pipefail
          mkdir -p /tmp/q6audit/out
          OPENBLAS_NUM_THREADS=1 PYTHONPATH=research/g0 \
            python research/q3/nguyen8_original_frozen_model_aftergrade_audit.py \
            --source /tmp/q6audit/src/NON_ERBENCH_NGUYEN8_NUMERIC_ONLY_48PTS.json \
            --truth /tmp/q6audit/gold/PUBLISHED_NGUYEN8_TRUE_AUTHOR_EQUATIONS_PRIVATE.json \
            --pred /tmp/q6audit/pred/FIRST_FROZEN_NEURAL_VS_CLASSICAL_NEW_NGUYEN8_SOURCE_PREDICTIONS.json \
            --grade /tmp/q6audit/grade/INDEPENDENT_NGUYEN8_FULL_AUTHOR_TRUTH_SCORE_FROZEN_NEURAL_AND_CLASSICAL.json \
            --out /tmp/q6audit/out/FIRST_NGUYEN8_FROZEN_ERBENCH_MLP_STRICT_EXTERNAL_AUTHOR_GRADE.json \
            | tee /tmp/q6audit/out/STRICT_PRIOR_MODEL_EXTERNAL_AUTHOR_SCORE_LOG.txt
          sha256sum /tmp/q6audit/out/FIRST_NGUYEN8_FROZEN_ERBENCH_MLP_STRICT_EXTERNAL_AUTHOR_GRADE.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-q6-first-nguyen8-strict-authored-original-frozen-model-causal-audit
          path: /tmp/q6audit/out/
          if-no-files-found: error
