name: NEUMANN Core Autonomous Solve-Discover-Learn Loop
on:
  push:
    branches:
      - feature/core-autonomous-synthesis-learning-loop-20261108
    paths:
      - neumann1/structural_meta_invention.py
      - neumann1/engine.py
      - neumann1/registry_engine.py
      - tests/test_autonomous_synthesis_core.py
      - .github/workflows/q3_core_autonomous_synthesis.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real_core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only dependencies used by production NEUMANN core
        run: |
          python -m pip install -q --disable-pip-version-check numpy scipy scikit-learn pytest
          python -m compileall -q neumann1
      - name: Execute autonomous runtime and old engine compatibility
        run: python -m pytest -q tests/test_autonomous_synthesis_core.py tests/test_structural_meta_invention.py tests/test_engine.py
