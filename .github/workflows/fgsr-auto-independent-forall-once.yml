name: FGSR independent original forall-instantiation proof (corrected one-shot)
on:
  pull_request:
    paths:
      - '.github/workflows/fgsr-auto-independent-forall-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-structure-independent-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FGSR_RESULT: research/evidence/fgsr-q3-automatic-scaffold-20261017/final_independent_forall_receipt.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin exact solver
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
          python -m py_compile research/evidence/fgsr-q3-automatic-scaffold-20261017/autonomous_scaffold_once.py
      - name: Model-generated coefficients + fully automatic five-relational constraints, independent original replay
        run: |
          python research/evidence/fgsr-q3-automatic-scaffold-20261017/autonomous_scaffold_once.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/evidence/fgsr-q3-automatic-scaffold-20261017/final_independent_forall_receipt.json').read_text())
          print("SCIENTIFIC_VERDICT",r["status"])
          print("PROVED_ALL_ORIGINAL",r.get("SECOND_INDEPENDENT_ORIGINAL_REPLAY",{}).get("verified"))
          print("LEARNED_9",r.get("LEARNED",{}).get("original_unsat_count"))
          print("NO_LEARNED_9",r.get("NONE",{}).get("original_unsat_count"))
          print("NEURAL_NECESSITY",False)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgsr-original-auto-five-invariant-certified-independent
          path: research/evidence/fgsr-q3-automatic-scaffold-20261017/final_independent_forall_receipt.json
          if-no-files-found: warn
          retention-days: 45
