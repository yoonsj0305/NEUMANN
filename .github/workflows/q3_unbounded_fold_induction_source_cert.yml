name: Q3 Source Proven Generic Integer Fold Induction Certificate

on:
  push:
    branches:
      - research/q3-bv-boolean-invariants-to-unbounded-integer-20261108
    paths:
      - research/q3/unbounded_integer_fold_inductive_proof_certificate.py
      - .github/workflows/q3_unbounded_fold_induction_source_cert.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  all_n_theorem:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pin independent unbounded SMT prover
        run: python -m pip install -q --disable-pip-version-check z3-solver==4.13.3.0
      - name: Download frozen prior source-only theorem seed
        uses: actions/download-artifact@v4
        with:
          name: q3-cross-theory-BV-invariant-to-unbounded-int-FROZEN-source
          run-id: 42436072641
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: frozen
      - name: Independently prove parametric recursive constructor across any N
        run: |
          python -m py_compile research/q3/unbounded_integer_fold_inductive_proof_certificate.py
          git hash-object research/q3/unbounded_integer_fold_inductive_proof_certificate.py
          python research/q3/unbounded_integer_fold_inductive_proof_certificate.py
          python - <<'PY'
          import json
          p=json.load(open('Q3_UNBOUNDED_ARITY_ALGEBRAIC_INDUCTION_CERTIFICATE.json'))
          lines={x['name']:x for x in p['proven_law_certificates']}
          assert all(x['unsat_means_valid'] for k,x in lines.items() if k!='incorrect_zero_identity_is_not_universal')
          assert lines['incorrect_zero_identity_is_not_universal']['status']=='sat'
          assert p['proof_domain']=='UNBOUNDED_INTEGERS_AND_ALL_FINITE_ARITIES_N_GE_1'
          print('SOURCE_INDUCED_UNBOUNDED_ARITY_THEOREM_AND_NEGATIVE_CONTROL_PASS')
          PY
      - name: Archive source-proven induction certificate and refuted identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-unbounded-integer-all-arity-inductive-source-proof
          path: Q3_UNBOUNDED_ARITY_ALGEBRAIC_INDUCTION_CERTIFICATE.json
          if-no-files-found: warn
