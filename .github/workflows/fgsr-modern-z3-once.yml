name: FGSR modern Z3 opened independent-classical audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-modern-z3:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FGSR_RESULT: research/evidence/fgsr-q3-single-independent-family/modern_z3_first_receipt.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent frozen modern Z3
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
          python -m py_compile research/evidence/fgsr-q3-single-independent-family/modern_z3_once.py
          python -c "import z3; print('Z3_VERSION',z3.get_version_string())"
      - name: One original unmodified modern Z3 with 20s timeout
        run: |
          python research/evidence/fgsr-q3-single-independent-family/modern_z3_once.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/evidence/fgsr-q3-single-independent-family/modern_z3_first_receipt.json').read_text())
          print('CLASSICAL_VERDICT',r['status'])
          print('MODEL_CALLS',r['model_calls'])
          print('Q_GATES',r['Q1_Q7'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgsr-opened-modern-z3-first-receipt
          path: research/evidence/fgsr-q3-single-independent-family/modern_z3_first_receipt.json
          if-no-files-found: warn
          retention-days: 45
