name: Q3 first independent SyGuS external corpus frozen model transfer
on:
  pull_request:
    paths:
      - '.github/workflows/q3-cross-corpus-original-first.yml'
      - 'research/evidence/q3_cross_corpus_frozen42_20261020/**'
      - 'docs/research/Q3_CROSS_CORPUS_FIRST_SOURCE_PREOPEN_FREEZE_20261020.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first_original_three_external_collections:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: cross_corpus_original
          sparse-checkout: |
            lib/Inv_Track/andrew_lustre
            lib/Inv_Track/xujie_code2inv
            comp/2017/Inv_Track
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact independent upstream revision and source audit syntax
        run: |
          test "$(git -C cross_corpus_original rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          python -m py_compile research/evidence/q3_cross_corpus_frozen42_20261020/first_three_external_originals.py
      - name: Frozen official cvc5 source verifier and original Z3
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          test "$(find /tmp/cvc5bin -type f -name cvc5 | wc -l)" -eq 1
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0 sympy==1.14.0 numpy==2.3.5 scipy==1.17.0
      - name: First frozen 42 weights unchanged on three truly external real originals
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_cross_corpus_frozen42_20261020/first_three_external_originals.py --root cross_corpus_original --out /tmp/q3_external_first.json | tee /tmp/q3_external_first.log
          sha256sum /tmp/q3_external_first.json
      - name: Preserve first outside-corpus artifact including zero proofs and unsupported
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-sygus-org-cross-corpus-frozen42-first
          path: |
            /tmp/q3_external_first.json
            /tmp/q3_external_first.log
          if-no-files-found: warn
      - name: Harden scientific admissibility never manufacture unique model advantage
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/q3_external_first.json'))
          assert r['all_three_rows_retained'] and len(r['sources'])==3
          assert r['original_remote_repo']=='SyGuS-Org/benchmarks'
          assert r['original_sha_frozen_upstream_rev']=='13c8deb68a873635879c9a69bc78caebd340f646'
          assert r['three_sources_pinned_before_source_body_read']
          assert r['trained_model_unchanged_original_weights']['frozen_trained_weights_sha256']=='563c6be70fade6db755425a5756b6fdd89503ada5727bf31f49ad195ec041a78'
          assert all(x.get('actual_git_blob_verified') for x in r['sources'])
          assert not r['separate_author_authorship_independently_verified']
          assert not r['model_training_data_contains_external_target_source']
          assert r['first_attempt_without_target_specific_adapter_tuning']
          assert r['global_Q3']==r['global_Q1_Q7']=='OPEN'
          print('TRUE_EXTERNAL_FIRST_LEARNED',r['first_frozen_cross_corpus_learned_original_passes'],'/3')
          print('EXACT_CLASSICAL',r['equal_input_exact_classical_original_passes'],'/3')
          PY
