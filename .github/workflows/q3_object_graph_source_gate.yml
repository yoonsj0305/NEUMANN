name: Q3 General Object Graph SOURCE Invention
on:
  push:
    branches:
      - research/q3-structural-graph-policy-20261110
    paths:
      - ".github/workflows/q3_object_graph_source_gate.yml"
      - "neumann1/q3_object_graph_invention.py"
      - "tests/test_q3_object_graph_invention.py"
      - "neumann1/q3_structural_invention.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one_core_real_docker:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify general object-relation structural invention with actual isolated Docker
        run: |
          set -euo pipefail
          python -m pip install -q -e . pytest
          docker pull python:3.11-alpine
          python -m pytest -q -x \
            tests/test_q3_object_graph_invention.py \
            tests/test_q3_structure_factorization.py \
            tests/test_q3_structural_invention.py
