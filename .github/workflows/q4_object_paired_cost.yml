name: Q4 Same-Original Inverse versus Forward Object Cost

on:
  pull_request:
    paths:
      - "neumann1/scene_graph_inventor.py"
      - "research/q3/q3_object_inverse_paired_cost.py"
      - ".github/workflows/q4_object_paired_cost.yml"
  workflow_dispatch:

jobs:
  matched-source-algorithm-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reproduce EXACT prior object enumerator from immutable commit
        run: |
          git fetch -q --depth 1 origin c193e291f37936a59c74f12be60479f62ad8a73f
          git show c193e291f37936a59c74f12be60479f62ad8a73f:neumann1/scene_graph_inventor.py > neumann1/_q3_forward_reference.py
          test -s neumann1/_q3_forward_reference.py
      - name: Fetch fixed independently-authored training source originals
        run: |
          mkdir -p /tmp/q4-object-source
          git -C /tmp/q4-object-source init -q
          git -C /tmp/q4-object-source remote add origin https://github.com/arcprize/ARC-AGI-2.git
          git -C /tmp/q4-object-source fetch -q --depth 1 origin f3283f727488ad98fe575ea6a5ac981e4a188e49
          git -C /tmp/q4-object-source checkout -q FETCH_HEAD
          test "$(git -C /tmp/q4-object-source rev-parse HEAD)" = f3283f727488ad98fe575ea6a5ac981e4a188e49
      - name: Matched same-run old/new source search with no original test labels
        run: |
          python -m pip install -e .
          for cohort in first second third; do
            python research/q3/q3_object_inverse_paired_cost.py \
              --upstream /tmp/q4-object-source \
              --cohort "$cohort" \
              --n 128 \
              --max-source-ms 350 \
              --output "q3_object_inverse_matched_${cohort}_cost.json"
          done
          python - <<'PY'
          import json
          for cohort in ('first','second','third'):
              d=json.load(open(f'q3_object_inverse_matched_{cohort}_cost.json'))
              s=d['summary']
              assert s['cohort']==cohort
              assert s['retained_source_cases']==128
              assert s['source_checked']+s['skipped']==128
              assert not s['external_target_gold_used']
              assert not s['global_q4_pass']
              print(cohort,s['paired_source_speedup'],s['old_forward_source_fits'],s['new_inverse_source_fits'])
          print('PAIRED SOURCE DSL OPTIMIZATION; NOT STRONGEST CLASSICAL/FULL Q4')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q4-matched-forward-inverse-128-source-cost
          path: q3_object_inverse_matched_*_cost.json
          if-no-files-found: error
