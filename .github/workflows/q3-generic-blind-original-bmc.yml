name: Q3 generic pre-neural original unsafe triage six sources
on:
  pull_request:
    paths:
      - '.github/workflows/q3-generic-blind-original-bmc.yml'
      - 'research/evidence/q3_generic_source_original_bmc_20261020/**'
      - 'docs/research/Q3_GENERIC_BOUNDED_BAD_PATH_6_REAL_ORIGINALS_FROZEN_20261020.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generic_authentic_original_BMC:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SaswatPadhi/LoopInvGen
          ref: 6ac90265b11431c9477dfbd33e3e3380234c0499
          path: upstream_original
          sparse-checkout: |
            benchmarks/NIA/other
            benchmarks/NIA/2018.CHI_InvGame
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original upstream revision and compile
        run: |
          test "$(git -C upstream_original rev-parse HEAD)" = 6ac90265b11431c9477dfbd33e3e3380234c0499
          python -m py_compile research/evidence/q3_generic_source_original_bmc_20261020/first_six_real_sources.py
      - name: Install pinned cvc5 1.4.2 and source-exact Z3
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          test "$(find /tmp/cvc5bin -type f -name cvc5 | wc -l)" -eq 1
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
      - name: "FIRST frozen three-uninspected + three controls: bounded source Pre/Trans/Post"
        run: |
          set -o pipefail
          PYTHONPATH=. python research/evidence/q3_generic_source_original_bmc_20261020/first_six_real_sources.py --root upstream_original --out /tmp/q3_generic_unsafe_bmc_first.json | tee /tmp/q3_generic_unsafe_bmc_first.log
          sha256sum /tmp/q3_generic_unsafe_bmc_first.json
      - name: Immutable preserve FIRST actual result including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-generic-six-original-unsafe-preflight-first
          path: |
            /tmp/q3_generic_unsafe_bmc_first.json
            /tmp/q3_generic_unsafe_bmc_first.log
          if-no-files-found: warn
      - name: Honest proof scope and model-training budget gate
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/q3_generic_unsafe_bmc_first.json'))
          assert r['all_six_rows_retained'] and len(r['sources'])==6
          assert r['all_six_exact_blob_hashes_and_semantic_parity']
          assert r['generic_detector_uses_no_manual_witness']
          assert r['three_new_sources_metadata_frozen_before_original_contents']
          assert r['BMC_depths_fixed_before_source_inspection']==[0,1,2,3]
          assert r['previously_known_unsafe_positive_control_detected']
          assert r['false_unsafe_positive_on_known_safe_controls']==0
          assert r['original_full_unbounded_SAFE_from_BMC'] is False
          assert r['learned_neural_first_new_structure'] is False
          assert r['global_Q3']==r['global_Q1_Q7']=='OPEN'
          print('AUTOMATED_BMC_SCOPE',r['scoped_generic_automated_safety_triage_pass'])
          print('NEW_ORIGINAL_UNSAFE',r['new_blind_sources_proven_unsafe'])
          PY
