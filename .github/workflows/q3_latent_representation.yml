name: Q3 Autonomous Latent Representation and Q6 Semantic Transfer

on:
  pull_request:
    paths:
      - "neumann1/causal_representation_inventor.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "tests/test_causal_representation_inventor.py"
      - ".github/workflows/q3_latent_representation.yml"
  workflow_dispatch:

jobs:
  active-representation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Autonomously invent symbolic interaction features, test every finite input
        run: |
          python -m pip install -e . pytest
          python -m pytest -q -s tests/test_causal_representation_inventor.py
