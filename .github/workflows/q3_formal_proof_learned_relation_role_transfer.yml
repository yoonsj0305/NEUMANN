name: Q3 independently prove actual learned relation transfer on ALL lengths
on:
  pull_request:
    paths:
      - 'research/q3/formal_proof_of_prior_coordinate_role_transfer.py'
      - '.github/workflows/q3_formal_proof_learned_relation_role_transfer.yml'
permissions:
  contents: read
  actions: read

jobs:
  independently-check-exact-generated-ast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm actual prior source and role-compiler byte unchanged
        run: |
          set -euo pipefail
          test "$(git hash-object research/q3/discover_index_relation_constructor.py)" = ddfe23f374e84914b239476b4fbdfdfa96807579
          test "$(git hash-object research/q3/learn_argument_roles_for_prior_relation.py)" = 32fc604ca88106d883e7fac78e88f113d0c4cf08
          python3 -m py_compile research/q3/formal_proof_of_prior_coordinate_role_transfer.py
          if ! command -v z3 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y z3
          fi
          z3 --version
      - name: Retrieve IMMUTABLE 29-family learned-program FIRST from original source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/q3-source-original-memory-crossargs
          gh run download 42365959895 \
            --repo yoonsj0305/NEUMANN \
            -n NEUMANN-Q3-PREVIOUSLY-INVENTED-INDEX-NEW-INPUT-ROLES-GPCS-POSTFIRST \
            -D /tmp/q3-source-original-memory-crossargs
          test -s /tmp/q3-source-original-memory-crossargs/RESULTS/POSTFIRST.json
          sha256sum /tmp/q3-source-original-memory-crossargs/RESULTS/POSTFIRST.json
      - name: Prove exact generated source AST for ALL lengths with Z3 and 21k+ independent examples
        run: |
          set -euo pipefail
          /usr/bin/time -f 'Q3_LEARNED_ROLE_INDEPENDENT_THEOREM_S=%e MAX_RSS_KB=%M' \
            python3 -m research.q3.formal_proof_of_prior_coordinate_role_transfer \
              --source /tmp/q3-source-original-memory-crossargs/RESULTS/POSTFIRST.json \
              --out Q3-LEARNED-RELATION-ALL-LENGTHS-PROOF
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('Q3-LEARNED-RELATION-ALL-LENGTHS-PROOF/POSTFIRST_FORMAL_THEOREM.json').read_text())
          assert d['actual_GP_postfirst_role_learner_run']==42365959895
          assert d['prior_original_FIRST']==42365072610
          assert d['warm_original_32_of_32_exact']
          assert not d['cold_same_candidate_budget_original_exact']
          assert d['cold_larger_candidate_budget_original_exact']
          assert d['independent_exhaustive_and_random_tests']>=20000
          assert d['exhaustive_runtime_semantic_disagreements']==0
          assert d['proved_all_length_crossargument_reverse_equivalence']
          assert all(x['pass'] for x in d['theorem'].values())
          assert d['this_is_old_external_corpus_POSTFIRST']
          assert d['Q3_GLOBAL']==d['Q4_GLOBAL']==d['Q6_GLOBAL']=='OPEN'
          print('INDEPENDENT_Z3_PROOF_OF_SOURCE_AUTOGENERATED_ROLE_TRANSFER_PASS_GLOBAL_Q3_OPEN')
          PY
      - name: Archive Z3 theorem scripts, generated AST and exhaustive semantics receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEUMANN-Q3-PRIOR-RELATION-NEW-INPUT-ROLES-FORMAL-ALL-LENGTHS
          path: Q3-LEARNED-RELATION-ALL-LENGTHS-PROOF/
          if-no-files-found: warn
          retention-days: 90
