name: Q346 Cross-Semantics Composition Invention

on:
  pull_request:
    paths:
      - "neumann1/composition_meta_inventor.py"
      - "neumann1/composed_grid_inventor.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "tests/test_composition_meta_transfer.py"
      - ".github/workflows/q346_composition_transfer.yml"
  workflow_dispatch:

jobs:
  cross-semantic-source-heldout:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run same inventor on exact numeric and structural grids
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_composition_meta_transfer.py tests/test_composed_grid_inventor.py tests/test_q346_joint_original_gate.py
