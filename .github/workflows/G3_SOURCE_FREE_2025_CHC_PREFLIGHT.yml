name: NEUMANN G3 source-free two native HORN solvers preflight, before 24 original first
# Original source-free preflight 42174182850 failed on ONE 38/40 char metadata typo, ZERO original 24 bodies accessed. Original 24 cohort freeze unchanged.
on:
  push:
    branches:
      - research/q3-g3-2025-chc-native-first-20261106
    paths:
      - .github/workflows/G3_SOURCE_FREE_2025_CHC_PREFLIGHT.yml
permissions:
  contents: read
jobs:
  sourcefree-native-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install original native SMT/CHC engines, pin reported versions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/g3/chccomp2025_native_first.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq z3 cvc5
          z3 --version
          cvc5 --version | head -1
      - name: Verify source selection is metadata-only and byte-locked before opening 24 original files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('docs/experiments/G3_2025_CHCCOMP_24_FIRST_METADATA_PREREG_2026_11_06.json').read_text())
          assert p['schema']=='neumann.q3.g3.chccomp2025.first-24-metadata-source-blind.v1'
          assert p['guardrails']['original_24_source_unopened_before_freeze'] is True
          assert len(p['cohorts'])==3
          assert all(len(x['targets'])==8 for x in p['cohorts'])
          t=[(x['folder'],y['file'],y['git_blob']) for x in p['cohorts'] for y in x['targets']]
          assert len(t)==len(set(t))==24
          err=json.loads(Path('docs/experiments/G3_SOURCEFREE_PREOPEN_ONE_GIT_BLOB_ERRATUM_2026_11_06.json').read_text())
          fix=err['exact_single_metadata_transcription_error']
          bad=[x for x in t if len(x[2])!=40]
          assert bad==[(fix['folder'],fix['file'],fix['original_38hex'])]
          assert fix['publisher_verified_40hex']=='be2d26d30df39059ea94ea9a9c33cddf51aaa19d'
          assert err['first_scorer_original_cases_executed']==0
          print('G3_24_DIFFERENT_MATH_SOURCES_PRECOMMITTED_ONE_PREOPEN_SHA_ERRATUM_FROZEN')
          PY
      - name: SOURCE-FREE synthetic HORN SAT/UNSAT controls both engines
        shell: bash
        run: |
          set -euo pipefail
          python3 -m research.g3.chccomp2025_native_first --synthetic > G3-HORN-SOURCEFREE-CONTROLS.json
          python3 - <<'PY'
          import json
          x=json.load(open('G3-HORN-SOURCEFREE-CONTROLS.json'))
          print(json.dumps(x,sort_keys=True))
          assert x['sourcefree_Z3_semantic_controls_pass'] is True
          assert x['no_original_task_bodies_read'] is True
          print('G3_Z3_SOURCEFREE_SEMANTICS_AND_CHC_SYNTAX_PASS')
          PY
      - name: Read ONLY disjoint NONSELECTED 2025 COMP pilot to prove deployed CHC source parse compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 -m research.g3.chccomp2025_native_first --pilot > G3-CHC-NONSELECTED-PILOT.json
          python3 - <<'PY'
          import json
          x=json.load(open('G3-CHC-NONSELECTED-PILOT.json'))
          print(json.dumps(x,sort_keys=True))
          assert x['file']=='const_mod_1_000.smt2'
          assert x['git_blob']=='3f814a05b5e518c3a0bf18d3e67c22a50bd6a185'
          assert x['status'] not in ('UNSUPPORTED_ORIGINAL_SOURCE_FORMAT','SOURCE_ACCESS_OR_INFRA_FAIL_CLOSED')
          assert any(z['engine']=='Z3' and z['status'] in ('SAT_CLAIM_UNVERIFIED','UNSAT_CLAIM_UNVERIFIED') for z in x['native'])
          print('G3_CHC_COMP_2025_NONSELECTED_SOURCE_FORMAT_AND_Z3_NATIVE_PILOT_PASS')
          PY
      - name: Preserve pilot evidence, never treat as 24 original first
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEUMANN-G3-CHC-2025-SOURCEFREE-PILOT
          path: |
            G3-HORN-SOURCEFREE-CONTROLS.json
            G3-CHC-NONSELECTED-PILOT.json
          if-no-files-found: warn
          retention-days: 90
