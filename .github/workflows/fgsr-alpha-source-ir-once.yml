name: FGSR semantic IR alpha-renaming invariance on opened external source
on:
  pull_request:
    paths:
      - '.github/workflows/fgsr-alpha-source-ir-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  name-invariant-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FGSR_RESULT: research/evidence/fgsr-q3-transfer-20261017/first_alpha_metamorphic_receipt.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin verifier and check source syntax
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
          python -m py_compile research/evidence/fgsr-q3-transfer-20261017/predicate_alpha_normalizer.py
          python -m py_compile research/evidence/fgsr-q3-transfer-20261017/alpha_metamorphic_regression.py
      - name: Prove actual original and alpha-renamed program without changing learned weights or grammar
        run: |
          python research/evidence/fgsr-q3-transfer-20261017/alpha_metamorphic_regression.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research/evidence/fgsr-q3-transfer-20261017/first_alpha_metamorphic_receipt.json").read_text())
          print("SCIENTIFIC_STATUS",r["status"])
          print("ORIGINAL",r.get("original",{}).get("original_9_of_9"))
          print("RENAMED",r.get("alpha_renamed",{}).get("original_9_of_9"))
          print("OTHER_FAMILY_TRANSFER_STILL",r["previous_2_source_transfer_count"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgsr-semantic-ir-alpha-metamorphic-original-evidence
          path: research/evidence/fgsr-q3-transfer-20261017/first_alpha_metamorphic_receipt.json
          if-no-files-found: warn
          retention-days: 45
