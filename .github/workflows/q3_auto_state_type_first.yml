name: Q3 automatic algebraic type invention and reusable language FIRST
on:
  pull_request:
    paths:
      - 'research/q3/autonomous_state_type_invention.py'
      - 'research/q3/auto_state_type_first.py'
      - 'tests/test_q3_autonomous_state_type_invention.py'
      - '.github/workflows/q3_auto_state_type_first.yml'
permissions:
  contents: read
jobs:
  q3-self-authored-state-types:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Generic computational type constructors and causal safety regression
        run: |
          set -euo pipefail
          python3 -m py_compile research/q3/autonomous_state_type_invention.py
          python3 -m py_compile research/q3/auto_state_type_first.py
          python3 -m unittest tests/test_q3_autonomous_state_type_invention.py -v
      - name: ORIGINAL FIRST of autogenerated state types and unfamiliar transition rules
        run: |
          set -euo pipefail
          /usr/bin/time -f 'Q3_NEW_TYPES_WALL_S=%e MAX_RSS_KB=%M' \
            python3 -m research.q3.auto_state_type_first \
              --out Q3-SELF-AUTHORED-STATE-TYPE-FIRST \
              --extra-unknown 48
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('Q3-SELF-AUTHORED-STATE-TYPE-FIRST')
          data=json.loads((root/'FIRST.json').read_text())
          assert data['summary']['prefix_observed']['tasks']==42
          assert data['summary']['whole_input_output']['tasks']==88
          assert data['summary']['prefix_observed']['heldout_total']==1008
          assert data['summary']['whole_input_output']['heldout_total']==2112
          assert data['no_per_family_code_in_type_inventor']
          assert data['human_supplied_generic_finite_state_model_class']
          assert data['model_state_cardinality_not_provided_to_learner']
          assert data['persistent_generated_language_schema']=='neumann.self-extending-state-type-language.v1'
          assert [a['mode'] for a in data['cross_task_language_history']]==[
            'invent','reuse','invent','reuse','invent','reuse']
          assert data['Q3_GLOBAL']==data['Q4']==data['Q6']=='OPEN'
          print('Q3_NEW_ALGEBRAIC_TYPES_ACTUAL_FIRST_ARCHIVED_GLOBAL_Q3_OPEN')
          PY
      - name: Retain all first outcomes and self-authored type definitions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEUMANN-Q3-AUTO-STATE-TYPE-FIRST
          path: Q3-SELF-AUTHORED-STATE-TYPE-FIRST/
          retention-days: 90
          if-no-files-found: warn
