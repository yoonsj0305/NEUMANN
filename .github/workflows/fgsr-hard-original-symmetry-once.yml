name: FGSR hard-original symmetry quotient (one paired CPU run)

on:
  pull_request:
    paths:
      - '.github/workflows/fgsr-hard-original-symmetry-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symmetry-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FGSR_RESULT: research/evidence/fgsr-q3-single-independent-family/permutation_quotient_first_receipt.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned modern native Z3
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
          python -m py_compile research/evidence/fgsr-q3-single-independent-family/permutation_quotient_once.py
      - name: Paired unmodified original versus automatically derived exact symmetry quotient
        run: |
          python research/evidence/fgsr-q3-single-independent-family/permutation_quotient_once.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/evidence/fgsr-q3-single-independent-family/permutation_quotient_first_receipt.json')
          r=json.loads(p.read_text())
          print("FGSR",r["verdict"])
          print("PAIRS",r.get("detected_swap_generators"))
          print("ORIGINAL",r.get("paired_original"))
          print("QUOTIENT",r.get("paired_quotient"))
          print("GLOBAL_Q",r["global_Q"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgsr-hard-original-symmetry-first-paired-run
          path: research/evidence/fgsr-q3-single-independent-family/permutation_quotient_first_receipt.json
          if-no-files-found: warn
          retention-days: 45
