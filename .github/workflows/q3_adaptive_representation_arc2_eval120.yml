name: NEUMANN Q0/Q3 adaptive representation ARC2 public evaluation120
on:
  pull_request:
    paths:
      - '.github/workflows/q3_adaptive_representation_arc2_eval120.yml'
      - 'research/evidence/q3_adaptive_representation_20261022/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prereg_source_then_mask_actual_eval120:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate fixed original prior solver and officially-pinned ARC2 data
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/evidence/q3_object_synthesis_transfer_20261022/frozen_original_typed_selector_v2.py)" = a46dc5480f0819895effc48df1e0600a23640bdf
          git clone -q --no-checkout https://github.com/arcprize/ARC-AGI-2.git /tmp/original-arc2
          git -C /tmp/original-arc2 checkout -q --detach f3283f727488ad98fe575ea6a5ac981e4a188e49
          test "$(git -C /tmp/original-arc2 rev-parse HEAD:data/evaluation)" = 8d04288aac3146b7c47d0b799c18bc9c0217d838
          mkdir -p /tmp/masked-only-evaluation
          python - <<'PY'
          import json,pathlib
          allfiles=sorted(pathlib.Path('/tmp/original-arc2/data/evaluation').glob('*.json'))
          assert len(allfiles)==120
          for f in allfiles:
              d=json.loads(f.read_text())
              masked={'train':d['train'],'test':[{'input':r['input']} for r in d['test']]}
              assert all('output' not in r for r in masked['test'])
              (pathlib.Path('/tmp/masked-only-evaluation')/f.name).write_text(json.dumps(masked,separators=(',',':'))+'\n')
          print('FROZEN_120_ALL_TEST_OUTPUTS_REMOVED')
          PY
          rm -rf /tmp/original-arc2
      - name: CPU source-only exact program composition with semantic dedup and bounded states
        run: |
          python -m pip install --quiet numpy==1.26.4 scipy==1.14.1
          mkdir -p /tmp/pregrade
          python research/evidence/q3_adaptive_representation_20261022/auto_typed_composer.py \
            --masked-dir /tmp/masked-only-evaluation --n 120 \
            --out /tmp/pregrade/ARC2_EVAL120_TWO_STAGE_ALL_PREDICTIONS.json \
            | tee /tmp/pregrade/ARC2_SOURCE_ONLY_COST_AND_DECISIONS.log
          python - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path('/tmp/pregrade/ARC2_EVAL120_TWO_STAGE_ALL_PREDICTIONS.json')
          d=json.loads(p.read_text());assert d['n']==120 and not d['test_labels_seen'] and len(d['rows'])==120
          print('FROZEN_SOURCE_ONLY_ARC2_120_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-adaptive-arc2evaluation120-exact-pregrade-all
          path: /tmp/pregrade/
          if-no-files-found: error
  independent_original_eval120_grade:
    needs: prereg_source_then_mask_actual_eval120
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: q3-adaptive-arc2evaluation120-exact-pregrade-all
          path: /tmp/pregrade/
      - name: Only now original public evaluation target labels available for independent grading
        run: |
          set -euo pipefail
          git clone -q --no-checkout https://github.com/arcprize/ARC-AGI-2.git /tmp/independent-arc2-source
          git -C /tmp/independent-arc2-source checkout -q --detach f3283f727488ad98fe575ea6a5ac981e4a188e49
          test "$(git -C /tmp/independent-arc2-source rev-parse HEAD:data/evaluation)" = 8d04288aac3146b7c47d0b799c18bc9c0217d838
          mkdir -p /tmp/grades
          python research/evidence/q3_adaptive_representation_20261022/independent_exact_grade.py \
            --sealed /tmp/pregrade/ARC2_EVAL120_TWO_STAGE_ALL_PREDICTIONS.json \
            --original /tmp/independent-arc2-source/data/evaluation \
            --corpus arc2eval120 \
            --out /tmp/grades/ARC2_EVAL120_SOURCE_INDEPENDENT_SCORES.json \
            | tee /tmp/grades/ALL120_EXACT_GRADE_LOG.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-adaptive-arc2evaluation120-independent-scores
          path: /tmp/grades/
          if-no-files-found: error
