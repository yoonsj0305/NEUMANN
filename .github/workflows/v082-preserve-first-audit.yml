name: Preserve v0.0.82 first audit

on:
  push:
    branches: [codex/v082-lp-basis-headroom]

permissions:
  contents: write
  actions: read

jobs:
  preserve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v082-lp-basis-headroom
          fetch-depth: 0
      - name: Preserve exact frozen artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11095901571"
          EXPECTED_SHA256: "2e3b3ca23a27c1d7f8176bf1b33c4c7edb4f077743cc7a2505e58a53fd701149"
        run: |
          set -euo pipefail
          target="docs/experiments/results/v082_first_audit.json"
          if [ -f "$target" ]; then
            echo "Frozen audit already preserved."
            exit 0
          fi
          mkdir -p "$(dirname "$target")" /tmp/v082
          curl -fL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/v082/audit.zip
          unzip -q /tmp/v082/audit.zip -d /tmp/v082/unpacked
          cp /tmp/v082/unpacked/v082_first_audit.json "$target"
          echo "$EXPECTED_SHA256  $target" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "v0.0.82 preserve frozen first audit artifact"
          git push origin HEAD:codex/v082-lp-basis-headroom
