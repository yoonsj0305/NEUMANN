name: Q3 Single Learned Discovery Core SOURCE Integrity
on:
  pull_request:
    paths:
      - "neumann1/q3_single_discovery_core.py"
      - "neumann1/q3_prompt_contract.py"
      - "neumann1/open_program_inventor.py"
      - "neumann1/q3_trainable_code_policy.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "tests/test_q3_single_discovery_core.py"
      - "neumann1/q3_structural_invention.py"
      - "tests/test_q3_structural_invention.py"
      - ".github/workflows/q3_single_discovery_core.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task-agnostic-source-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source verification requires real network-isolated Docker
        run: docker pull python:3.11-alpine
      - name: Install core and tests
        run: python -m pip install -e . pytest
      - name: Run one core across arithmetic and strings, verify memory and sandbox
        run: |
          python -m pytest -q -x tests/test_q3_single_discovery_core.py tests/test_q3_neural_gradient_contract.py tests/test_q3_open_program_discovery.py tests/test_q3_structural_invention.py
