name: Q3 Single Learned Discovery Core SOURCE Integrity
on:
  pull_request:
    paths:
      - "neumann1/q3_single_discovery_core.py"
      - "neumann1/q3_prompt_contract.py"
      - "neumann1/open_program_inventor.py"
      - "neumann1/q3_trainable_code_policy.py"
      - "neumann1/engine.py"
      - "neumann1/representation.py"
      - "neumann1/causal_experience.py"
      - "neumann1/q3_latent_world_policy.py"
      - "tests/test_causal_experience_core.py"
      - "tests/test_q3q6_original_transfer_gate.py"
      - "tests/test_q3_predictive_state_contract.py"
      - "neumann1/q3_predictive_state.py"
      - "research/q3/q3q6_predictive_state_original.py"
      - "research/q3/q3q6_two_author_freeze.py"
      - "research/q3/q3q6_original_transfer_run.py"
      - "neumann1/registry_engine.py"
      - "tests/test_q3_single_discovery_core.py tests/test_q3q6_original_transfer_gate.py tests/test_q3_predictive_state_contract.py"
      - ".github/workflows/q3_single_discovery_core.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task-agnostic-source-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source verification requires real network-isolated Docker
        run: docker pull python:3.11-alpine
      - name: Install core and tests plus lightweight real gradient runtime
        run: |
          python -m pip install -e . pytest
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Run one core across arithmetic and strings, verify memory and sandbox
        run: |
          python -m pytest -q -x tests/test_causal_experience_core.py tests/test_q3_neural_gradient_contract.py tests/test_q3_open_program_discovery.py tests/test_q3_single_discovery_core.py
