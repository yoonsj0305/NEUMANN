name: Q3 Active Endpoint Process Counterexample Invention
on:
  pull_request:
    paths:
      - "neumann1/active_terminal_process_inventor.py"
      - "neumann1/terminal_only_process_inventor.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "tests/test_active_terminal_process_inventor.py"
      - ".github/workflows/q3_active_endpoint_repair.yml"
  workflow_dispatch:

jobs:
  active-process-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - name: Generate new SOURCE experiments, falsify and reconstruct processes
        run: python -m pytest -q -s tests/test_active_terminal_process_inventor.py tests/test_terminal_only_process_inventor.py
