name: Q3 Active Invention - First Evidence

on:
  pull_request:
    paths:
      - "neumann1/*inventor.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "tests/test_active_*inventor.py"
      - "research/q3/q3_active_*first.py"
      - ".github/workflows/q3_active_invention.yml"
  workflow_dispatch:

jobs:
  conditional-source-discovery:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and run direct active invention contracts
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_monoid_operator_inventor.py tests/test_active_law_inventor.py tests/test_active_numeric_inventor.py
      - name: Regenerate both source-only FIRST result snapshots
        run: |
          PYTHONPATH=. python research/q3/q3_active_law_first.py > /tmp/q3_active_law_result.txt
          PYTHONPATH=. python research/q3/q3_active_numeric_first.py > /tmp/q3_active_numeric_result.txt
          python - <<'PY'
          import json
          a=json.load(open("research/q3/q3_active_law_first_result.json"))
          n=json.load(open("research/q3/q3_active_numeric_first_result.json"))
          assert a["totals"]=={"accepted":150,"source_queries":53582,"unqueried":114718,
                              "correct":114718,"full_table_source_queries":168300}
          assert a["counterexample"]["wrong_unqueried_prediction"]
          assert n["totals"]=={"constructed":180,"source_queries":4590,
                              "heldout":36000,"correct":36000}
          print("Q3 FIRST REPLAY VERIFIED: 150+180 syntheses, both negative and positive evidence")
          PY
