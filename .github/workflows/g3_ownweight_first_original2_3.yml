name: G3 own-weight quantified AST FIRST registered originals 2+3
# Historical first already archived; disable duplicate evaluation.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
jobs:
  first-original-only:
    if: false # archived immutable first result

    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install required original model numerical and independent Z3 engine
        run: |
          python -m pip install numpy==2.2.6
          sudo apt-get update -qq
          sudo apt-get install -qq -y z3
          z3 --version
      - name: Source-free negative controls and freeze SHA prior to ANY original target body
        run: python -m unittest discover -s tests -p 'test_g3_ownweight_first_safety.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: NEUMANN-G3-OWNWEIGHT-QUANTIFIED-TRAIN-FIRST
          run-id: 42198111692
          github-token: ${{ github.token }}
          path: frozen-first
      - name: Verify actual FIRST trained checkpoint immutable fingerprint, no target fetched
        shell: bash
        run: |
          set -euo pipefail
          echo '982ef08b88758537dfe56f3ad8451de26fbd438df295802c491c25d231de9bdc  frozen-first/G3-OWNWEIGHT-QUANTIFIED-AST-FROZEN.json' | sha256sum -c -
          python - <<'PY'
          import json, pathlib
          freeze=json.loads(pathlib.Path('docs/experiments/G3_OWNWEIGHT_QUANTIFIER_STUDENT_FROZEN_BEFORE_INIT2_INIT3_2026_11_06.json').read_text())
          report=json.loads(pathlib.Path('frozen-first/G3-OWNWEIGHT-QUANTIFIED-TRAIN-FIRST.json').read_text())
          assert report['checkpoint_SHA256']==freeze['training_first']['checkpoint_sha256']
          assert report['opened_original_proved']==49 and report['opened_original_total_clauses']==49
          assert report['original_test_sources_fetched']==0
          assert freeze['eval_executed'] is False
          print('FROZEN_OWNWEIGHT_BEFORE_ORIGINAL_SOURCE_ACCESS')
          PY
      - name: FIRST original source 2+3 evaluation, frozen own-weight vs untrained/human/native
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'ALL_FOUR_ARMS_COLD_ORIGINAL_EVAL_WALL_SEC=%e MAX_RSS_KB=%M' \
            python -m research.g3.ownweight_schema_original_first \
              --checkpoint frozen-first/G3-OWNWEIGHT-QUANTIFIED-AST-FROZEN.json \
              --report G3-OWNWEIGHT-ORIGINAL-INIT2-INIT3-FIRST.json
          sha256sum G3-OWNWEIGHT-ORIGINAL-INIT2-INIT3-FIRST.json
      - name: Preserve all ORIGINAL first outcomes, scientific positive or negative
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEUMANN-G3-OWNWEIGHT-ORIGINAL-INIT2-3-ONE-FIRST
          path: G3-OWNWEIGHT-ORIGINAL-INIT2-INIT3-FIRST.json
          retention-days: 90
          if-no-files-found: warn
