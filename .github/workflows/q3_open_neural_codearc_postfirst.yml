name: Q3 Real Neural Open-Program External Original POSTFIRST
on:
  pull_request:
    paths:
      - "research/q3/q3_open_neural_codearc_postfirst.py"
      - "research/q3/verified_prior_codearc_source_library.json"
      - "neumann1/verified_fragment_transfer.py"
      - "tests/test_q3_verified_fragment_transfer.py"
      - ".github/workflows/q3_open_neural_codearc_postfirst.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-author-original-neural-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DOWNLOAD_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin independently authored CodeARC original source revision
        run: |
          set -euo pipefail
          mkdir -p Q3-OPEN-NEURAL-POSTFIRST /tmp/q3-neural-original
          DATA=https://huggingface.co/datasets/anjiangwei/CodeARC-Invocations
          REV=119512573bf96148cbb95e99cf7cdd21c06153e4
          curl --fail --location --retry 3 --silent --show-error \
            "$DATA/resolve/$REV/invocations.jsonl" \
            -o /tmp/q3-neural-original/invocations.jsonl
          test -s /tmp/q3-neural-original/invocations.jsonl
          sha256sum /tmp/q3-neural-original/invocations.jsonl \
            > Q3-OPEN-NEURAL-POSTFIRST/DATASET.sha256
      - name: Pin open-weight program generator revision
        run: |
          set -euo pipefail
          MODEL=https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct
          REV="$(git ls-remote "$MODEL" HEAD | awk '{print $1}')"
          test "$(printf %s "$REV" | wc -c)" -eq 40
          printf "%s\n" "$REV" > Q3-OPEN-NEURAL-POSTFIRST/MODEL_REVISION.txt
      - name: Install CPU-only model and source-only NEUMANN
        run: |
          python -m pip install -e .
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'transformers>=4.48,<5' sentencepiece
          docker pull python:3.11-alpine
      - name: Verify prior AUTHOR-SOURCE operators and new cross-type transfer
        run: |
          python -m pip install pytest
          python -m pytest -q -x tests/test_q3_verified_fragment_transfer.py
      - name: Blind originals before model proposal
        run: |
          python research/q3/q3_open_neural_codearc_postfirst.py prepare \
            --original /tmp/q3-neural-original/invocations.jsonl \
            --blind Q3-OPEN-NEURAL-POSTFIRST/BLIND.json --n 16 --offset 32
      - name: Generate and source-repair actual model code; freeze predictions
        run: |
          REV="$(cat Q3-OPEN-NEURAL-POSTFIRST/MODEL_REVISION.txt)"
          python research/q3/q3_open_neural_codearc_postfirst.py propose \
            --blind Q3-OPEN-NEURAL-POSTFIRST/BLIND.json \
            --output Q3-OPEN-NEURAL-POSTFIRST/PREDICTIONS.json \
            --model-revision "$REV" --proposals 2 \
            --source-library research/q3/verified_prior_codearc_source_library.json
          sha256sum Q3-OPEN-NEURAL-POSTFIRST/PREDICTIONS.json \
            > Q3-OPEN-NEURAL-POSTFIRST/PREDICTIONS.sha256
      - name: Score author original withheld outputs ONLY after SHA freeze
        run: |
          SHA="$(cut -d' ' -f1 Q3-OPEN-NEURAL-POSTFIRST/PREDICTIONS.sha256)"
          python research/q3/q3_open_neural_codearc_postfirst.py score \
            --original /tmp/q3-neural-original/invocations.jsonl \
            --predictions Q3-OPEN-NEURAL-POSTFIRST/PREDICTIONS.json \
            --expected-sha "$SHA" \
            --output Q3-OPEN-NEURAL-POSTFIRST/ORIGINAL_SCORE.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Q3-NEURAL-CODEARC-POSTFIRST-REAL-MODEL
          path: Q3-OPEN-NEURAL-POSTFIRST/
          if-no-files-found: warn
          retention-days: 90
