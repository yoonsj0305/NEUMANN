name: Q34 Opened Historical Head-to-Head (Development Only)
# No historical evidence rewrite. Opened, contaminated, retrospective comparison only.
# First run 37885771474 failed before any measurements: Python KeyError scikit_learn.
# Corrected-development run is distinct; original failed logs are retained.
# Pinned to base research HEAD c182fd3, prior first archives remain immutable.
on:
  push:
    branches:
      - research/q34-opened-direct-vs-learned-20261009
    paths:
      - .github/workflows/q34_opened_direct_vs_learned_20261009.yml
      - experiments/q34_opened_direct_vs_learned_20261009.py

permissions:
  contents: read

jobs:
  q34-opened-head-to-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "HASWELL"
      MKL_NUM_THREADS: "1"
      MKL_CBWR: "COMPATIBLE"
      BLIS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned historical v102 CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.9.1 threadpoolctl==3.7.0 highspy==1.15.1
          python -m pip install -e . --no-deps
          python -m pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Historical archive availability
        run: |
          test -s docs/experiments/results/v102_fresh_sources.json.gz
          test -s docs/experiments/results/v102_first_evaluation.json.gz
          test -s docs/experiments/results/v101_first_expansion.json.gz
          test -s docs/experiments/results/v100_first_refit.json.gz
      - name: Execute one opened retrospective paired CPU comparison
        run: |
          python -m experiments.q34_opened_direct_vs_learned_20261009
      - name: Upload complete receipts including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q34-opened-direct-vs-learned-20261009-first
          if-no-files-found: warn
          path: research/development/q34_opened_direct_vs_learned_20261009/
