name: Q3 last original1 generic conjunctive inequality full proof
on:
  pull_request:
    paths:
      - '.github/workflows/q3_last_original1_conjunctive_native.yml'
      - 'research/evidence/q3_last_original1_conjunctive_20261021/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify_last_genuine_original1:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: original
          sparse-checkout: |
            lib/Inv_Track/xujie_code2inv
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original version and source-independent conjunctive invariant miner
        run: |
          test "$(git -C original rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          python -m py_compile research/evidence/q3_last_original1_conjunctive_20261021/generate_small_generic_affine_Houdini_original1.py
      - name: Install independent original native Z3 and pinned cvc5 proof checker
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 sympy==1.14.0 z3-solver==4.13.3.0
      - name: Original 1 native full inductive proof from exact generated conjunction
        run: |
          set -o pipefail
          PYTHONPATH=. OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python research/evidence/q3_last_original1_conjunctive_20261021/generate_small_generic_affine_Houdini_original1.py \
            --root original \
            --freeze research/evidence/q3_dnf_first12_20261021/NEW_UNSEEN_ORIGINALS_BEFORE_SOURCE_BODY_LOCK.json \
            --out /tmp/q3_original1_actual_classical_full3VC.json | tee /tmp/q3_original1_actual_classical_full3VC.log
          sha256sum /tmp/q3_original1_actual_classical_full3VC.json
      - name: Preserve all actual source proof results even if incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-original1-finite-inequality-native-conjunctive-safety-proof
          path: |
            /tmp/q3_original1_actual_classical_full3VC.json
            /tmp/q3_original1_actual_classical_full3VC.log
          if-no-files-found: warn
      - name: Report but never fabricate full original induction proof
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/q3_original1_actual_classical_full3VC.json'))
          assert r['schema']=='neumann.q3.original1_posthoc_source_generic_small_inequality_grammar_Houdini_full3VC.v1'
          assert r['original_code2inv_git_blob']=='859bae24a9f26044a40a3c97f1d2e5fc08504f06'
          assert r['human_manual_invariant_injected'] is False
          assert r['not_trained_or_neural']
          if r['full_original_native_three_VC_SAFE_proved']:
              assert all(p['dual_pass'] for p in r['actual_generic_houdini_full_original_dual_solver_result']['independent_original_pre_trans_post_dual_proofs'].values())
          assert r['global_Q3']==r['global_Q4']==r['global_Q6']=='OPEN'
          print('ORIGINAL1_ACTUAL_CLASSICAL_SAFE_ONLY_IF_INDEPENDENT_ALL_THREE_NATIVE_SOURCE_VCS')
          PY
