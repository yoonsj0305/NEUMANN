name: Q3 real lcm source-only modular lattice original 3VC
on:
  pull_request:
    paths:
      - '.github/workflows/q3-lcm-modular-lattice-first.yml'
      - 'research/evidence/q3_lcm_modular_lattice_20261020/**'
      - 'docs/research/Q3_LCM_MODULAR_LATTICE_SOURCE_ONLY_FROZEN_20261020.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real_original_lcm_source_modular_lattice:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SaswatPadhi/LoopInvGen
          ref: 6ac90265b11431c9477dfbd33e3e3380234c0499
          path: original_loopinvgen
          sparse-checkout: |
            benchmarks/NIA/other
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen source revision and Python safety
        run: |
          test "$(git -C original_loopinvgen rev-parse HEAD)" = 6ac90265b11431c9477dfbd33e3e3380234c0499
          python -m py_compile research/evidence/q3_lcm_modular_lattice_20261020/source_only_modular_houdini.py
      - name: Independent pinned cvc5 1.4.2 solver and exact native Z3
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          test "$(find /tmp/cvc5bin -type f -name cvc5 | wc -l)" -eq 1
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F '1.4.2'
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 sympy==1.14.0 z3-solver==4.13.3.0
      - name: FIRST official source-only candidate-generation and exact original 3VC trial
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_lcm_modular_lattice_20261020/source_only_modular_houdini.py --source-root original_loopinvgen --out /tmp/q3_lcm_modular_first.json | tee /tmp/q3_lcm_modular_first.log
          sha256sum /tmp/q3_lcm_modular_first.json
      - name: Preserve first evidence, even if incomplete or solver unknown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-real-lcm-first-source-only-modular-houdini
          path: |
            /tmp/q3_lcm_modular_first.json
            /tmp/q3_lcm_modular_first.log
          if-no-files-found: warn
      - name: Honesty gates never require a manufactured Q3 success
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3_lcm_modular_first.json'))
          assert x['pinned_git_blob']=='6c0cbaafc0c8b960d6047014dc5670554aacbc85'
          assert x['source_only_no_gold_post_during_candidate_selection']
          assert len(x['source_only_discovery']['pre_valid_candidates'])>0
          assert x['source_only_discovery']['final_atom_count']>0
          assert x['generated_modular_atoms_before_precheck']==32
          assert not x['learned_neural_new_operator']
          assert not x['unique_neural_over_strong_classical']
          assert not x['genuinely_blind_source']
          assert x['global_Q3']==x['global_Q1_Q7']=='OPEN'
          print("REAL_LCM_SOURCE_ONLY_SCIENCE_STATUS",x['posthoc_classical_scoped_pass'])
          print("REAL_LCM_FINAL_ATOMS",x['source_only_discovery']['final_atom_names'])
          PY
