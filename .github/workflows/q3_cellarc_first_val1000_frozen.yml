name: NEUMANN Q3 first untouched CellARC validation1000 frozen generator
on:
  pull_request:
    paths:
      - '.github/workflows/q3_cellarc_first_val1000_frozen.yml'
      - 'research/evidence/q3_cellarc2000_20261022/debruijn_validation1000.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze_original_model_and_mask_val_targets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify previous actually evaluated solver Git blob BEFORE ever reading validation split
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/evidence/q3_cellarc2000_20261022/debruijn_structural_model.py)" = fb12bc217178f7f3e89f0865987078e5dc367074
          python -m py_compile research/evidence/q3_cellarc2000_20261022/debruijn_structural_model.py research/evidence/q3_cellarc2000_20261022/debruijn_validation1000.py
          mkdir -p /tmp/first-val-source
          python - <<'PY'
          import urllib.request,json,pathlib,hashlib
          sha='76040e6aef0edc4982e53c13a85ef227378ed171'
          url=f'https://huggingface.co/datasets/mireklzicar/cellarc_100k/resolve/{sha}/data/val.jsonl'
          req=urllib.request.Request(url,headers={'User-Agent':'NEUMANN-frozen-before-validation-original'})
          with urllib.request.urlopen(req,timeout=120) as t:raw=t.read()
          rows=raw.decode().splitlines();assert len(rows)==1000,len(rows)
          dest=pathlib.Path('/tmp/first-val-source/VAL1000_SOURCE_DEMONSTRATIONS_NO_TRUTH.jsonl')
          with dest.open('w') as f:
              ids=set()
              for line in rows:
                  d=json.loads(line);assert set(d).issuperset({'id','train','query','solution'})
                  assert len(d['train'])==5 and d['id'] not in ids
                  ids.add(d['id'])
                  source={'id':d['id'],'train':d['train'],'query':d['query']}
                  assert 'solution' not in source and 'meta' not in source
                  f.write(json.dumps(source,separators=(',',':'),sort_keys=True)+'\n')
          manifest={'model_original_git_blob':'fb12bc217178f7f3e89f0865987078e5dc367074',
              'original_dataset_commit':sha,'original_dataset_path':'data/val.jsonl',
              'source_n':1000,'raw_sha256':hashlib.sha256(raw).hexdigest(),
              'masked_sha256':hashlib.sha256(dest.read_bytes()).hexdigest()}
          pathlib.Path('/tmp/first-val-source/FROZEN_SOURCE_MANIFEST.json').write_text(json.dumps(manifest,sort_keys=True)+'\n')
          print('FROZEN_BEFORE_FIRST_CELLARC_VALIDATION','model_git_blob',manifest['model_original_git_blob'],'source_sha',manifest['raw_sha256'],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: neumann-cellarc-first-val1000-original-target-masked
          path: /tmp/first-val-source/
          if-no-files-found: error
  first_read_only_val1000_predictions:
    needs: freeze_original_model_and_mask_val_targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: neumann-cellarc-first-val1000-original-target-masked
          path: /tmp/first-val-source
      - name: Run unchanged De Bruijn model on new original 1000 val tasks, save immutable receipt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/evidence/q3_cellarc2000_20261022/debruijn_structural_model.py)" = fb12bc217178f7f3e89f0865987078e5dc367074
          mkdir -p /tmp/first-val-pregrade
          python research/evidence/q3_cellarc2000_20261022/debruijn_validation1000.py --mode infer --input /tmp/first-val-source/VAL1000_SOURCE_DEMONSTRATIONS_NO_TRUTH.jsonl --out /tmp/first-val-pregrade/ALL1000_BEFORE_ANY_TARGET_READ.json | tee /tmp/first-val-pregrade/SOURCE_ONLY_PREGRADE.log
          python - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path('/tmp/first-val-pregrade/ALL1000_BEFORE_ANY_TARGET_READ.json')
          d=json.loads(p.read_text())
          assert d['n']==len(d['rows'])==1000 and d['source_only'] and not d['hidden_meta_accessed']
          print('FIRST_VAL1000_BLIND_PREDICTION_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-first-val1000-model-unmodified-pregrade
          path: /tmp/first-val-pregrade/
          if-no-files-found: error
  first_independent_val1000_original_exact_grade:
    needs: first_read_only_val1000_predictions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: neumann-cellarc-first-val1000-original-target-masked
          path: /tmp/first-val-source
      - uses: actions/download-artifact@v4
        with:
          name: neumann-first-val1000-model-unmodified-pregrade
          path: /tmp/first-val-pregrade
      - name: NOW download original full truth, enforce same revision and exact hash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,urllib.request,hashlib
          m=json.loads(pathlib.Path('/tmp/first-val-source/FROZEN_SOURCE_MANIFEST.json').read_text())
          url=f"https://huggingface.co/datasets/mireklzicar/cellarc_100k/resolve/{m['original_dataset_commit']}/{m['original_dataset_path']}"
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'NEUMANN-independent-first-val-original-grade'}),timeout=120) as r:raw=r.read()
          assert hashlib.sha256(raw).hexdigest()==m['raw_sha256']
          assert len(raw.splitlines())==1000
          pathlib.Path('/tmp/ORIGINAL_VAL1000_TRUTH_FOR_GRADER_ONLY.jsonl').write_bytes(raw)
          print('ORIGINAL_FIRST_VALIDATION_TRUE_TARGETS_ADMITTED_AFTER_SHA_SEAL')
          PY
          mkdir -p /tmp/first-val-grade
          python research/evidence/q3_cellarc2000_20261022/debruijn_validation1000.py --mode grade --sealed /tmp/first-val-pregrade/ALL1000_BEFORE_ANY_TARGET_READ.json --source /tmp/ORIGINAL_VAL1000_TRUTH_FOR_GRADER_ONLY.jsonl --out /tmp/first-val-grade/ORIGINAL1000_INDEPENDENT_FIRST_SCORE.json | tee /tmp/first-val-grade/ORIGINAL_INDEPENDENT_VERDICT.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-first-original-cellarc-val1000-independent-exact-grade
          path: /tmp/first-val-grade/
          if-no-files-found: error

  analyze_true_generator_only_after_independent_score:
    needs: first_independent_val1000_original_exact_grade
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: neumann-cellarc-first-val1000-original-target-masked
          path: /tmp/first-val-source
      - uses: actions/download-artifact@v4
        with:
          name: neumann-first-val1000-model-unmodified-pregrade
          path: /tmp/first-val-pregrade
      - name: Reacquire original validation truth and hidden meta in separate POSTGRADE-only runner
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,urllib.request,hashlib
          m=json.loads(pathlib.Path('/tmp/first-val-source/FROZEN_SOURCE_MANIFEST.json').read_text())
          url=f"https://huggingface.co/datasets/mireklzicar/cellarc_100k/resolve/{m['original_dataset_commit']}/{m['original_dataset_path']}"
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'NEUMANN-val-postgrade-only'}),timeout=120) as r:raw=r.read()
          assert hashlib.sha256(raw).hexdigest()==m['raw_sha256']
          pathlib.Path('/tmp/ORIGINAL_VAL1000_POSTGRADE_ONLY.jsonl').write_bytes(raw)
          PY
          mkdir -p /tmp/val1000-metadata-after-grade
          python research/evidence/q3_cellarc2000_20261022/debruijn_validation_postgrade.py --sealed /tmp/first-val-pregrade/ALL1000_BEFORE_ANY_TARGET_READ.json --original /tmp/ORIGINAL_VAL1000_POSTGRADE_ONLY.jsonl --out /tmp/val1000-metadata-after-grade/FIRST_VAL1000_TRUE_GENERATOR_CAUSAL_ERRORS.json | tee /tmp/val1000-metadata-after-grade/POSTGRADE_TRUE_STRATA.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-first-val1000-generator-meta-after-independent-score
          path: /tmp/val1000-metadata-after-grade/
          if-no-files-found: error
