name: Q3 frozen learned AST onto three unopened real originals
on:
  pull_request:
    paths:
      - '.github/workflows/q3-frozen-ast-real-original-first.yml'
      - 'research/evidence/q3_frozen_ast_blind_real_20261020/**'
      - 'docs/research/Q3_FROZEN_AST_3_REAL_ORIGINAL_SOURCES_PREREG_20261020.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen_originals_first:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SaswatPadhi/LoopInvGen
          ref: 6ac90265b11431c9477dfbd33e3e3380234c0499
          path: original_loopinvgen
          sparse-checkout: |
            benchmarks/NIA/other
            benchmarks/NIA/2018.CHI_InvGame
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact-source revision and Python syntax
        run: |
          test "$(git -C original_loopinvgen rev-parse HEAD)" = 6ac90265b11431c9477dfbd33e3e3380234c0499
          python -m py_compile research/evidence/q3_frozen_ast_blind_real_20261020/frozen_ast_original_interface.py
      - name: Official cvc5 1.4.2 independent verifier pinned by binary SHA
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          test "$(find /tmp/cvc5bin -type f -name cvc5 | wc -l)" -eq 1
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F '1.4.2'
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 sympy==1.14.0 z3-solver==4.13.3.0
      - name: FIRST actual source-frozen third-party original transfer without target retraining
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_frozen_ast_blind_real_20261020/frozen_ast_original_interface.py --upstream-root original_loopinvgen --out /tmp/q3_frozen_ast_real_first.json | tee /tmp/q3_frozen_ast_real_first.log
          sha256sum /tmp/q3_frozen_ast_real_first.json
      - name: Archive FIRST whole result even if unsupported or unsuccessful
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-frozen-ast-three-originals-first
          path: |
            /tmp/q3_frozen_ast_real_first.json
            /tmp/q3_frozen_ast_real_first.log
          if-no-files-found: warn
      - name: Scientific identity checks, with NO false G1 success assertion
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3_frozen_ast_real_first.json'))
          assert x['frozen_trained_AST']=='(- a (* (div a b) b))'
          assert x['frozen_trained_weights_sha256']=='c67457981ed9f8faea5b1b38061ceebb998340274554e003b67bf47822280f10'
          assert x['all_three_origins_pinned'] and len(x['originals'])==3
          assert x['classical_full_grammar_behavior_scoring_required']
          assert not x['new_operator_outside_frozen_grammar']
          assert not x['learned_unique_over_exact_classical']
          assert x['genuine_blind_original_new_invariant_certified']==0
          assert x['global_Q3']==x['global_Q1_Q7']=='OPEN'
          print('Q3_FROZEN_AST_TRUE_FIRST_REAL_SOURCE_INTERFACE_AUDIT_COMPLETE')
          print('SCIENTIFIC_ORIGINAL_ROWS',[(v['source'],v['status']) for v in x['originals']])
          print('MATH_UNIVERSAL_DUAL_SOLVER',x['frozen_universal_arithmetic_identity']['both_solver_backends_UNSAT'])
          PY
