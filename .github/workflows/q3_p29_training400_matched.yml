name: NEUMANN P2.9 400 public original matched-classical ceiling audit
on:
  push:
    branches:
      - research/q3-p29-inferred-coordinate-programs-20261105
    paths:
      - .github/workflows/q3_p29_training400_matched.yml
permissions:
  contents: read
  actions: read
jobs:
  matched:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: neumann-p29-400-training-grammar-census
          run-id: 42021735122
          github-token: ${{ github.token }}
          path: first
      - name: Fetch exact original public ARC benchmark
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/arc-agi"
          git -C "$RUNNER_TEMP/arc-agi" remote add origin https://github.com/fchollet/ARC-AGI.git
          git -C "$RUNNER_TEMP/arc-agi" fetch --depth=1 origin 399030444e0ab0cc8b4e199870fb20b863846f34
          git -C "$RUNNER_TEMP/arc-agi" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/arc-agi" rev-parse HEAD)" = "399030444e0ab0cc8b4e199870fb20b863846f34"
      - name: Compare original 400 outcomes with five matched classical source strategies
        shell: bash
        run: |
          set -euo pipefail
          node experiments/q3_p29_training400_matched_controls.mjs "$RUNNER_TEMP/arc-agi" first/P29-TRAIN400-CENSUS.json > P29-FIRST-TRAIN400-STRONG-MATCHED.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('P29-FIRST-TRAIN400-STRONG-MATCHED.json','utf8'));
          if(x.counts.N!==400||x.counts.p29_first_correct!==19||x.counts.p29_false_submitted!==1||!x.original_gold_read_after_proposals)process.exit(1);
          console.log(JSON.stringify({scope:x.source,counts:x.counts,report_source:x.P29_first_receipt_sha256}));
          NODE
      - name: Retain exact baseline comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neumann-p29-public400-matched-classical-audit
          path: P29-FIRST-TRAIN400-STRONG-MATCHED.json
          if-no-files-found: warn
          retention-days: 90
