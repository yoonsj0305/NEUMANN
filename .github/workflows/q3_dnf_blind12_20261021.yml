name: Q3 genuinely unopened twelve original Boolean structure learner
on:
  pull_request:
    paths:
      - '.github/workflows/q3_dnf_blind12_20261021.yml'
      - 'research/evidence/q3_dnf_first12_20261021/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first_unopened_original12_actual_tree_DNF_vs_strong_classical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: original
          sparse-checkout: |
            lib/Inv_Track/xujie_code2inv
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen metadata and source-independent model syntax
        run: |
          test "$(git -C original rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          python -m py_compile research/evidence/q3_dnf_first12_20261021/firstblind_transfer_unchanged_trained_boolean.py
          python - <<'PY'
          import json
          a=json.load(open("research/evidence/q3_dnf_first12_20261021/NEW_UNSEEN_ORIGINALS_BEFORE_SOURCE_BODY_LOCK.json"))
          assert a["schema"]=="neumann.q3.train_BOOLEAN_DNF_first12_unopened_xujie_SHA.v1"
          assert a["original_source_bodies_not_read_before_freeze"]
          assert len(a["cases"])==12 and len({r["git_blob"] for r in a["cases"]})==12
          assert a["global_Q3"]==a["global_Q4"]==a["global_Q6"]=="OPEN"
          print("NEW_SOURCE_BODY_BLIND_12_GITSHA_FROZEN")
          PY
      - name: Install exact Z3 cvc5 and truly fitted CPU decision tree
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 z3-solver==4.13.3.0
      - name: Train ACTUAL Boolean models on twelve FIRST unopened sources and compare exact nofit OR
        run: |
          set -o pipefail
          PYTHONPATH=. OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python research/evidence/q3_dnf_first12_20261021/firstblind_transfer_unchanged_trained_boolean.py \
            --root original \
            --freeze research/evidence/q3_dnf_first12_20261021/NEW_UNSEEN_ORIGINALS_BEFORE_SOURCE_BODY_LOCK.json \
            --out /tmp/q3_fresh12_actual_trained_DNF_source_original.json | tee /tmp/q3_fresh12_actual_trained_DNF_source_original.log
          sha256sum /tmp/q3_fresh12_actual_trained_DNF_source_original.json
      - name: Preserve every proof, unsupported source, training fit and classical baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-fresh12-real-original-trained-DNF-vs-nofit-OR-native-double-proof
          path: |
            /tmp/q3_fresh12_actual_trained_DNF_source_original.json
            /tmp/q3_fresh12_actual_trained_DNF_source_original.log
          if-no-files-found: warn
      - name: Verify all claimed full original proofs have independent three-VC certificates
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/q3_fresh12_actual_trained_DNF_source_original.json'))
          assert r["schema"]=="neumann.q3.first_unseen_original12_actual_learned_boolean_DNF_vs_exact_classical.v1"
          assert r["preregister_source_SHA_only_Git_commit"]=="ba08ffcf1760ef556d6f4fd058f81ef656263642"
          assert r["first_source_originals_sha_verified"]==12 and len(r["all_original_cases"])==12
          assert len({c["source_git_blob"] for c in r["all_original_cases"]})==12
          assert r["model_DNF_not_model_only_verifier_calibrated"]
          assert r["same_data_strong_OR_classical_equal_math_rights"]
          assert r["global_Q3"]==r["global_Q4"]==r["global_Q6"]=="OPEN"
          for source in r["all_original_cases"]:
              for k in ("trained_DNF_full_original_native_safe","same_data_no_fit_OR_full_original_native_safe"):
                  p=source.get(k)
                  if p and p["certified"]:
                      assert all(x["dual_pass"] for x in p["full_genuine_source_Z3_cvc5_3VC"].values())
          print("FIRST_SOURCE_BLIND_BOOLEAN_LEARNER_CLAIM_AUDIT_PASS")
          PY
