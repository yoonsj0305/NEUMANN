name: FGSR Houdini 48 Horn parser repair single run

on:
  pull_request:
    paths:
      - '.github/workflows/fgsr-houdini-parser-repair-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-houdini:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FGSR_RESULT: research/evidence/fgsr-q3-single-independent-family/houdini_parser_repaired_receipt.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned SMT verifier and check source
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
          python -m py_compile research/evidence/fgsr-q3-single-independent-family/houdini_once.py
      - name: Single unchanged-source Houdini finite basis check
        run: |
          python research/evidence/fgsr-q3-single-independent-family/houdini_once.py
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('research/evidence/fgsr-q3-single-independent-family/houdini_parser_repaired_receipt.json').read_text())
          print("VERDICT",v["status"])
          print("INVARIANTS_SURVIVING",v.get("accepted_inductive_conjuncts"))
          print("ORIGINAL_CERTIFIED",v.get("full_original_unsat_count"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgsr-houdini-parser-repaired-original-48
          path: research/evidence/fgsr-q3-single-independent-family/houdini_parser_repaired_receipt.json
          if-no-files-found: warn
          retention-days: 45
