name: Q3 automatic exact interaction arity escalation four originals
on:
  pull_request:
    paths:
      - '.github/workflows/q3_auto_source_arity_witness.yml'
      - 'research/evidence/q3_autonomous_arity_witness20261022/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_original_automatic_kwise_inexpressivity_and_independent_dual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit no-supplied-witness generator, compile before reading source body
        run: |
          set -euo pipefail
          python -m py_compile research/evidence/q3_autonomous_arity_witness20261022/auto_kwise_recombination.py
          python -m py_compile research/evidence/q3_original_arity_hierarchy_20261022/prove_arity_lower_bounds.py
          python - <<'PY'
          from pathlib import Path
          code=Path('research/evidence/q3_autonomous_arity_witness20261022/auto_kwise_recombination.py').read_text()
          assert 'def make_candidate' in code and 'def parse_original' in code
          assert 'spurious_glued_state' in code and 'SOURCE_ID' in code
          assert 'CASE' not in code.split('SOURCE_ID={')[1].split('}')[0]
          print('SOURCE_ONLY_NO_HUMAN_BAD_TRACE_OR_INVARIANT_INPUT',flush=True)
          PY
      - name: Install free double source-verifier independent backends
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libz3-4
          curl -fL --retry 3 --connect-timeout 10 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5-bin /tmp/neumann-autoarity/sources /tmp/neumann-autoarity/auto_smt /tmp/neumann-autoarity/manual_upper_smt
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5-bin
          sudo install -m 755 "$(find /tmp/cvc5-bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
      - name: Authenticate four unchanged actual SyGuS source bodies by official Git blob sha
        run: |
          python - <<'PY'
          import pathlib,hashlib,urllib.request
          p=pathlib.Path('/tmp/neumann-autoarity/sources')
          root='https://raw.githubusercontent.com/SyGuS-Org/benchmarks/13c8deb68a873635879c9a69bc78caebd340f646/'
          cases={
          'hola_countud.sl':('comp/2017/Inv_Track/','5d7f07c0b5a35d119ebe2d59bd5f56e447c547bf'),
          'fib_15.sl':('comp/2019/Inv_Track/From2018/','125d1f9a277e262df77bcbda1a77851841d563d3'),
          'fib_18.sl':('comp/2019/Inv_Track/From2018/','03f37e87068ec2616c1747cf45860d7811c3ba99'),
          'jmbl_tacas.sl':('comp/2019/Inv_Track/From2018/','07da5f3887401f7f778cf6cea87cea12a6fe1f83')}
          for name,(folder,expected) in cases.items():
              b=urllib.request.urlopen(root+folder+name,timeout=25).read()
              sha=hashlib.sha1(('blob '+str(len(b))+'\0').encode()+b).hexdigest()
              assert sha==expected,(name,sha,expected)
              (p/name).write_bytes(b)
              print('ORIGINAL_SHA_VERIFIED',name,sha,flush=True)
          PY
      - name: AUTOMATIC find source-only reachable coordinate recombinations and original unsafe paths, independent cvc5 rechecks
        run: |
          set -o pipefail
          python research/evidence/q3_autonomous_arity_witness20261022/auto_kwise_recombination.py \
            --source-dir /tmp/neumann-autoarity/sources \
            --out /tmp/neumann-autoarity/AUTO_SOURCE_PROJECTION_WITNESSES.json \
            --smt-out /tmp/neumann-autoarity/auto_smt \
            --max-witness-depth 3 --max-unsafe-depth 3 --lower -4 --upper 6 --cvc5 \
            | tee /tmp/neumann-autoarity/AUTO_RUN.log
          python - <<'PY'
          import json, pathlib, hashlib
          p=pathlib.Path('/tmp/neumann-autoarity')
          d=json.load(open(p/'AUTO_SOURCE_PROJECTION_WITNESSES.json'))
          expected={'hola_countud.sl':3,'fib_15.sl':3,'fib_18.sl':3,'jmbl_tacas.sl':4}
          assert d['original_count']==4 and d['cvc5_run']
          assert all(d['certified'][name]['necessary_support_at_least']==arity for name,arity in expected.items())
          assert len(d['verifier_receipt'])==d['query_count_verified']>=30
          assert d['totals']['sat_verified_queries']==d['totals']['cvc5_replays']==d['query_count_verified']
          assert all(x['z3']==x['cvc5']=='sat' for x in d['verifier_receipt'])
          assert len(list((p/'auto_smt').glob('*.smt2')))==d['query_count_verified']
          print('AUTOMATIC_SOURCE_ONLY_INTERACTION_GATE_PASS',d['query_count_verified'],
                hashlib.sha256((p/'AUTO_SOURCE_PROJECTION_WITNESSES.json').read_bytes()).hexdigest(),flush=True)
          PY
      - name: Separate independent original-source correct upper bounds and historical handmade lower bounds, double SMT
        run: |
          set -o pipefail
          python research/evidence/q3_original_arity_hierarchy_20261022/prove_arity_lower_bounds.py \
            --source-dir /tmp/neumann-autoarity/sources \
            --out /tmp/neumann-autoarity/INDEPENDENT_EXISTING_UPPER_BOUND_3VC.json \
            --queries-dir /tmp/neumann-autoarity/manual_upper_smt --cvc5 \
            | tee /tmp/neumann-autoarity/UPPER_BOUND_RUN.log
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/neumann-autoarity')
          a=json.load(open(p/'INDEPENDENT_EXISTING_UPPER_BOUND_3VC.json'))
          assert a['original_count']==4 and a['both_SMT_backends']
          assert a['total_query_count_per_backend']==56
          assert a['query_result_counts']=={'sat':36,'unsat':20}
          print('SOURCE_ORIGINAL_INDEPENDENT_MINIMAL_K_UPPER_AND_LOWER_PROOF',flush=True)
          PY
      - name: Full original evidence manifest, include negative and bounded-search limitations
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path('/tmp/neumann-autoarity')
          a=json.load(open(p/'AUTO_SOURCE_PROJECTION_WITNESSES.json'))
          b=json.load(open(p/'INDEPENDENT_EXISTING_UPPER_BOUND_3VC.json'))
          out={'scientific_status':'AUTOMATED_SOURCE_ONLY_MIN_INTERACTION_ARITY_FOUND_4_OF_4_AND_INDEPENDENT_TWO_SMT_PROOF',
            'firstblind':False,'learned_model_exclusive_new_operator':False,
            'automatically_discovered_lower_bounds':{n:r['necessary_support_at_least'] for n,r in a['certified'].items()},
            'pre_existing_human_upper_bound_dual_certified':True,
            'auto_concrete_z3_and_cvc5_replays':a['query_count_verified'],
            'independent_original_previous_56_each':b['total_query_count_per_backend'],
            'search_is_bounded':True,'automatic_recombination_wall_s':a['wall_time_s'],
            'strong_classical_comparator':'The automatic witness generator IS an exact classical SMT algorithm. Neural exclusivity is NOT PROVEN.'}
          for name in ['AUTO_SOURCE_PROJECTION_WITNESSES.json','INDEPENDENT_EXISTING_UPPER_BOUND_3VC.json']:
              out[name+'_sha256']=hashlib.sha256((p/name).read_bytes()).hexdigest()
          (p/'VERDICT.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('SOURCE_ONLY_ARITY_AUTOMATION_VERDICT',json.dumps(out),flush=True)
          PY
      - name: Preserve all original scripts and receipts even if run fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-automatic-source-kwise-discovery-four-real-programs-z3-cvc5
          path: /tmp/neumann-autoarity/
          if-no-files-found: warn
