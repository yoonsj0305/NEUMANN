name: v101 Frozen Support Expansion Contracts

on:
  push:
    branches:
      - research/v101-frozen-support-expansion
    paths:
      - .github/workflows/v101_support_contracts.yml

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contract dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Validate frozen v101 training-free contract only
        run: pytest -q tests/test_lp_frozen_support_expansion_v101.py
