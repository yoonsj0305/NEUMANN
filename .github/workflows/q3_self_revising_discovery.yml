name: Q3 Self-Revising Discovery Method Meta-Core
on:
  pull_request:
    paths:
      - "neumann1/discovery_policy_core.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "tests/test_discovery_policy_core.py"
      - "research/q3/q3_self_revising_discovery_first.py"
      - ".github/workflows/q3_self_revising_discovery.yml"
  workflow_dispatch:

jobs:
  learn-and-revise-discovery-method:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact production source tree
        run: python -m pip install -e . pytest
      - name: Check self-invented discovery-policy AST and production-engine revision
        run: |
          python -m pytest -q tests/test_discovery_policy_core.py
      - name: Freeze learned and revised method before fresh cross-family scoring
        run: |
          python research/q3/q3_self_revising_discovery_first.py \
            --output q3_meta_method_first_evidence.json
          sha256sum q3_meta_method_first_evidence.json > q3_meta_evidence_sha256.txt
          python - <<'PY'
          import json
          r=json.load(open('q3_meta_method_first_evidence.json'))
          s=r['summary']
          assert not r['errors']
          assert s['task_count']==300
          assert s['meta_accuracy']==s['classical_accuracy']==300
          assert s['meta_total_training_and_heldout_source_queries']==60930
          assert s['classical_total_heldout_source_queries']==76050
          assert s['revised_policy_sha256']=='69ed0e038cd66b6269d44bfd66eec233c4e2e421c5ff111776383f89374f99d3'
          assert s['repaired_feedback_errors']==0
          assert not s['global_Q3_Q4_Q6_pass']
          print('SCOPED PROCEDURE REVISION PASS. GLOBAL Q3/Q4/Q6 OPEN.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q3-self-revising-meta-policy-300-new-math-tasks
          path: |
            q3_meta_method_first_evidence.json
            q3_meta_evidence_sha256.txt
          if-no-files-found: error
