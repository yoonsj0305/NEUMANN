name: NEUMANN G3 actual Golem 0.7.1 2025 LIA first read-only scientific audit
on:
  push:
    branches:
      - research/q3-g3-2025-chc-native-first-20261106
    paths:
      - .github/workflows/G3_2025_GOLEM071_LIA_FIRST_READONLY_AUDIT.yml
permissions:
  contents: read
  actions: read
jobs:
  read-original-peer-not-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: NEUMANN-G3-2025-ACTUAL-LIA_MULTIPHASE-PEER-POSTFIRST
          run-id: 42177539601
          github-token: ${{ github.token }}
          path: immutable-peer-first
      - name: Inspect EXACT native first JSON after only CI logging KeyError (no source re-fetch)
        shell: bash
        run: |
          set -euo pipefail
          echo '67e3955f9b5c45c82076400ffd375cddc69ff7b95c403608bc5eac906e8c2f56  immutable-peer-first/G3-2025-LIA_MULTIPHASE-PEER-POSTFIRST.json' | sha256sum -c -
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('immutable-peer-first/G3-2025-LIA_MULTIPHASE-PEER-POSTFIRST.json')
          x=json.loads(p.read_text())
          assert x['schema']=='neumann.q3.g3.postfirst-reproduction-native-CHCCOMP2025-actual-peers.v1'
          assert x['cohort']=='LIA_MULTIPHASE'
          assert x['peer_version']=='Golem-0.7.1'
          assert len(x['rows'])==8
          assert x['stats']['peer_originals_executed']==7
          assert x['stats']['student_neural_training_invocations']==0
          assert x['stats']['new_ARC_eval_originals']==0
          assert x['stats']['peer_verdict_conflicts_with_official_competition']==0
          out={'status':'IMMUTABLE_REAL_2025_NATIVE_GOL_071_FIRST_SCIENCE_RECOVERED',
            'first_run_id':42177539601,
            'first_sha256':'67e3955f9b5c45c82076400ffd375cddc69ff7b95c403608bc5eac906e8c2f56',
            'stats':x['stats'],
            'exact_original_source_outcomes':[{
              'name':r['name'],
              'old_Z3':r['original_Z3_status'],
              'peer_executed':r['peer_executed'],
              'peer_status':r.get('peer',{}).get('status'),
              'peer_wall_ms':r.get('peer',{}).get('wall_ms'),
              'peer_stdout':r.get('peer',{}).get('stdout_excerpt','')[:280],
              'official_match':r.get('official_competition_verdict_matches'),
              'classification':r.get('classification')}
              for r in x['rows']]}
          print(json.dumps(out,sort_keys=True))
          print('REAL_G3_LIA_GOLEM_071_FIRST_SCIENCE_RECOVERY_PASS_NOT_REPEAT')
          PY
