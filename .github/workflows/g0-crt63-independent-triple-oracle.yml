name: G0 CRT63 exact original helper independent 3D exhaustive positive negative oracle
on:
  pull_request:
    paths:
      - '.github/workflows/g0-crt63-independent-triple-oracle.yml'
      - 'research/evidence/g0_cubic_crt63_20261021/independent_exhaustive_triple_oracle_test.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove_filtered_numpy_exactness_against_python_bruteforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact arithmetic reference dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 z3-solver==4.13.3.0
          python -m py_compile research/evidence/g0_cubic_crt63_20261021/independent_exhaustive_triple_oracle_test.py
      - name: Independently enumerate genuine triples 250 cases and compare CRT63
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/g0_cubic_crt63_20261021/independent_exhaustive_triple_oracle_test.py | tee /tmp/g0_crt63_small_reference.log
          grep -F 'INDEPENDENT_TRIPLE_BRUTE_ORACLE_EXACT_CRT63_PASS 250 /250 SAT 125 BOUNDED_NO_WITNESS 125' /tmp/g0_crt63_small_reference.log
          grep -F 'FINITE_CRT63_MODULAR_INTEGER_PROOF 8 /8' /tmp/g0_crt63_small_reference.log
      - name: Preserve positive and negative reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-crt63-250-independent-reference-brute
          path: /tmp/g0_crt63_small_reference.log
          if-no-files-found: warn
