name: NEUMANN AM2 mainline opened control dominance
on:
  push:
    branches:
      - research/am2-mainline-control-pivot-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opened-control:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout only existing opened tasks and model-free runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Match existing NEUMANN scientific Python dependencies
        run: python -m pip install -e .
      - name: Test zero-model fail-closed comparator
        run: python -m unittest -v tests.test_am2_opened_control_dominance
      - name: Test AM2 dual-plane interface against original checkers (fixture model only)
        run: python -m unittest -v tests.test_am2_dual_plane_runtime
      - name: Test AM2 dual-plane candidate parity and authority isolation
        run: python -m unittest -v tests.test_am2_dual_plane_semantic_parity
      - name: Certify no new semantic hypothesis before GPU spend
        run: |
          set -euo pipefail
          python -m experiments.am2_same_hypothesis_kill_gate > am2-no-headroom.json
          python - <<'PY'
          import json
          x=json.load(open("am2-no-headroom.json"))
          assert x["same_semantic_result_under_matched_responses"] == 12
          assert x["identical_coding_prompts"] == 4
          assert x["actual_model_calls"] == 0
          assert x["architecture_multiplier"] == "NOT_EVALUATED"
          assert x["status"] == "STOP_CURRENT_AM2_BEFORE_EXPENSIVE_MODEL_RUN"
          print(x["status"],"matched 12/12, fixture-only")
          PY
      - name: Execute original-tool/checker matched capability assay
        run: |
          set -euo pipefail
          python -m experiments.am2_opened_control_dominance > am2-first-model-free-opened.json
          python - <<'PY'
          import json
          d=json.load(open("am2-first-model-free-opened.json"))
          for arm in ("TOOL","NEUMANN"):
              a=d["totals"][arm]
              assert a["accepted"]==8 and a["terminal"]==12 and a["model_calls"]==0
              print(f"{arm}: {a['accepted']}/12 tool_calls={a['tool_calls']} original_checker_calls={a['checker_calls']}")
          assert d["new_architecture_multiplier_executed"] is False
          print("Result:",d["result"])
          PY
      - name: Test previously proven strongest 12/12 static tool without neural calls
        run: python -m unittest -v tests.test_am2_strong_matched_baseline_admission
      - name: Recheck original strong-baseline saturation and fail the unnecessary +2 capability spend
        run: |
          set -euo pipefail
          python -m experiments.am2_strong_matched_baseline_admission > am2-strong-tool-12of12.json
          python - <<'PY'
          import json
          x=json.load(open("am2-strong-tool-12of12.json"))
          assert x["statistics"]["TOOL"]["original_solved"] == 12
          assert x["statistics"]["NEUMANN"]["original_solved"] == 12
          assert not x["plus_two_accuracy_gate_possible"]
          assert x["max_extra_accuracy_with_this_toolbox"] == 0
          assert x["source_git_blob"] == "8440a8dc13fa8084fd48407462deb7ef41c5e715"
          print("STRONGEST_MATCHED_OPENED_12_OF_12",x["decision"])
          PY
      - name: Preserve actual first model-free controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neumann-am2-first-model-free-opened-headroom
          path: |
            am2-first-model-free-opened.json
            am2-no-headroom.json
            am2-strong-tool-12of12.json
          if-no-files-found: warn
          retention-days: 90
