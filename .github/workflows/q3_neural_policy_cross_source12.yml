name: Q3 actual cross-source neural proof policy frozen12 first test
on:
  pull_request:
    paths:
      - '.github/workflows/q3_neural_policy_cross_source12.yml'
      - 'research/evidence/q3_neural_proof_policy_transfer_20261022/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learned_weight_transfer_original_dual_verified:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile frozen neural learner, authenticate target SHA-only registration BEFORE reading any target body
        run: |
          set -euo pipefail
          export R=research/evidence/q3_neural_proof_policy_transfer_20261022
          python -m py_compile "$R/learned_policy.py"
          python - <<'PY'
          import json,pathlib,hashlib
          b=pathlib.Path('research/evidence/q3_neural_proof_policy_transfer_20261022')
          m=json.loads((b/'HOLDOUT12_SHA_BEFORE_BODY.json').read_text())
          assert len(m['cases'])==12 and len({a['sha'] for a in m['cases']})==12
          assert len({a['name'] for a in m['cases']})==12
          assert m['study_regime'].startswith('FROZEN_MODEL_STRUCTURE_ONLY')
          t=json.loads((b/'teacher_dev8_minimal.json').read_text())
          assert len(t['cases'])==8
          print('FROZEN_SOURCE_ONLY_TARGET_REGISTER',hashlib.sha256((b/'HOLDOUT12_SHA_BEFORE_BODY.json').read_bytes()).hexdigest(),flush=True)
          print('TRAIN_DEV8_TEACHER_SHA256',hashlib.sha256((b/'teacher_dev8_minimal.json').read_bytes()).hexdigest(),flush=True)
          PY
      - name: Install exact dual backends and actual CPU PyTorch
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check numpy==1.26.4 torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get update -qq
          sudo apt-get install -y libz3-4
          curl -fL --retry 3 --connect-timeout 10 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          unzip -q /tmp/cvc5.zip -d /tmp
          sudo install -m 755 "$(find /tmp -maxdepth 4 -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          python - <<'PY'
          import torch; print('TRAINING_BACKEND',torch.__version__,torch.cuda.is_available(),flush=True)
          PY
      - name: Materialize authentic prior8 teacher sources separately from newly heldout12
        run: |
          set -euo pipefail
          mkdir -p /tmp/neumann-neural-policy/dev8 /tmp/neumann-neural-policy/holdout12 /tmp/neumann-neural-policy/evidence
          python - <<'PY'
          import json,hashlib,pathlib,urllib.request
          root=pathlib.Path('research/evidence/q3_neural_proof_policy_transfer_20261022')
          old=json.load(open('research/evidence/q3_source_houdini_sha12_20261022/PREVIOUS_OPEN_DEV8.json'))
          new=json.load(open(root/'HOLDOUT12_SHA_BEFORE_BODY.json'))
          assert len(old['cases'])==8 and len(new['cases'])==12
          for cohort,dest,meta in [('train8','dev8',old),('holdout12','holdout12',new)]:
              for x in meta['cases']:
                  u='https://raw.githubusercontent.com/SyGuS-Org/benchmarks/'+new['upstream_commit']+'/'+x['path']
                  b=urllib.request.urlopen(u,timeout=30).read()
                  blob=hashlib.sha1(('blob '+str(len(b))+'\0').encode()+b).hexdigest()
                  if blob!=x['sha'] or len(b)!=x['size']:
                      print('FROZEN_SHA_IDENTITY_FAILURE_ABSTAIN_NO_SUBSTITUTE',cohort,x['name'],x['sha'],blob,len(b),flush=True)
                      ledger=pathlib.Path('/tmp/neumann-neural-policy/evidence/SOURCE_IDENTITY_FAILURES.json')
                      entries=json.loads(ledger.read_text()) if ledger.exists() else []
                      entries.append({'case':x['name'],'cohort':cohort,'expected_blob':x['sha'],'actual_blob':blob,'expected_size':x['size'],'actual_size':len(b),'status':'FAIL_CLOSED'})
                      ledger.write_text(json.dumps(entries,indent=2)+'\n')
                      continue
                  pathlib.Path('/tmp/neumann-neural-policy',dest,x['name']).write_bytes(b)
                  print('AUTHENTIC_ORIGINAL',cohort,x['name'],len(b),blob,flush=True)
          PY
      - name: Real neural weights train ONLY on 8 prior certificates then transfer UNCHANGED to each 12 original sources
        run: |
          set -o pipefail
          R=research/evidence/q3_neural_proof_policy_transfer_20261022
          python "$R/learned_policy.py" \
            --engine research/evidence/q3_source_houdini_sha12_20261022/classical_houdini.py \
            --dev-dir /tmp/neumann-neural-policy/dev8 \
            --dev-manifest research/evidence/q3_source_houdini_sha12_20261022/PREVIOUS_OPEN_DEV8.json \
            --min-archive "$R/teacher_dev8_minimal.json" \
            --target-dir /tmp/neumann-neural-policy/holdout12 \
            --target-manifest "$R/HOLDOUT12_SHA_BEFORE_BODY.json" \
            --out /tmp/neumann-neural-policy/evidence/FIRST12_NEURAL_STATIC_RANDOM_EXACT.json \
            | tee /tmp/neumann-neural-policy/evidence/FIRST12_NEURAL_STATIC_RANDOM_EXACT.log
          sha256sum /tmp/neumann-neural-policy/evidence/FIRST12_NEURAL_STATIC_RANDOM_EXACT.json
      - name: Construct five source-original dual checker inputs from untouched per-arm candidates
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/neumann-neural-policy/evidence')
          r=json.load(open(p/'FIRST12_NEURAL_STATIC_RANDOM_EXACT.json'))
          assert len(r['cases'])==12
          for arm in ('learned','no_training','static','random','full'):
              items=[]
              for case in r['cases']:
                  x=case['routes'].get(arm,{})
                  items.append({'file':case['file'],'safe_certified':x.get('safe_certified',False),'invariant':x.get('invariant'),'source_algorithm':'NEURAL_POLICY_'+arm})
              (p/('RECHECK_INPUT_'+arm+'.json')).write_text(json.dumps({'cases':items},indent=2))
          PY
      - name: Independent original full source 3VC verifier Z3 and cvc5 for every accepted arm
        run: |
          set -o pipefail
          C=research/evidence/q3_source_houdini_sha12_20261022/independent_original_checker.py
          M=research/evidence/q3_neural_proof_policy_transfer_20261022/HOLDOUT12_SHA_BEFORE_BODY.json
          for arm in learned no_training static random full; do
            python "$C" --receipt "/tmp/neumann-neural-policy/evidence/RECHECK_INPUT_${arm}.json" \
              --input /tmp/neumann-neural-policy/holdout12 --manifest "$M" --backend dual \
              --out "/tmp/neumann-neural-policy/evidence/INDEPENDENT_DUAL_${arm}.json" \
              | tee "/tmp/neumann-neural-policy/evidence/INDEPENDENT_DUAL_${arm}.log"
          done
          python - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path('/tmp/neumann-neural-policy/evidence')
          raw=json.load(open(p/'FIRST12_NEURAL_STATIC_RANDOM_EXACT.json'))
          ledger={'weights_transfer_frozen':True,'source_original_denominator':12,'training_examples':raw['training']['samples'],'training_s':raw['training']['train_s'],'results':{}}
          for arm in ('learned','no_training','static','random','full'):
              d=json.load(open(p/('INDEPENDENT_DUAL_'+arm+'.json')))
              proposed=sum(x['routes'].get(arm,{}).get('safe_certified',False) for x in raw['cases'])
              certified=d['totals']['dual_safe_certified']
              assert proposed==certified,(arm,proposed,certified)
              ledger['results'][arm]={'proposed':proposed,'independent_dual_proven':certified,'checker_wall_s':d['wall_s'],
                'source_work_sum_queries':sum(x['routes'].get(arm,{}).get('total_queries_including_failed',x['routes'].get(arm,{}).get('queries',0)) for x in raw['cases'])}
          (p/'SCOPED_FIRST_RESULTS.json').write_text(json.dumps(ledger,indent=2,sort_keys=True)+'\n')
          print('SCOPED_FROZEN_RESULTS',json.dumps(ledger),flush=True)
          PY
      - name: Retain real first receipts even if parser/solver or convergence fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neumann-q3-actual-weight-transfer-first12-and-independent-strong-controls
          path: /tmp/neumann-neural-policy/evidence/
          if-no-files-found: warn
