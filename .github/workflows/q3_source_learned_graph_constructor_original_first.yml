name: Q3 Learns New Graph Constructor From Certified Source Programs

on:
  push:
    branches:
      - research/q3-graph-conditional-source-invention-20261107
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen_source_learned_meta_first:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable PREVIOUS original source proof (not future target)
        uses: actions/download-artifact@v4
        with:
          name: q3-conditional-bv-graph-24-untouched-original-first
          run-id: 42370828681
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prior
      - name: Preflight source induction and freeze meta method before target data
        run: |
          python -m py_compile research/q3/source_learned_conditional_meta_constructor.py
          git hash-object research/q3/source_learned_conditional_meta_constructor.py
          python - <<'PY'
          import sys,json
          sys.path.insert(0,"research/q3")
          import source_learned_conditional_meta_constructor as q
          assert q.NEW_IDS == [f"PRE_{i}_100" for i in range(54,78)]
          assert q.HELDOUT == 32
          archive=json.load(open("prior/Q3_CONDITIONAL_GRAPH_EXTERNAL_FIRST.json"))
          method=q.learn_method_from_prior(archive)
          assert len(method["source_original_ids"])>=3
          assert method["pattern"][:2]==["ite",["bit",0]] # source-derived regression, not target
          xx=[(i, (i>>16)+1 if i&1 else i+2) for i in range(64)]
          result=q.apply_learned_method(method,xx)
          assert result["status"]=="SOURCE_LEARNED_META_CONSTRUCTOR"
          assert all(q.base.run(result["ast"],i)==((i>>16)+1 if i&1 else i+2)
                     for i in range(64,4096))
          print("PRETARGET_SOURCE_META_METHOD_SHA256",method["content_hash"])
          print("PRETARGET_PREFLIGHT_PASS")
          PY
      - name: Score 24 new untouched independent original programs
        run: python research/q3/source_learned_conditional_meta_constructor.py
      - name: Preserve pre-target learned method and complete original FIRST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-autogenerated-graph-constructor-fresh-24-original-first
          path: |
            Q3_LEARNED_META_METHOD_BEFORE_NEW_TARGETS.json
            Q3_LEARNED_META_CONSTRUCTOR_NEW_ORIGINAL_FIRST.json
          if-no-files-found: warn
