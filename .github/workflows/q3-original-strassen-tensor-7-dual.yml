name: Q3 Strassen real original quantified 7-product tensor exact SAT and external rank7
on:
  pull_request:
    paths:
      - '.github/workflows/q3-original-strassen-tensor-7-dual.yml'
      - 'research/evidence/q3_strassen_exact_tensor_20261021/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual_original_bilinear_matrix_tensor_verification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SMT-LIB/benchmark-submission-2022
          ref: 81a39628827f61fbd74c6f3e67feb5c1b740d2f0
          path: original
          sparse-checkout: |
            non-incremental/NRA/20220222-strassen-matrix-multiplication
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate original source, no novel-trained model and citation contract
        run: |
          test "$(git -C original rev-parse HEAD)" = 81a39628827f61fbd74c6f3e67feb5c1b740d2f0
          python -m py_compile research/evidence/q3_strassen_exact_tensor_20261021/actual_original_strassen_tensor_exact_source_checker.py
          python - <<'PY'
          import json
          q=json.load(open('research/evidence/q3_strassen_exact_tensor_20261021/POST_FIRST_OPEN_STRASSEN_SOURCE_EXACT_TENSOR_AND_EXTERNAL_RANK7_CONTRACT.json'))
          assert q['schema']=='neumann.q3.posthoc_strassen_tensor_coefficient_3_original_source_gate.v1'
          assert q['posthoc_after_first_source_open'] and len(q['three_tasks'])==3
          assert 'Winograd 1971' in q['known_public_background']
          print('ORIGINAL_QUANTIFIED_TENSOR_EXTERNAL_KNOWN_PRIOR_ART_NOT_NEW_LEARNING')
          PY
      - name: Pinned Z3 cvc5 original SMT-LIB real quantifier solvers and exact SymPy
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check numpy==2.3.5 z3-solver==4.13.3.0 sympy==1.14.0
          lscpu | grep 'Model name' | head -1
      - name: Original true 3 matrix tensor math source identities and actual dual quantified original SAT
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_strassen_exact_tensor_20261021/actual_original_strassen_tensor_exact_source_checker.py --root original --freeze research/evidence/q3_fresh_real_nra_20261021/BEFORE_ANY_NEW_SOURCE_BODY_18_ORIGINALS.json --contract research/evidence/q3_strassen_exact_tensor_20261021/POST_FIRST_OPEN_STRASSEN_SOURCE_EXACT_TENSOR_AND_EXTERNAL_RANK7_CONTRACT.json --out /tmp/q3_strassen_real_three_source_originals.json | tee /tmp/q3_strassen_real_three_source_originals.log
          sha256sum /tmp/q3_strassen_real_three_source_originals.json
      - name: Preserve true source SAT witness certificates and conditional external UNSAT proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-original-strassen-public-seven-tensor-quantified-true-identity
          path: |
            /tmp/q3_strassen_real_three_source_originals.json
            /tmp/q3_strassen_real_three_source_originals.log
          if-no-files-found: warn
      - name: Fail closed on true original tensor maths and false novel-learning assertion
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3_strassen_real_three_source_originals.json'))
          assert x['source_original_all_three_authentic']==3
          assert x['source_linear_complete_original_SAT_algebraic']
          assert x['source_hard_complete_original_SAT_algebraic']
          assert x['source_impossible_classification_external_rank7_theorem_only']
          assert x['published_prior_art_strassen_and_winograd_not_model_invention']
          assert x['model_training_and_neural_forwards']==0
          assert not x['learned_unique_Q3_proven']
          assert x['global_Q3']==x['global_Q4']==x['global_Q5']=='OPEN'
          for t in x['original_three'][:2]:
              assert t['source_complete_real_mathematical_identity_valid']
              assert t['original_source_full_real_quantified_identity_coefficient_proof']['all_actual_original_output_input_basis_coefficients_exact']==64
              assert t['exact_original_source_all_existentials_grounded_real']>=28
          k=x['original_three'][2]['original_native_rank_six_external_theorem_premises']
          assert k['actual_original_all_four_outputs_six_active_rank_one_products']
          assert k['actual_original_seventh_weight_exactly_literal_zero']
          assert k['this_source_bridge_NOT_a_formal_proof_of_Winograd_theorem']
          print('TRUE_ORIGINAL_STRASSEN_EXACT_FULL_QUANTIFIER_SAT_ALGEBRAIC_2_OF_2')
          print('TRUE_ORIGINAL_STRASSEN_EXTERNAL_KNOWN_RANK7_CONDITIONAL_UNSAT_1_OF_1')
          PY
