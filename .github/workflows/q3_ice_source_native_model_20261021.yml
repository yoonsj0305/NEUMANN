name: Q3 posthoc actual ICE-trained multivariate source-native invariants
on:
  pull_request:
    paths:
      - '.github/workflows/q3_ice_source_native_model_20261021.yml'
      - 'research/evidence/q3_ice_multivariate_20261021/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fit_ICE_learner_on_original_counterexamples_not_human_invariant:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: original
          sparse-checkout: |
            lib/Inv_Track/from_2018
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Honest retrospective source and model implementation lint
        run: |
          test "$(git -C original rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          python -m py_compile research/evidence/q3_ice_multivariate_20261021/real_ICE_multivariate_original_training.py
          echo 'PRIOR_SOURCE_BODIES_ALREADY_OPENED_V2_IS_POSTHOC_NOT_FIRSTBLIND'
      - name: Original source-independent Z3+cvc5 and CPU sklearn multivariate SVM
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 z3-solver==4.13.3.0
      - name: Train actual counterexample conditioned CPU model and verify source original full three VCs
        run: |
          set -o pipefail
          PYTHONPATH=. OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python research/evidence/q3_ice_multivariate_20261021/real_ICE_multivariate_original_training.py \
            --root original \
            --freeze research/evidence/q3_firstblind_eight_trained_20261021/BEFORE_EIGHT_NEW_ORIGINAL_SOURCE_BODIES_SHA_LOCK.json \
            --out /tmp/q3_ICE_actual_trained_source8_original.json | tee /tmp/q3_ICE_actual_trained_source8_original.log
          sha256sum /tmp/q3_ICE_actual_trained_source8_original.json
      - name: Preserve failures, successful learned original proofs, ablation and training receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-real-source8-posthoc-ICE-trained-SVM-original-full-dual-proof
          path: |
            /tmp/q3_ICE_actual_trained_source8_original.json
            /tmp/q3_ICE_actual_trained_source8_original.log
          if-no-files-found: warn
      - name: Only original independently proven full three-VCs are accepted
        if: success()
        run: |
          python - <<'PY'
          import json
          q=json.load(open('/tmp/q3_ICE_actual_trained_source8_original.json'))
          assert q['schema']=='neumann.q3.posthoc_ice_actual_trained_multivariate_counterexample_invariants.v1'
          assert q['original_programs_previously_opened_by_PR395']
          assert q['original_case_count']==8
          assert q['global_Q3']==q['global_Q4']==q['global_Q6']=='OPEN'
          assert q['strongest_equal_authority_classical_structure_not_exhaustively_compared']
          for x in q['real_programs']:
              if x.get('actual_trained_original_full_native_Z3_cvc5_3VC',{}).get('fully_verified_complete_original_3VC'):
                  assert all(v['dual_pass'] for v in x['actual_trained_original_full_native_Z3_cvc5_3VC']['independent_original_pre_trans_post_dual_proofs'].values())
          print('POSTHOC_TRAINED_REAL_NATIVE_INVARIANT_MODEL_HONEST_RESULTS_PRESERVED')
          PY
