name: Q3S first learned source-affine variable relation AST on last two untouched original families
on:
  pull_request:
    paths:
      - 'research/evidence/q3s-first-affine-20261018/**'
      - 'docs/research/Q3S_FIRST_AFFINE_TYPED_LEARNER_PREREG_20261018.md'
      - '.github/workflows/q3s-first-affine-typed-original-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frozen-first-affine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SaswatPadhi/LoopInvGen
          ref: 6ac90265b11431c9477dfbd33e3e3380234c0499
          path: external_loopinvgen
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          repository: yoonsj0305/NEUMANN
          run-id: 39094837562
          name: q3q-first-learned-source-ast-constructor-original-3vc-full-baselines
          github-token: ${{ github.token }}
          path: /tmp/q3s-first-q3q
      - uses: actions/download-artifact@v4
        with:
          repository: yoonsj0305/NEUMANN
          run-id: 39096215784
          name: q3r-first-truly-new-origin-trained-constructor-postonly-fullclassical-originals
          github-token: ${{ github.token }}
          path: /tmp/q3s-first-q3r
      - name: Pin CPU-based original solver and train neural engine
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m py_compile research/evidence/q3s-first-affine-20261018/first_new_affine_relationship_proposer.py
      - name: First original affine variable relation learned proposals across frozen last two fresh families
        run: |
          python research/evidence/q3s-first-affine-20261018/first_new_affine_relationship_proposer.py --root external_loopinvgen --old-q3q /tmp/q3s-first-q3q/q3q-first-real-neural-construction-original-proof.json --old-q3r /tmp/q3s-first-q3r/q3r-first-new-family-original-3vc.json --out /tmp/q3s-first-new-affine-learned-original.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3s-first-new-affine-learned-original.json'))
          assert x['status']=='COMPLETE_FIRST_FROZEN_AFFINE_STUDY'
          assert x['all_old_corpus_original_count']==56
          assert len(x['newly_selected_origin_groups'])<=2
          assert x['new_unique_original_file_count']>0
          assert x['training_from_old_originals_completed_before_new_target_body_read'] is True
          assert x['original_training']['neural_parameters']==1633
          assert x['original_training']['positive']>0
          assert x['original_training']['negative']>0
          assert x['source_declared_operators_are_HUMAN_DESIGNED_not_model_invented'] is True
          assert x['q3f_escrow_competition_problem_source_opened'] is False
          assert x['no_original_external_source_or_formula_redistributed'] is True
          assert x['global_q1_q7']=='OPEN'
          assert len(x['all_first_exact_original_receipts'])==x['new_unique_original_file_count']
          assert len(set(r['original_source_sha'] for r in x['all_first_exact_original_receipts']))==x['new_unique_original_file_count']
          for r in x['all_first_exact_original_receipts']:
              assert r['new_origin_group'] in x['newly_selected_origin_groups']
              if r.get('trained_complete_original_3VC_proof'):
                  j=r['all_original_three_vc_results']['TRAINED_TOP12']
                  assert j['status']=='ALL_THREE_ORIGINAL_VCS_UNSAT_NONTRIVIAL'
                  assert j['strict_original_3vc_status']=='ALL_THREE_ORIGINAL_VCS_UNSAT'
                  assert j['nonvacuous_source_postcondition'] is True
                  assert j['final_conjunction_atom_count']>0
          print('Q3S_FIRST_FROZEN_REAL_TYPED_AFFINE_SOURCE_ORIGINAL_PROOFS_AND_STRONG_CONTROLS_RECORDED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3s-first-affine-last-unopened-two-source-groups-original-3vc
          path: /tmp/q3s-first-new-affine-learned-original.json
          retention-days: 90
