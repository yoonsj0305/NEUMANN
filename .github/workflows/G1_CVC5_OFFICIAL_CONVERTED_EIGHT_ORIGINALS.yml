name: NEUMANN G1 official SyGuS1->2 cvc5 real specialist eight external originals
on:
  push:
    branches:
      - research/g1-first-ownweight-ast-sygus-20261106
    paths:
      - .github/workflows/G1_CVC5_OFFICIAL_CONVERTED_EIGHT_ORIGINALS.yml
permissions:
  contents: read
  actions: read
jobs:
  official-converter-and-specialist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned publisher converter and real specialist
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cvc5
          python -m pip install --quiet --user ply==3.11 pyparsing==2.4.7
          git init "$RUNNER_TEMP/sygus-tools"
          git -C "$RUNNER_TEMP/sygus-tools" remote add origin https://github.com/SyGuS-Org/tools.git
          git -C "$RUNNER_TEMP/sygus-tools" fetch --depth=1 origin 9f5cc084b77ce172a22c646dc54528b639ffb139
          git -C "$RUNNER_TEMP/sygus-tools" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/sygus-tools" rev-parse HEAD)" = '9f5cc084b77ce172a22c646dc54528b639ffb139'
          cvc5 --version | head -1
      - name: Source-free controls for exact original train conservation, withheld last and parser
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_g1_postfirst_official_converter.py -v
          python -m unittest discover -s tests -p test_g1_postfirst_real_sygus_specialist.py -v
      - name: Full expert ORIGINAL eight after publisher v1->v2 conversion, original gold hidden during synthesis
        shell: bash
        run: |
          set -uo pipefail
          python -m research.g1.postfirst_official_converter_cvc5 "$RUNNER_TEMP/sygus-tools" > G1-REAL-CVC5-OFFICIAL-CONVERTED-8.json 2> G1-REAL-CVC5-OFFICIAL-CONVERTED-8.stderr
          rc=$?
          if test -s G1-REAL-CVC5-OFFICIAL-CONVERTED-8.json; then
            python - <<'PY'
          import json
          x=json.load(open('G1-REAL-CVC5-OFFICIAL-CONVERTED-8.json'))
          print(json.dumps({'scientific_status':x['scientific_status'],'stats':x.get('stats'),
          'per_task':[{'name':r['name'],'status':r['status'],
            'expert_candidate':(r.get('specialist') or {}).get('status'),
            'original_ground_verified':r['verified_heldout'],
            'converter':(r.get('conversion') or {}).get('status')}
            for r in x.get('rows',[])]},sort_keys=True))
          assert x.get('stats',{}).get('original_external_denominator')==8
          assert x.get('stats',{}).get('original_training_weights_retrained') is False
          assert x.get('stats',{}).get('ARC_public_eval_originals_consumed')==0
          PY
            v=$?
            if test "$v" -ne 0;then rc=1;fi
          else
            rc=1
          fi
          cat G1-REAL-CVC5-OFFICIAL-CONVERTED-8.stderr
          echo "OFFICIAL_CONVERTER_SPECIALIST_PROCESS_EXIT=$rc"
          exit "$rc"
      - name: Hash all original public expert results, including no-witness failures
        if: always()
        shell: bash
        run: |
          if test -s G1-REAL-CVC5-OFFICIAL-CONVERTED-8.json; then
            sha256sum G1-REAL-CVC5-OFFICIAL-CONVERTED-8.json > G1-REAL-CVC5-OFFICIAL-CONVERTED-8.sha256
            cat G1-REAL-CVC5-OFFICIAL-CONVERTED-8.sha256
          fi
      - name: Preserve exact official conversion, cvc5 specialist and original validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEUMANN-G1-OFFICIAL-CONVERTER-CVC5-EIGHT-POSTFIRST
          path: |
            G1-REAL-CVC5-OFFICIAL-CONVERTED-8.json
            G1-REAL-CVC5-OFFICIAL-CONVERTED-8.stderr
            G1-REAL-CVC5-OFFICIAL-CONVERTED-8.sha256
          if-no-files-found: warn
          retention-days: 90
