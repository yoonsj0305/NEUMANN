name: FGSR original 48 source-equivalent tautology deletion first and matched classical replay
on:
  pull_request:
    paths:
      - '.github/workflows/fgsr-48-tautology-equivalent-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-carrying-source-simplification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FGSR_RESULT: research/evidence/fgsr-double-lock-original-20261017/first_exact_original_tautology_receipt.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin Z3 and precheck source syntax
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
          python -m py_compile research/evidence/fgsr-double-lock-original-20261017/exact_tautology_reduce_original.py
      - name: Independently prove deletions valid for arbitrary Inv and run equivalent original
        run: |
          python -u research/evidence/fgsr-double-lock-original-20261017/exact_tautology_reduce_original.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/evidence/fgsr-double-lock-original-20261017/first_exact_original_tautology_receipt.json').read_text())
          assert r.get('original_source_sha_verified')
          assert len(r.get('clauses',[]))==48
          assert r.get('preserved_original_clause_count')+len(r.get('removed_tautological_clause_indices',[]))==48
          print('ORIGINAL_EQUIVALENT',r['status'])
          print('TAUTOLOGY_ORIGINAL_INDICES',r['removed_tautological_clause_indices'])
          print('ALL_Q',r['q1_to_q7'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgsr-double-lock-exact-48-clause-tautology-proof-and-equivalent-replay
          path: research/evidence/fgsr-double-lock-original-20261017/first_exact_original_tautology_receipt.json
          if-no-files-found: warn
          retention-days: 45
