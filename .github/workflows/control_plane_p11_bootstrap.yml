name: P1.1 first-run bootstrap contracts

on:
  pull_request:
    paths:
      - 'scripts/control_plane_p11_kaggle.py'
      - 'tests/test_control_plane_p11_kaggle.py'
      - 'docs/experiments/control_plane_p11_bootstrap.freeze.json'
      - 'docs/research/control_plane_p11_kaggle.md'
      - '.github/workflows/control_plane_p11_bootstrap.yml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core dependencies for unchanged source registration; no model
        run: pip install -e .
      - name: First-only orchestration, timeout cleanup and evidence integrity; no model
        run: python -m unittest discover -s tests -p 'test_control_plane_p11_kaggle.py' -v
      - name: Verify bootstrap bytes and unchanged original source registration
        run: |
          python -c "import hashlib,json,pathlib; p=pathlib.Path('.'); f=json.loads((p/'docs/experiments/control_plane_p11_bootstrap.freeze.json').read_bytes()); assert hashlib.sha256((p/f['bootstrap_path']).read_bytes()).hexdigest()==f['bootstrap_sha256']; assert f['runtime_head']=='4e6db9926a27c94f63c8d539d0c6e57c34b49336'"
          python -m experiments.control_plane_p11_dev --check-registration
