name: Q3 original LCM independently certified decomposed ghost proof
on:
  pull_request:
    paths:
      - '.github/workflows/q3-lcm-decomposed-ghost-first.yml'
      - 'research/evidence/q3_lcm_ghost_quotient_20261020/**'
      - 'docs/research/Q3_LCM_GHOST_QUOTIENT_COMPOSITIONAL_FROZEN_20261020.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first_dual_backend_ghost_lift:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SaswatPadhi/LoopInvGen
          ref: 6ac90265b11431c9477dfbd33e3e3380234c0499
          path: original_loopinvgen
          sparse-checkout: |
            benchmarks/NIA/other
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze original revision and study syntax
        run: |
          test "$(git -C original_loopinvgen rev-parse HEAD)" = 6ac90265b11431c9477dfbd33e3e3380234c0499
          python -m py_compile research/evidence/q3_lcm_ghost_quotient_20261020/compositional_source_original_proof.py
      - name: Independently pinned cvc5 and native Z3 plus exact integer algebra
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          test "$(find /tmp/cvc5bin -type f -name cvc5 | wc -l)" -eq 1
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 sympy==1.14.0 z3-solver==4.13.3.0
      - name: FIRST exact actual original branch ghost-quotient sublemma proof
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_lcm_ghost_quotient_20261020/compositional_source_original_proof.py --source-root original_loopinvgen --out /tmp/q3_lcm_ghost_first.json | tee /tmp/q3_lcm_ghost_first.log
          sha256sum /tmp/q3_lcm_ghost_first.json
      - name: Preserve FIRST failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-lcm-ghost-quotient-first-original
          path: |
            /tmp/q3_lcm_ghost_first.json
            /tmp/q3_lcm_ghost_first.log
          if-no-files-found: warn
      - name: Strict proof scope, no invented global Q3
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3_lcm_ghost_first.json'))
          assert x['original_git_blob']=='6c0cbaafc0c8b960d6047014dc5670554aacbc85'
          assert x['Q3_global']==x['Q1_Q7_global']=='OPEN'
          assert not x['genuine_unseen_original_source']
          assert not x['neural_trained_new_structure']
          assert len(x['selected_modular_relations'])==4
          assert len(x['source_only_integer_lattice_old_certificate'])==8
          assert x['total_sublemmas']>=20
          assert x['dual_independently_unsat_sublemmas']==x['total_sublemmas'],[
            (v['name'],v['Z3'],v['cvc5'].get('result'))
            for v in x['compositional_sublemmas'] if not v['both_unsat']]
          assert x['full_compositional_original_safety_certificate'] is True
          print('REAL_ORIGINAL_LCM_DECOMPOSED_DUAL_CERTIFICATE_PASS')
          print('MONOLITHIC_DIRECT_Z3_REMAINS',x['monolithic_original_3VC_unchanged_status'])
          PY
