name: Q3 First External Original Nonregular Counter Invention
on:
  pull_request:
    paths:
      - "neumann1/unbounded_counter_inventor.py"
      - "research/q3/q3_counter_external_first.py"
      - ".github/workflows/q3_counter_external_original_first.yml"
  workflow_dispatch:

jobs:
  counter-grammar-first-original:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Freeze independent author's original repository version
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/eendor/formal-languages.git /tmp/q3-external-author
          git -C /tmp/q3-external-author fetch --depth 1 origin 9f43910c2d2facfcc3c8e1510dcfae7003caf638
          git -C /tmp/q3-external-author checkout --detach FETCH_HEAD
          test "$(git -C /tmp/q3-external-author rev-parse HEAD)" = 9f43910c2d2facfcc3c8e1510dcfae7003caf638
          test -f /tmp/q3-external-author/examples/cfg_anbn.json
          test -f /tmp/q3-external-author/examples/pda_balanced.json
      - name: Invent unbounded state using isolated SOURCE author-oracle only
        run: |
          python -m research.q3.q3_counter_external_first propose \
            --author-root /tmp/q3-external-author \
            --output q3_counter_frozen_first.json
          sha256sum q3_counter_frozen_first.json > q3_counter_frozen_first.sha256
      - name: Only now score independent original CFG/PDA gold
        run: |
          frozen_sha="$(cut -d' ' -f1 q3_counter_frozen_first.sha256)"
          python -m research.q3.q3_counter_external_first score \
            --author-root /tmp/q3-external-author \
            --predictions q3_counter_frozen_first.json \
            --sha "$frozen_sha" \
            --output q3_counter_external_original_score.json
      - uses: actions/upload-artifact@v4
        with:
          name: q3-nonregular-original-source-first-frozen
          path: |
            q3_counter_frozen_first.json
            q3_counter_frozen_first.sha256
            q3_counter_external_original_score.json
          if-no-files-found: error
