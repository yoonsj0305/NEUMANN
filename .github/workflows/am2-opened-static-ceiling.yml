name: AM2 opened twelve static-tool capability ceiling FIRST audit
on:
  pull_request:
    paths:
      - '.github/workflows/am2-opened-static-ceiling.yml'
      - 'neumann1/am2_classical_code_compiler.py'
      - 'experiments/am2_static_code_ceiling_first.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-twelve-strong-static-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original twelve-task benchmark frozen source
        run: |
          test "$(git hash-object experiments/general_multiplier_tasks.py)" = 357f4bb4827543b0a2c9f8d809c8911b51040820
          python -m py_compile neumann1/am2_classical_code_compiler.py experiments/am2_static_code_ceiling_first.py
      - name: Install only declared project Python runtime
        run: python -m pip install .
      - name: One frozen full twelve original static-tool challenger execution
        run: |
          set -o pipefail
          python -m experiments.am2_static_code_ceiling_first --out /tmp/am2_static_first_twelve.json | tee /tmp/am2_static_first_stdout.txt
          sha256sum /tmp/am2_static_first_twelve.json
      - name: Always preserve first positive or negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am2-first-static-challenger-twelve-originals
          path: |
            /tmp/am2_static_first_twelve.json
            /tmp/am2_static_first_stdout.txt
          if-no-files-found: warn
      - name: Enforce capability-veto proof boundary
        if: success()
        run: |
          python - <<'PY'
          import json,sys
          r=json.load(open('/tmp/am2_static_first_twelve.json'))
          print('AM2_FIRST_STATIC_CEILING:',r['status'])
          assert r['original_task_set_sha256']
          assert r['historical_am1_verdict']=='FAIL_UNCHANGED'
          assert r['new_baseline_tooling'].startswith('YES_')
          assert r['global_Q1_Q7']=='OPEN'
          assert r['no_model_load'] and r['model_calls']==0 and r['gpu_calls']==0
          if not r['first_gate_pass']:
              sys.exit(2)
          assert r['per_arm']['TOOL']['original_checker_successes']==12
          assert r['per_arm']['NEUMANN']['original_checker_successes']==12
          assert r['static_tool_plus2_capability_path_logically_possible'] is False
          assert r['efficiency_path']=='OPEN_NOT_MEASURED_WITH_ACTUAL_FROZEN_MODEL'
          print('FIRST_STRONGER_STATIC_TOOL_12_OF_12_PLUS2_IMPOSSIBLE_SCOPED')
          PY
