name: Q3 Prospective 100 Original Source - Coordinate and Causal Invention Gate
on:
  push:
    branches:
      - research/q3-source-inferred-coordinate-morphism-20261110
      - research/q3-periodic-residual-causal-invention-20261110
      - research/q3-coordinate-prospective-100-original-20261110
    paths:
      - ".github/workflows/q3_coordinate_original_source_gate.yml"
      - "neumann1/q3_periodic_residual_invention.py"
      - "neumann1/q3_coordinate_morphisms.py"
      - "tests/test_q3_periodic_residual_invention.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
jobs:
  freeze_prospective_source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pre-register 100 original author SOURCE IDs by SHA, exclude prior 50 before looking at SOURCE results
        run: |
          set -euo pipefail
          python -m pip install -q -e . pytest
          python -m pytest -q -x tests/test_q3_prospective_source_contract.py
          mkdir -p old prospective
          gh run download 42735035357 \
            --name q3-original-arc2-source-only-frozen \
            --dir old
          test "$(cut -d ' ' -f1 old/ORIGINAL_SOURCE_ONLY.sha256)" = \
               "$(sha256sum old/ORIGINAL_SOURCE_ONLY.json | cut -d ' ' -f1)"
          git init -q /tmp/prospective-author
          git -C /tmp/prospective-author fetch -q --depth 1 \
            https://github.com/arcprize/ARC-AGI-2.git \
            f3283f727488ad98fe575ea6a5ac981e4a188e49
          git -C /tmp/prospective-author checkout -q FETCH_HEAD
          test "$(git -C /tmp/prospective-author rev-parse HEAD)" = \
            f3283f727488ad98fe575ea6a5ac981e4a188e49
          python -m research.q3.q3_coordinate_original_source_gate freeze-prospective \
            --author-root /tmp/prospective-author/data/training \
            --old-source old/ORIGINAL_SOURCE_ONLY.json \
            --out prospective/ORIGINAL_SOURCE_ONLY.json
          sha256sum prospective/ORIGINAL_SOURCE_ONLY.json > prospective/ORIGINAL_SOURCE_ONLY.sha256
          rm -rf /tmp/prospective-author
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("prospective/ORIGINAL_SOURCE_ONLY.json").read_text())
          assert d["original_source_count"]==100
          assert d["source_scope"]=="PROSPECTIVE_100_RELATIVE_TO_PRIOR_50_ONLY"
          assert d["no_target_gold_in_payload"] is True
          print("Q3_PROSPECTIVE_UNTUNED_METHOD_SOURCE_COHORT_FROZEN",
                [r["source_id"][:8] for r in d["records"]],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q3-prospective-source-100-originals-frozen
          path: prospective/
          retention-days: 90

  source_invention:
    needs: freeze_prospective_source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: q3-prospective-source-100-originals-frozen
          path: previous
      - name: Same single SOURCE core; new general index representation, actual isolated Docker
        run: |
          set -euo pipefail
          python -m pip install -q -e . pytest
          docker pull python:3.11-alpine
          python -m pytest -q -x tests/test_q3_coordinate_morphisms.py tests/test_q3_periodic_residual_invention.py
          mkdir -p previous methods
          test "$(cut -d ' ' -f1 previous/ORIGINAL_SOURCE_ONLY.sha256)" = \
               "$(sha256sum previous/ORIGINAL_SOURCE_ONLY.json | cut -d ' ' -f1)"
          python -m research.q3.q3_coordinate_original_source_gate invent \
            --source previous/ORIGINAL_SOURCE_ONLY.json \
            --out methods/FROZEN_SOURCE_METHODS.json
          sha256sum methods/FROZEN_SOURCE_METHODS.json \
            > methods/FROZEN_SOURCE_METHODS.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("methods/FROZEN_SOURCE_METHODS.json").read_text())
          assert x["source_originals"]==100
          assert x["target_gold_accessed"] is False
          print("Q3_PROSPECTIVE_100_ORIGINAL_SOURCE_CERTIFICATIONS",
                {"source_certified":x["source_verified_count"],
                 "total":x["source_originals"],
                 "scope":x["prior_exposure"]},flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q3-coordinate-frozen-source-methods
          path: methods/
          retention-days: 90

  freeze_original_test_inputs:
    needs: source_invention
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: q3-coordinate-frozen-source-methods
          path: methods
      - name: Serialize only original input data AFTER SOURCE code methods are frozen
        run: |
          set -euo pipefail
          python -m pip install -q -e .
          git init -q /tmp/official-arc2
          git -C /tmp/official-arc2 fetch -q --depth 1 \
            https://github.com/arcprize/ARC-AGI-2.git \
            f3283f727488ad98fe575ea6a5ac981e4a188e49
          git -C /tmp/official-arc2 checkout -q FETCH_HEAD
          mkdir -p blind
          python -m research.q3.q3_coordinate_original_source_gate blind \
            --methods methods/FROZEN_SOURCE_METHODS.json \
            --author-root /tmp/official-arc2/data/training \
            --out blind/TARGET_INPUTS_ONLY.json
          sha256sum blind/TARGET_INPUTS_ONLY.json > blind/TARGET_INPUTS_ONLY.sha256
          rm -rf /tmp/official-arc2
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("blind/TARGET_INPUTS_ONLY.json").read_text())
          assert p["target_gold_not_serialized"] is True
          assert all("test" not in r and "target_inputs" in r
                     for r in p["entries"])
          print("Q3_POSTFIRST_ORIGINAL_TARGET_INPUTS_FROZEN",
                [x["id"][:8] for x in p["entries"]],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q3-coordinate-original-input-blind
          path: blind/
          retention-days: 90

  predict_frozen:
    needs: freeze_original_test_inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: q3-coordinate-frozen-source-methods
          path: methods
      - uses: actions/download-artifact@v4
        with:
          name: q3-coordinate-original-input-blind
          path: blind
      - name: Docker-execute previously locked method on original author input only
        run: |
          set -euo pipefail
          python -m pip install -q -e .
          docker pull python:3.11-alpine
          mkdir -p predictions
          python -m research.q3.q3_coordinate_original_source_gate predict \
            --methods methods/FROZEN_SOURCE_METHODS.json \
            --blind blind/TARGET_INPUTS_ONLY.json \
            --out predictions/PREDICTIONS.json
          sha256sum predictions/PREDICTIONS.json \
            > predictions/PREDICTIONS.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: q3-coordinate-original-author-predictions-before-gold
          path: predictions/
          retention-days: 90

  postfrozen_original_author_score:
    needs: predict_frozen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: q3-coordinate-frozen-source-methods
          path: methods
      - uses: actions/download-artifact@v4
        with:
          name: q3-coordinate-original-input-blind
          path: blind
      - uses: actions/download-artifact@v4
        with:
          name: q3-coordinate-original-author-predictions-before-gold
          path: predictions
      - name: Independently read original-author test outputs ONLY AFTER prediction SHA freeze
        run: |
          set -euo pipefail
          python -m pip install -q -e .
          test "$(cut -d ' ' -f1 predictions/PREDICTIONS.sha256)" = \
               "$(sha256sum predictions/PREDICTIONS.json | cut -d ' ' -f1)"
          git init -q /tmp/official-arc2
          git -C /tmp/official-arc2 fetch -q --depth 1 \
            https://github.com/arcprize/ARC-AGI-2.git \
            f3283f727488ad98fe575ea6a5ac981e4a188e49
          git -C /tmp/official-arc2 checkout -q FETCH_HEAD
          mkdir -p score
          python -m research.q3.q3_coordinate_original_source_gate score \
            --author-root /tmp/official-arc2/data/training \
            --methods methods/FROZEN_SOURCE_METHODS.json \
            --blind blind/TARGET_INPUTS_ONLY.json \
            --predictions predictions/PREDICTIONS.json \
            --expected-sha "$(cut -d ' ' -f1 predictions/PREDICTIONS.sha256)" \
            --out score/POSTFIRST_ORIGINAL_SCORE.json
          sha256sum score/POSTFIRST_ORIGINAL_SCORE.json \
            > score/POSTFIRST_ORIGINAL_SCORE.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("score/POSTFIRST_ORIGINAL_SCORE.json").read_text())["summary"]
          assert result["q3_global"]=="OPEN"
          assert result["scientific_scope"]=="PREVIOUSLY_EXPOSED_AUTHOR_SOURCE_DEV"
          print("Q3_AUTHOR_ORIGINAL_RESULT_NOT_GLOBAL_PASS",result,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q3-coordinate-original-author-scored-not-global-Q3
          path: score/
          retention-days: 90
