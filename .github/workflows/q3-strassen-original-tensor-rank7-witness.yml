name: Q3 authentic Strassen original exact tensor witness and independent universal verification
on:
  pull_request:
    paths:
      - '.github/workflows/q3-strassen-original-tensor-rank7-witness.yml'
      - 'research/evidence/q3_strassen_exact_tensor_20261021/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic_original_strassen_bilinear_tensor_witness:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SMT-LIB/benchmark-submission-2022
          ref: 81a39628827f61fbd74c6f3e67feb5c1b740d2f0
          path: original
          sparse-checkout: |
            non-incremental/NRA/20220222-strassen-matrix-multiplication
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen original and executable source certificate syntax
        run: |
          test "$(git -C original rev-parse HEAD)" = 81a39628827f61fbd74c6f3e67feb5c1b740d2f0
          python -m py_compile research/evidence/q3_strassen_exact_tensor_20261021/original_strassen_rank7_exact_bilinear_symbolic_witness.py
          python - <<'PY'
          import json
          x=json.load(open('research/evidence/q3_strassen_exact_tensor_20261021/POST_FIRST_OPEN_STRASSEN_SOURCE_EXACT_TENSOR_AND_EXTERNAL_RANK7_CONTRACT.json'))
          assert x['posthoc_after_first_source_open'] and len(x['three_tasks'])==3
          assert x['schema']=='neumann.q3.posthoc_strassen_tensor_coefficient_3_original_source_gate.v1'
          print('POSTHOC_STRASSEN_EXACT_ORIGINAL_METHOD_PREREGISTERED')
          PY
      - name: Pinned actual independent original QF_NRA Z3 and cvc5 solvers
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check numpy==2.3.5 z3-solver==4.13.3.0 sympy==1.14.0
          lscpu | grep 'Model name' | head -1
      - name: True source Strassen first exact tensor coefficient witness and full original universal quantification
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_strassen_exact_tensor_20261021/original_strassen_rank7_exact_bilinear_symbolic_witness.py --root original --freeze research/evidence/q3_fresh_real_nra_20261021/BEFORE_ANY_NEW_SOURCE_BODY_18_ORIGINALS.json --contract research/evidence/q3_strassen_exact_tensor_20261021/POST_FIRST_OPEN_STRASSEN_SOURCE_EXACT_TENSOR_AND_EXTERNAL_RANK7_CONTRACT.json --out /tmp/q3_strassen_true_original_exact_tensor.json | tee /tmp/q3_strassen_true_original_exact_tensor.log
          sha256sum /tmp/q3_strassen_true_original_exact_tensor.json
      - name: Preserve full exact original real source proofs including any failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-authentic-strassen-rank7-tensor-original-dual-quantifier
          path: |
            /tmp/q3_strassen_true_original_exact_tensor.json
            /tmp/q3_strassen_true_original_exact_tensor.log
          if-no-files-found: warn
      - name: No original hard SAT without dual QF NRA quantified proof
        if: success()
        run: |
          python - <<'PY'
          import json
          q=json.load(open('/tmp/q3_strassen_true_original_exact_tensor.json'))
          assert q['preregistered_before_first_strassen_exact_method_evidence_commit']=='f9d66c5bc9493ad0a1f1106484cf7a05ceca9b85'
          assert q['all_source_files_original_git_authenticated']
          assert q['actual_original_linear_proved_SAT_doubly']
          assert q['actual_original_hard_proved_SAT_doubly']
          assert q['original_impossible_remains_UNPROVEN']
          assert q['prior_known_classical_Strassen_algorithm_public']
          assert q['no_neural_training_or_learned_unique_Q3']
          assert q['global_Q3']==q['global_Q4']==q['global_Q5']=='OPEN'
          assert q['linear_source_exact_full_tensor_64']['source_exact_all_4x16_basis_coefficients_match']
          assert q['original_hard_independent_two_solver_all_reals_proof']['both_independent_engines_proved_forall_over_ALL_REAL_matrices']
          assert q['original_linear_independent_two_solver_all_reals_proof']['both_independent_engines_proved_forall_over_ALL_REAL_matrices']
          print('REAL_ORIGINAL_STRASSEN_LINEAR_HARD_UNIVERSAL_SAT_Z3_CVC5_CERTIFIED_2_OF_2')
          PY
