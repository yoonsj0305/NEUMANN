name: NEUMANN G3 real Eldarica2.3 and Golem0.9 postFIRST 15 originals
on:
  push:
    branches:
      - research/q3-g3-2025-chc-native-first-20261106
    paths:
      - .github/workflows/G3_POSTFIRST_ELDARICA_GOLEM_15_ORIGINAL.yml
permissions:
  contents: read
  actions: read
jobs:
  exact-native-strong-baseline:
    strategy:
      fail-fast: false
      matrix:
        cohort:
          - ARRAY_CHC
          - LIA_MULTIPHASE
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: NEUMANN-G3-2025-CHC-LIA_MULTIPHASE-NATIVE-ORIGINAL-FIRST
          run-id: 42174775254
          github-token: ${{ github.token }}
          path: immutable-lia
      - uses: actions/download-artifact@v4
        with:
          name: NEUMANN-G3-2025-CHC-ARRAY_CHC-NATIVE-ORIGINAL-FIRST
          run-id: 42174775254
          github-token: ${{ github.token }}
          path: immutable-array
      - name: Verify exact original untouched first two cohort byte receipts, and accepted source-free expert trial
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/g3/chccomp2025_postfirst_specialists.py
          echo 'c4529472973dc7e102e3b755ff866ccac5f285a9d7206488d65dd054f5b41535  immutable-lia/G3-LIA_MULTIPHASE-NATIVE-ORIGINAL-FIRST.json' | sha256sum -c -
          echo '47d2776afe699cccab8dc6d6e4b4f06707522f61e8d3d079c478c5614ed5f8c8  immutable-array/G3-ARRAY_CHC-NATIVE-ORIGINAL-FIRST.json' | sha256sum -c -
          test -f docs/experiments/G3_POSTFIRST_STRONG_2025_CHC_2_NEW_NATIVE_SPECIALISTS_CONTRACT_2026_11_06.json
          echo 'PINNED_ORIGINAL_15_FROM_FIRST_NONPROVEN_STATUS'
      - name: Install strong classical experts strictly SHA256-pinned to publisher release bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native"
          curl -fLsS --retry 2 --max-time 75 \
            https://github.com/uuverifiers/eldarica/releases/download/v2.3/eldarica-x86-linux-static.gz \
            -o "$RUNNER_TEMP/native/eldarica.gz"
          echo "6815742c34e92d26b379006029eeeb1877757947206b5af9c2f7ff61a5e9440d  $RUNNER_TEMP/native/eldarica.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/native/eldarica.gz" > "$RUNNER_TEMP/native/eld"
          chmod 755 "$RUNNER_TEMP/native/eld"
          curl -fLsS --retry 2 --max-time 75 \
            https://github.com/usi-verification-and-security/golem/releases/download/v0.9.0/golem-x64-linux.tar.bz2 \
            -o "$RUNNER_TEMP/native/golem.tar.bz2"
          echo "8209e804c6d4870e52d8d53b605a19145309445bffbd7e89f3ab4db31afdc490  $RUNNER_TEMP/native/golem.tar.bz2" | sha256sum -c -
          mkdir "$RUNNER_TEMP/native/golem-release"
          tar -xjf "$RUNNER_TEMP/native/golem.tar.bz2" -C "$RUNNER_TEMP/native/golem-release"
          GOLEM_PATH="$(find "$RUNNER_TEMP/native/golem-release" -type f -name golem | head -1)"
          test -n "$GOLEM_PATH"
          chmod 755 "$GOLEM_PATH"
          echo "ELDARICA_PATH=$RUNNER_TEMP/native/eld" >> "$GITHUB_ENV"
          echo "GOLEM_PATH=$GOLEM_PATH" >> "$GITHUB_ENV"
      - name: Run EXACT postFIRST only original 8 array / 7 LIA, 20s independent strong expert budgets
        shell: bash
        env:
          COHORT: ${{ matrix.cohort }}
        run: |
          set -uo pipefail
          python3 -m research.g3.chccomp2025_postfirst_specialists \
            --cohort "$COHORT" --eld "$ELDARICA_PATH" --golem "$GOLEM_PATH" \
            --first-array immutable-array/G3-ARRAY_CHC-NATIVE-ORIGINAL-FIRST.json \
            --first-lia immutable-lia/G3-LIA_MULTIPHASE-NATIVE-ORIGINAL-FIRST.json \
            > "G3-$COHORT-ELDARICA-GOLEM-POSTFIRST.json" \
            2> "G3-$COHORT-ELDARICA-GOLEM-POSTFIRST.stderr"
          rc=$?
          if test -s "G3-$COHORT-ELDARICA-GOLEM-POSTFIRST.json"; then
            python3 - "$COHORT" <<'PY'
          import json,sys
          c=sys.argv[1]
          x=json.load(open(f'G3-{c}-ELDARICA-GOLEM-POSTFIRST.json'))
          print(json.dumps({'cohort':c,'scope':x.get('science_status'),
             'statistics':x.get('stats'),
             'cases':[{'name':r['original_file'],
               'claim_status':r['postfirst_status'],
               'native':[(n['engine'],n['status'],n.get('wall_ms')) for n in r['natives']]}
                for r in x.get('rows',[])]},sort_keys=True))
          assert x.get('postfirst_original_denominator')==(8 if c=='ARRAY_CHC' else 7)
          assert x.get('stats',{}).get('originals_checked')==(8 if c=='ARRAY_CHC' else 7)
          assert x.get('extra_training_and_neural_model_calls')==0
          assert x.get('stats',{}).get('ARC_public_eval_new_IDs')==0
          PY
            parsed=$?
            if test "$parsed" -ne 0;then rc=1;fi
          else
            rc=1
          fi
          cat "G3-$COHORT-ELDARICA-GOLEM-POSTFIRST.stderr"
          echo "G3_$COHORT_POSTFIRST_STRONG_BASELINE_EXIT=$rc"
          exit "$rc"
      - name: Lock original science receipt bytes even if independent strong native fails
        if: always()
        shell: bash
        env:
          COHORT: ${{ matrix.cohort }}
        run: |
          if test -s "G3-$COHORT-ELDARICA-GOLEM-POSTFIRST.json"; then
            sha256sum "G3-$COHORT-ELDARICA-GOLEM-POSTFIRST.json" > "G3-$COHORT-ELDARICA-GOLEM-POSTFIRST.sha256"
            cat "G3-$COHORT-ELDARICA-GOLEM-POSTFIRST.sha256"
          fi
      - name: Preserve postFIRST exact original expert outcomes, even failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEUMANN-G3-${{ matrix.cohort }}-ELDARICA23-GOLEM09-POSTFIRST
          path: |
            G3-${{ matrix.cohort }}-ELDARICA-GOLEM-POSTFIRST.json
            G3-${{ matrix.cohort }}-ELDARICA-GOLEM-POSTFIRST.stderr
            G3-${{ matrix.cohort }}-ELDARICA-GOLEM-POSTFIRST.sha256
          if-no-files-found: warn
          retention-days: 90
