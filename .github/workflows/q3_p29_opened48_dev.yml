name: NEUMANN P2.9 opened old ARC48 development diagnostics
on:
  push:
    branches:
      - research/q3-p29-inferred-coordinate-programs-20261105
    paths:
      - .github/workflows/q3_p29_opened48_dev.yml
permissions:
  contents: read
  actions: read
jobs:
  opened:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout P2.9 sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify mechanism-only generalization contracts
        run: node --test tests/test_q3_p29_induced_coordinate_programs.mjs
      - name: Retrieve original P2.8 already-scored 48 receipt
        uses: actions/download-artifact@v4
        with:
          name: neumann-p28-FIRST-original-transfer48
          run-id: 42018227034
          github-token: ${{ github.token }}
          path: previous-first
      - name: Fetch frozen public original ARC source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/arc-agi"
          git -C "$RUNNER_TEMP/arc-agi" remote add origin https://github.com/fchollet/ARC-AGI.git
          git -C "$RUNNER_TEMP/arc-agi" fetch --depth=1 origin 399030444e0ab0cc8b4e199870fb20b863846f34
          git -C "$RUNNER_TEMP/arc-agi" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/arc-agi" rev-parse HEAD)" = 399030444e0ab0cc8b4e199870fb20b863846f34
      - name: Diagnostic on REUSED 48 originals, strong original baselines
        shell: bash
        run: |
          set -euo pipefail
          node experiments/q3_p29_opened48_dev.mjs "$RUNNER_TEMP/arc-agi" previous-first/p28-FIRST-ORIGINAL-TRANSFER48.json > p29-OPENED48-DIAGNOSTIC.json
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('p29-OPENED48-DIAGNOSTIC.json','utf8'));
          if(r.stats.n!==48 || r.stats.old_correct!==3 || r.scope!=='REUSED_PREVIOUSLY_SCORED_48_ORIGINALS_NOT_FRESH_HOLDOUT')process.exit(1);
          console.log(JSON.stringify({scope:r.scope,stats:r.stats}));
          NODE
      - name: Preserve raw opened-development results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neumann-p29-opened48-development
          path: p29-OPENED48-DIAGNOSTIC.json
          if-no-files-found: warn
          retention-days: 90
