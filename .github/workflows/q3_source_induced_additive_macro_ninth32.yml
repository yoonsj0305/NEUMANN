name: NEUMANN Q3 learn NEW additive symbolic macro and evaluate first original ninth32
on:
  pull_request:
    paths:
      - '.github/workflows/q3_source_induced_additive_macro_ninth32.yml'
      - 'research/q3/learned_additive_macro_ninth32.py'
      - 'research/g0/erbench_original_ninth.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  first_authored_original_source_only_ninth32_freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 sympy==1.13.3
      - name: Pin full 10k public original corpus and first-unseen ninth32 IDs
        run: |
          set -euo pipefail
          mkdir -p /tmp/q3-9/source /tmp/q3-9/truth /tmp/q3-9/data
          python - <<'PY'
          import hashlib,urllib.request,pathlib
          commit='95bf15c27de68c3f170ca6140d2e4a811c60344f'
          url='https://huggingface.co/datasets/EquationDiscovery/Equation_Recovery_Benchmark/resolve/'+commit+'/train.csv?download=true'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'NEUMANN-G1-macro-reuse-ninth32'}),timeout=70) as f:raw=f.read()
          h=hashlib.sha256(raw).hexdigest()
          assert h=='03c0ceb53ed0348650c0a94ed5cd1e452325d2b7c7d3be68f9a458316eda33b1'
          pathlib.Path('/tmp/q3-9/data/original.csv').write_bytes(raw)
          print('NINTH_PINNED_AUTHOR_CORPUS_VERIFIED',commit,h)
          PY
          OPENBLAS_NUM_THREADS=1 python research/g0/erbench_original_ninth.py --mode prepare \
            --csv-path /tmp/q3-9/data/original.csv \
            --revision 95bf15c27de68c3f170ca6140d2e4a811c60344f \
            --source /tmp/q3-9/source/FIRST_NINTH32_SOURCE_ONLY_NUMERIC.json \
            --truth /tmp/q3-9/truth/REAL_NINTH32_PRIVATE_AUTHOR_TRUTH.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/q3-9/source/FIRST_NINTH32_SOURCE_ONLY_NUMERIC.json'))
          assert d['all_selected']==32
          assert len(d['source_numeric_without_equations'])==32
          assert all('original_expression' not in x for x in d['source_numeric_without_equations'])
          print('NINTH_SOURCE_AND_TRUE_EXPRESSION_PHYSICALLY_SEPARATED')
          PY
          rm -f /tmp/q3-9/data/original.csv
      - uses: actions/upload-artifact@v4
        with:
          name: neumann-q3-first-ninth32-original-source-only-no-truth
          path: /tmp/q3-9/source/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: neumann-q3-first-ninth32-actual-original-true-expression-private
          path: /tmp/q3-9/truth/
          if-no-files-found: error
  train_own_reward_macros_propose_source_and_match_fair_strong_baselines:
    needs: first_authored_original_source_only_ninth32_freeze
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 sympy==1.13.3 scikit-learn==1.5.2
      - uses: actions/download-artifact@v4
        with:
          run-id: 39913799990
          name: q3-sx-online-no-label-training-original128-only-numeric
          github-token: ${{ github.token }}
          path: /tmp/q3-9/train-other
      - uses: actions/download-artifact@v4
        with:
          name: neumann-q3-first-ninth32-original-source-only-no-truth
          path: /tmp/q3-9/source
      - name: Real synthetic POSITIVE and negative oracle controls before first original truth
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=1 PYTHONPATH=research/g0:research/q3 python - <<'PY'
          import numpy as np,sympy as sp
          from learned_additive_macro_ninth32 import source_program,BASIS,X
          print('AVAILABLE_BASE_TYPED_PRIMITIVE_COUNT',len(BASIS))
          xx=np.linspace(0.2,2.8,48)
          for yy in (np.sin(xx),np.exp(xx)+np.sin(xx)):
              found,attempts=source_program({'x':xx.tolist(),'y':yy.tolist()},list(range(len(BASIS))),max_candidates=4)
              assert found,('MISSING_REAL_COMPOSITIONAL_NUMERIC_POSITIVE',attempts)
              print('COMPOSED_MACRO_SOURCE_POSITIVE',found[0]['named_lambda'])
          xx=np.linspace(0.3,1.5,48)
          false,attempts=source_program({'x':xx.tolist(),'y':(np.sin(xx)+1e-3*xx**5).tolist()},
                                  list(range(10)),max_candidates=4)
          assert not false,'UNSUPPORTED_SOURCE_PROGRAM_ACCEPTED'
          print('COMPOSED_MACRO_INVALID_NEGATIVE_CONTROL_REJECTED')
          PY
      - name: Model trains on other original128 numeric source only and generates NEW named two-term lambda expressions
        run: |
          set -euo pipefail
          mkdir -p /tmp/q3-9/pred
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 PYTHONPATH=research/g0:research/q3 \
            python research/q3/learned_additive_macro_ninth32.py --mode infer \
            --train /tmp/q3-9/train-other/OTHER_ORIGINAL128_NUMERIC_XY_NO_FORMULA.json \
            --source /tmp/q3-9/source/FIRST_NINTH32_SOURCE_ONLY_NUMERIC.json \
            --pred /tmp/q3-9/pred/FIRST_NINTH_LEARNED_DYNAMIC_MACROS_AND_ALL_CLASSICAL_SOURCE_ONLY.json \
            | tee /tmp/q3-9/pred/FIRST_BEFORE_GOLD_ORIGINAL_NEURAL_GRAPH_COMPOSITION.log
          sha256sum /tmp/q3-9/pred/FIRST_NINTH_LEARNED_DYNAMIC_MACROS_AND_ALL_CLASSICAL_SOURCE_ONLY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-q3-ninth32-frozen-selfreward-composed-macros-before-grading
          path: /tmp/q3-9/pred/
          if-no-files-found: error
  exact_independent_true_author_whole_expression_grade:
    needs: train_own_reward_macros_propose_source_and_match_fair_strong_baselines
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 sympy==1.13.3 scikit-learn==1.5.2
      - uses: actions/download-artifact@v4
        with:
          name: neumann-q3-first-ninth32-actual-original-true-expression-private
          path: /tmp/q3-9/truth
      - uses: actions/download-artifact@v4
        with:
          name: neumann-q3-ninth32-frozen-selfreward-composed-macros-before-grading
          path: /tmp/q3-9/pred
      - name: Independent exact author original symbol function equal across all 32, after original proposals frozen
        run: |
          set -euo pipefail
          mkdir -p /tmp/q3-9/graded
          OPENBLAS_NUM_THREADS=1 PYTHONPATH=research/g0:research/q3 \
            python research/q3/learned_additive_macro_ninth32.py --mode grade \
            --truth /tmp/q3-9/truth/REAL_NINTH32_PRIVATE_AUTHOR_TRUTH.json \
            --pred /tmp/q3-9/pred/FIRST_NINTH_LEARNED_DYNAMIC_MACROS_AND_ALL_CLASSICAL_SOURCE_ONLY.json \
            --out /tmp/q3-9/graded/FIRST_NINTH32_AUTHOR_FULL_EQUIVALENCE_NEURAL_AND_CLASSICAL.json \
            | tee /tmp/q3-9/graded/REAL_AUTHOR_EXACT_GRADE.log
          python - <<'PY'
          import json
          d=json.load(open('/tmp/q3-9/graded/FIRST_NINTH32_AUTHOR_FULL_EQUIVALENCE_NEURAL_AND_CLASSICAL.json'))
          assert len(d['score'])==5 and all(z['total']==32 for z in d['score'].values())
          assert d['G1']=='HOLD' and d['Q3_GLOBAL']=='OPEN'
          print('NINTH32_ALL_FIRST_AUTHORED_ORIGINALS_GRADED_SAFELY')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-q3-ninth32-full-original-exact-additive-macro-grader
          path: /tmp/q3-9/graded/
          if-no-files-found: error
