name: Q3 OOD operator vocabulary learned fail-closed independent source SAT
on:
  pull_request:
    paths:
      - '.github/workflows/q3_frozen_mod_operator_OOD_failclosed.yml'
      - 'research/evidence/q3_OOD_operator_failclosed_20261022/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reject_all_outside_vocabulary_model_source_proofs_and_classically_recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen operator model and OOD negative source experiment
        run: |
          python -m py_compile research/evidence/q3_OOD_operator_failclosed_20261022/frozen_operator_vocabulary_negative_admission.py
      - name: Install independent source semantics SMT tools Z3 and cvc5
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          python -m pip install --disable-pip-version-check numpy==2.3.5 sympy==1.14.0 z3-solver==4.13.3.0
      - name: Actually train unsupported source operator, reject SAT counterexample then prove classical original fallback
        run: |
          set -o pipefail
          PYTHONPATH=. OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python research/evidence/q3_OOD_operator_failclosed_20261022/frozen_operator_vocabulary_negative_admission.py \
            --out /tmp/q3_mod_OOD_original_negative_proofs.json | tee /tmp/q3_mod_OOD_original_negative_proofs.log
          sha256sum /tmp/q3_mod_OOD_original_negative_proofs.json
      - name: Preserve failed neural source candidates and successful classical receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-original-outside-fixed-operator-vocabulary-exact-negative-model-certificates
          path: |
            /tmp/q3_mod_OOD_original_negative_proofs.json
            /tmp/q3_mod_OOD_original_negative_proofs.log
          if-no-files-found: warn
      - name: All learned model miss must be rejected by BOTH source SAT solvers
        if: success()
        run: |
          python - <<'PY'
          import json
          j=json.load(open('/tmp/q3_mod_OOD_original_negative_proofs.json'))
          assert j['schema']=='neumann.q3.ood_fixed_primitive_vocabulary_failclosed_gcd.v1'
          assert j['total_out_of_vocabulary_trials']==16
          assert j['learned_full_original_SAFE_count']==0
          assert j['original_model_cvc5_Z3_counterexamples']==16
          assert j['classical_native_full_original_SAFE_count']==16
          assert j['online_controller_fail_closed_classical_recovery_count']==16
          assert j['frozen_vocabulary_cannot_express_original_modulus']
          assert j['global_Q3']==j['global_Q4']==j['global_Q6']=='OPEN'
          for row in j['evidence']:
              assert row['source_original_model_independent_three_VC'][1]['independent_dual_sat']
              assert all(q['independent_dual_unsat'] for q in row['native_original_Z3_cvc5_complete_SAFE'])
              assert row['unverified_model_never_authorized_SAFE']
          print('OOD_LEARNED_OPERATOR_REJECTED_CLASSICAL_SOURCE_RECOVERY_16_OF_16')
          PY
