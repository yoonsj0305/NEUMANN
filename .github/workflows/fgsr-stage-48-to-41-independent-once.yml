name: FGSr 48 to 41 independent induction verifier
on:
  pull_request:
    paths:
      - '.github/workflows/fgsr-stage-48-to-41-independent-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-formal-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin independent native z3py
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
          python -m py_compile research/evidence/fgsr-double-lock-stage-cut-20261017/independent_48_to_41_z3py.py
      - name: Prove 45/45 original stage induction and 48-to-41 exact safety-equivalent reduction
        run: |
          python research/evidence/fgsr-double-lock-stage-cut-20261017/independent_48_to_41_z3py.py
          python - <<'PY'
          import json
          r=json.load(open('independent_48_to_41_receipt.json'))
          assert r['original_generative_inductive_unsat']==45
          assert r['retained_count']==41
          assert r['full_original_safety']=='UNKNOWN'
          assert r['global_Q1_Q7']=='OPEN'
          print('VALIDATED_STAGE_CUT_41',True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgsr-stage-48-to-41-independent-Z3-4-13-3
          path: independent_48_to_41_receipt.json
          if-no-files-found: warn
          retention-days: 45
