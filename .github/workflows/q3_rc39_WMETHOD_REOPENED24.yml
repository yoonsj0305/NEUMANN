name: Q3 RC39 W-method source-rights classical ablation
on:
  push:
    branches:
      - research/q3-rc39-wmethod-20261106
    paths:
      - 'research/q3/rc39/wmethod_*.py'
      - 'tests/test_q3_rc39_wmethod_conformance.py'
      - 'tests/test_q3_rc39_wmethod_cross_alphabet.py'
      - 'docs/experiments/q3_RC39_WMETHOD_REOPENED24_PREREG_2026_11_06.json'
      - 'docs/experiments/q3_RC39_WMETHOD_CROSS_ALPHABET_PREREG_2026_11_06.json'
      - '.github/workflows/q3_rc39_WMETHOD_REOPENED24.yml'
  workflow_dispatch:
jobs:
  scientific-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent finite fault-domain and negative safety tests
        run: python -m unittest discover -s tests -p 'test_q3_rc39_wmethod_conformance.py' -v
      - name: Preregistered cross-alphabet generalization stress
        run: python -m unittest discover -s tests -p 'test_q3_rc39_wmethod_cross_alphabet.py' -v
      - name: Reopened original 24 and original exhaustive comparator
        run: |
          set -o pipefail
          python -m research.q3.rc39.wmethod_reopened24 | tee rc39_wmethod_reopened24.json
      - name: Parse scientific admission separately from process exit
        run: |
          python - <<'PY'
          import json
          x=json.load(open('rc39_wmethod_reopened24.json'))
          assert x['n_tasks']==24
          assert x['same_rights_all_length_pass'], '24/24 independently proven all-length required'
          assert x['reference_enumeration_distinct_queries']==172051, 'baseline reproduction mismatch'
          print('BASELINE',x['reference_enumeration_distinct_queries'])
          print('W_METHOD',x['candidate_wmethod_distinct_queries'])
          print('SOURCE_CALL_RATIO',x['source_call_reduction_ratio'])
          print('CLASSICAL_COST_GATE', 'PASS' if x['source_call_reduction_ratio']>=10 else 'FAIL')
          assert x['source_call_reduction_ratio']>=10, 'W-method query reduction <10x: scientific gate FAIL'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-rc39-wmethod-reopened24-receipt
          path: rc39_wmethod_reopened24.json
          if-no-files-found: warn
