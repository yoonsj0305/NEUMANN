name: NEUMANN P3.0 first frozen public original training400
on:
  push:
    branches:
      - research/q3-p30-relational-object-language-20261105
    paths:
      - .github/workflows/q3_p30_training400_first.yml
permissions:
  contents: read
jobs:
  first:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run object semantics exact-replay and inconsistent-evidence checks
        shell: bash
        run: node --test tests/test_q3_p30_object_rewrite_language.mjs
      - name: Fetch frozen original public ARC training only, not heldout evaluation
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/arc-agi"
          git -C "$RUNNER_TEMP/arc-agi" remote add origin https://github.com/fchollet/ARC-AGI.git
          git -C "$RUNNER_TEMP/arc-agi" fetch --depth=1 origin 399030444e0ab0cc8b4e199870fb20b863846f34
          git -C "$RUNNER_TEMP/arc-agi" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/arc-agi" rev-parse HEAD)" = 399030444e0ab0cc8b4e199870fb20b863846f34
      - name: FIRST source-locked original public training 400 task diagnostic
        shell: bash
        run: |
          set -euo pipefail
          node experiments/q3_p30_public400_first.mjs "$RUNNER_TEMP/arc-agi" > P30-FIRST-PUBLIC-TRAIN400.json
          node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("P30-FIRST-PUBLIC-TRAIN400.json","utf8"));
          if(x.stats.N!==400||!x.prior_test_gold_not_visible_to_proposer||x.neural_calls!==0)process.exit(1);
          console.log(JSON.stringify({scope:x.scope,first:x.stats,Q3:x.autonomous_new_opcode}));
          NODE
      - name: Hash first original source-locked receipt
        if: always()
        shell: bash
        run: |
          if test -f P30-FIRST-PUBLIC-TRAIN400.json; then
            sha256sum P30-FIRST-PUBLIC-TRAIN400.json > P30-FIRST-PUBLIC-TRAIN400.sha256
            cat P30-FIRST-PUBLIC-TRAIN400.sha256
          fi
      - name: Preserve original public first receipt even negative
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neumann-p30-first-public-training400
          path: |
            P30-FIRST-PUBLIC-TRAIN400.json
            P30-FIRST-PUBLIC-TRAIN400.sha256
          if-no-files-found: warn
          retention-days: 90
