name: FGSR authentic double-lock 48 Horn strong original solver first one-shot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unbounded-source-classical-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FGSR_RESULT: research/evidence/fgsr-double-lock-original-20261017/real_48_original_solver_first_receipt.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin exact Z3 and validate script
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
          python -m py_compile research/evidence/fgsr-double-lock-original-20261017/first_strong_original_one_shot.py
      - name: Four classical solvers independent whole original fixed caps
        run: |
          python -u research/evidence/fgsr-double-lock-original-20261017/first_strong_original_one_shot.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/evidence/fgsr-double-lock-original-20261017/real_48_original_solver_first_receipt.json').read_text())
          assert r['pinned_original_verified']
          assert len(r['arms'])==4
          print('FROZEN_ONE_SHOT_CLASSICAL',r['strong_original_classical_status'])
          print('GLOBAL_QUESTIONS',r['global_q1_q7'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgsr-double-lock-48-original-unbounded-four-armed-first-receipt
          path: research/evidence/fgsr-double-lock-original-20261017/real_48_original_solver_first_receipt.json
          if-no-files-found: warn
          retention-days: 45
