name: Q3 Relational Causal Multi-Object Invention

on:
  pull_request:
    paths:
      - "neumann1/relational_action_inventor.py"
      - "neumann1/object_gap_router.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "tests/test_relational_action_inventor.py"
      - ".github/workflows/q3_relational_action.yml"
  workflow_dispatch:

jobs:
  causal-relational-synthesis:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source-only learned relational program and heldouts
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_relational_action_inventor.py
