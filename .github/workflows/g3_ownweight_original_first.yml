name: G3 own-weight frozen original init2 init3 FIRST, native and human matched

on:
  pull_request:
    paths:
      - 'research/g3/ownweight_schema_external_first.py'
      - 'docs/experiments/G3_OWNWEIGHT_FROZEN_BEFORE_EXTERNAL_FIRST_2026_11_06.json'
      - '.github/workflows/g3_ownweight_original_first.yml'

permissions:
  contents: read
  actions: read

jobs:
  first-external-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install immutable evaluation dependencies
        run: |
          python -m pip install 'numpy>=1.26,<3'
          sudo apt-get update -qq
          sudo apt-get install -y -qq z3
          z3 --version
      - uses: actions/download-artifact@v4
        with:
          name: NEUMANN-G3-OWNWEIGHT-QUANTIFIED-TRAIN-FIRST
          run-id: 42198111692
          github-token: ${{ github.token }}
          path: frozen
      - name: Verify source-unopened first permission and original independent trained-weights SHA BEFORE source body reads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          manifest=json.loads(Path('docs/experiments/G3_OWNWEIGHT_FROZEN_BEFORE_EXTERNAL_FIRST_2026_11_06.json').read_text())
          c=Path('frozen/G3-OWNWEIGHT-QUANTIFIED-AST-FROZEN.json')
          report=json.loads(Path('frozen/G3-OWNWEIGHT-QUANTIFIED-TRAIN-FIRST.json').read_text())
          assert c.is_file()
          actual=hashlib.sha256(c.read_bytes()).hexdigest()
          assert actual==manifest["actual_student_checkpoint_SHA256"]=="982ef08b88758537dfe56f3ad8451de26fbd438df295802c491c25d231de9bdc"
          assert report['checkpoint_SHA256']==actual and report['opened_original_proved']==49 and report['original_test_sources_fetched']==0
          assert manifest['training_first_successful_run']==42198111692
          assert manifest["original_test_run"]=="NOT_RUN_BEFORE_MANIFEST"
          assert len(manifest["source_unopened_test_first"])==2
          print('ACTUAL_OWN_WEIGHT_SHA_FROZEN_FIRST='+actual)
          print('NO_EXTERNAL_FIRST_ORIGINAL_READ_BEFORE_THIS_CHECK')
          PY
      - name: Exactly one ORIGINAL test2/test3 source-first evaluation and strong matched baselines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-first
          /usr/bin/time -f 'EXTERNAL_FIRST_TOTAL_WALL_SEC=%e\nEXTERNAL_FIRST_MAX_RSS_KB=%M' \
            python -m research.g3.ownweight_schema_external_first \
            --checkpoint frozen/G3-OWNWEIGHT-QUANTIFIED-AST-FROZEN.json \
            --expected-sha 982ef08b88758537dfe56f3ad8451de26fbd438df295802c491c25d231de9bdc \
            --training-run 42198111692 \
            --report external-first/G3-OWNWEIGHT-ORIGINAL-FIRST.json \
            > external-first/stdout.txt 2> external-first/stderr.txt
          cat external-first/stdout.txt
          tail -12 external-first/stderr.txt
      - name: Retain all original first outcomes including failed/UNKNOWN solvers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEUMANN-G3-OWNWEIGHT-QUANTIFIED-ORIGINAL-INIT2INIT3-FIRST
          path: external-first/
          if-no-files-found: warn
          retention-days: 90
