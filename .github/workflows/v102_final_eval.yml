name: v102 Final Q34 Holdout Closure

on:
  push:
    branches:
      - research/v102-final-q34-holdout
    paths:
      - .github/workflows/v102_final_eval.yml
      - neumann1/lp_final_holdout_archive_v102.py
      - experiments/lp_final_holdout_v102.py
      - tests/test_lp_final_holdout_v102.py

permissions:
  contents: write

jobs:
  final-q34-holdout:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "HASWELL"
      MKL_NUM_THREADS: "1"
      MKL_CBWR: "COMPATIBLE"
      BLIS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact retained final runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.9.1 threadpoolctl==3.7.0 highspy==1.15.1 pytest
          pip install -e . --no-deps
          pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Validate frozen final evaluator contract
        run: pytest -q tests/test_lp_final_holdout_v102.py
      - name: Final fresh Q34 holdout exactly once
        run: |
          mkdir -p docs/experiments/results
          test -e docs/experiments/results/v102_final_sources.json.gz
          test -e docs/experiments/results/v102_final_sources.manifest.json
          test ! -e docs/experiments/results/v102_final_evaluation.json.gz
          test ! -e docs/experiments/results/v102_final_evaluation.manifest.json
          python -m experiments.lp_final_holdout_v102 \
            --output-gzip docs/experiments/results/v102_final_evaluation.json.gz \
            --manifest docs/experiments/results/v102_final_evaluation.manifest.json \
            --frozen-head "$GITHUB_SHA"
      - name: Retain immutable final closure evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/experiments/results/v102_final_evaluation.json.gz \
                  docs/experiments/results/v102_final_evaluation.manifest.json
          git commit -m "v102 retain final fresh Q34 holdout closure"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload final closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: v102-final-q34-closure
          path: |
            docs/experiments/results/v102_final_evaluation.json.gz
            docs/experiments/results/v102_final_evaluation.manifest.json
