name: FGSR authentic 48-Horn full nonlinear proof DAG (single run)

on:
  pull_request:
    paths:
      - '.github/workflows/fgsr-full-nonlinear-dag-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nonlinear-original:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FGSR_RESULT: research/evidence/fgsr-q3-single-independent-family/nonlinear_dag_first_receipt.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin independent original Horn backend
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
          python -m py_compile research/evidence/fgsr-q3-single-independent-family/full_nonlinear_dag_one.py
      - name: Bounded all-premise proof DAG and independently replay witness
        run: |
          python research/evidence/fgsr-q3-single-independent-family/full_nonlinear_dag_one.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/evidence/fgsr-q3-single-independent-family/nonlinear_dag_first_receipt.json').read_text())
          print('ORIGINAL_ALL_PREMISE_VERDICT',r['status'])
          print('NONLINEAR_CLAUSES_INCLUDED',r.get('nonlinear_original_rules_included'))
          print('ATTEMPTS',[(a['nodes'],a['verdict']) for a in r['attempts']])
          print('COST_MS',r['elapsed_ms'])
          print('NO_Q_PROMOTION',r['q1_q7'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgsr-full-original-nonlinear-dag-first-actual
          path: research/evidence/fgsr-q3-single-independent-family/nonlinear_dag_first_receipt.json
          if-no-files-found: warn
          retention-days: 45
