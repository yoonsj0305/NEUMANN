name: NEUMANN G0 SGI original source-only CVC5 first
on:
  push:
    branches: [research/rc51-intelligence-spend-gate-20261026]
    paths:
      - .github/workflows/g0-sgi-cvc5-first-20261027.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/g0-sgi-cvc5-first-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neumann-g0-sgi-source-only-first
  cancel-in-progress: false
jobs:
  strong-classical-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc51-intelligence-spend-gate-20261026
          persist-credentials: false
      - name: Freeze implementation identity and compile
        run: |
          set -euo pipefail
          sha256sum research/q3/discovery_policy/sgi_first_classical_original.py
          python3 -m py_compile research/q3/discovery_policy/sgi_first_classical_original.py
      - name: Install the real native strong classical synthesis solver
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cvc5
          cvc5 --version
          dpkg-query -W cvc5
      - name: Fetch pinned independent original benchmark source
        run: |
          set -euo pipefail
          git init -q upstream
          git -C upstream remote add origin https://github.com/Barnard-PL-Labs/sygus-sgi-1.git
          git -C upstream fetch --depth 1 origin e7ae840e5546e9243ff94afb1a29064fc050011c
          git -C upstream checkout --detach -q FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = e7ae840e5546e9243ff94afb1a29064fc050011c
      - name: Execute exactly twelve preregistered deterministic source-only original tasks
        run: |
          set -euo pipefail
          python3 research/q3/discovery_policy/sgi_first_classical_original.py
          test -s first_receipts/FIRST_CVC5_SOURCE_ONLY.json
          sha256sum first_receipts/FIRST_CVC5_SOURCE_ONLY.json
          cat first_receipts/FIRST_SHA256.txt
      - name: Preserve raw outputs and immutable FIRST candidate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neumann-g0-sgi-first-CVC5-source-only-20261027
          path: |
            first_receipts/FIRST_CVC5_SOURCE_ONLY.json
            first_receipts/FIRST_SHA256.txt
            first_receipts/cvc5-version.txt
            first_receipts/raw
          if-no-files-found: warn
