name: General Runtime-0 and frozen transfer contracts
on:
  pull_request:
    paths:
      - neumann1/general_*v106.py
      - neumann1/general_*v1061.py
      - experiments/general_*v106.py
      - experiments/general_*v1061.py
      - experiments/bp_frozen_transfer_m106.py
      - experiments/first_evidence_v106.py
      - tests/test_first_evidence_v106.py
      - tests/test_general_evidence_v106.py
      - tests/test_general_boot2_first_archive.py
      - docs/experiments/boot2_first_v106.pins.json
      - docs/experiments/results/v106_general_boot2*
      - .github/workflows/general_runtime_boot2.yml
      - tests/test_general_runtime_v106.py
      - tests/test_general_runtime_repair_v1061.py
      - tests/test_bp_frozen_transfer_m106.py
      - .github/workflows/general_runtime*.yml
      - .github/workflows/bp_frozen_transfer_first.yml
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest
      - name: Fixtures only; no model download, fitting or registered corpus
        run: python -m pytest -q tests/test_general_runtime_v106.py tests/test_general_runtime_repair_v1061.py tests/test_bp_frozen_transfer_m106.py tests/test_first_evidence_v106.py tests/test_general_evidence_v106.py tests/test_general_boot2_first_archive.py
  processor-readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned CPU processor dependencies; no model weights or inference
        run: |
          pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.9.1 threadpoolctl==3.7.0 highspy==1.15.1
          pip install torch==2.14.0+cpu torchvision==0.29.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.10.1 pillow
          pip install -e . --no-deps
      - name: Import actual model/processor classes and pinned processor only
        run: |
          python - <<'PY'
          from transformers import AutoProcessor, Gemma4Processor, Gemma4ForConditionalGeneration
          from neumann1.general_runtime_v106 import MODEL_ID, MODEL_REVISION
          processor=AutoProcessor.from_pretrained(MODEL_ID,revision=MODEL_REVISION,token=False,trust_remote_code=False)
          assert isinstance(processor,Gemma4Processor)
          from neumann1.general_runtime_repair_v1061 import _schemas
          messages=[
              {'role':'system','content':'Bounded native action controller.'},
              {'role':'user','content':'Return one bounded action.'},
          ]
          rendered=processor.apply_chat_template(
              messages, tools=_schemas('N'), tokenize=True, return_dict=True,
              return_tensors='pt', add_generation_prompt=True, enable_thinking=False)
          assert int(rendered['input_ids'].shape[-1]) > 0
          assert int(rendered['input_ids'].shape[-1]) < 4096
          print('PINNED_PROCESSOR_READY_NATIVE_REPAIR_TOOLS_NO_WEIGHTS_NO_FORWARD')
          PY
      - name: Original retained BP witnesses and full costs; no fit/forward/solve
        env:
          OPENBLAS_CORETYPE: HASWELL
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m experiments.bp_frozen_transfer_m106 --replay --directory docs/experiments/results/m106_bp_transfer_first
      - name: Retained General first failure and available original answers; no neural replay
        run: |
          python -m experiments.general_evidence_v106 --directory docs/experiments/results/v106_general_development_first
          if test -d docs/experiments/results/v106_general_boot2; then
            python -m experiments.general_evidence_v106 --directory docs/experiments/results/v106_general_boot2
          fi
