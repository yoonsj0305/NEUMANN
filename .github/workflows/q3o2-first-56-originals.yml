name: Q3O2 first fixed 40 linear plus 16 nonlinear original SyGuS typed proof seed survey
on:
  pull_request:
    paths:
      - 'research/evidence/q3o-real-sygus-20261018/**'
      - 'docs/research/Q3O2_EXTERNAL_SYGUS_56_PREREG_20261018.md'
      - '.github/workflows/q3o2-first-56-originals.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  true-original-sygus-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SaswatPadhi/LoopInvGen
          ref: 6ac90265b11431c9477dfbd33e3e3380234c0499
          path: external_loopinvgen
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen Z3, first exact 56 original LIA/NIA source-goal type-safe direct CHC
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
          python -m py_compile research/evidence/q3o-real-sygus-20261018/first_56_external_sources.py
          python research/evidence/q3o-real-sygus-20261018/first_56_external_sources.py --root external_loopinvgen --output /tmp/q3o2-first-real-56.json
          python - <<'PY'
          import json
          obj=json.load(open('/tmp/q3o2-first-real-56.json'))
          assert obj['status']=='FIRST_REAL_EXTERNAL_ORIGINAL_BATCH_RECORDED'
          assert 2<=obj['selected_count']<=56
          assert len(obj['first_all_source_receipts'])==obj['selected_count']
          assert obj['source_text_or_candidate_formula_exported'] is False
          assert obj['Q3F_competition_holdout_originals_read'] is False
          assert obj['any_neural_training'] is False
          assert obj['any_frontier_API_calls'] is False
          assert obj['global_Q1_Q7']=='OPEN'
          assert obj['independently_3VC_proven_typed_AST_seed_count']<=obj['direct_SPACER_original_proof_count']
          for x in obj['first_all_source_receipts']:
              assert len(x['source_git_blob'])==40
              if x.get('at_least_one_independently_proven_AST_cover'):
                  assert x['original_initial_states_sat_status']=='sat'
                  assert x['spacer_original_bad_exit_verdict']=='unsat'
                  assert any(c.get('status')=='ALL_ORIGINAL_SYGUS_VCS_UNSAT'
                     and c['init']==c['inductive']==c['postcondition']=='unsat'
                     for c in x['independently_original_VC_reproved_covers'])
          print('Q3O2_FIRST_REAL_56_EXACT_SOURCE_ALL_OUTCOMES_RECORDED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3o2-first-real-mit-source-lia-nia-56-typed-original-three-vc-receipts
          path: /tmp/q3o2-first-real-56.json
          retention-days: 90
