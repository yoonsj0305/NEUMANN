name: Q3 real Strassen exact bilinear 64-coefficient source SAT dual
on:
  pull_request:
    paths:
      - '.github/workflows/q3-strassen-exact-tensor-source-dual.yml'
      - 'research/evidence/q3_strassen_exact_tensor_20261021/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_real_original_Strassen_source_complete_forall_certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SMT-LIB/benchmark-submission-2022
          ref: 81a39628827f61fbd74c6f3e67feb5c1b740d2f0
          path: original
          sparse-checkout: |
            non-incremental/NRA/20220222-strassen-matrix-multiplication
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authentic original SHA and prior run baseline
        run: |
          test "$(git -C original rev-parse HEAD)" = 81a39628827f61fbd74c6f3e67feb5c1b740d2f0
          python -m py_compile research/evidence/q3_strassen_exact_tensor_20261021/original_strassen_rank7_exact_bilinear_symbolic_witness.py
          python - <<'PY'
          import json
          a=json.load(open('research/evidence/q3_strassen_exact_tensor_20261021/POST_FIRST_OPEN_STRASSEN_SOURCE_EXACT_TENSOR_AND_EXTERNAL_RANK7_CONTRACT.json'))
          assert a['schema']=='neumann.q3.posthoc_strassen_tensor_coefficient_3_original_source_gate.v1'
          assert a['posthoc_after_first_source_open']
          assert len(a['three_tasks'])==3
          print('SOURCE_AFTER_FIRST_OPEN_NEVER_CLAIM_UNSEEN_Q3')
          PY
      - name: Install pinned independent source mathematical theorem engines
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check numpy==2.3.5 sympy==1.14.0 z3-solver==4.13.3.0
          lscpu | grep 'Model name' | head -1
      - name: Solve exactly all 64 source tensor coefficients then certify actual quantified native original both full solvers
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_strassen_exact_tensor_20261021/original_strassen_rank7_exact_bilinear_symbolic_witness.py --root original --freeze research/evidence/q3_fresh_real_nra_20261021/BEFORE_ANY_NEW_SOURCE_BODY_18_ORIGINALS.json --contract research/evidence/q3_strassen_exact_tensor_20261021/POST_FIRST_OPEN_STRASSEN_SOURCE_EXACT_TENSOR_AND_EXTERNAL_RANK7_CONTRACT.json --out /tmp/q3_source_strassen_full_exact_tensor.json | tee /tmp/q3_source_strassen_full_exact_tensor.log
          sha256sum /tmp/q3_source_strassen_full_exact_tensor.json
      - name: Archive all SAT/UNSAT/UNKNOWN source and solver witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-real-strassen-linear-hard-source-exact-rational-witness
          path: |
            /tmp/q3_source_strassen_full_exact_tensor.json
            /tmp/q3_source_strassen_full_exact_tensor.log
          if-no-files-found: warn
      - name: Strict original equivalence and dual real-rank-seven theorem receipts
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3_source_strassen_full_exact_tensor.json'))
          assert x['preregistered_before_first_strassen_exact_method_evidence_commit']=='f9d66c5bc9493ad0a1f1106484cf7a05ceca9b85'
          assert x['source_posthoc_previously_opened']
          assert x['all_source_files_original_git_authenticated']
          assert x['original_impossible_remains_UNPROVEN']
          assert x['no_neural_training_or_learned_unique_Q3']
          assert x['strong_classical_direct_can_access_exact_same_bilinear_algorithm']
          assert x['global_Q3']==x['global_Q4']==x['global_Q5']=='OPEN'
          assert x['actual_original_linear_proved_SAT_doubly']
          assert x['actual_original_hard_proved_SAT_doubly']
          assert x['linear_source_exact_full_tensor_64']['source_exact_all_4x16_basis_coefficients_match']
          assert x['witness_exact_original_existent_var_counts']=={'hard':84,'linear':28}
          for y in (x['original_linear_independent_two_solver_all_reals_proof'],x['original_hard_independent_two_solver_all_reals_proof']):
              assert y['both_independent_engines_proved_forall_over_ALL_REAL_matrices']
          print('TRUE_ORIGINAL_STRASSEN_TWO_OF_THREE_ADDITIONAL_CLASSICAL_SAT_DUAL_PASS')
          PY
