name: Q3 Relational Composition 200 Original SOURCE-FROZEN Calibration
on:
  push:
    branches:
      - feature/q3-relational-composition-hybrid-20261108
    paths:
      - research/q3/arc2_relational_composition_second_200_original_first.py
      - .github/workflows/q3_arc2_hybrid_source_frozen.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source_frozen_no_new_target:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official ARC2 exact revision
        run: |
          git init -q arc2_official
          git -C arc2_official fetch -q --depth 1 https://github.com/arcprize/ARC-AGI-2.git f3283f727488ad98fe575ea6a5ac981e4a188e49
          git -C arc2_official checkout -q FETCH_HEAD
          test "$(git -C arc2_official rev-parse HEAD)" = f3283f727488ad98fe575ea6a5ac981e4a188e49
      - name: Immutable v1 240 ORIGINAL FIRST source IDs now opened development ONLY
        uses: actions/download-artifact@v4
        with:
          name: q3-relational-inventor-384-source-before-240-new-original-FROZEN
          run-id: 42442712903
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous_source
      - name: Install production package dependencies
        run: python -m pip install -q --disable-pip-version-check numpy scipy scikit-learn
      - name: Verify the remaining new target names alone without opening files
        run: |
          python -m compileall -q neumann1
          python - <<'PY'
          import sys
          sys.path.insert(0,'research/q3')
          import arc2_relational_composition_second_200_original_first as x
          source,new=x.registries()
          assert len(source)==240 and len(new)==200
          assert not set(p.stem for p in source)&set(p.stem for p in new)
          print("TWO_HUNDRED_NEW_ORIGINALS_NAMES_FROZEN_NOT_OPENED")
          PY
      - name: Source-only review of new rule composition and two-output classical retention
        run: python research/q3/arc2_relational_composition_second_200_original_first.py source
      - name: Preserve original SOURCE report and frozen language SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-relational-multirule-hybrid-development-240-source-FROZEN
          path: Q3_RELATIONAL_MULTI_HYBRID_SOURCE_ONLY_V2_FROZEN.json
          if-no-files-found: warn
