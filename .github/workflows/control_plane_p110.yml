name: P1.10 minimal semantic pairwise contracts

on:
  pull_request:
    paths:
      - 'neumann1/control_plane_p110*.py'
      - 'experiments/control_plane_p110*.py'
      - 'scripts/control_plane_p110*.py'
      - 'tests/test_control_plane_p110*.py'
      - 'docs/experiments/control_plane_p110*.json'
      - 'docs/research/control_plane_p110*.md'
      - '.github/workflows/control_plane_p110.yml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies only
        run: python -m pip install pytest numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1 threadpoolctl==3.7.0
      - name: Compile P1.10 without model loading
        run: python -m py_compile neumann1/control_plane_p110.py neumann1/control_plane_p110_semantic.py experiments/control_plane_p110_catalog.py experiments/control_plane_p110_registration.py experiments/control_plane_p110_runtime.py experiments/control_plane_p110_dev.py experiments/control_plane_p110_replay.py scripts/control_plane_p110_kaggle.py tests/test_control_plane_p110.py tests/test_control_plane_p110_first.py tests/test_control_plane_p110_kaggle.py
      - name: P1.10 minimal semantic pairwise contracts
        run: python -m pytest -q tests/test_control_plane_p110.py tests/test_control_plane_p110_first.py tests/test_control_plane_p110_kaggle.py
      - name: Frozen fresh P1.10 registration and construction controls
        run: python -m experiments.control_plane_p110_registration
      - name: Publish frozen P1.10 bootstrap SHA-256
        run: python -c 'import hashlib; from pathlib import Path; print("P110_BOOTSTRAP_SHA256="+hashlib.sha256(Path("scripts/control_plane_p110_kaggle.py").read_bytes()).hexdigest())'
      - name: P1.9 regressions
        run: python -m pytest -q tests/test_control_plane_p19.py tests/test_control_plane_p19_first.py
      - name: P1.10 machine contract matches implementation
        run: python -c 'import json; from pathlib import Path; from neumann1.control_plane_p110 import contract; assert json.loads(Path("docs/experiments/control_plane_p110_p0.contract.json").read_text()) == contract()'
