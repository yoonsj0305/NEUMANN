name: Q3 Terminal-Only Autonomous Latent Process Invention
on:
  pull_request:
    paths:
      - "neumann1/terminal_only_process_inventor.py"
      - "neumann1/higher_order_method_inventor.py"
      - "neumann1/typed_transition_inventor.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "tests/test_terminal_only_process_inventor.py"
      - ".github/workflows/q3_terminal_only_process.yml"
  workflow_dispatch:

jobs:
  no-successor-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact Q3 code
        run: python -m pip install -e . pytest
      - name: Source only initial and terminal states, recover executable processes
        run: python -m pytest -q -s tests/test_terminal_only_process_inventor.py
