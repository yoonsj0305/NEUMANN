name: Q3 first16 cross prefix original exact polynomial modular abstraction headroom
on:
  pull_request:
    paths:
      - '.github/workflows/q3-first16-cross-prefix-general-math.yml'
      - 'research/evidence/q3_cross_prefix_modulo_20261021/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  truly_unopened_eight_different_problem_forms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SMT-LIB/benchmark-submission-2022
          ref: 81a39628827f61fbd74c6f3e67feb5c1b740d2f0
          path: original
          sparse-checkout: |
            non-incremental/QF_NIA/20220315-MathProblems
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source identity check and mathematical proof compiler syntax
        run: |
          test "$(git -C original rev-parse HEAD)" = 81a39628827f61fbd74c6f3e67feb5c1b740d2f0
          python -m py_compile research/evidence/q3_cross_prefix_modulo_20261021/first16_general_polynomial_modulus_overapprox_vs_direct.py
          python - <<'PY'
          import json
          x=json.load(open('research/evidence/q3_cross_prefix_modulo_20261021/PRE_SOURCE_16_BY_8_PREFIX_SHA_LOCK.json'))
          assert x['frozen_before_any_selected_source_body_read']
          assert len(x['source_hash_targets'])==16
          assert len({v['sha1_git_blob'] for v in x['source_hash_targets']})==16
          assert len({v['group'] for v in x['source_hash_targets']})==8
          assert x['registered_general_abstract_discoverer']['math_modulus_candidates']==[2,3,4,5,7,8,9,11,13,16]
          print('FROZEN_BEFORE_CONTENT_SIXTEEN_EIGHT_MATH_FAMILIES')
          PY
      - name: Install exact independently pinned Z3 and cvc5, original full SMT-LIB
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check numpy==2.3.5 z3-solver==4.13.3.0
          lscpu | grep -E 'Model name' | head -1
      - name: FIRST 16 true original source polynomial congruence proofs vs raw strong Z3 cvc5
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_cross_prefix_modulo_20261021/first16_general_polynomial_modulus_overapprox_vs_direct.py --root original --freeze research/evidence/q3_cross_prefix_modulo_20261021/PRE_SOURCE_16_BY_8_PREFIX_SHA_LOCK.json --out /tmp/q3_first16_cross_prefix_true_originals.json | tee /tmp/q3_first16_cross_prefix_true_originals.log
          sha256sum /tmp/q3_first16_cross_prefix_true_originals.json
      - name: Preserve all authentic original complete/unknown/failure cases and negative outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-first-sixteen-eight-problem-prefixes-source-original-theorem-abstain
          path: |
            /tmp/q3_first16_cross_prefix_true_originals.json
            /tmp/q3_first16_cross_prefix_true_originals.log
          if-no-files-found: warn
      - name: Strict zero invented mathematical SAT or cross-family prior art novelty
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3_first16_cross_prefix_true_originals.json'))
          assert x['frozen_prior_to_first_body_git_sha_commit']=='4edf65e61bfe3830e07effcadaab4487595dc6bd'
          assert x['all_16_first_case_source_rows_retained'] and len(x['cases'])==16
          assert x['genuine_original_16_git_sha_authenticated']==16
          assert x['case_statuses_conflict_or_unauthenticated']==0
          assert x['general_modular_generator_hardcodes_NO_3cube_specialized_rule']
          assert x['nonpolynomial_constraints_dropped_sound_overapprox']
          assert x['modular_abstract_SAT_is_NOT_original_SAT']
          assert x['global_Q3']==x['global_Q4']==x['global_Q5']=='OPEN'
          for case in x['cases']:
              if case['math_auto_modulus_no_hardcoded_cubes']['real_original_unbounded_unsat_proved']:
                  assert case['status']=='ORIGINAL_UNBOUNDED_UNSAT_GENERAL_MODULAR_DUAL_CERTIFIED'
                  passes=[r for r in case['math_auto_modulus_no_hardcoded_cubes']['searched_moduli']
                          if r.get('abstract_Z3')=='UNSAT' and
                             r.get('independent_original_math_cvc5',{}).get('cvc5_original_math_status')=='UNSAT']
                  assert passes
          print('TRUE_ORIGINAL_EIGHT_PREFIXES_FROZEN_16',x['genuine_original_16_git_sha_authenticated'])
          print('GENERAL_CROSS_FORMULA_POLYNOMIAL_MODULAR_UNBOUNDED_UNSAT',x['global_structural_math_automatic_source_UNSAT_count'])
          print('RAW_DIRECT_SAT_UNSAT',x['generic_raw_direct_any_solver_SAT_count'],x['generic_raw_direct_any_solver_UNSAT_count'])
          PY
