name: P1.2 full-S4 development contracts

on:
  pull_request:
    paths:
      - 'neumann1/control_plane*.py'
      - 'experiments/control_plane_p12*.py'
      - 'scripts/control_plane_p12_kaggle.py'
      - 'tests/test_control_plane_p12*.py'
      - 'docs/experiments/control_plane_p12*.json'
      - 'docs/experiments/results/control_plane_p11_first.zip.b64'
      - 'docs/research/control_plane_p12.md'
      - '.github/workflows/control_plane_p12.yml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core and CPU tensor fixtures; no Gemma weights
        run: |
          pip install -e .
          pip install torch==2.14.0+cpu torchvision==0.29.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.16.1 huggingface_hub
      - name: Full group, residual interactions, robustness, accounting, first FAIL and bootstrap
        run: |
          python -m unittest discover -s tests -p 'test_control_plane_p12*.py' -v
          python -m unittest discover -s tests -p 'test_control_plane_p11.py' -v
          python -m experiments.control_plane_p12_dev --check-registration
      - name: Actual frozen tokenizer only; no weights, tasks or inference
        run: python -m experiments.control_plane_p12_dev --tokenizer-readiness
