name: Q3 Relational Grid Predicate Invention Live Core
on:
  push:
    branches:
      - feature/q3-relational-predicate-invention-arc2-20261108
    paths:
      - neumann1/relational_grid_inventor.py
      - neumann1/engine.py
      - neumann1/registry_engine.py
      - tests/test_relational_grid_inventor.py
      - .github/workflows/q3_relational_grid_core.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invented_grid_rules_in_actual_engine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing core runtime
        run: |
          python -m pip install -q --disable-pip-version-check numpy scipy scikit-learn pytest
          python -m compileall -q neumann1
      - name: Exercise invented new conditional ASTs and previous core
        run: |
          python -m pytest -q tests/test_relational_grid_inventor.py tests/test_autonomous_synthesis_core.py tests/test_structural_meta_invention.py tests/test_meta_utility_policy.py tests/test_engine.py
