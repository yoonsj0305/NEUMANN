name: NEUMANN Q34 one-shot optimal unknown Boolean operator discovery full exhaustive proofs
on:
  pull_request:
    paths:
      - '.github/workflows/q34_one_shot_boolean_operator.yml'
      - 'research/q34/one_shot_boolean_operator.py'
      - 'research/q34/independent_shannon_audit.py'
      - 'research/q34/optimal_noisy_boolean_operator.py'
      - 'research/q34/independent_noise_distance_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full_65536_truth_table_induction_and_independent_BDD:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full deterministic 4x4 de Bruijn source, all 65536 unknown 2x2 operators reconstructed and ANF exact on entire domain
        run: |
          set -euo pipefail
          mkdir -p /tmp/neumann-q34-first
          python research/q34/one_shot_boolean_operator.py | tee /tmp/neumann-q34-first/FIRST_65536_ANF_PROOF.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/neumann-q34-first/FIRST_65536_ANF_PROOF.json'))
          assert x['rules_recovered_and_ANF_domain_verified']==65536
          assert x['incorrect_operators']==0 and x['highest_degree_four_rules']==32768
          assert x['used_binary_output_bits']==x['minimum_binary_output_bits']==16
          assert x['used_experiment_rounds']==x['minimum_experiment_rounds']==1
          assert sum(int(z) for z in x['essential_variable_counts'].values())==65536
          print('Q34_ORIGINAL_BOOLEAN_OPERATORS_ALL_65536_AND_INFO_OPTIMAL_SOURCE_PROVED')
          PY
      - name: Independently recompile every recovered unknown Boolean operator via reduced Shannon BDD, all-input proof
        run: |
          set -euo pipefail
          PYTHONPATH=research/q34 python research/q34/independent_shannon_audit.py | tee /tmp/neumann-q34-first/INDEPENDENT_65536_SHANNON_BDD_PROOF.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/neumann-q34-first/INDEPENDENT_65536_SHANNON_BDD_PROOF.json'))
          assert x['independent_BDD_synthesis_verified']==65536
          assert sum(int(z) for z in x['BDD_node_count_distribution'].values())==65536
          assert x['bounded_Q34']=='PASS'
          print('INDEPENDENT_ALL_65536_SOURCE_OPERATORS_TWO_SYMBOLIC_LANGUAGES_0_ERRORS')
          PY
          sha256sum /tmp/neumann-q34-first/*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-q34-first-exhaustive-65536-operator-one-probe-anf-plus-independent-shannon-exact
          path: /tmp/neumann-q34-first/
          if-no-files-found: error

  exhaustive_adversarial_noise_at_exact_48_bit_lower_bound:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove every 4-input Boolean operator under every one of 48 adversarial observed output bit flips and compile all ANFs
        run: |
          set -euo pipefail
          mkdir -p /tmp/q34-noisy-one-shot
          python research/q34/optimal_noisy_boolean_operator.py | tee /tmp/q34-noisy-one-shot/ALL_3145728_ADVERSARIAL_FLIPS_PRIMARY.log
          python - <<'PY'
          import json,pathlib
          s=pathlib.Path('/tmp/q34-noisy-one-shot/ALL_3145728_ADVERSARIAL_FLIPS_PRIMARY.log').read_text().splitlines()
          x=json.loads(s[0])
          assert x['all_possible_truth_table_operators']==65536
          assert x['all_possible_single_output_bit_flip_trials']==3145728
          assert x['wrong_reconstructions']==0
          assert x['every_unknown_rule_ANF_checked_all16_inputs']==65536
          assert x['t1_optimal_output_bits']==x['t1_optimality_lower_bound']==48
          assert x['t2_optimal_output_bits']==80
          assert x['scoped_optimal_noise_resilient_operator_discovery']=='PASS'
          assert x['global_Q3']=='OPEN'
          print('Q34_TRUE_UNRESTRICTED_ALL_OPERATORS_EVERY_SINGLE_CORRUPTION_PROVEN')
          PY
      - name: Independent context-key grouped repetition/erasure decoder with impossible two-copy counterexample
        run: |
          set -euo pipefail
          python research/q34/independent_noise_distance_audit.py | tee /tmp/q34-noisy-one-shot/INDEPENDENT_SOURCE_GROUPED_CODING_60000_ERROR_CONTROLS.log
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('/tmp/q34-noisy-one-shot/INDEPENDENT_SOURCE_GROUPED_CODING_60000_ERROR_CONTROLS.log').read_text().splitlines()[0])
          assert x['all65536_full_operator_tables_accepted'] is True
          assert x['every_corruption_at_each_of48_positions_on1024_rules']==49152
          assert x['additional_randomized_flip_erasure_controls']==60000
          assert x['wrong_admissions']==0
          assert x['min_one_output_bit_flip_observations']==48
          assert x['min_two_output_bit_flips_observations']==80
          assert x['one_flip_two_copy_ambiguity_EXPLICIT'] is True
          print('Q34_TRUE_INDEPENDENT_MINIMUM_HAMMING_DISTANCE_PROOF_PASS')
          PY
          sha256sum /tmp/q34-noisy-one-shot/*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-q34-new-minimum-noisy48bit-all3145728-cases-and-independent-coding-audit
          path: /tmp/q34-noisy-one-shot/
          if-no-files-found: error

  # SCIENTIFIC FIRST external learned Keijzer+Neat experiment, copied VERBATIM
  # from frozen PR554 ungraded first source-only three-step workflow.
  physically_separate_first_12_authored_equations_from_source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 sympy==1.13.3 scikit-learn==1.5.2
      - name: Freeze original author Keijzer seven and Neat five by task metadata from pinned DSO source
        run: |
          set -euo pipefail
          mkdir -p /tmp/q3-q3new/source /tmp/q3-q3new/gold
          OPENBLAS_NUM_THREADS=1 PYTHONPATH=research/q3:research/g0 \
            python research/q3/first_keijzer_neat_source_only.py \
            --source /tmp/q3-q3new/source/ORIGINAL12_XY_SOURCE_ONLY.json \
            --truth /tmp/q3-q3new/gold/ORIGINAL12_TRUE_AUTHOR_FORMULAS_GRADER_ONLY.json \
            | tee /tmp/q3-q3new/source/FIRST_AUTHOR_PIN_AND_PHYSICAL_SOURCE_TRUTH_LOG.txt
          python - <<'PY'
          import json
          r=json.load(open('/tmp/q3-q3new/source/ORIGINAL12_XY_SOURCE_ONLY.json'))
          assert len(r['source_numeric_without_equations'])==12
          assert all('original_expression' not in t and 'author_full_expression_sympy' not in t for t in r['source_numeric_without_equations'])
          assert all(t['collection'] in ('DSO_Keijzer','DSO_Neat') for t in r['source_numeric_without_equations'])
          print("ORIGINAL12_PUBLISHED_OTHER_AUTHOR_EQNS_PHYSICALLY_WITHHELD_FROM_MODEL")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q3-first-new-keijzer7-neat5-source-only-real-original-x-y
          path: /tmp/q3-q3new/source/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: q3-first-new-keijzer7-neat5-gold-full-author-original-graders-only
          path: /tmp/q3-q3new/gold/
          if-no-files-found: error
  actually_train_neural_edits_from_independent_source_reward_then_SHA_freeze:
    needs: physically_separate_first_12_authored_equations_from_source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 sympy==1.13.3 scikit-learn==1.5.2
      - uses: actions/download-artifact@v4
        with:
          name: q3-first-new-keijzer7-neat5-source-only-real-original-x-y
          path: /tmp/q3-q3new/source/
      - name: Mechanism controls: all five graph-edit families actually execute, graph constructs new lambda and no fabricated source exact
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 PYTHONPATH=research/q3:research/g0 python - <<'PY'
          import numpy as np,sympy as sp
          from learned_dynamic_graph_family_2authors import ACTIONS,GRAMMARS,execute,X
          assert len(ACTIONS)==5 and all(len(g)>20 for g in GRAMMARS.values())
          x=np.linspace(.15,1.1,48)
          examples={
           'POLYNOMIAL':x**4+2*x**2+x,
           'TRIG_PRODUCT':np.sin(x**2)*np.cos(x)-5,
           'LOG_SUM':np.log(x**2+x)+np.log(x**3+x),
           'EXP_ROOT':np.exp(-x**2),
           'SAFE':(x+1)/(x+2),
          }
          for action,y in examples.items():
              row={'x':x.tolist(),'y':y.tolist()}
              proposal,calls,nodes=execute(row,action)
              assert calls>0,(action,'ACTION_DID_NOT_RUN')
              assert proposal is not None,(action,'NO_EXECUTABLE_VERIFIED_SOURCE_MACRO')
              expr=sp.sympify(proposal['defined_operator_AST'],locals={'x':X})
              assert expr.has(X),(action,'NOT_A_VARIABLE_FUNCTION')
              print('ACTUAL_GRAPH_EDIT_SOURCE_POSITIVE_CONTROL_PASS',action,
                    'lambda',proposal['named_lambda'],'fits',calls,'nodes',nodes)
          # Wrong targets may generate float fits but must not become exact.
          bad={'x':x.tolist(),'y':(np.sin(x)+.017*x**7).tolist()}
          proposal,_,_=execute(bad,'EXP_ROOT')
          assert proposal is None,'WRONG_GRAPH_ACCEPTED_WITHOUT_SOURCE_PROOF'
          print('Q3_GRAPH_EDIT_CONSTRUCTION_POSITIVE5_NEGATIVE1_PASS')
          PY
      - name: Train model on 60 independent synthetic source-only tasks and independently infer exact 12 actual author numeric originals with four strong source controls
        run: |
          set -euo pipefail
          mkdir -p /tmp/q3-q3new/pregrade
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 PYTHONPATH=research/q3:research/g0 \
            python research/q3/learned_dynamic_graph_family_2authors.py --mode infer \
            --source /tmp/q3-q3new/source/ORIGINAL12_XY_SOURCE_ONLY.json \
            --pred /tmp/q3-q3new/pregrade/FIRST_NEURAL_RECURSIVE_GRAPH_AND_FOUR_CLASSICAL_12_PRED.json \
            | tee /tmp/q3-q3new/pregrade/FIRST_MODEL_SELF_REWARD_AND_GRAPH_CONSTRUCTION.log
          sha256sum /tmp/q3-q3new/pregrade/FIRST_NEURAL_RECURSIVE_GRAPH_AND_FOUR_CLASSICAL_12_PRED.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-first-new-keijzer7-neat5-sealed-real-learned-graph-edit-predictions
          path: /tmp/q3-q3new/pregrade/
          if-no-files-found: error
  third_party_style_original_author_entire_analytic_formula_exact_grader:
    needs: actually_train_neural_edits_from_independent_source_reward_then_SHA_freeze
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 sympy==1.13.3 scikit-learn==1.5.2
      - uses: actions/download-artifact@v4
        with:
          name: q3-first-new-keijzer7-neat5-gold-full-author-original-graders-only
          path: /tmp/q3-q3new/gold/
      - uses: actions/download-artifact@v4
        with:
          name: q3-first-new-keijzer7-neat5-sealed-real-learned-graph-edit-predictions
          path: /tmp/q3-q3new/pred/
      - name: Exact published author's full analytic symbolic formula, not source numeric approximate only, 12/12 accounted PASS or UNKNOWN
        run: |
          set -euo pipefail
          mkdir -p /tmp/q3-q3new/grade
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 PYTHONPATH=research/q3:research/g0 \
            python research/q3/learned_dynamic_graph_family_2authors.py --mode grade \
            --truth /tmp/q3-q3new/gold/ORIGINAL12_TRUE_AUTHOR_FORMULAS_GRADER_ONLY.json \
            --pred /tmp/q3-q3new/pred/FIRST_NEURAL_RECURSIVE_GRAPH_AND_FOUR_CLASSICAL_12_PRED.json \
            --out /tmp/q3-q3new/grade/FIRST_KEIJZER7_NEAT5_PUBLISHED_AUTHOR_ORIGINAL_EXACT_GRADE.json \
            | tee /tmp/q3-q3new/grade/NATIVE_AUTHOR_REAL_ORIGINAL_INDEPENDENT_FULL_FORMULA_EQUIVALENCE.log
          python - <<'PY'
          import json
          r=json.load(open('/tmp/q3-q3new/grade/FIRST_KEIJZER7_NEAT5_PUBLISHED_AUTHOR_ORIGINAL_EXACT_GRADE.json'))
          assert len(r['method_full_author_symbolic_exact'])==6
          assert all(x['all']==12 for x in r['method_full_author_symbolic_exact'].values())
          assert r['G1']=='HOLD' and r['Q3_GLOBAL']=='OPEN'
          print("ALL_FIRST_INDEPENDENT_12_REAL_AUTHOR_ORIGINALS_ACCOUNTED")
          PY
          sha256sum /tmp/q3-q3new/grade/FIRST_KEIJZER7_NEAT5_PUBLISHED_AUTHOR_ORIGINAL_EXACT_GRADE.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-first-new-keijzer7-neat5-whole-original-real-author-sympy-math-grade
          path: /tmp/q3-q3new/grade/
          if-no-files-found: error
