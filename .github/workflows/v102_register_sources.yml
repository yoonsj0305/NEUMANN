name: v102 Register Final Fresh Q34 Holdout

on:
  push:
    branches:
      - research/v102-final-q34-holdout
    paths:
      - .github/workflows/v102_register_sources.yml

permissions:
  contents: write

jobs:
  register-sources:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "HASWELL"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact registration runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.9.1 highspy==1.15.1 pytest
          pip install -e . --no-deps
      - name: Contract check before source generation
        run: python -m pytest -q tests/test_lp_final_holdout_sources_v102.py
      - name: Register fresh holdout sources only
        run: |
          mkdir -p docs/experiments/results
          test ! -e docs/experiments/results/v102_final_sources.json.gz
          test ! -e docs/experiments/results/v102_final_sources.manifest.json
          python -m experiments.lp_final_holdout_sources_v102 \
            --output-gzip docs/experiments/results/v102_final_sources.json.gz \
            --manifest docs/experiments/results/v102_final_sources.manifest.json \
            --frozen-head "$GITHUB_SHA"
      - name: Retain registered sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/experiments/results/v102_final_sources.json.gz \
                  docs/experiments/results/v102_final_sources.manifest.json
          git commit -m "v102 register final fresh Q34 holdout sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload registration evidence
        uses: actions/upload-artifact@v4
        with:
          name: v102-final-holdout-sources
          path: |
            docs/experiments/results/v102_final_sources.json.gz
            docs/experiments/results/v102_final_sources.manifest.json
