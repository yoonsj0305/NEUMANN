name: Q3 audit two true source-first cohorts of 24 real original learned proofs
on:
  pull_request:
    paths:
      - '.github/workflows/q3_original24_learned_effect_audit_20261021.yml'
      - 'research/evidence/q3_first24_bounded_learned_effect_audit_20261021/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify_disjoint_frozen_real_source24_original_Z3_cvc5_proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify official pre-source-body commit tags and audit code
        run: |
          python -m py_compile research/evidence/q3_first24_bounded_learned_effect_audit_20261021/verify_official_disjoint24_and_extract_learned_witness.py
          echo 'OFFICIAL_RECEIPT_READ_ONLY_NO_NEW_SOLVERS_OR_MODEL_TRAINING'
      - name: Download first 12 untouched original frozen PCA plus Post proofs
        uses: actions/download-artifact@v4
        with:
          run-id: 39587212632
          github-token: ${{ github.token }}
          name: q3-v32-first12-original-PCA-learned-full3VC-vs-no-fit-and-exact
          path: /tmp/ai24/first
      - name: Download second 12 different source-first original frozen PCA plus Post proofs
        uses: actions/download-artifact@v4
        with:
          run-id: 39587851842
          github-token: ${{ github.token }}
          name: q3-v32-second12-original-PCA-learned-full3VC-replication-vs-classical
          path: /tmp/ai24/second
      - name: Independently validate exact SHA provenance 24 original programs and extract learned typed witness
        run: |
          set -o pipefail
          python research/evidence/q3_first24_bounded_learned_effect_audit_20261021/verify_official_disjoint24_and_extract_learned_witness.py \
            --first /tmp/ai24/first/q3_v32_first_new12_original_actual_learned_complete_3VC.json \
            --second /tmp/ai24/second/q3_v32_second_new12_original_actual_learned_complete_3VC.json \
            --freeze1 research/evidence/q3_v32_new12_full_source_20261021/PREOPEN_GENUINE_TWELVE_ORIGINAL_GITSHA_SOURCE_LOCK.json \
            --freeze2 research/evidence/q3_v32_second12_replication_20261021/BEFORE_SECOND12_ORIGINAL_SOURCE_BODIES_GITSHA.json \
            --out /tmp/ai24/Q3_ACTUAL_LEARNED_24_FIRST_UNSEEN_PROOF_EVIDENCE.json | tee /tmp/ai24/actual_learned24.log
          sha256sum /tmp/ai24/Q3_ACTUAL_LEARNED_24_FIRST_UNSEEN_PROOF_EVIDENCE.json
      - name: Preserve exact per-source learned witness, bounded ablations and historical provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-24-real-original-double-solver-cross-run-learned-structures-witness
          path: |
            /tmp/ai24/Q3_ACTUAL_LEARNED_24_FIRST_UNSEEN_PROOF_EVIDENCE.json
            /tmp/ai24/actual_learned24.log
          if-no-files-found: warn
