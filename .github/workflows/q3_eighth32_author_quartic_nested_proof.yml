name: NEUMANN Q3 first external author quartic nested square of square degree proof
on:
  pull_request:
    paths:
      - '.github/workflows/q3_eighth32_author_quartic_nested_proof.yml'
      - 'research/q3/eighth_original_quartic_nested_macro_degree_proof.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact_frozen_eighth_original_quartic_and_degree_lower_bound:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 sympy==1.13.3
      - uses: actions/download-artifact@v4
        with:
          run-id: 39920470677
          name: q3-eighth32-actual-private-full-author-equations-grader-only
          github-token: ${{ github.token }}
          path: /tmp/eighth-quartic/truth
      - uses: actions/download-artifact@v4
        with:
          run-id: 39920470677
          name: q3-eighth32-frozen-nonlinear-learned-generated-macro-and-classical-pregrade
          github-token: ${{ github.token }}
          path: /tmp/eighth-quartic/pred
      - uses: actions/download-artifact@v4
        with:
          run-id: 39920470677
          name: q3-eighth32-first-real-author-full-original-nonlinear-macro-independent-grade
          github-token: ${{ github.token }}
          path: /tmp/eighth-quartic/grade
      - name: Prove first original quartic exactly generated by learned SQUARE of SQUARE, impossible in one earlier single polynomial atom
        run: |
          set -euo pipefail
          mkdir -p /tmp/eighth-quartic/out
          OPENBLAS_NUM_THREADS=1 PYTHONPATH=research/g0 \
            python research/q3/eighth_original_quartic_nested_macro_degree_proof.py \
            --truth /tmp/eighth-quartic/truth/EIGHTH32_PRIVATE_FULL_AUTHOR_EQUATIONS.json \
            --pred /tmp/eighth-quartic/pred/FIRST_NEURAL_AND_CLASSICAL_NESTED_MACRO_PREDICTIONS.json \
            --grade /tmp/eighth-quartic/grade/FIRST_EIGHTH32_FULL_ORIGINAL_NONLINEAR_MACRO_EXACT_GRADE.json \
            --out /tmp/eighth-quartic/out/FIRST_EXTERNAL_AUTHOR_QUARTIC_REQUIRES_NESTED_DEGREE_FOUR.json \
            | tee /tmp/eighth-quartic/out/EXACT_FIRST_SOURCE_MATH_PROOF.log
          sha256sum /tmp/eighth-quartic/out/FIRST_EXTERNAL_AUTHOR_QUARTIC_REQUIRES_NESTED_DEGREE_FOUR.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neumann-q3-eighth32-immutable-first-original-quartic-nested-macro-degree-proof
          path: /tmp/eighth-quartic/out/
          if-no-files-found: error
