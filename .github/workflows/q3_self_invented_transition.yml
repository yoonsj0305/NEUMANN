name: Q3 Fully Source-Invented Transition Plus Recursive Algorithm

on:
  pull_request:
    paths:
      - "neumann1/typed_transition_inventor.py"
      - "neumann1/higher_order_method_inventor.py"
      - "neumann1/engine.py"
      - "neumann1/registry_engine.py"
      - "tests/test_typed_transition_inventor.py"
      - ".github/workflows/q3_self_invented_transition.yml"
  workflow_dispatch:

jobs:
  self-invent-transition-and-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NEUMANN and source-grade tests
        run: python -m pip install -e . pytest
      - name: Discover NEW operator ASTs + learned control AST in both production engines
        run: |
          python -m pytest -q -s tests/test_typed_transition_inventor.py
          python -m pytest -q -s tests/test_higher_order_method_inventor.py
