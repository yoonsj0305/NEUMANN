name: Q3 GATE R FIRST unopened two original learned XOR4 versus exact GF2
on:
  pull_request:
    paths:
      - '.github/workflows/q3-learned-xor4-first-two-real.yml'
      - 'research/evidence/q3_gateR_learned_xor4_20261021/**'
      - 'docs/research/Q3_FIRST_UNOPENED_XOR4_GENERATIVE_PRE_SOURCE_FREEZE_20261021.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real_source_first_neural_xor4_composition:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: original_unopened_sources
          sparse-checkout: |
            lib/Inv_Track/andrew_lustre
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact upstream original revision and grammar syntax
        run: |
          test "$(git -C original_unopened_sources rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          python -m py_compile research/evidence/q3_gateR_learned_xor4_20261021/first_two_frozen_source_four_way_parity.py
      - name: Exact original Z3 and independently SHA-pinned official cvc5 1.4.2
        run: |
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          test "$(find /tmp/cvc5bin -type f -name cvc5 | wc -l)" -eq 1
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check numpy==2.3.5 z3-solver==4.13.3.0
      - name: FIRST source-free model trained before original, exact-classical pairwise independent XOR4 and true original 2VC
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q3_gateR_learned_xor4_20261021/first_two_frozen_source_four_way_parity.py --root original_unopened_sources --out /tmp/q3_xor4_first_two.json | tee /tmp/q3_xor4_first_two.log
          sha256sum /tmp/q3_xor4_first_two.json
      - name: Preserve first scientific outcomes including ALL failures/abstentions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-learned-xor4-two-real-first-originals
          path: |
            /tmp/q3_xor4_first_two.json
            /tmp/q3_xor4_first_two.log
          if-no-files-found: warn
      - name: Strict no unearned broad claims
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/q3_xor4_first_two.json'))
          assert x['all_two_source_git_blobs_authenticated']
          assert x['source_free_synthetic_training_before_target_source_read']
          assert x['first_two_original_file_Git_blobs_frozen_before_source_body_read']
          assert x['source_one_author_origin_not_cross_author_disjoint']
          assert x['model']['synthetic_training_programs']==3600
          assert x['model']['synthetic_independent_test_programs']==600
          assert x['new_operator_outside_predeclared_XOR4_grammar']=='NOT_DEMONSTRATED'
          assert x['model_genuine_new_author_origin_G1']=='NOT_TESTED'
          assert x['gate_R_full']==x['gate_V']==x['global_Q3']=='OPEN'
          print('FIRST REAL SOURCE LEARNED COMPOSED XOR4',x['learned_independent_real_original_2VC_count'])
          print('STRONG EXACT CLASSICAL XOR4',x['strong_classical_independent_real_original_2VC_count'])
          PY
