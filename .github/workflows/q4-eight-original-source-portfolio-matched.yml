name: Q4 same CPU eight original source PDR vs native cvc5 SyGuS dual 3VC
on:
  pull_request:
    paths:
      - '.github/workflows/q4-eight-original-source-portfolio-matched.yml'
      - 'research/evidence/q4_same_cpu_eight_20261021/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eight_original_source_proof_matched_same_cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: SyGuS-Org/benchmarks
          ref: 13c8deb68a873635879c9a69bc78caebd340f646
          path: source
          sparse-checkout: |
            lib/Inv_Track/andrew_lustre
            lib/Inv_Track/from_2018
            lib/Inv_Track/xujie_code2inv
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact pinned source, syntax, pinned CPU environment
        run: |
          test "$(git -C source rev-parse HEAD)" = 13c8deb68a873635879c9a69bc78caebd340f646
          python -m py_compile research/evidence/q4_same_cpu_eight_20261021/eight_matched_actual_original_solver_benchmark.py
          curl -fL --retry 2 -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo '7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  /tmp/cvc5.zip' | sha256sum -c -
          mkdir -p /tmp/cvc5bin
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5bin
          sudo install -m 755 "$(find /tmp/cvc5bin -type f -name cvc5 | head -1)" /usr/local/bin/cvc5
          cvc5 --version | grep -F 1.4.2
          python -m pip install --disable-pip-version-check numpy==2.3.5 z3-solver==4.13.3.0
          lscpu | grep -E 'Model name|CPU\(s\)' | head -3
      - name: Full original eight paired baseline and route matched native proof
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. python research/evidence/q4_same_cpu_eight_20261021/eight_matched_actual_original_solver_benchmark.py --root source --first-freeze research/evidence/q3_affine_unopened_transfer_20261021/ORIGINAL_FOUR_PRESOURCE_FREEZE.json --second-freeze research/evidence/q3_other_origin_four_20261021/FROZEN_BEFORE_FIRST_OPEN.json --out /tmp/q4_matched_eight.json | tee /tmp/q4_matched_eight.log
          sha256sum /tmp/q4_matched_eight.json
      - name: Always archive original 8 PDR/cvc5 proofs and negative controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q4-eight-real-source-same-cpu-native-pdr-sygus-baseline
          path: |
            /tmp/q4_matched_eight.json
            /tmp/q4_matched_eight.log
          if-no-files-found: warn
      - name: Strict no fabricated global Q4 performance
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/q4_matched_eight.json'))
          assert len(r['cases'])==8
          assert r['global_Q3']==r['global_Q4']=='OPEN'
          assert r['not_any_SOTA_or_full_Q4_10x']
          assert all(x['status']=='PASS_REJECT_FALSE_SAFETY' for x in r['negative_post_false_controls'])
          assert r['PDR_original_dual_safety_pass']==8
          print('SCOPED_EIGHT_ORIGINALS_PDR_DUAL',r['PDR_original_dual_safety_pass'])
          print('MATCHED_CVC5_SYGUS_DUAL',r['baseline_original_dual_safety_pass'])
          print('PAIRED_COMMON_RATIO',r['common_solved_wall_speed_ratios'])
          PY
