name: General Runtime-0.2 compact opened repair first attempt
on:
  push:
    branches: [research/general-runtime-compact-v1062]
    paths: [docs/experiments/general_runtime_compact_v1062.trigger.json]

permissions:
  contents: write

concurrency:
  group: general-runtime-compact-v1062
  cancel-in-progress: false

jobs:
  compact-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove prior negative evidence remains present
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test -d docs/experiments/results/v106_general_boot2
          test -d docs/experiments/results/v1061_general_repair_first
          test -f docs/experiments/results/v1061_general_repair_first/replay.json
          test ! -e docs/experiments/results/v1062_general_compact_first
          python - <<'PY'
          import json
          from pathlib import Path
          marker=json.loads(Path('docs/experiments/general_runtime_compact_v1062.trigger.json').read_text())
          assert marker['schema']=='neumann.general-runtime-compact-trigger.v1062.v1'
          assert marker['rerun'] is False
          assert marker['new_training'] is False
          assert marker['frontier_calls']==0
          assert marker['paid_api_calls']==0
          assert marker['holdout_opened'] is False
          assert marker['prior_evidence_preserved'] is True
          assert marker['admission_tokens']==240
          assert marker['per_call_tokens']==64
          assert marker['wall_ms']==120000
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compact contracts before model execution
        run: |
          pip install -e . pytest
          python -m pytest -q tests/test_general_runtime_compact_v1062.py
          python -m experiments.general_repair_evidence_v1061 \
            --directory docs/experiments/results/v1061_general_repair_first \
            --expect docs/experiments/results/v1061_general_repair_first/replay.json

      - name: Frozen CPU model dependencies
        timeout-minutes: 10
        run: |
          pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.9.1
          pip install torch==2.14.0+cpu torchvision==0.29.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.10.1 pillow

      - name: Execute fifteen opened compact repair observations
        timeout-minutes: 40
        run: |
          python -u -m experiments.general_compact_v1062 \
            --directory docs/experiments/results/v1062_general_compact_first \
            --frozen-head "$GITHUB_SHA"

      - name: Retain first compact repair bytes including partial failure
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/experiments/results/v1062_general_compact_first* || true
          if ! git diff --cached --quiet; then
            git commit -m "Retain first Runtime-0.2 opened compact evidence"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general-runtime-compact-v1062-first
          path: docs/experiments/results/v1062_general_compact_first*
