[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neumann-example-scalar-sum"
version = "0.1.1"
description = "External NEUMANN family used for cross-package interoperability testing"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
example_scalar_sum = ["neumann_plugins/*.json"]